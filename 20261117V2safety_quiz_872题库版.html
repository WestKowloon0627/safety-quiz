管理","question":"为什么保险丝不能用铜、铁丝代替？","options":[],"answer":"因为铜、铁丝的熔点比保险丝的熔点高，在电流突然增大时，不能即刻熔断，起不到切断电流的保险作用，会使电气设备因短路或过载而起火。","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0862","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"禁止阻塞","explanation":"","basis":"","source":"综合题库4.docx","status":"答案存在来源差异，需人工核对"},{"id":"Q0863","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"禁止吸烟","explanation":"","basis":"","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0864","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"禁止烟火","explanation":"","basis":"","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0865","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"禁止带火种","explanation":"","basis":"","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0866","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"地下消消防栓","explanation":"","basis":"","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0867","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"紧急出口","explanation":"","basis":"","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0868","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"灭火器","explanation":"","basis":"","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0869","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"当心爆炸—爆炸性物质","explanation":"","basis":"","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0870","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"禁放易燃物","explanation":"","basis":"","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0871","type":"看图识别题","category":"安全标志与现场管理","question":"【原题为图片识别题】当前Excel未提供可直接嵌入网页的图片资源，请以原始图片题库核对。","options":[],"answer":"应急照明灯","explanation":"","basis":"","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0872","type":"判断题","category":"安全生产理念与方针","question":"以人为本就是要求在进行生产和其他工作时把安全工作放在一切工作的首要位置。( )","options":["对","错"],"answer":"B","explanation":"题库答案为B（错）。本题考查“以人为本”与“安全第一”两个理念的区别。“以人为本”强调尊重、保护人的生命健康和合法权益，是安全生产工作的价值取向；“把安全工作放在一切工作的首要位置”更接近“安全第一”的要求，不能将其直接作为“以人为本”的定义。因此按题库原答案判错。","basis":"《中华人民共和国安全生产法》第三条：安全生产工作应当以人为本，坚持人民至上、生命至上，把保护人民生命安全摆在首位。","source":"","status":"解析补充第3批：题干将“以人为本”与“安全第一”概念混同，属于概念表述不严谨；保留原题及答案。"}];
const byId=new Map(QUESTIONS.map(q=>[q.id,q]));
let user=null, wrongIds=new Set(), favoriteIds=new Set(), doneIds=new Set();
let currentQueue=[], currentIndex=0, currentQuestion=null, answered=false, currentView="practice", lastSession=null;

const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function msg(t){$("authMsg").textContent=t||"";}
function setView(v){
 currentView=v;
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
 ["practice","wrong","favorites","progress"].forEach(x=>$(x+"View").classList.toggle("hidden",x!==v));
 if(v==="wrong")renderCollection("wrong");
 if(v==="favorites")renderCollection("favorites");
 if(v==="progress")renderProgress();
}
function updateStats(){
 $("wrongStat").textContent=wrongIds.size;$("favStat").textContent=favoriteIds.size;$("doneStat").textContent=doneIds.size;
}
function fillFilters(){
 const types=[...new Set(QUESTIONS.map(q=>q.type))].sort();
 const cats=[...new Set(QUESTIONS.map(q=>q.category).filter(Boolean))].sort();
 types.forEach(v=>$("typeFilter").add(new Option(v,v)));
 cats.forEach(v=>$("categoryFilter").add(new Option(v,v)));
}
function filteredQuestions(){
 const t=$("typeFilter").value,c=$("categoryFilter").value;
 return QUESTIONS.filter(q=>(!t||q.type===t)&&(!c||q.category===c));
}
function begin(list,label,startIndex=0){
 currentQueue=list;currentIndex=Math.max(0,Math.min(startIndex,list.length-1));
 $("practiceHint").textContent=`${label}：共 ${list.length} 道题`;
 if(!list.length){$("questionCard").innerHTML='<div class="empty">没有符合条件的题目。</div>';return;}
 showQuestion();
 saveProgress();
}
function parseCustomIds(raw){
 const parts=String(raw||"").toUpperCase().split(/[，,、;；\s]+/).filter(Boolean);
 const ids=[];
 for(const part of parts){
   const range=part.match(/^Q?(\d+)-Q?(\d+)$/);
   if(range){
     const a=Number(range[1]),b=Number(range[2]);
     if(b<a||b-a>2000) return {error:`题号范围不正确：${part}`};
     for(let n=a;n<=b;n++) ids.push("Q"+String(n).padStart(4,"0"));
   }else{
     const one=part.match(/^Q?(\d+)$/);
     if(!one) return {error:`无法识别题号：${part}`};
     ids.push("Q"+String(Number(one[1])).padStart(4,"0"));
   }
 }
 const unique=[...new Set(ids)];
 const missing=unique.filter(id=>!byId.has(id));
 if(missing.length) return {error:"以下题号不存在："+missing.slice(0,12).join("、")+(missing.length>12?"等":"")};
 return {ids:unique};
}
function showQuestion(){
 if(currentIndex<0||currentIndex>=currentQueue.length){$("questionCard").innerHTML='<div class="empty">本组题目已完成。可返回题目列表继续复习。</div>';return;}
 currentQuestion=currentQueue[currentIndex];answered=false;
 const q=currentQuestion, isFav=favoriteIds.has(q.id);
 let options=q.options.map((o,i)=>({o,i})).filter(x=>x.o);
 let optionHtml="";
 if(options.length){
   optionHtml=options.map(({o,i})=>`<label class="option" data-opt="${"ABCDE"[i]}"><input type="${q.type==="多选题"?"checkbox":"radio"}" name="answer" value="${"ABCDE"[i]}"><span><b>${"ABCDE"[i]}.</b> ${esc(o)}</span></label>`).join("");
 }else{
   optionHtml=`<textarea id="textAnswer" rows="3" style="width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:12px" placeholder="请输入答案（简答/填空/看图识别题）"></textarea>`;
 }
 $("questionCard").innerHTML=`
 <div class="question-top"><span>${esc(q.id)} · ${esc(q.type)}</span><span>${currentIndex+1} / ${currentQueue.length}</span></div>
 <div class="muted" style="margin-top:7px">${esc(q.category)}</div>
 <div class="qtext">${esc(q.question)}</div>
 <div id="options">${optionHtml}</div>
 <div class="actions">
 <button id="submitAnswer">提交答案</button>
 <button id="favoriteBtn" class="${isFav?"secondary":"ghost"}">${isFav?"★ 已收藏":"☆ 收藏题目"}</button>
 </div>
 <div id="feedback"></div>
 <div class="actions"><button id="prevBtn" class="secondary">上一题</button><button id="nextBtn" class="secondary">下一题</button></div>`;
 document.querySelectorAll(".option").forEach(el=>el.addEventListener("click",()=>{if(answered)return;if(q.type!=="多选题"){document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));}el.classList.toggle("selected");}));
 $("submitAnswer").onclick=submitAnswer;
 $("favoriteBtn").onclick=()=>toggleFavorite(q.id);
 $("prevBtn").onclick=()=>{if(currentIndex>0){currentIndex--;showQuestion();saveProgress();}};
 $("nextBtn").onclick=()=>{if(currentIndex<currentQueue.length-1){currentIndex++;showQuestion();saveProgress();}};
}
function normalized(s){return String(s??"").trim().replace(/\s+/g,"").replace(/[，。；;、]/g,"").toLowerCase();}
function getUserAnswer(){
 const q=currentQuestion;
 if(q.options.length){
   return [...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value).sort().join("");
 }
 return $("textAnswer")?.value.trim()||"";
}
function isCorrect(q,a){
 const expected=String(q.answer||"").trim().toUpperCase();
 if(q.options.length){
   return String(a).toUpperCase()===expected.replace(/[^A-E]/g,"").split("").sort().join("");
 }
 if(q.type==="填空题"||q.type==="简答题"||q.type==="看图识别题"){
   if(!a)return false;
   const candidates=expected.split(/[；;、\n]/).map(normalized).filter(Boolean);
   return candidates.some(x=>x===normalized(a)) || normalized(a)===normalized(q.answer);
 }
 return false;
}
async function submitAnswer(){
 if(answered)return;
 const q=currentQuestion, a=getUserAnswer();
 if(!a){$("feedback").innerHTML='<div class="answerbox">请先选择或填写答案。</div>';return;}
 answered=true;
 const ok=isCorrect(q,a);
 doneIds.add(q.id);
 if(!ok){wrongIds.add(q.id);await saveWrong(q.id);}
 await saveProgress();
 const answerText=q.answer||"未提供标准答案";
 $("feedback").innerHTML=`<div class="answerbox ${ok?"good":"bad"}"><h3>${ok?"回答正确":"回答错误"}</h3><div><b>你的答案：</b>${esc(a)}</div><div><b>标准答案：</b>${esc(answerText)}</div>${q.explanation?`<p><b>解析：</b>${esc(q.explanation)}</p>`:""}${q.basis?`<p><b>依据：</b>${esc(q.basis)}</p>`:""}</div>`;
 document.querySelectorAll(".option").forEach(el=>{const val=el.dataset.opt;if(String(q.answer).toUpperCase().includes(val)){el.classList.add("correct");}else if(el.classList.contains("selected")&&!ok){el.classList.add("wrong");}});
 $("submitAnswer").disabled=true;updateStats();
}
async function saveWrong(qid){
 const {error}=await db.from("wrong_questions").upsert({user_id:user.id,question_id:qid,wrong_count:1,last_wrong_at:new Date().toISOString()},{onConflict:"user_id,question_id"});
 if(error)console.error("wrong save",error);
}
async function removeWrong(qid){
 const {error}=await db.from("wrong_questions").delete().eq("user_id",user.id).eq("question_id",qid);
 if(error){alert("移出错题本失败："+error.message);return;}
 wrongIds.delete(qid);updateStats();renderCollection("wrong");
}
async function toggleFavorite(qid){
 if(favoriteIds.has(qid)){
   const {error}=await db.from("favorites").delete().eq("user_id",user.id).eq("question_id",qid);
   if(error){alert("取消收藏失败："+error.message);return;}
   favoriteIds.delete(qid);
 }else{
   const {error}=await db.from("favorites").upsert({user_id:user.id,question_id:qid},{onConflict:"user_id,question_id"});
   if(error){alert("收藏失败："+error.message);return;}
   favoriteIds.add(qid);
 }
 updateStats();
 if(currentQuestion?.id===qid){$("favoriteBtn").textContent=favoriteIds.has(qid)?"★ 已收藏":"☆ 收藏题目";$("favoriteBtn").className=favoriteIds.has(qid)?"secondary":"ghost";}
 if(currentView==="favorites")renderCollection("favorites");
}
async function saveProgress(){
 const progress={done:[...doneIds],lastQuestionId:currentQuestion?.id||null,session:currentQueue.length?{ids:currentQueue.map(q=>q.id),index:currentIndex,label:$("practiceHint").textContent}:null,updatedAt:new Date().toISOString()};
 const {error}=await db.from("practice_progress").upsert({user_id:user.id,progress,updated_at:new Date().toISOString()},{onConflict:"user_id"});
 if(error)console.error("progress save",error);
}
async function loadCloudData(){
 const [w,f,p]=await Promise.all([
  db.from("wrong_questions").select("question_id").eq("user_id",user.id),
  db.from("favorites").select("question_id").eq("user_id",user.id),
  db.from("practice_progress").select("progress").eq("user_id",user.id).maybeSingle()
 ]);
 if(w.error||f.error||p.error){throw new Error(w.error?.message||f.error?.message||p.error?.message);}
 wrongIds=new Set((w.data||[]).map(x=>x.question_id));
 favoriteIds=new Set((f.data||[]).map(x=>x.question_id));
 const pr=p.data?.progress||{};
 doneIds=new Set(Array.isArray(pr.done)?pr.done:[]);
 lastSession=pr.session&&Array.isArray(pr.session.ids)?pr.session:null;
 $("resumeBtn").disabled=!lastSession;
 updateStats();
}
function renderCollection(kind){
 const ids=kind==="wrong"?[...wrongIds]:[...favoriteIds];
 const box=$(kind==="wrong"?"wrongList":"favoriteList");
 if(!ids.length){box.innerHTML='<div class="empty">目前没有记录。</div>';return;}
 box.innerHTML=ids.map(id=>{
  const q=byId.get(id);if(!q)return "";
  return `<div class="listitem"><div class="listtitle">${esc(id)} · ${esc(q.question)}</div><div class="muted">${esc(q.type)} · ${esc(q.category)}</div><div class="actions"><button class="smallbtn" data-open="${esc(id)}">翻阅此题</button>${kind==="wrong"?`<button class="smallbtn danger" data-remove="${esc(id)}">移出错题本</button>`:`<button class="smallbtn secondary" data-unfav="${esc(id)}">取消收藏</button>`}</div></div>`;
 }).join("");
 box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{setView("practice");begin([byId.get(b.dataset.open)],kind==="wrong"?"错题复习":"收藏复习");});
 box.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeWrong(b.dataset.remove));
 box.querySelectorAll("[data-unfav]").forEach(b=>b.onclick=()=>toggleFavorite(b.dataset.unfav));
}
function renderProgress(){
 const box=$("progressList");
 const ids=[...doneIds].map(id=>byId.get(id)).filter(Boolean);
 box.innerHTML=ids.length?ids.map(q=>`<div class="listitem"><span class="tag">${esc(q.id)}</span>${esc(q.question)}</div>`).join(""):'<div class="empty">暂时没有已作答记录。</div>';
}
async function showApp(){
 $("authPanel").classList.add("hidden");$("appPanel").classList.remove("hidden");$("logoutBtn").classList.remove("hidden");
 const {data}=await db.from("profiles").select("nickname").eq("id",user.id).maybeSingle();
 $("userLine").textContent=(data?.nickname||user.email)+" · 云端同步已连接";
 await loadCloudData();
}
async function boot(){
 fillFilters();
 const {data:{session}}=await db.auth.getSession();
 if(session){user=session.user;try{await showApp();}catch(e){alert("读取云端记录失败："+e.message);}}
}
$("loginBtn").onclick=async()=>{
 msg("正在登录……");
 const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error){msg(error.message);return;}user=data.user;try{await showApp();msg("");}catch(e){msg("云端读取失败："+e.message);}
};
$("showSignupBtn").onclick=()=>$("signupFields").classList.toggle("hidden");
$("signupBtn").onclick=async()=>{
 const email=$("email").value.trim(),password=$("password").value,nickname=$("nickname").value.trim();
 if(!email||!password||!nickname){msg("请填写邮箱、密码和昵称。");return;}
 msg("正在注册……");
 const {data,error}=await db.auth.signUp({email,password});
 if(error){msg(error.message);return;}
 if(!data.user){msg("注册请求已提交，请检查账号状态。");return;}
 const {error:pe}=await db.from("profiles").upsert({id:data.user.id,nickname},{onConflict:"id"});
 if(pe){msg("账号已创建，但昵称保存失败："+pe.message);return;}
 user=data.user;
 if(data.session){await showApp();msg("注册成功。");}
 else msg("账号已注册。当前项目如关闭邮箱验证，请直接登录；如启用了验证，请先完成邮箱验证。");
};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();location.reload();};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
$("startBtn").onclick=()=>begin(filteredQuestions(),"筛选练习");
$("allBtn").onclick=()=>begin(QUESTIONS,"全部题目");
$("randomBtn").onclick=()=>{const a=filteredQuestions().slice().sort(()=>Math.random()-.5).slice(0,20);begin(a,"随机抽题");};
$("customStartBtn").onclick=()=>{
 const parsed=parseCustomIds($("customIds").value);
 if(parsed.error){$("practiceHint").textContent=parsed.error;return;}
 if(!parsed.ids.length){$("practiceHint").textContent="请先输入要练习的题号。";return;}
 begin(parsed.ids.map(id=>byId.get(id)),"自选题目");
};
$("resumeBtn").onclick=()=>{
 if(!lastSession||!lastSession.ids?.length){$("practiceHint").textContent="没有找到上次练习进度。";return;}
 const list=lastSession.ids.map(id=>byId.get(id)).filter(Boolean);
 if(!list.length){$("practiceHint").textContent="上次练习题目已不在当前题库中。";return;}
 begin(list,lastSession.label||"继续上次练习",Math.min(lastSession.index||0,list.length-1));
};
db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){user=null;}});
boot();
</script>
</body>
</html>
