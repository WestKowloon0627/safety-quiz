工作；建立消防档案，确定消防安全重点部位，设置防火标志，实行严格管理；实行每日防火巡查，并建立巡查记录；对职工进行岗前消防安全培训，定期组织消防安全培训和消防演练等）。","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0468","type":"多选题","category":"从业人员安全生产权利义务","question":"从业人员的义务包括（）。","options":["对本单位安全生产工作中存在的问题提出批评","正确佩戴和使用劳动防护用品","了解其作业场所和工作岗位存在的危险因素、防范措施及事故应急措施","发现事故隐患，立即向现场安全生产管理人员或者本单位负责人报告"],"answer":"BD","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五十七条：从业人员在作业过程中，应当严格落实岗位安全责任，遵守本单位的安全生产规章制度和操作规程，服从管理，正确佩戴和使用劳动防护用品。第五十九条：从业人员发现事故隐患或者其他不安全因素，应当立即向现场安全生产管理人员或者本单位负责人报告。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0469","type":"多选题","category":"消防","question":"下列（）是消防行政处罚种类。","options":["警告","拘留","劳动","没收违法所得"],"answer":"ABD","explanation":"《中华人民共和国行政处罚法》（2021年修订版）第九条：行政处罚的种类包括（一）警告、通报批评；（二）罚款、没收违法所得、没收非法财物；（三）暂扣许可证件、降低资质等级、吊销许可证件；（四）限制开展生产经营活动、责令停产停业、责令关闭、限制从业；（五）行政拘留；（六）法律、行政法规规定的其他行政处罚。警告、拘留（行政拘留）、没收违法所得均属法定行政处罚种类，《中华人民共和国消防法》在消防领域适用上述处罚种类。 〔依据法规已收录条款库：《中华人民共和国行政处罚法》〕","basis":"《中华人民共和国行政处罚法》（2021年修订版）、《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0470","type":"多选题","category":"消防安全","question":"根据《中华人民共和国消防法》，企业应当履行的消防安全职责有（ ）。","options":["落实消防安全责任制，制定本单位的消防安全制度、消防安全操作规程","按照国家标准、行业标准配置消防设施、器材，设置消防安全标志，并定期组织检验、维修，确保完好有效","对建筑消防设施每年至少进行一次全面检测，确保完好有效，检测记录应当完整准确，存档备查","无需组织员工进行消防安全培训，仅需张贴消防宣传标语即可"],"answer":"ABC","explanation":"《中华人民共和国消防法》（2021 修正）第十六条","basis":"《中华人民共和国消防法》（2021年修订版）第十六条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0471","type":"多选题","category":"应急管理","question":"根据紧急救护规范，作业人员发生触电事故后，现场急救应当遵循的原则有（ ）。","options":["迅速脱离电源，防止救护人员触电","对呼吸、心跳停止的伤员，立即进行心肺复苏","及时拨打急救电话，等待专业医护人员到达","对电灼伤部位进行正确处理，防止感染"],"answer":"ABCD","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"紧急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0472","type":"多选题","category":"消防安全管理","question":"根据《中华人民共和国安全生产法》，企业消防安全管理中，必须落实的日常管理要求有（ ）。","options":["定期对消防设施、器材进行巡检、维护、保养，确保完好有效","保持消防通道、安全出口畅通，严禁堵塞、占用消防通道","定期组织员工开展消防安全培训和应急疏散演练","对易燃易爆场所严格落实动火审批制度，严禁违规动火"],"answer":"ABCD","explanation":"《中华人民共和国消防法》第十六条：机关、团体、企业、事业等单位应当履行下列消防安全职责：（二）按照国家标准、行业标准配置消防设施、器材，设置消防安全标志，并定期组织检验、维修，确保完好有效；（四）保障疏散通道、安全出口、消防车通道畅通，保证防火防烟分区、防火间距符合消防技术标准；（六）组织进行有针对性的消防演练。；《中华人民共和国消防法》第十七条：消防安全重点单位应当……（二）对职工进行岗前消防安全培训。；《中华人民共和国消防法》第二十一条：因施工等特殊情况需要使用明火作业的，应当按照规定事先办理审批手续，采取相应的消防安全措施；作业人员应当遵守消防安全规定。","basis":"《中华人民共和国安全生产法》第四十二条、《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0473","type":"多选题","category":"安全生产责任制","question":"根据《中华人民共和国安全生产法》，企业安全生产责任制必须明确的内容有（ ）。","options":["各岗位的责任人员、责任范围和考核标准","主要负责人的安全生产第一责任人职责","分管安全生产负责人的安全生产管理职责","各职能部门、生产车间、班组的安全生产职责"],"answer":"ABCD","explanation":"《安全生产法》（2021修正）第四条（全员安全生产责任制）、第二十二条（安全生产责任制应明确各岗位责任人员、责任范围和考核标准）","basis":"《中华人民共和国安全生产法》（2021修正）第四条、第二十二条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0474","type":"多选题","category":"建设项目安全管理","question":"根据《中华人民共和国安全生产法》，企业建设项目安全设施“三同时”管理要求包括（ ）。","options":["安全设施必须与主体工程同时设计、同时施工、同时投入生产和使用","建设项目安全设施设计必须符合国家安全生产标准和行业规范","建设项目竣工投入生产前，必须对安全设施进行验收，验收合格后方可投入使用","安全设施投资应当纳入建设项目概算，不得随意削减、挪用"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》（2021 修正）第三十一条、第三十四条","basis":"《中华人民共和国安全生产法》（2021年修订版）第三十一条、第三十四条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0475","type":"多选题","category":"劳动防护用品管理","question":"根据《中华人民共和国安全生产法》，企业劳动防护用品管理必须落实的要求有（ ）。","options":["为从业人员免费提供符合国家标准、行业标准的劳动防护用品，不得以货币或者其他物品替代","对劳动防护用品进行定期检查、维护、保养，确保其完好有效，对达到报废标准的及时更换","教育、督促从业人员正确佩戴和使用劳动防护用品，严禁不佩戴防护用品上岗作业","建立劳动防护用品采购、验收、发放、使用、报废台账，做到全程可追溯"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》（2021 修正）第四十五条","basis":"《中华人民共和国安全生产法》（2021年修订版）第四十五条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0476","type":"多选题","category":"从业人员安全生产权利义务","question":"根据《中华人民共和国安全生产法》，企业从业人员的安全生产权利包括（ ）。","options":["有权了解其作业场所和工作岗位存在的危险因素、防范措施及事故应急措施","有权对本单位的安全生产工作提出建议，对安全生产工作中存在的问题提出批评、检举、控告","有权拒绝违章指挥和强令冒险作业，发现直接危及人身安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所","因生产安全事故受到损害的，有权依法获得工伤保险赔偿，有权向本单位提出赔偿要求"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第五十三条：生产经营单位的从业人员有权了解其作业场所和工作岗位存在的危险因素、防范措施及事故应急措施，有权对本单位的安全生产工作提出建议。；《中华人民共和国安全生产法》第五十四条：从业人员有权对本单位安全生产工作中存在的问题提出批评、检举、控告；有权拒绝违章指挥和强令冒险作业。；《中华人民共和国安全生产法》第五十五条：从业人员发现直接危及人身安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所。；《中华人民共和国安全生产法》第五十六条：因生产安全事故受到损害的从业人员，除依法享有工伤保险外，依照有关民事法律尚有获得赔偿的权利的，有权提出赔偿要求。","basis":"《中华人民共和国安全生产法》（2021年修订版）第三章","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0477","type":"多选题","category":"特种设备安全管理","question":"根据《中华人民共和国特种设备安全法》，企业起重机械使用必须遵守的规定有（ ）。","options":["起重机械使用单位应当在投入使用前或者投入使用后三十日内，向负责特种设备安全监督管理的部门办理使用登记，取得使用登记证书","起重机械使用单位应当建立岗位责任、隐患治理、应急救援等安全管理制度，制定操作规程，保证起重机械安全运行","起重机械使用单位应当对其使用的起重机械进行经常性维护保养和定期自行检查，并作出记录，对其使用的起重机械的安全附件、安全保护装置进行定期校验、检修，并作出记录","起重机械使用单位应当按照安全技术规范的要求，在检验合格有效期届满前一个月向特种设备检验机构提出定期检验要求，未经定期检验或者检验不合格的起重机械，不得继续使用"],"answer":"ABCD","explanation":"《中华人民共和国特种设备安全法》第三十三条、第三十四条、第三十五条、第四十条","basis":"《中华人民共和国特种设备安全法》第三十三条、第三十四条、第三十五条、第四十条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0478","type":"多选题","category":"安全生产主体责任","question":"根据安全生产监管要求，企业安全生产主体责任包括（ ）。","options":["建立健全安全生产责任制，制定安全生产规章制度和操作规程，保证安全生产投入的有效实施","设置安全生产管理机构，配备专职安全生产管理人员，对从业人员进行安全生产教育和培训","开展安全生产检查，及时消除生产安全事故隐患，制定并实施生产安全事故应急救援预案，及时、如实报告生产安全事故","严格执行国家和行业安全生产标准，加强安全生产技术管理，推广应用先进的安全生产技术、设备和管理方法"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四条：生产经营单位必须遵守本法……加强安全生产管理，建立健全全员安全生产责任制和安全生产规章制度……加强安全生产标准化、信息化建设，构建安全风险分级管控和隐患排查治理双重预防机制。；《中华人民共和国安全生产法》第二十一条：主要负责人对本单位安全生产工作负有（一）建立健全并落实全员安全生产责任制……（四）保证安全生产投入有效实施……（五）督促、检查安全生产工作，及时消除事故隐患……（六）组织制定并实施应急救援预案……（七）及时、如实报告生产安全事故。；《中华人民共和国安全生产法》第二十四条：应当设置安全生产管理机构或者配备专职安全生产管理人员。；《中华人民共和国安全生产法》第二十八条：对从业人员进行安全生产教育和培训。；《中华人民共和国安全生产法》第八十一条：生产经营单位应当制定本单位生产安全事故应急救援预案，与所在地县级以上地方人民政府组织制定的生产安全事故应急救援预案相衔接，并定期组织演练。；《中华人民共和国安全生产法》第八十三条：生产经营单位发生生产安全事故后，事故现场有关人员应当立即报告本单位负责人……按照国家有关规定立即如实报告当地负有安全生产监督管理职责的部门。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0479","type":"多选题","category":"安全生产保险保障","question":"根据《中华人民共和国保险法》，企业安全生产相关的保险包括（ ）。","options":["工伤保险：用人单位应当为本单位全部职工或者雇工缴纳工伤保险费，职工因工作原因受到事故伤害或者患职业病，且经工伤认定的，享受工伤保险待遇","安全生产责任保险：生产经营单位可以投保安全生产责任保险，为从业人员提供安全生产相关的保障","雇主责任保险：雇主对其雇员在受雇期间从事业务时因遭受意外导致伤、残、死亡或患有与职业有关的职业性疾病，依法或根据雇佣合同应由雇主承担的经济赔偿责任为承保风险的一种责任保险","财产保险：包括企业财产保险、机器损坏保险等，为企业的固定资产、流动资产等提供因自然灾害、意外事故造成的财产损失保障"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第五十一条：生产经营单位必须依法参加工伤保险，为从业人员缴纳保险费；国家鼓励投保安全生产责任保险。 〔依据法规已收录条款库：《中华人民共和国保险法》〕 〔依据法规已收录条款库：《工伤保险条例》〕","basis":"《中华人民共和国保险法》、《工伤保险条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0480","type":"多选题","category":"电气作业安全管理","question":"根据《中华人民共和国安全生产法》，企业电缆敷设作业必须落实的安全要求有（ ）。","options":["电缆敷设前必须编制专项施工方案，对作业人员进行安全技术交底，明确敷设路径、作业流程和安全注意事项","电缆敷设前必须对电缆进行全面检查，确保电缆型号、规格符合设计要求，电缆外观无破损、绝缘良好","电缆敷设过程中，必须严格控制电缆的弯曲半径，严禁过度弯曲、扭转、拖拽电缆，防止电缆绝缘层破损","电缆敷设现场必须设置安全警示区域，严禁无关人员进入，安排专人进行现场监护，在交通要道、路口设置专人指挥"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四十三条：生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实；《中华人民共和国安全生产法》第四十五条：生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用。 〔依据法规已收录条款库：《危险性较大的分部分项工程安全管理规定》〕","basis":"《中华人民共和国安全生产法》（2021年修订版）、《危险性较大的分部分项工程安全管理规定》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0481","type":"多选题","category":"建设工程安全管理","question":"根据《中华人民共和国安全生产法》，企业模板安装与拆除作业必须落实的安全要求有（ ）。","options":["模板安装与拆除前必须编制专项施工方案，对作业人员进行安全技术交底，明确作业流程、安全注意事项和应急处置措施","模板安装必须严格按照专项施工方案和国家规范进行，确保模板的支撑系统稳定、牢固，严禁违规安装、超荷载使用","模板拆除必须按照先支后拆、后支先拆的顺序进行，严禁野蛮拆除、大面积撬落、拉倒模板，拆除现场必须设置安全警示区域，严禁无关人员进入","模板安装与拆除作业人员必须正确佩戴和使用劳动防护用品，高处作业必须系好安全带，严禁在无防护的情况下作业"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四十三条：生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实。 〔依据法规已收录条款库：《危险性较大的分部分项工程安全管理规定》〕","basis":"《中华人民共和国安全生产法》（2021年修订版）第四十三条、《危险性较大的分部分项工程安全管理规定》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0482","type":"多选题","category":"动火作业安全管理","question":"根据《中华人民共和国安全生产法》，企业动火作业必须落实的安全要求有（ ）。","options":["动火作业前必须对作业人员进行安全技术交底，明确作业流程、安全注意事项和应急处置措施","动火作业前必须对作业现场进行安全检查","动火作业人员必须正确佩戴和使用劳动防护用品","动火作业现场必须设置安全警示区域，严禁无关人员进入，安排专人进行现场监护，作业结束后必须清理现场，确认无安全隐患后方可离开"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四十三条：生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实。","basis":"《中华人民共和国安全生产法》（2021年修订版）第四十三条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0483","type":"多选题","category":"现场操作规范","question":"根据高处作业安全规范，高处作业时，必须佩戴的个人防护用品有哪些？","options":["安全帽","安全带","防滑鞋","根据作业环境佩戴的护目镜、防尘口罩等"],"answer":"ABCD","explanation":"《JGJ 80-2016 建筑施工高处作业安全技术规范》3.0.5：高处作业人员应按规定正确佩戴和使用高处作业安全防护用品、用具，并应经专人检查。","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0484","type":"多选题","category":"现场操作规范","question":"根据焊接作业安全规范，焊接作业时，必须采取的防火防爆措施有哪些？","options":["清理作业区域周围的易燃易爆物品","无法清理的易燃易爆物品采取隔离防护措施","作业现场配备足够的消防器材","焊接作业结束后，检查现场是否有残留火种，确认无火灾隐患后再离开"],"answer":"ABCD","explanation":"《GB 9448-2025 焊接与切割安全》7.3.1：焊接或切割作业只应在无火灾隐患的条件下实施……应将工件移至指定的安全区进行焊接或切割作业；《GB 9448-2025 焊接与切割安全》7.3.2：工件不可移动时，应将火灾隐患周围所有可移动的物体移至安全位置；《GB 9448-2025 焊接与切割安全》7.4.1：在进行焊接及切割操作的地方应配置足够的灭火设备；《GB 9448-2025 焊接与切割安全》7.5：火灾警戒人员负责监视作业区域内的火灾情况以及在焊接或切割完成后检查并消灭可能存在的残火。","basis":"《焊接与切割安全》GB 9448-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0485","type":"多选题","category":"应急救护技能","question":"根据应急救护规范，发现人员触电后，应采取的正确急救措施有哪些？","options":["立即切断电源，或用干燥的绝缘物体使触电者脱离电源","将触电者转移到安全区域，检查患者的意识、呼吸、心跳","如果患者呼吸、心跳停止，立即进行心肺复苏","立即拨打急救电话，等待医护人员到达"],"answer":"ABCD","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0486","type":"多选题","category":"应急救护技能","question":"根据应急救护规范，对于严重出血的患者，可采取的止血方法有哪些？","options":["直接压迫止血法","加压包扎止血法","止血带止血法","填塞止血法"],"answer":"ABCD","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0487","type":"多选题","category":"应急救护技能","question":"根据应急救护规范，对于烧伤的患者，急救的正确操作有哪些？","options":["立即用大量流动的冷水冲洗烧伤部位15-30分钟，降温止痛","用干净的纱布或毛巾覆盖烧伤部位，避免感染","如果患者口渴，可给患者喝少量淡盐水","立即拨打急救电话，等待医护人员到达"],"answer":"ABCD","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0488","type":"多选题","category":"应急救护技能","question":"对触电者进行急救时，正确的做法包括（ ）。","options":["首先立即切断电源，或用干燥的绝缘物体使触电者脱离电源","将脱离电源的触电者迅速移至通风干燥处，仰卧平躺","检查触电者的呼吸和心跳，如停止立即进行心肺复苏","立即拨打急救电话，同时持续进行急救，直至医护人员到场"],"answer":"ABCD","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"触电急救通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0489","type":"多选题","category":"应急救护技能","question":"对骨折伤员进行急救时，正确的做法包括（ ）。","options":["首先检查伤员的生命体征，如有呼吸心跳停止，立即进行心肺复苏","对骨折部位进行固定，可使用木板、树枝等作为固定材料","固定时应超过骨折部位的上下两个关节，避免骨折端移动","为了方便运输，可将骨折伤员的双腿绑在一起，无论骨折部位在哪里"],"answer":"ABC","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"创伤急救规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0490","type":"单选题","category":"建设工程安全","question":"根据《建设工程安全生产管理条例》，施工单位应当向作业人员提供安全防护用具和安全防护服装，并（）危险岗位的操作规程和违章操作的危害。","options":["口头告知","书面告知","电话通知","无需告知"],"answer":"B","explanation":"建设工程安全生产管理条例 第三十二条","basis":"《建设工程安全生产管理条例》第三十二条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0491","type":"单选题","category":"通用安全法律法规","question":"根据《生产安全事故报告和调查处理条例》，单位负责人接到事故报告后，应当于（）内向事故发生地县级以上人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门报告。","options":["半小时","1小时","2小时","4小时"],"answer":"B","explanation":"生产安全事故报告和调查处理条例 第九条","basis":"《生产安全事故报告和调查处理条例》第九条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0492","type":"多选题","category":"特种设备","question":"根据《中华人民共和国特种设备安全法》，关于电梯的安装、改造、修理，下列说法正确的有（）。","options":["必须由电梯制造单位进行","可以由电梯制造单位或者其委托的依照本法取得相应许可的单位进行","电梯制造单位对电梯安全性能负责","安装、改造、修理无需取得许可"],"answer":"BC","explanation":"中华人民共和国特种设备安全法 第二十二条","basis":"《中华人民共和国特种设备安全法》第二十二条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0493","type":"单选题","category":"职业健康","question":"根据《中华人民共和国职业病防治法》，用人单位应当对劳动者进行（）的职业卫生培训，普及职业卫生知识。","options":["上岗前","在岗期间定期","上岗前和在岗期间","离岗时"],"answer":"C","explanation":"中华人民共和国职业病防治法 第三十四条","basis":"《中华人民共和国职业病防治法》第三十四条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0494","type":"单选题","category":"危险化学品安全","question":"根据《危险化学品安全管理条例》，危险化学品单位应当制定本单位危险化学品事故应急预案，配备应急救援人员和必要的器材、设备，并（）组织应急救援演练。","options":["定期","每年一次","每季度","视情况"],"answer":"A","explanation":"危险化学品安全管理条例 第七十条","basis":"《危险化学品安全管理条例》第七十条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0495","type":"多选题","category":"应急管理","question":"根据《中华人民共和国突发事件应对法》（2024修订），应急预案应当具体规定（）等内容。","options":["组织指挥体系与职责","预防与预警机制","应急处置程序","应急保障措施以及事后恢复与重建措施"],"answer":"ABCD","explanation":"《中华人民共和国突发事件应对法》第二十八条","basis":"《中华人民共和国突发事件应对法》（2024修订）第二十八条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0496","type":"单选题","category":"通用安全法律法规","question":"根据《中华人民共和国安全生产法》，生产经营单位应当向从业人员如实告知作业场所和工作岗位存在的危险因素、防范措施以及（）。","options":["事故应急措施","利润分配方案","人事安排","以上都不对"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021 修正）第四十四条","basis":"《中华人民共和国安全生产法》第四十四条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0497","type":"单选题","category":"消防","question":"根据《中华人民共和国消防法》，任何人发现火灾都应当立即（）。","options":["报警","自行灭火","撤离现场","报告单位领导"],"answer":"A","explanation":"《中华人民共和国消防法》（2021 修正）第四十四条","basis":"《中华人民共和国消防法》第四十四条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0498","type":"多选题","category":"应急管理","question":"根据《生产安全事故应急条例》，应当至少每半年组织1次生产安全事故应急救援预案演练的单位包括（）。","options":["危险化学品生产、经营、储存、运输单位","矿山、金属冶炼、城市轨道交通运营单位","建筑施工单位","宾馆、商场、娱乐场所、旅游景区等人员密集场所经营单位"],"answer":"ABCD","explanation":"《生产安全事故应急条例》第八条","basis":"《生产安全事故应急条例》第八条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0499","type":"单选题","category":"职业健康","question":"根据《中华人民共和国职业病防治法》，新建、扩建、改建建设项目和技术改造、技术引进项目可能产生职业病危害的，建设单位在（）应当进行职业病危害预评价。","options":["设计阶段","可行性论证阶段","施工阶段","竣工验收阶段"],"answer":"B","explanation":"中华人民共和国职业病防治法 第十七条","basis":"《中华人民共和国职业病防治法》第十七条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0500","type":"单选题","category":"特种设备与起重作业安全","question":"某大厦内有甲、乙、丙三家公司对大厦的一部电梯拥有共同产权，其中甲占50％，乙占30％，丙占20％。三个公司共同委托大厦物业管理方丁公司负责管理电梯，应向特种设备检验机构提出定期检验申请的单位是（ ）。","options":["丁公司","甲公司","乙公司"],"answer":"A","explanation":"答案为A（丁公司）。题干已明确三家共有人共同委托丁公司管理电梯。特种设备属于共有的，共有人可以委托物业服务单位或者其他管理人管理；受托人履行特种设备使用单位的法定义务并承担相应责任。因此，本题由受托管理人丁公司作为使用管理责任主体办理定期检验申请，而不是由甲、乙、丙按产权比例分别申请。定期检验应在检验合格有效期届满前一个月提出。","basis":"《中华人民共和国特种设备安全法》第三十八条、第四十条。另注意：市场监管总局2026年第6号公告发布的《特种设备使用管理规则》（TSG 08—2026）自2026年5月1日起施行，已替代TSG 08—2017；具体办理程序还应按现行TSG 08—2026及当地检验机构要求执行。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：已核对法律条文；现行TSG 08—2026具体操作条款未逐条核读，故不引用其条款号。"},{"id":"Q0501","type":"单选题","category":"安全生产法律法规","question":"某道路运输企业共有基层员工83人，管理人员15人，依据(安全生产法》的规定，下列关于该企业安全生产管理机构设置和安全生产管理人员配备的说法，正确的是( )。","options":["该企业可根据需要，自主决定是否设置安全生产管理机构、配备安全生产管理人员，这是其经营自主权范围内的事","该企业规模较小，配备兼职安全生产管理人员就可以了","该企业应当设置安全生产管理机构或者配备专职安全生产管理人员","该企业应当配备专职或者兼职的安全生产管理人员"],"answer":"C","explanation":"答案为C。道路运输单位属于《安全生产法》第二十四条明确列举的单位类型，不因企业员工人数少于100人而适用一般生产经营单位的“专职或兼职”配备规则。该企业应当设置安全生产管理机构，或者配备专职安全生产管理人员。选项A、B、D均忽略了“运输单位”这一法定类别。","basis":"《中华人民共和国安全生产法》第二十四条。该条明确规定，运输单位应当设置安全生产管理机构或者配备专职安全生产管理人员。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：已核对现行《安全生产法》条文。"},{"id":"Q0502","type":"单选题","category":"安全风险管控与隐患排查","question":"关于事故隐患排查治理制度，以下表述错误的是( )。","options":["生产经营单位应当采取技术、管理措施，及时发现并消除事故隐患","事故隐患应当报告主管的负有安全生产监督管理职责的部门","县级以上地方各级人民政府负有安全生产监督管理职责的部门应当建立健全重大事故隐患治理督办制度"],"answer":"B","explanation":"答案为B。生产经营单位应当建立并落实事故隐患排查治理制度，采取技术、管理措施及时发现、消除隐患，并如实记录、向从业人员通报；其中重大事故隐患排查治理情况应及时向负有安全生产监督管理职责的部门和职工大会或者职工代表大会报告。法律并未规定所有一般事故隐患都必须逐项报告主管部门，因此B将报告义务扩大到全部事故隐患，表述错误。C所述县级以上地方政府有关部门建立重大事故隐患治理督办制度，属于法律规定。","basis":"《中华人民共和国安全生产法》第四十一条第二款、第三款。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：已核对现行《安全生产法》条文。"},{"id":"Q0503","type":"单选题","category":"安全生产责任与制度","question":"生产经营单位应当建立相应的机制，加强对安全生产责任制落实情况的（ ），保证安全生产责任制的落实。","options":["综合管理","监督考核","监督管理","综合监督管理"],"answer":"B","explanation":"答案为B（监督考核）。安全生产责任制应明确各岗位责任人员、责任范围和考核标准；生产经营单位还应建立相应机制，对责任制落实情况进行监督考核，以推动责任落实。题干问的是对落实情况采取的具体机制，故选“监督考核”，而不是一般性的综合管理或监督管理。","basis":"《中华人民共和国安全生产法》第二十二条。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：已核对现行《安全生产法》条文。"},{"id":"Q0504","type":"单选题","category":"危险化学品安全","question":"单元内存在危险化学品的数量等于或超过规定的临界量，即被定为( )。","options":["安全隐患","重大危险源","重大安全隐患","危险源"],"answer":"B","explanation":"答案为B（重大危险源）。重大危险源辨识并非只看是否存在危险化学品，而是按照生产单元、储存单元内危险化学品的种类、数量及相应临界量进行辨识。单一品种数量达到或超过该品种临界量，或者多品种按标准规定的比例计算后达到辨识指标的，构成危险化学品重大危险源。","basis":"GB 18218—2018《危险化学品重大危险源辨识》第3.4条、第4.2.1条。国家标准信息公共服务平台标示该标准状态为现行。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：已核对现行国家标准文本及标准状态。"},{"id":"Q0505","type":"单选题","category":"危险化学品安全","question":"危险化学品、非煤矿山企业主要负责人和安全生产管理人员安全资格培训时间不得少于（ ）学时。","options":["16","24","32","48"],"answer":"D","explanation":"按题库给定答案D（48学时）。《生产经营单位安全培训规定》第九条规定，煤矿、非煤矿山、危险化学品、烟花爆竹、金属冶炼等生产经营单位主要负责人和安全生产管理人员初次安全培训时间不得少于48学时；每年再培训时间不得少于16学时。题干所列危险化学品、非煤矿山企业属于该范围，故选48学时。注意本题问的是主要负责人和安全生产管理人员的初次培训，不是一般从业人员岗前培训。","basis":"《生产经营单位安全培训规定》第九条。应急管理部公开文本载明该规定经2013年、2015年修正；本题适用的48学时要求见第九条第二款。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：已核对应急管理部公布的规章文本；正式用于考试前建议结合培训对象及行业类别再次确认适用范围。"},{"id":"Q0506","type":"单选题","category":"安全生产法律法规","question":"某公司董事长由上一级单位总经理张某兼任，张某长期在外地.不负责该公司日常工作。该公司总经理安某在国外脱产学习，期间日常工作由常务副总经理徐某负责，分管安全生产工作的副总经理姚某协助其工作。根据(安全生产法)有关规定，此期间对该公司的安全生产工作全面负责的人是（ ）。","options":["安某","张某","徐某"],"answer":"C","explanation":"题库给定答案为C（徐某）。题干描述董事长张某不负责该公司日常工作、总经理安某脱产学习，期间由常务副总经理徐某负责日常工作，姚某仅协助分管安全生产。按本题设置的情境，徐某是该期间实际主持、全面负责公司日常工作的负责人，因此题库答案选择徐某。需要注意：现行《安全生产法》规定生产经营单位主要负责人对本单位安全生产工作全面负责，但本题将“临时主持日常工作者”直接等同于法律意义上的主要负责人，仍需结合公司任命、授权文件及实际职责判断；仅凭题干不能完全替代对具体任职关系的法律认定。","basis":"《中华人民共和国安全生产法》第五条规定生产经营单位主要负责人是本单位安全生产第一责任人，对本单位安全生产工作全面负责。该条可作为责任原则依据，但未直接规定本题所述临时代理情形的认定标准。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：需进一步核验：题库答案按题干情境可解释为C，但代理负责人是否构成法律意义上的主要负责人，须结合任命、授权及实际履职事实。"},{"id":"Q0507","type":"单选题","category":"安全生产法律法规","question":"某生产车间进行吊装作业，为防止吊装物料失衡滑落，班长要求工人站在吊装的物料上。根据《安全生产法》，工人正确的做法是?（ ）","options":["执行班长的工作指令","系上安全带进行作业","拒绝班长的工作指令"],"answer":"C","explanation":"答案为C（拒绝班长的工作指令）。站在吊装物料上属于明显的不安全作业安排，可能导致物体失衡、坠落或人员伤害。从业人员有权拒绝违章指挥和强令冒险作业，不应以系安全带等个人防护措施替代对明显违法违规指令的拒绝。现场应停止该安排，并按规定采用合规的吊装工艺和人员作业位置。","basis":"《中华人民共和国安全生产法》第五十四条：从业人员有权拒绝违章指挥和强令冒险作业。涉及紧急危险时，还应结合第五十五条关于停止作业、撤离作业场所的规定。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：已核对现行《安全生产法》条文。"},{"id":"Q0508","type":"单选题","category":"有限空间作业安全","question":"有限空间作业前（   ）内，应对有限空间内进行气体分析检测，检测合格后方可进入。","options":["20分钟","30分钟","60分钟"],"answer":"B","explanation":"按题库给定答案B（30分钟）。对于适用《危险化学品企业特殊作业安全规范》的受限空间作业，作业前30 min内应对受限空间进行气体检测，检测分析合格后方可进入。检测点应具有代表性；容积较大的受限空间应按标准要求进行多部位检测。注意适用范围：GB 30871—2022适用于危险化学品企业特殊作业；不能不加区分地将“30分钟”表述为所有行业、所有有限空间作业的统一规定。工贸企业还应同时遵守现行《工贸企业有限空间作业安全规定》关于先通风、再检测、后作业等要求。","basis":"《危险化学品企业特殊作业安全规范》GB 30871—2022第6.3条a）。该标准适用范围应结合企业性质及作业类型判断；《工贸企业有限空间作业安全规定》（应急管理部令第13号）第十四条规定“先通风、再检测、后作业”，但未在该条规定统一的30分钟数值。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：答案与GB 30871—2022第6.3条a）一致；需注意该标准适用范围，不宜泛化至所有有限空间作业。"},{"id":"Q0509","type":"单选题","category":"安全生产责任与制度","question":"生产经营单位的主要负责人和安全生产管理人员必须具备与本单位所从事的生产经营活动相应的（ ）。","options":["安全生产知识和培训能力","安全生产知识和管理能力","安全培训知识和管理能力"],"answer":"B","explanation":"答案为B（安全生产知识和管理能力）。生产经营单位主要负责人和安全生产管理人员不仅要掌握安全生产知识，还必须具备与本单位生产经营活动相适应的安全生产管理能力。选项A将“管理能力”替换为“培训能力”，选项C将“安全生产知识”表述为“安全培训知识”，均不符合条文原文。","basis":"《中华人民共和国安全生产法》第二十七条第一款。","source":"综合题库2.docx","status":"解析补充第1批；已录入原资料答案；未提供解析；解析补充第1批：已核对现行《安全生产法》条文。"},{"id":"Q0510","type":"单选题","category":"安全生产法律法规与综合管理","question":"造成 10 人以上 30 人以下死亡，或者 50 人以上 100 人以下重伤，或者 5000 万元以上 1 亿元 以下直接经济损失的事故是( )。","options":["特别重大事故","重大事故","较大事故"],"answer":"B","explanation":"答案为B（重大事故）。《生产安全事故报告和调查处理条例》按死亡人数、重伤人数或直接经济损失三项指标划分事故等级，任一指标达到相应档次即按该档次认定。题干的10人以上30人以下死亡、50人以上100人以下重伤、5000万元以上1亿元以下直接经济损失，均对应重大事故。注意重伤包括急性工业中毒。","basis":"《生产安全事故报告和调查处理条例》第三条第（二）项。","source":"综合题库2.docx；综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：现行条例条文可核对；本题等级阈值以该条例第三条为准。"},{"id":"Q0511","type":"单选题","category":"消防安全","question":"个人损坏、挪用或擅自拆除、停用消防设施、器材， 埋压、圈占、遮挡消火栓的， 处（）处 罚。","options":["警告或五百元以下罚款","十日以下行政拘留","十五日以下行政拘留"],"answer":"A","explanation":"题库答案为A（警告或五百元以下罚款）。该题描述的是个人损坏、挪用、擅自拆除或停用消防设施器材，以及埋压、圈占、遮挡消火栓等行为。消防法对个人实施该类行为规定了警告或者罚款的法律责任。注意本题处罚对象是“个人”，不能与单位违法时的罚款幅度混淆。","basis":"《中华人民共和国消防法》第六十条第二款。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：按题库给定答案解释；处罚条款应以现行消防法文本核对，执法适用还需结合具体行为及情节。"},{"id":"Q0512","type":"单选题","category":"消防安全","question":"消防法规定， 生产、储存、经营易燃易爆危险品的场所不得与（ ）设置在同一建筑物内，并应当与其保持安全距离。","options":["居住场所","住宅","商场"],"answer":"A","explanation":"答案为A（居住场所）。易燃易爆危险品生产、储存、经营场所具有较高火灾爆炸危险性，与人员居住空间设置在同一建筑物内会显著增加人员伤亡风险。因此消防法明确禁止该类场所与居住场所设置在同一建筑物内，并要求保持安全距离。选项“住宅”范围较窄，法条使用的是“居住场所”。","basis":"《中华人民共和国消防法》第十九条。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：已按消防法条文用语解释；具体项目还应核对建筑用途及相关消防技术标准。"},{"id":"Q0513","type":"单选题","category":"消防安全","question":"消防法规定，举办大型群众性活动，承办人应当依法向（ ）申请安全许可，制定灭火和应 急疏散预案并组织演练。","options":["人民法院","公安机关","消防监督管理部门"],"answer":"B","explanation":"答案为B（公安机关）。大型群众性活动的承办人依法应向公安机关申请安全许可，并制定灭火和应急疏散预案、组织演练。公安机关负责大型群众性活动安全管理许可，不是人民法院，也不是消防监督管理部门直接受理该项活动安全许可。","basis":"《中华人民共和国消防法》第二十条；《大型群众性活动安全管理条例》第十一条。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：需注意题干沿用消防法表述；具体许可事项还应结合《大型群众性活动安全管理条例》及现行公安机关办理要求。"},{"id":"Q0514","type":"单选题","category":"消防安全","question":"人员密集场所室内装修、装饰，应当按照消防技术标准的要求，使用（ ）材料。","options":["难燃","不燃","不燃、难燃"],"answer":"C","explanation":"题库答案为C（不燃、难燃）。人员密集场所人员集中、疏散压力大，室内装修装饰材料的燃烧性能会影响火灾荷载、火势蔓延和烟气发展。相关消防技术标准按建筑部位、场所用途和材料类别规定燃烧性能等级，并非所有部位一律只用不燃材料；本题选项中“不燃、难燃”体现按标准要求选用相应等级材料。","basis":"《中华人民共和国消防法》第二十六条；《建筑内部装修设计防火规范》GB 50222—2017。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：该题表述较概括；具体材料等级必须按建筑类型、使用部位及现行规范表格确定，不能把“不燃、难燃”理解为所有部位均可任选。"},{"id":"Q0515","type":"单选题","category":"消防安全","question":"《中华人民共和国消防法》规定， 建设工程的消防设计、施工必须符合( )工程建设消防技术标准。","options":["省级","行业","国家"],"answer":"C","explanation":"答案为C（国家）。建设工程消防设计、施工应符合国家工程建设消防技术标准。消防技术标准是建设工程消防设计、施工及验收的重要技术依据，不能仅满足某一省级或行业文件而降低国家标准要求。","basis":"《中华人民共和国消防法》第九条。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：已按消防法现行条文解释。"},{"id":"Q0516","type":"单选题","category":"消防安全","question":"消防法规定， 生产经营单位的消防设施、器材或者消防安全标志的配置、设置不符合国家标 准、行业标准，或者未保持完好有效的，责令改正，处（ ）罚款。","options":["五千元以上二万元以下","一万元以上五万元以下","五千元以上五万元以下"],"answer":"C","explanation":"题库答案为C（五千元以上五万元以下）。消防设施、器材或者消防安全标志的配置、设置不符合国家标准、行业标准，或者未保持完好有效，属于消防法规定的违法行为。题库所列罚款幅度对应单位违法的处罚幅度；个人违法的处罚规则不同。","basis":"《中华人民共和国消防法》第六十条第一款相关规定。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：请注意本题题干使用“生产经营单位”但未明确处罚主体是否为单位；解释按题库答案C对应的单位罚款幅度说明。"},{"id":"Q0517","type":"单选题","category":"消防安全","question":"消防法规定， 生产经营单位损坏、挪用或者擅自拆除、停用消防设施、器材的处（ ）罚款。","options":["五千元以上五万元以下","五千元以上十万元以下","一万元以上五万元以下"],"answer":"A","explanation":"题库答案为A（五千元以上五万元以下）。损坏、挪用或者擅自拆除、停用消防设施、器材，会削弱建筑消防设施的报警、灭火和防护功能，可能导致火灾初期无法及时控制。消防法对单位实施该行为规定责令改正及相应罚款；个人实施类似行为适用不同处罚条款和幅度。","basis":"《中华人民共和国消防法》第六十条第一款。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：按题库给定答案解释；请核对原题是否明确为单位行为，个人处罚另有规定。"},{"id":"Q0518","type":"单选题","category":"消防安全","question":"消防法规定， 生产经营单位占用、堵塞、封闭疏散通道、安全出口或者有其他妨碍安全疏散 行为的，处（ ）罚款。","options":["五千元以上一万元以下","五千元以上五万元以下","一万元以上五万元以下"],"answer":"B","explanation":"题库答案为B（五千元以上五万元以下）。占用、堵塞、封闭疏散通道、安全出口，或有其他妨碍安全疏散行为，会影响人员在火灾等紧急情况下及时撤离。消防法对单位实施此类行为规定责令改正及罚款；对个人的处罚另有规定。","basis":"《中华人民共和国消防法》第六十条第一款。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：按题库答案及单位违法情形解释；实际处罚需区分违法主体及具体行为。"},{"id":"Q0519","type":"单选题","category":"消防安全","question":"消防法规定，生产经营单位占用、堵塞、封闭消防车通道，妨碍消防车通行的，处（ ）罚 款。","options":["五千元以上一万元以下","五千元以上二万元以下","五千元以上五万元以下"],"answer":"C","explanation":"题库答案为C（五千元以上五万元以下）。消防车通道是消防车辆快速到达火灾现场、展开灭火救援的重要通行条件。占用、堵塞、封闭消防车通道并妨碍消防车通行，属于消防法明确禁止的行为，单位违法适用相应罚款。","basis":"《中华人民共和国消防法》第六十条第一款。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：按题库给定答案解释；应与疏散通道、安全出口违法行为的法条项次及个人处罚区分。"},{"id":"Q0520","type":"单选题","category":"消防安全","question":"消防法规定，（ ）都有参加有组织的灭火工作的义务。","options":["任何单位和成年人","重点单位和个人","任何单位和个人"],"answer":"A","explanation":"答案为A（任何单位和成年人）。消防法规定，任何单位和成年人都有参加有组织的灭火工作的义务。该义务强调社会单位和具备相应条件的成年人参与有组织灭火，并不等于任何个人均可不顾现场指挥和自身安全擅自进入危险区域灭火。","basis":"《中华人民共和国消防法》第四十四条。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：已按消防法条文解释；参与灭火应服从统一组织指挥并确保自身安全。"},{"id":"Q0521","type":"单选题","category":"安全生产综合知识","question":"重大劳动安全事故罪是指( )。","options":["违反有关安全管理的规定，导致发生重大伤亡事故","违反爆炸性、易燃性等物品的管理规定，因而发生重大事故","安全生产设施或安全生产条件不符合国家规定，因而发生重大伤亡事故"],"answer":"C","explanation":"答案为C。重大劳动安全事故罪针对安全生产设施或者安全生产条件不符合国家规定，因而发生重大伤亡事故或者造成其他严重后果的情形。A更接近强令、违章冒险作业等相关犯罪描述，B针对危险物品肇事类情形，均不是本罪的核心构成表述。刑事责任认定还需满足主体、结果及因果关系等构成要件。","basis":"《中华人民共和国刑法》第一百三十五条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：已按刑法条文解释；具体罪名认定须由司法机关结合全部犯罪构成要件判断。"},{"id":"Q0522","type":"单选题","category":"安全生产法律法规","question":"《中华人民共和国安全生产法》规定， 生产经营单位必须建立、健全安全生产责任制度和安全 生产规章制度，改善安全生产条件，推进( )，提高安全生产水平。","options":["安全生产标准化建设","企业安全文化建设","事故预防体系建设"],"answer":"A","explanation":"答案为A（安全生产标准化建设）。安全生产标准化通过建立并持续运行安全生产责任制、管理制度和操作规程，开展风险分级管控、隐患排查治理及持续改进，推动生产经营单位安全管理规范化。题干所引《安全生产法》要求生产经营单位推进安全生产标准化建设。","basis":"《中华人民共和国安全生产法》第四条。","source":"综合题库2.docx；综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第1批：已按现行《安全生产法》条文解释。"},{"id":"Q0523","type":"单选题","category":"现场管理与作业规范","question":"作业现场“6S” 管理是指（ ）","options":["整理、整顿、清扫、清洁、素养、安全","排查、整理、整顿、清扫、清洁、素养","整理、排查、清扫、清洁、素养、安全"],"answer":"A","explanation":"答案为A。6S通常指整理、整顿、清扫、清洁、素养、安全，是现场管理方法。整理是区分必要与不必要物品，整顿是定置、定位、定量，清扫是清除脏污并检查异常，清洁是维持前三项成果，素养是形成遵守标准的习惯，安全是识别和控制现场风险。6S属于管理方法，不是法律法规中统一规定的法定术语。","basis":"现场管理通行的6S管理方法；不属于单一法律条文规定。","source":"综合题库2.docx；综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：属于管理工具性知识，具体实施标准可结合企业现场管理制度。"},{"id":"Q0524","type":"单选题","category":"安全生产综合知识","question":"特种劳动防护用品的“三证一标志”中的标志指（ ）。","options":["产品标志","安全标签","安全标志"],"answer":"C","explanation":"题库答案为C（安全标志）。传统教材中“特种劳动防护用品三证一标志”通常指生产许可证、产品合格证、安全鉴定证及特种劳动防护用品安全标志。该题所称“标志”是安全标志，而不是化学品安全标签。需要注意，特种劳动防护用品管理制度和标志管理要求曾有调整，实际采购、验收应按现行国家及行业管理要求核验产品资质、检验报告和适用标准。","basis":"历史教材术语“三证一标志”；可结合原国家安全生产监督管理总局《劳动防护用品监督管理规定》及现行特种劳动防护用品配备、产品标准核查。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：术语具有历史制度背景，现行采购管理不宜仅凭“三证一标志”旧称判断合规；建议列为制度时效复核项。"},{"id":"Q0525","type":"单选题","category":"安全生产综合知识","question":"下面（   ）是化学品标签中的警示词。","options":["危险、警告、注意","火灾、爆炸、自燃","毒性、还原性、氧化性"],"answer":"A","explanation":"题库答案为A（危险、警告、注意），但该选项与现行化学品安全标签标准的规范用语存在疑点。化学品安全标签中的“象形图、信号词、危险性说明、防范说明”等是规范要素；GB 15258规定的信号词为“危险”或“警告”，并非“危险、警告、注意”三种。题库答案暂按原值保留，但本题答案与现行标准术语不完全一致，建议后续核对原题选项及标准版本，不宜将“注意”作为规范信号词教授。","basis":"GB 15258—2009《化学品安全标签编写规定》关于信号词的规定；另应核查该标准截至使用时是否已有替代版本。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：标记为需复核：题库给定答案A与标准列举的信号词不完全一致，本批不擅自更改答案。"},{"id":"Q0526","type":"单选题","category":"安全生产综合知识","question":"标明了安全使用注意事项和防护基本要求的是（   ）。","options":["化学品标志","化学品安全标签","危险化学品标志"],"answer":"B","explanation":"答案为B（化学品安全标签）。化学品安全标签用于向使用者传递化学品危险性及安全使用信息，通常包括化学品标识、象形图、信号词、危险性说明、防范说明、供应商信息等内容，能够标明安全使用注意事项和防护基本要求。单纯的化学品标志或危险化学品标志不能替代完整安全标签。","basis":"GB 15258—2009《化学品安全标签编写规定》；使用时应核查国家标准现行状态及替代版本。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：依据标准名称及标签制度解释；标准现行状态需在正式定稿前再次核验。"},{"id":"Q0527","type":"单选题","category":"危险化学品安全","question":"浓硫酸属于（   ）化学品。","options":["爆炸品","腐蚀性","易燃液体"],"answer":"B","explanation":"答案为B（腐蚀性）。浓硫酸具有强腐蚀性，接触皮肤、眼睛可造成严重化学灼伤；与水混合会大量放热，稀释时应遵守将酸缓慢加入水中并搅拌等安全要求。危险化学品分类应依据具体浓度、物质性质及适用分类标准，不能仅凭俗名判断所有浓度硫酸的危险类别。","basis":"GB 30000系列《化学品分类和标签规范》相关腐蚀类别标准；具体分类应结合硫酸浓度和产品安全技术说明书（SDS）。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：题目未给出浓度；按“浓硫酸”常见商品形态解释，精确分类需核对浓度及SDS。"},{"id":"Q0528","type":"单选题","category":"危险化学品安全","question":"下面对剧毒品的描述中, （   ）是错误的?","options":["不准露天堆放","必须双人收发","不能用玻璃瓶储存"],"answer":"C","explanation":"题库答案为C（不能用玻璃瓶储存）作为错误描述。剧毒化学品储存容器应根据物质性质、相容性、包装要求及相关标准选择，不能笼统认定所有剧毒品均不得用玻璃容器；是否可用玻璃瓶取决于具体化学品与容器材质的相容性。剧毒化学品必须落实严格的储存、双人收发、专人管理等制度。题目将所有剧毒品一概而论，表述过于绝对。","basis":"《危险化学品安全管理条例》有关剧毒化学品管理规定；GB 15603—2022《危险化学品仓库储存通则》及具体化学品SDS。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：需核验：不同剧毒化学品包装材质要求不同，题干未指明具体物质，不能形成普遍性结论；保留题库答案并标记。"},{"id":"Q0529","type":"单选题","category":"危险化学品安全","question":"储存危险化学品的仓库可以使用（   ）采暖。","options":["蒸汽","热水","机械"],"answer":"B","explanation":"答案为B（热水）。危险化学品仓库采暖方式应防止热源引发危险化学品分解、燃烧、爆炸或包装损坏。采用何种采暖方式需根据储存物质类别、仓库设计和消防要求确定；热水采暖通常比明火或高温表面直接加热更易控制温度和点火风险，但仍须符合仓库设计规范及储存物品的温度要求。","basis":"GB 15603—2022《危险化学品仓库储存通则》；仓库建筑及采暖设计还应符合适用的建筑防火、暖通设计标准。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：按题库选项解释；具体仓库采暖方式须结合危险化学品类别及设计规范确认。"},{"id":"Q0530","type":"单选题","category":"安全生产综合知识","question":"遇水燃烧物质起火时,不能用（  ）扑灭。","options":["干粉灭火剂","泡沫灭火剂","二氧化碳灭火剂"],"answer":"B","explanation":"答案为B（泡沫灭火剂）。遇水燃烧物质与水或含水灭火剂接触可能发生剧烈反应，产生可燃气体、放热甚至爆炸。泡沫灭火剂含有水相，因此不适用于遇水燃烧物质火灾。应根据物质性质选择适用的干粉、专用覆盖剂或其他相容灭火介质，并遵循化学品SDS及应急处置方案。","basis":"GB 50140—2005《建筑灭火器配置设计规范》及相关灭火剂适用范围；具体物质应以SDS和专项处置方案为准。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：题干未明确具体遇水燃烧物质；不同物质灭火方法有差异，不能将某一种灭火剂泛化适用于所有情形。"},{"id":"Q0531","type":"单选题","category":"安全生产综合知识","question":"工业上使用的氧化剂要与具有（   ）性质的化学品远远分离。","options":["还原性物品","惰性气体","腐蚀性液体"],"answer":"A","explanation":"答案为A（还原性物品）。氧化剂具有氧化性，可能与还原剂发生剧烈氧化还原反应，释放大量热量，造成燃烧或爆炸风险。因此氧化剂应与还原性物品分区、隔离储存，并按危险化学品禁忌物料表及SDS落实相容性管理。","basis":"GB 15603—2022《危险化学品仓库储存通则》关于禁忌物料、分类分区储存的要求；具体物料配伍以SDS为准。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：按通用化学品相容性原则解释；具体储存应以物质类别和SDS为依据。"},{"id":"Q0532","type":"单选题","category":"危险化学品安全","question":"搬运剧毒化学品后,应该（   ）。","options":["用流动的水洗手","吃东西补充体力","休息"],"answer":"A","explanation":"答案为A（用流动的水洗手）。搬运剧毒化学品后，手部可能受到微量污染，不能直接进食、饮水或触摸口鼻眼。应按化学品SDS和现场卫生程序及时进行去污清洗，脱除受污染手套或衣物；如怀疑皮肤接触或出现症状，应立即按应急程序处理并就医。普通清洗不能替代针对特定化学品的专业去污措施。","basis":"《危险化学品安全管理条例》关于作业安全及防护要求；具体清洗方法以该化学品SDS和应急处置卡为准。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：题目为一般卫生防护原则；不同剧毒化学品去污方法可能不同，需以SDS为准。"},{"id":"Q0533","type":"单选题","category":"安全生产综合知识","question":"强酸灼伤皮肤不能用（   ）冲洗。","options":["热水","冷水","弱碱溶液"],"answer":"A","explanation":"答案为A（热水）。强酸灼伤皮肤后，应立即脱去受污染衣物，并使用大量流动清水持续冲洗受伤部位；不应使用热水，以免加重组织损伤或影响处置。也不建议现场自行使用弱碱溶液中和皮肤上的强酸，因为中和反应可能放热并造成二次灼伤。冲洗后应尽快接受医疗评估。","basis":"化学品安全技术说明书（SDS）第4部分“急救措施”；可参照GB/T 16483《化学品安全技术说明书 内容和项目顺序》。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：依据为化学灼伤急救通行原则；具体急救应以涉事酸品SDS和医疗救治意见为准。"},{"id":"Q0534","type":"单选题","category":"特种设备与起重作业安全","question":"施工起重机械，在验收前应当经有相应资质检验检测机构监督检验合格，这是（ ）的规定。","options":["《设备安全运行条例》","《特种设备安全监察条例》","《特种设备安全运行条例》","《特种设备监察条例》"],"answer":"B","explanation":"题库答案为B（《特种设备安全监察条例》）。本题所引规定涉及施工起重机械安装、拆卸及验收前监督检验。需要注意，建设工程施工现场的建筑起重机械还受《建筑起重机械安全监督管理规定》《建设工程安全生产管理条例》等专门规定调整；题目所列《特种设备安全监察条例》属于历史法规名称，现行制度和具体设备适用范围需进一步核验，不能仅凭旧题答案作为当前办理依据。","basis":"《建设工程安全生产管理条例》第三十五条；《建筑起重机械安全监督管理规定》（建设部令第166号）相关规定。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：标记法规名称及适用范围需复核：题干引用的《特种设备安全监察条例》不是当前建筑起重机械管理的唯一或当然依据。"},{"id":"Q0535","type":"单选题","category":"安全生产法律法规","question":"根据《建设工程安全生产管理条例》规定，有权对施工现场的作业条件、作业程序和作业方式中存在的安全问题提出批评、检举和控告的是（ ）。","options":["最终用户","设计人员","作业人员","产品经销人员"],"answer":"C","explanation":"答案为C（作业人员）。建设工程作业人员有权对施工现场作业条件、作业程序和作业方式中存在的安全问题提出批评、检举和控告。该权利是保障一线作业人员参与安全管理、报告风险和监督违章作业的重要制度。题干问的是谁享有该权利，故选作业人员。","basis":"《建设工程安全生产管理条例》第三十二条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：已核对条例条文。"},{"id":"Q0536","type":"单选题","category":"安全风险管控与隐患排查","question":"安全生产检查的类型包括:定期安全检查、经常性安全检查、季节性及节假日前后安全检查、专项安全检查、( )和不定期职工代表巡视安全检查。","options":["综合性安全检查","指令性安全检查","防火防爆安全检查","预防性安全检查"],"answer":"A","explanation":"答案为A（综合性安全检查）。安全检查可按组织方式、周期和重点分为定期、经常性、季节性及节假日前后、专项、综合性和不定期职工代表巡视等类型。综合性安全检查通常对一个单位或区域的多项安全管理内容进行较全面检查；专项检查则围绕某一专业或突出风险开展。","basis":"安全生产检查分类属于安全管理通用方法；具体分类以企业安全检查制度和培训教材为准。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：属于管理方法分类，未发现统一法律条文对题干列举类型作封闭式规定。"},{"id":"Q0537","type":"单选题","category":"安全生产综合知识","question":"班组长在安全生产上的职责是:贯彻执行本单位对安全生产的规定和要求，督促本班组工人遵守有关安全生产规章制度和安全操作规程，切实做到（ ）。","options":["尽职尽责，措施完善","班前班后检查、评比","不违章指挥，不违章作业，遵守劳动纪律","事事有人管"],"answer":"C","explanation":"答案为C。班组长处于生产作业一线管理岗位，应组织班组落实单位安全生产规定和操作规程，督促员工遵章作业；自身应做到不违章指挥，并制止违章作业、督促遵守劳动纪律。选项C同时涵盖班组长和班组成员应遵守的基本要求，与题干职责描述相符。","basis":"《中华人民共和国安全生产法》第五十七条、第五十八条；班组长具体职责还应结合企业安全生产责任制。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：法律规定从业人员遵章守规、服从管理；班组长职责的具体表述属于岗位责任制度。"},{"id":"Q0538","type":"单选题","category":"安全生产综合知识","question":"特种作业人员安全技术考核以 ( )考核为主，合格者获得国家统一印制的( )。","options":["安全技术理论 《特种作业人员操作证》","实际操作技能 《特种作业人员操作证》","实际操作技能 《特殊工种资格证》","安全技术理论 《特殊工种资格证》"],"answer":"B","explanation":"题库答案为B（实际操作技能考核为主，取得《特种作业人员操作证》）。但该题明显沿用旧版特种作业考核制度表述。自2026年6月1日起施行的应急管理部令第19号规定，特种作业安全技术考试包括理论考试和实际操作考试两部分，二者均合格才视为考试合格；证书名称为《中华人民共和国特种作业操作证》。因此，题库原答案的“以实际操作技能考核为主”不宜再作为现行制度的完整表述，建议标记待核，不在本次改动原答案。","basis":"《特种作业人员安全技术培训考核管理规定》（应急管理部令第19号）第四条、第九条、第二十条、第四十九条；该规定自2026年6月1日起施行。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：重要时效提示：题库旧答案与2026年6月1日起施行的新规考试结构表述不完全一致；保留原答案，建议修订题目或增加现行制度提示，但本次不自行修改。"},{"id":"Q0539","type":"单选题","category":"安全生产法律法规","question":"（ ）是安全生产法律法规和规章制度的直接执行者，（ ）对本岗位的安全生产负直接责任。","options":["安管人员  岗位工人","车间主任  班组长","车间主任  工人","班组长  岗位工人"],"answer":"A","explanation":"题库答案为A（安全管理人员；岗位工人）。安全生产法律法规和规章制度需要由各层级人员落实：安全管理人员承担组织、协调、监督检查等管理职责；岗位工人是岗位操作规程和安全要求的直接执行者，对本岗位安全生产承担直接责任。题干的两处空格分别对应管理制度执行层面的安全管理人员和岗位直接责任主体。","basis":"《中华人民共和国安全生产法》第二十五条、第五十七条；岗位责任的具体划分还应结合生产经营单位安全生产责任制。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：题干属于教材概括性表述；法律条文分别规定安全生产管理人员职责和从业人员岗位义务。"},{"id":"Q0540","type":"单选题","category":"安全生产责任与制度","question":"在安全生产工作中，通常所说的“三违”现象是指( )。","options":["违反作业规程、违反操作规程、违反安全规程","违章指挥、违章作业、违反劳动纪律","违规进行安全培训、违规发放劳动防护用品、违规消减安全技措经费","违反规定建设、违反规定生产、违反规定销售"],"answer":"B","explanation":"答案为B（违章指挥、违章作业、违反劳动纪律）。“三违”是安全生产管理中对三类常见违规行为的简称：管理人员违章指挥、作业人员违章作业，以及有关人员违反劳动纪律。三者都可能破坏安全管理秩序、导致风险失控。企业应通过制度教育、现场监督和纠正措施防范“三违”。","basis":"安全生产管理通用术语；可结合《中华人民共和国安全生产法》第四十四条、第五十七条及企业安全生产规章制度理解。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：“三违”是安全管理常用概括，不是单一法律条文中的法定定义。"},{"id":"Q0541","type":"单选题","category":"事故管理与持续改进","question":"目前进行事故调查处理应坚持实事求是、尊重科学、( )、公正公开和分级管辖的原则。","options":["严刑厉法","四不放过","三不放过","五不放过"],"answer":"B","explanation":"答案为B（四不放过）。事故处理中的“四不放过”通常指事故原因未查清不放过、责任人员未处理不放过、有关人员未受到教育不放过、整改措施未落实不放过。其核心是查明原因、追究责任、教育警示和落实整改，防止同类事故重复发生。题干列举的是事故调查处理的原则性要求，选项中“四不放过”最符合。","basis":"事故调查处理应遵循《生产安全事故报告和调查处理条例》关于依法调查、查明原因、认定责任、提出处理建议和防范整改措施的规定；“四不放过”为事故管理工作原则性要求。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：需注意“四不放过”是安全生产管理工作中长期使用的原则概括，并非该条例逐字列出的法定原则条款。"},{"id":"Q0542","type":"单选题","category":"安全生产综合知识","question":"目前，我国安全生产监督管理体制是综合监管与行业监管相结合、( )、政府监督与其他监督相结合。","options":["国家监察与地方监管相结合","群众监督与专业机构监督相结合","新闻媒体监督与社会监督相结合","个人监督与集体监督相结合"],"answer":"A","explanation":"答案为A（国家监察与地方监管相结合）。该选项是传统安全生产监督管理体制教材中的概括性表述，强调国家层面的监察与地方政府属地监管相衔接。当前安全生产监管体制还涉及综合监管、行业领域监管、国家矿山安全监察等具体职责分工，不能仅以该概括替代现行机构职责和监管权限。","basis":"《中华人民共和国安全生产法》第十条；国家矿山安全监察等职责还应结合现行机构职能规定。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：该题属于教材性体制概括；“国家监察与地方监管相结合”需结合具体行业监管体制理解，不宜泛化为所有行业统一模式。"},{"id":"Q0543","type":"单选题","category":"安全生产综合知识","question":"建筑施工中，事故比例所占最高的是（ ）","options":["高处坠落事故","各种坍塌事故","物体打击事故","起重伤害事故"],"answer":"A","explanation":"题库答案为A（高处坠落事故）。建筑施工现场存在临边、洞口、脚手架、模板支撑、攀登和悬空作业等高处作业场景，人员失足、作业平台或防护设施失效均可能导致高处坠落。该题属于事故统计类判断，比例排序会随统计年度、地区、工程类型和统计口径变化，不能脱离统计来源长期作为固定事实。","basis":"建筑施工安全生产事故统计资料；应以住房城乡建设主管部门公布的相应年度全国房屋市政工程生产安全事故情况通报为准。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：需补充统计年份、地区及数据来源；本题答案按题库保留，但不宜作为无时间限定的恒定统计结论。"},{"id":"Q0544","type":"单选题","category":"高处作业安全","question":"在施工现场安装、拆卸施工起重机械和整体提升脚手架、模板等自升式架设设施，必须由具有（ ）的单位承担。","options":["相应施工承包资质","制造能力","维修保养经验","检测检验人员"],"answer":"A","explanation":"答案为A（具有相应施工承包资质的单位）。施工起重机械、整体提升脚手架和模板等自升式架设设施的安装、拆卸属于专业性较强且风险较高的作业，应由具备相应资质条件的单位承担，并按规定编制专项施工方案、履行审核和现场管理程序。不能仅凭制造能力、维修经验或拥有检测人员就认定具备承揽资格。","basis":"《建设工程安全生产管理条例》第十七条；《建筑起重机械安全监督管理规定》相关规定。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：已按建设工程安全管理规定解释；具体资质类别和许可要求应结合设备类型及现行资质管理制度核对。"},{"id":"Q0545","type":"单选题","category":"安全生产综合知识","question":"施工单位应当设立安全生产管理机构，配备（ ）安全生产管理人员。","options":["兼职","专职","代理","业余"],"answer":"B","explanation":"答案为B（专职）。建设工程施工单位应当设立安全生产管理机构并配备专职安全生产管理人员。专职安全生产管理人员负责施工现场安全生产监督检查，发现隐患应及时报告，对违章指挥、违章操作应立即制止。兼职、代理或业余人员不能替代法规要求的专职配备。","basis":"《建设工程安全生产管理条例》第二十三条。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：已核对条例条文。"},{"id":"Q0546","type":"单选题","category":"特种设备与起重作业安全","question":"生产经营单位进行爆破、吊装等危险作业，应当安排（ ）进行现场安全管理，确保操作规程的遵守和安全措施的落实。","options":["专门人员","领导","技术工人","负责人"],"answer":"A","explanation":"答案为A（专门人员）。爆破、吊装等危险作业具有较高事故风险，生产经营单位应安排专门人员进行现场安全管理，确保操作规程得到遵守、安全措施得到落实。现场管理人员应核查作业条件、人员资格、警戒隔离和应急措施，不能仅由一般领导到场或由技术工人自行兼顾。","basis":"《中华人民共和国安全生产法》第四十三条。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：已核对现行《安全生产法》条文。"},{"id":"Q0547","type":"单选题","category":"安全教育培训与职业健康","question":"从业人员在作业过程中，应当严格遵守本单位的安全生产规章制度和操作规程，服从管理，正确佩戴和使用（ ）。","options":["安全卫生用品","劳动防护用品","劳动防护工具","劳动防护服装"],"answer":"B","explanation":"答案为B（劳动防护用品）。从业人员应按照岗位风险和单位规定，正确佩戴、使用劳动防护用品。劳动防护用品应与作业危害相匹配，并符合适用的国家标准或行业标准；仅发放用品而未正确选择、佩戴和维护，不能有效发挥防护作用。","basis":"《中华人民共和国安全生产法》第五十七条；《用人单位劳动防护用品管理规范》及适用产品标准。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：已核对《安全生产法》相关义务；具体用品种类须按岗位危害因素和适用标准确定。"},{"id":"Q0548","type":"单选题","category":"应急管理与救援","question":"依据《安全生产法》，生产经营单位应当向从业人员如实告知作业场所和工作岗位存在的( )、防范措施以及事故应急措施。","options":["危险因素","事故隐患","设备缺陷","安全生产责任"],"answer":"A","explanation":"答案为A（危险因素）。生产经营单位应如实告知从业人员作业场所和工作岗位存在的危险因素、防范措施以及事故应急措施，使员工了解岗位风险和发生异常时的应对方法。事故隐患、设备缺陷可能是风险来源或具体问题，但法条所使用的规范表述是“危险因素”。","basis":"《中华人民共和国安全生产法》第四十四条第一款。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第1批：已核对现行《安全生产法》条文。"},{"id":"Q0549","type":"单选题","category":"安全生产综合知识","question":"专职安全生产管理人员负责对施工现场的安全生产进行监督检查，发现违章指挥、违章操作的，应当（ ）。","options":["马上报告有关部门","找有关人员协商","立即制止","通知项目负责人"],"answer":"C","explanation":"答案为C（立即制止）。专职安全生产管理人员发现违章指挥、违章操作，应当立即制止；发现安全事故隐患，应及时向项目负责人和安全生产管理机构报告。制止违章行为是现场监督检查的直接职责，不能仅协商或等待报告后再处理。","basis":"《建设工程安全生产管理条例》第二十三条第二款。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第1批：已核对条例条文。"},{"id":"Q0550","type":"单选题","category":"安全生产综合知识","question":"用人单位各项安全规章制度的核心是（ ）。","options":["安全生产责任制","安全生产管理制度","安全检查制度","安全操作规程"],"answer":"A","explanation":"答案为A（安全生产责任制）。安全生产责任制明确各岗位责任人员、责任范围和考核标准，是把安全生产要求落实到单位、部门、班组和岗位的基础制度。其他管理制度、检查制度和操作规程均需以责任分工为基础运行，因此通常称其为各项安全规章制度的核心。","basis":"《中华人民共和国安全生产法》第二十一条第（一）项、第二十二条。第二十一条规定主要负责人建立健全并落实全员安全生产责任制；第二十二条规定责任制应明确责任人员、责任范围和考核标准。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0551","type":"单选题","category":"安全生产综合知识","question":"在人机系统中，人始终起着核心作用。解决人机系统安全问题的根本途径是( )。","options":["控制人的不安全行为","应用机械的冗余设计","强化监控","实现生产过程机械化和自动化"],"answer":"D","explanation":"答案为D（实现生产过程机械化和自动化）。人机系统事故既可能来自人的不安全行为，也可能来自设备、环境及人机界面设计缺陷。通过机械化、自动化减少人员直接暴露于危险作业环节，可从系统层面降低人为操作失误和危险能量接触的机会，是题目所指的根本途径。控制人的不安全行为、监控和冗余设计也有作用，但属于局部控制措施，不能替代系统性改进。","basis":"本题属于安全人机工程学原理题，未对应单一法律条文。可结合现行机械安全、人机工程及设备安全设计标准理解；具体标准应按设备类别选用。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：属于专业原理题，答案按题库保留；未将其表述为法律规定。"},{"id":"Q0552","type":"单选题","category":"安全生产法律法规","question":"《安全生产法》要求，生产经营单位主要负责人和安全生产管理人员必须具备与本单位所从事生产经营活动相应的安全生产知识和( )。","options":["安全资格","安全技能","管理能力","生产组织能力"],"answer":"C","explanation":"答案为C（管理能力）。生产经营单位主要负责人和安全生产管理人员应具备与本单位生产经营活动相适应的安全生产知识和管理能力。这里强调的不只是掌握知识，还要能够组织落实安全管理、辨识风险、检查隐患、组织培训和应急管理。安全资格、安全技能或生产组织能力均不能完整替代法条中的“管理能力”表述。","basis":"《中华人民共和国安全生产法》第二十七条第一款。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0553","type":"单选题","category":"安全生产综合知识","question":"安全生产“五要素”是既相对独立，叉相辅相成的有机统一体。“五要素”包括安全法制、安全责任、安全科技、安全投入和( )。","options":["安全文化","安全教育","安全管理","安全评价"],"answer":"A","explanation":"答案为A（安全文化）。安全生产“五要素”是安全法制、安全责任、安全科技、安全投入和安全文化。安全文化通过价值理念、行为规范、教育宣传和组织氛围，引导员工形成尊重生命、遵章守纪、主动防范风险的意识。它与制度、责任、科技和投入相互支撑。","basis":"安全生产管理理论中的“五要素”概念，属于教材性知识，并非《安全生产法》中的法定五项分类。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：属于管理理论分类，未对应单一法律条款。"},{"id":"Q0554","type":"单选题","category":"安全教育培训与职业健康","question":"生产经营单位必须为从业人员提供符合国家标准或者（ ）标准的劳动防护用品。","options":["当地","本单位","行业","国家"],"answer":"C","explanation":"答案为C（行业）。劳动防护用品应根据岗位危害因素和防护需求选用，并符合国家标准或者行业标准；没有相应国家标准、行业标准的，应满足相应安全要求。用人单位不能以本单位自行制定的标准替代适用的国家或行业标准。题库答案为“行业”，对应题干的并列表述。","basis":"《中华人民共和国安全生产法》第四十五条；《用人单位劳动防护用品管理规范》及相应劳动防护用品产品标准。","source":"综合题库2.docx","status":"已从题干括号标注识别答案；解析补充第2批：法律表述为符合国家标准或者行业标准；具体用品还应核对对应产品标准及适用范围。"},{"id":"Q0555","type":"单选题","category":"安全生产综合知识","question":"对于事故的预防与控制，安全技术对策着重解决（ ）。","options":["人的不安全行为","管理的缺陷","物的不安全状态","有害的作业环境"],"answer":"C","explanation":"答案为C（物的不安全状态）。安全技术对策主要通过工程技术手段改善设备、设施、工具、防护装置和作业环境，消除或控制物的不安全状态及危险能量。人的不安全行为更多需要通过培训、行为管理和监督纠正；管理缺陷则主要通过管理制度和组织措施改善。题库选项中C最符合安全技术对策的经典分类。","basis":"本题属于事故预防与控制理论中的安全对策分类，非单一法律条款。可结合安全工程学教材及设备安全技术标准理解。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：属于安全管理理论题，未将教材分类表述为法定定义。"},{"id":"Q0556","type":"判断题","category":"安全生产综合知识","question":"特别重大事故由发生事故所在省级人民政府负责调查。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。特别重大事故的调查权限原则上由国务院或者国务院授权有关部门组织事故调查组进行调查；省级人民政府负责调查的是重大事故，而不是特别重大事故。因此题干将特别重大事故调查主体表述为事故发生地省级人民政府，错误。","basis":"《生产安全事故报告和调查处理条例》第十九条第一款。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0557","type":"判断题","category":"安全风险管控与隐患排查","question":"重大危险源是指长期地或临时地生产、加工、搬运、使用或贮存危险物质，且危险物 质的数量等于或超过临界量的单元。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。重大危险源辨识的核心是单元内危险物质的数量达到或超过相应临界量。辨识时需按标准确定生产单元、储存单元，核算单一危险化学品或多种危险化学品的数量与临界量关系；不能仅凭现场存在危险物质就直接认定为重大危险源。","basis":"《危险化学品重大危险源辨识》GB 18218—2018第3章、第4章。适用对象为危险化学品生产、储存装置、设施或场所的重大危险源辨识。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干为概括性定义；实际辨识应按GB 18218—2018的单元划分和计算方法执行。"},{"id":"Q0558","type":"判断题","category":"安全风险管控与隐患排查","question":"对于一般的安全隐患，生产经营单位应引起注意，不必立即进行整改。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。一般事故隐患也应及时排查治理，不能仅“引起注意”而不整改。生产经营单位应建立事故隐患排查治理制度，采取技术、管理措施及时发现并消除隐患；重大事故隐患还应按规定报告、制定治理方案并落实治理措施。一般与重大隐患的区别主要影响治理组织、报告和督办要求，不意味着一般隐患可以不整改。","basis":"《中华人民共和国安全生产法》第四十一条第二款、第三款。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0559","type":"判断题","category":"安全风险管控与隐患排查","question":"职工个人是事故隐患排查、治理和防控的责任主体。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。事故隐患排查、治理和防控的责任主体是生产经营单位，而不是职工个人。员工负有发现隐患及时报告、遵守安全规程等义务，但单位应建立制度、组织排查、落实治理资金和措施，并对隐患治理承担主体责任。","basis":"《中华人民共和国安全生产法》第四十一条；《安全生产事故隐患排查治理暂行规定》第四条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0560","type":"判断题","category":"安全生产综合知识","question":"造成1亿元以上直接经济损失的事故为重大事故。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。按照生产安全事故等级划分，造成1亿元以上直接经济损失的，属于特别重大事故；重大事故对应直接经济损失5000万元以上、1亿元以下。事故等级判断遵循死亡人数、重伤人数、直接经济损失三项指标，任一项达到相应等级标准即可按该等级认定。","basis":"《生产安全事故报告和调查处理条例》第三条第（一）项、第（二）项。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0561","type":"判断题","category":"安全生产综合知识","question":"自事故发生之日起60日内，事故造成的伤亡人数发生变化的，应当及时补报。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。事故发生后，伤亡人数发生变化需要补报，但补报期限并非一律60日。自事故发生之日起30日内，因事故伤亡人数变化导致事故等级发生变化的，应及时补报；道路交通事故、火灾事故的期限为7日。题干写成60日，混淆了事故调查报告提交期限等其他时间规定。","basis":"《生产安全事故报告和调查处理条例》第十三条第二款。条例第二十九条规定调查报告一般应在事故发生之日起60日内提交，二者不能混淆。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0562","type":"判断题","category":"安全生产法律法规","question":"未参加工伤保险期间，用人单位职工发生工伤的，由该用人单位按照相关规定的工伤保险待遇项目和标准支付费用。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。用人单位依法应参加工伤保险而未参加，职工发生工伤的，工伤保险待遇项目和标准并不因此消失，应由用人单位按照《工伤保险条例》规定支付相关费用。用人单位还应依法补缴工伤保险费；补缴后新发生的费用按条例规定由基金和用人单位分别承担。","basis":"《工伤保险条例》第六十二条第二款、第三款；《中华人民共和国社会保险法》第四十一条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0563","type":"判断题","category":"安全生产综合知识","question":"在作业时闻到有害物味道或感觉刺激性，有呼吸困难、头晕、恶心等任何身体不适时，如果已经佩戴了呼吸防护用品，应该坚持完成作业，待作业完成后再离开污染区域检查呼吸防护用品是否存在问题。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。出现刺激性气味、呼吸困难、头晕、恶心等异常症状，说明可能发生有害物暴露或呼吸防护失效，应立即停止作业，在确保自身安全的前提下撤离至安全区域，并报告现场负责人。不能为了完成作业而继续停留在污染区域；呼吸防护用品是否失效应在安全区域由专业人员检查。","basis":"《中华人民共和国安全生产法》第五十五条关于从业人员发现直接危及人身安全紧急情况时停止作业、撤离危险场所的权利；具体呼吸防护应按适用的呼吸防护标准及产品说明执行。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0564","type":"判断题","category":"安全教育培训与职业健康","question":"生产和生活过程中接触粉尘、毒物、噪声、辐射等物理、化学危害因素达到一定的危害程度，将会导致职业病（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。职业病危害因素包括粉尘、化学毒物、物理因素等；劳动者在职业活动中接触职业病危害因素，达到一定暴露水平并符合职业病诊断标准时，可能导致职业病。并非只要接触就必然患病，风险与危害因素种类、浓度或强度、接触时间、个体防护和健康条件等有关。","basis":"《中华人民共和国职业病防治法》第二条、第十五条；《职业病分类和目录》（国卫职健发〔2013〕48号及后续调整文件）。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干“达到一定危害程度”是概括性表述；具体诊断须依职业病诊断标准及法定程序。"},{"id":"Q0565","type":"判断题","category":"安全生产综合知识","question":"施工单位应当向作业人员提供安全防护用具和安全防护服装，并书面告知危险岗位的操作规程和违章操作的危害。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。施工单位应向作业人员提供符合标准的安全防护用具和防护服装，并以书面方式告知危险岗位的操作规程及违章操作危害。该要求旨在使作业人员获得必要防护并知悉岗位风险；仅发放防护用品而不告知操作规程，不能替代完整的安全教育和技术交底。","basis":"《建设工程安全生产管理条例》第三十二条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0566","type":"判断题","category":"安全生产综合知识","question":"生产经营单位委托有关服务机构提供安全生产技术、管理服务的，保证安全生产的责任由服务机构负责。( )","options":["对","错"],"answer":"B","explanation":"答案为B（错）。生产经营单位可以依法委托具备条件的服务机构提供安全生产技术、管理服务，但保证安全生产的责任仍由本单位负责。委托服务只是引入专业支持，不发生法定安全生产主体责任的转移。","basis":"《中华人民共和国安全生产法》第十五条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0567","type":"判断题","category":"安全教育培训与职业健康","question":"生产经营单位不得以任何形式与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应承担的责任，但从业人员有违章作业情形的除外。( )","options":["对","错"],"answer":"B","explanation":"答案为B（错）。生产经营单位不得通过协议免除或减轻其对从业人员因生产安全事故伤亡依法应承担的责任。该禁止性规定不因从业人员存在违章作业而当然排除；从业人员违章行为可依法作为事故责任认定因素，但不能通过预先协议免除单位法定责任。","basis":"《中华人民共和国安全生产法》第五十二条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0568","type":"判断题","category":"安全教育培训与职业健康","question":"一般企业主要负责人和安全生产管理人员初次安全培训时间不得少于48学时。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。题干使用“一般企业”这一范围，现行《生产经营单位安全培训规定》第九条规定，其他生产经营单位主要负责人和安全生产管理人员初次安全培训时间不得少于32学时，每年再培训不得少于12学时；48学时适用于煤矿、非煤矿山、危险化学品、烟花爆竹、金属冶炼等特定高危行业单位。","basis":"《生产经营单位安全培训规定》第九条；应急管理部公布的现行规章文本。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0569","type":"判断题","category":"安全生产综合知识","question":"用人单位对人身有害或污染劳动环境的设备无法改造时，交罚款后可以允许继续使用。 （ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。对危害劳动者人身安全或污染劳动环境的设备，不能因缴纳罚款就允许继续使用。用人单位应依法采取治理、改造、替换或停止使用等措施，确保作业环境和设备符合职业卫生及安全要求。行政处罚不能替代消除危害、保障劳动者健康的法定义务。","basis":"《中华人民共和国职业病防治法》关于用人单位职业病防护设施、设备和作业场所管理的规定；具体设备应按适用的安全卫生标准及监管要求处理。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干未指明设备类型及具体危害，无法对应唯一条款号；按职业病防治和安全生产基本义务解释。"},{"id":"Q0570","type":"判断题","category":"消防安全","question":"个人损坏、挪用或擅自拆除、停用消防设施、器材， 埋压、圈占、遮挡消火栓的， 处警告或1000元以下罚款。( )","options":["对","错"],"answer":"B","explanation":"答案为B（错）。消防法对个人损坏、挪用、擅自拆除或停用消防设施器材，以及埋压、圈占、遮挡消火栓等行为，规定处警告或者五百元以下罚款；题干所述“1000元以下”与法条金额不符。注意该条对单位违法行为另规定五千元以上五万元以下罚款，不能混用单位和个人的处罚幅度。","basis":"《中华人民共和国消防法》第六十条第一款、第二款。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0571","type":"判断题","category":"安全生产责任与制度","question":"安全生产责任制是一项最基本的安全生产制度，是其他各项安全规章制度得以切实实施的基本保证。( )","options":["对","错"],"answer":"A","explanation":"答案为A（对）。安全生产责任制明确各岗位人员在安全生产工作中的职责、责任范围和考核标准，是把安全生产要求落实到各层级和岗位的基础制度。其他规章制度、操作规程和检查机制需要通过责任制明确由谁执行、谁监督、谁承担责任。","basis":"《中华人民共和国安全生产法》第二十一条第（一）项、第二十二条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0572","type":"判断题","category":"安全风险管控与隐患排查","question":"所有生产经营单位都必须将本单位的重大危险源报当地人民政府负责安全生产监督管理的部门备案。( )","options":["对","错"],"answer":"A","explanation":"答案为A（对，按题库答案）。重大危险源应按规定进行辨识、评估、登记建档，并向所在地负有安全生产监督管理职责的部门备案。题干使用“所有生产经营单位”容易产生范围误读：并非所有单位都当然存在重大危险源并需备案，而是辨识出重大危险源的生产经营单位依法履行备案义务；备案部门的名称应按现行职责表述理解。","basis":"《中华人民共和国安全生产法》第四十条；《危险化学品重大危险源监督管理暂行规定》第三章有关备案要求。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：需提示题干“所有生产经营单位”措辞不严谨；仅对辨识、评估确认存在重大危险源的单位适用备案义务。保留题库答案，不改题干。"},{"id":"Q0573","type":"判断题","category":"安全生产综合知识","question":"建设单位应将拆除工程发包给具有相应资质等级的施工单位。( )","options":["对","错"],"answer":"A","explanation":"答案为A（对）。建设单位应将拆除工程发包给具有相应资质等级的施工单位，并依法在施工前将相关资料报送有关主管部门备案。拆除工程涉及结构稳定、坠落、坍塌、物体打击等风险，必须由具备相应资质和施工能力的单位实施，不能交由无资质主体承揽。","basis":"《建设工程安全生产管理条例》第十一条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0574","type":"判断题","category":"安全生产综合知识","question":"施工单位对列入建设工程概算的安全作业环境及施工安全措施所需费用，可以挪作他用。( )","options":["对","错"],"answer":"B","explanation":"答案为B（错）。建设工程概算中列明的安全作业环境及安全施工措施费用，应当用于施工安全防护用具及设施的采购和更新、安全施工措施落实、安全生产条件改善等，不得挪作他用。挪用安全措施费用会导致必要防护和安全投入缺失。","basis":"《建设工程安全生产管理条例》第二十二条；《中华人民共和国安全生产法》第二十三条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0575","type":"判断题","category":"安全生产责任与制度","question":"安全生产责任制是一项最基本的安全生产管理制度。( )","options":["对","错"],"answer":"A","explanation":"答案为A（对）。安全生产责任制是生产经营单位最基本的安全生产管理制度之一，明确各岗位安全职责和责任边界，是安全生产规章制度有效执行的基础。它与题目Q0571表述相近，核心考查责任制在安全管理体系中的基础性作用。","basis":"《中华人民共和国安全生产法》第二十一条、第二十二条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：与前题考点相近，保留独立题目和原答案。"},{"id":"Q0576","type":"判断题","category":"安全教育培训与职业健康","question":"生产和生活过程中接触粉尘、毒物、噪声、辐射等物理、化学危害因素达到一定的危害程度，将会导致职业病（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。粉尘、毒物、噪声、辐射等属于职业病危害因素的常见类别。劳动者在职业活动中长期或达到一定强度接触，可能造成相应职业健康损害；是否构成法定职业病，须结合职业史、危害因素检测、临床表现及国家职业病诊断标准依法诊断。","basis":"《中华人民共和国职业病防治法》第二条、第十五条；《职业病分类和目录》。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0577","type":"判断题","category":"安全生产综合知识","question":"施工单位应当向作业人员提供安全防护用具和安全防护服装，并书面告知危险岗位的操作规程和违章操作的危害。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。施工单位有义务向作业人员提供符合要求的安全防护用具和防护服装，并书面告知危险岗位操作规程和违章操作危害。该规定将劳动防护用品保障与岗位风险告知结合起来，帮助作业人员理解如何安全作业及违章后果。","basis":"《建设工程安全生产管理条例》第三十二条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0578","type":"判断题","category":"消防安全","question":"生产经营单位在事故隐患治理过程中，应当采取相应的安全防范措施，防止事故发生。事故隐患排除前或者排除过程中无法保证安全的，应当从危险区域内撤出作业人员，并疏散可能危及的其他人员。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。生产经营单位治理事故隐患时，应采取相应安全防范措施；如果隐患排除前或排除过程中无法保证人员安全，应撤出危险区域作业人员，并疏散可能受影响的其他人员。治理隐患不能以继续生产为前提，必须先控制风险、保护人员。","basis":"《中华人民共和国安全生产法》第四十一条第二款；重大事故隐患治理还应落实该条第三款规定的报告和治理要求。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0579","type":"判断题","category":"安全风险管控与隐患排查","question":"从业人员发现事故隐患或者其他不安全因素，应当立即向现场安全生产管理人员或者本单位负责人报告。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。从业人员发现事故隐患或其他不安全因素，应立即向现场安全生产管理人员或本单位负责人报告；接报人员应及时处理。员工报告是隐患排查治理的重要信息来源，但事故隐患治理主体仍是生产经营单位，不能把治理责任转嫁给个人。","basis":"《中华人民共和国安全生产法》第五十九条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0580","type":"判断题","category":"安全教育培训与职业健康","question":"生产经营单位从业人员不包括临时聘用的人员。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。生产经营单位从业人员并不因属于临时聘用而当然被排除。单位应对本单位从业人员进行安全生产教育培训，劳务派遣、临时用工等人员应结合劳动关系和实际用工管理纳入相应安全培训、岗位管理和防护体系。具体责任分配还需结合劳务派遣等用工形式判断。","basis":"《中华人民共和国安全生产法》第二十八条；《生产经营单位安全培训规定》第四条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：“临时聘用人员”具体法律关系可能不同；题干将其一概排除不正确。"},{"id":"Q0581","type":"判断题","category":"特种设备与起重作业安全","question":"门式起重机施工时，注意施工范围有无其它外界干扰，周围行人及运动物应与龙门吊保持足够的安全距离。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。门式起重机作业区域应进行现场风险辨识，确认周边人员、车辆、其他设备及移动物体是否可能进入吊运或运行范围，并设置警戒、隔离和必要的指挥监护。安全距离应依据设备运行范围、吊物摆动、轨道和现场条件确定，不宜仅凭经验随意设定。","basis":"起重机械安全管理要求及适用的起重机械安全规程、设备使用维护说明书；具体安全距离应按现场风险评估和设备技术文件确定。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干未给出设备型号、场地及距离数值，故不提供统一数值标准。"},{"id":"Q0582","type":"判断题","category":"安全教育培训与职业健康","question":"安全管理人员的主要日常工作是建立并检查安全生产规章制度的落实情况，对施工现场进行检查并作出处理，进行安全技术管理、安全教育等内容。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。安全管理人员日常工作通常包括组织或参与制度、规程制定，检查制度落实，开展现场检查，督促整改隐患，组织或参与安全教育培训及安全技术管理等。法定职责具体见《安全生产法》，不同单位的岗位分工还应结合内部责任制。","basis":"《中华人民共和国安全生产法》第二十五条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0583","type":"判断题","category":"安全教育培训与职业健康","question":"单位对新职工进行三级安全生产教育培训，危险性较大的行业或岗位教育培训时间不得小于36小时。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。题干将危险性较大的行业或岗位三级安全教育培训时间统一规定为不少于36小时，缺少适用范围和依据。现行《生产经营单位安全培训规定》对新上岗从业人员规定：一般生产经营单位岗前培训不少于24学时；煤矿、非煤矿山、危险化学品、烟花爆竹、金属冶炼等单位新上岗人员不少于72学时。具体岗位还可能有更严格的专项培训要求。","basis":"《生产经营单位安全培训规定》第十三条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干“危险性较大的行业或岗位”范围不清，36小时不是该条规定的统一法定标准。"},{"id":"Q0584","type":"判断题","category":"电气安全管理","question":"电缆接头拆除与装配必须切断电源方可进行作业。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。电缆接头拆除、装配属于电气作业，应先按程序停电、隔离电源并采取防止误送电措施，确认无电后方可作业；必要时进行验电、放电、接地和挂牌上锁。仅关闭控制开关而未确认电源隔离，不能视为安全状态。","basis":"《电力安全工作规程》及适用的电气装置安装、运行和维护规范；具体应按电压等级、设备类型及单位电气作业制度执行。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干未指明电压等级及设施类型，不引用单一条款号；核心要求为停电隔离、验电确认后作业。"},{"id":"Q0585","type":"判断题","category":"安全生产综合知识","question":"铁路营业线施工时，线间局距小于6.5m不得堆料。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（按题库答案）。铁路营业线施工或邻近营业线作业时，材料、机具堆放必须符合铁路限界、建筑接近限界和现场防护要求，不得侵入行车设备限界。题干中的“线间距小于6.5m不得堆料”属于特定铁路施工管理要求，必须结合铁路线路等级、限界、施工组织和现行铁路技术管理规程核对，不能脱离具体场景泛化。","basis":"铁路营业线施工安全管理相关规章、铁路技术管理规程及铁路局（集团）现行施工安全管理实施细则。","source":"综合题库2.docx","status":"需人工核对：原文未识别到明确答案；解析补充第2批：需核验具体线路、线间距定义及适用铁路规章版本；本批保留题库答案，不将6.5m作为所有铁路场景通用限值。"},{"id":"Q0586","type":"判断题","category":"安全生产综合知识","question":"浇注高度3米以上的壁、柱、梁混凝土时，应该搭设操作平台。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。题干称浇注高度3米以上的壁、柱、梁混凝土时“应该搭设操作平台”，这一要求并非仅以3米作为统一触发条件。是否设置操作平台，应根据作业高度、模板支撑体系、施工工艺、作业面条件及高处作业防护要求确定；高处作业应设置可靠作业平台、临边防护和上下通道，不能因未达到题干数值就免除防护。题库答案为错，解析强调题干的绝对化高度阈值需结合规范核实。","basis":"《建筑施工高处作业安全技术规范》JGJ 80—2016；《建筑施工模板安全技术规范》JGJ 162—2008等适用标准。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干缺少工程工况及规范条款语境；具体是否必须搭设平台应按现行适用规范及专项施工方案判定。"},{"id":"Q0587","type":"判断题","category":"安全风险管控与隐患排查","question":"项目安全技术交底由技术人员交底，施工负责人落实，安全检查人员进行监督检查。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。安全技术交底应使作业人员了解工程特点、危险因素、施工工艺、安全技术要求和应急措施。技术人员负责交底，施工负责人组织落实，安全管理人员监督检查，是常见施工项目管理分工；交底应有针对性、书面记录和签字确认，不能以一般性教育代替具体作业交底。","basis":"《建设工程安全生产管理条例》第二十七条；《建筑施工安全检查标准》JGJ 59—2011相关检查要求。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干所述岗位分工属于施工管理实践，具体责任分工还应结合项目安全生产责任制。"},{"id":"Q0588","type":"判断题","category":"安全生产综合知识","question":"拆除工程施工过程中，当发生重大险情或生产安全事故时，应及时排查险情、组织抢救、不用保护事故现场，向有关部门报告。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。发生重大险情或生产安全事故时，应及时排查险情、组织抢救，同时必须妥善保护事故现场及相关证据；因抢救人员、防止事故扩大等需要移动现场物件的，应作出标记、绘制现场简图并形成书面记录，妥善保存重要痕迹和物证。题干“不用保护事故现场”明显错误。","basis":"《生产安全事故报告和调查处理条例》第十六条。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0589","type":"判断题","category":"电气安全管理","question":"施工现场临时用电必须分级设置漏电保护装置。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。施工现场临时用电应按规定采用分级配电和分级漏电保护，形成总配电箱、分配电箱、开关箱等配电层级，并根据系统形式、设备和环境配置相应漏电保护装置。漏电保护器的额定动作参数、安装位置及试验维护要求应按临时用电规范确定。","basis":"《施工现场临时用电安全技术规范》JGJ 46—2005第8章。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：本题引用的JGJ 46—2005需在项目实施前核查标准现行状态及是否有替代版本；不在此处推断具体参数。"},{"id":"Q0590","type":"判断题","category":"危险化学品安全","question":"乙炔瓶在储存或使用时可以水平放置。（ ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。乙炔瓶在储存和使用时应保持直立，并采取防倾倒措施；卧放可能导致丙酮流出，影响减压器和供气安全，也增加回火、燃烧或爆炸风险。气瓶搬运、储存和使用还应远离热源，避免曝晒和撞击，并按规定检查瓶阀、减压器及回火防止器。","basis":"《气瓶安全技术规程》TSG 23—2021；乙炔气瓶安全使用及储存相关国家标准、产品说明书。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：乙炔瓶直立要求需结合气瓶安全技术规程及气瓶制造商使用说明执行。"},{"id":"Q0591","type":"判断题","category":"高处作业安全","question":"施工现场塔吊、拌和楼、物料提升机、龙门吊、钢脚手架等高架设施，必须按规定设置防雷、避雷装置。（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。塔吊、拌和楼、物料提升机、龙门吊和钢脚手架等高耸设施可能遭受雷击，是否设置防雷装置以及防雷接地形式、接地电阻要求，应根据设施高度、所在地雷电环境、周边防雷系统及现行防雷规范确定。不能仅因设备名称列举就忽略专项设计和检测要求。","basis":"《建筑物防雷设计规范》GB 50057—2010；《施工现场临时用电安全技术规范》JGJ 46—2005相关接地与防雷要求。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：具体是否必须单独设置、如何连接，应按设施条件和防雷设计确定；JGJ 46—2005现行状态需在实施前复核。"},{"id":"Q0592","type":"判断题","category":"电气安全管理","question":"保险丝熔断，应及时更换，但不能用铜、铁、铝丝代替。（   ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。熔断器的熔体应按线路负荷和保护要求选用。铜、铁、铝丝的熔断特性与设计熔体不一致，不能保证过载或短路时及时熔断，可能造成导线过热、绝缘损坏甚至火灾。因此熔断器熔断后应查明原因，使用规格匹配的合格熔体更换，严禁用金属丝替代。","basis":"低压配电及熔断器产品标准、设备制造商技术文件；电气线路保护应符合现行低压配电设计和安装规范。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：属于电气安全基本要求；具体熔体规格按电路设计和设备说明确定。"},{"id":"Q0593","type":"判断题","category":"电气安全管理","question":"如发现电器设备有障碍或漏电起火，要立即拉开电源开关，在未切断电源前，不能用水或酸、碱泡沫灭火器灭火。（   ）","options":["对","错"],"answer":"A","explanation":"答案为A（对）。电气设备漏电或起火时，应首先在确保自身安全的前提下切断电源；未确认断电前，水及含水、导电性灭火剂可能造成触电和电弧危险。应根据带电设备电压等级和火灾类型选用适用的灭火器材，不能使用不适用于带电设备的水基或泡沫灭火剂。","basis":"《建筑灭火器配置设计规范》GB 50140—2005关于带电火灾灭火器选型要求；电气安全操作规程。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干的“酸、碱泡沫灭火器”属于旧式称谓，实际处置应按灭火器铭牌适用类别和带电状态判断。"},{"id":"Q0594","type":"判断题","category":"安全生产综合知识","question":"家中燃气泄漏时，可以开启家中任何电器设备。（  ）","options":["对","错"],"answer":"B","explanation":"答案为B（错）。发现燃气泄漏时，不得开启或关闭电灯、排风扇、抽油烟机等电器，也不得在室内拨打电话或操作可能产生电火花的设备。应避免明火，迅速关闭气源阀门（确保安全可操作时），打开门窗自然通风，撤离至室外安全区域后联系燃气经营企业或应急救援部门。","basis":"城镇燃气安全相关国家标准及燃气经营企业应急处置指引；可结合《城镇燃气管理条例》有关燃气安全使用义务。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：属于居民燃气泄漏应急处置常识；具体操作应服从当地燃气企业和应急部门指引。"},{"id":"Q0595","type":"判断题","category":"安全生产综合知识","question":"煤气中毒后，人往往会头晕、恶心、呕吐、心慌、皮肤苍白、意识模糊，严重者会神志不清、牙关紧闭、全身抽搐、大小便失禁、面色口唇出现樱红色、呼吸和脉搏增快。（   ）","options":["对","错"],"answer":"A","explanation":"答案为A（按题库答案）。一氧化碳中毒可出现头痛、头晕、恶心、呕吐、乏力、心悸、意识障碍，严重者可昏迷甚至死亡。传统教材常描述樱桃红色，但该体征并非所有患者都会出现，不能以皮肤或口唇颜色正常排除中毒。发现疑似中毒，应立即转移至新鲜空气处、呼叫急救并尽快接受高浓度氧疗等专业救治。","basis":"《职业性急性一氧化碳中毒的诊断》GBZ 23—2002及急诊医学相关诊疗规范。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干将樱桃红色等表现写成较典型描述，但该体征并非必然出现；急救应优先脱离暴露并呼叫专业医疗救援。"},{"id":"Q0596","type":"判断题","category":"安全生产综合知识","question":"发现自己处在森林火场中，选择向火已经烧过或杂草稀疏、地势平坦的地段转移。穿越火线时要用衣服蒙住头部，快速逆风冲越火线。切忌顺风在火线前方逃跑。（   ）","options":["对","错"],"answer":"A","explanation":"答案为A（按题库答案，但其中“逆风冲越火线”表述存在安全风险，需特别提示）。森林火场逃生应优先向火势较弱、已过火或植被稀疏、地形相对安全区域转移，并避开峡谷、山脊、鞍部等可能形成强风和火焰加速的地形。穿越火线属于极端情况下的高风险避险行为，不能简单理解为常规逃生方法；必须根据火势、风向、可燃物和安全区位置由专业指挥判断。","basis":"森林草原火灾扑救相关应急预案及林草主管部门发布的避险指南。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：重要风险提示：题干“快速逆风冲越火线”不宜作为一般公众通用逃生指令；本次保留原答案，仅在解析中提示，不建议据此自行实施。"},{"id":"Q0597","type":"判断题","category":"应急管理与救援","question":"应急处置与救援,是应对突发事件工作的核心环节,应当坚持“先避险,后抢险,先救人,再救物,先救灾,再恢复”的原则（ ）","options":["对","错"],"answer":"A","explanation":"答案为A（对，按题库表述）。应急处置强调先识别危险、采取避险措施，避免救援人员盲目进入危险区域；救援行动应优先保障人员生命安全，再根据现场条件开展财产和设施抢救，灾后再组织恢复重建。该顺序体现以人为本和救援人员安全优先，但具体现场仍须遵循统一指挥、专业救援和风险评估。","basis":"《中华人民共和国突发事件应对法》有关应急处置、人员救助和生命安全保障的规定；各类专项应急预案和现场救援规程。","source":"综合题库2.docx","status":"已录入原资料答案；未提供解析；解析补充第2批：题干中的“先避险、后抢险”等属于应急处置原则性表述，具体措施应按事件类型和现场指挥执行。"},{"id":"Q0598","type":"简答题","category":"应急管理与救援","question":"安全生产应急预案分为哪三类？","options":[],"answer":"安全生产应急预案分为综合预案、专项预案、现场处置方案","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0599","type":"简答题","category":"消防安全","question":"消防安全“四个能力”是指什么？","options":[],"answer":"1、检查消除火灾隐患能力；2、扑救初期火灾能力；3、组织疏散逃生能力；4、消防宣传教育能力","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0600","type":"简答题","category":"安全生产综合知识","question":"安全生产“四不两直”检查，是指什么？","options":[],"answer":"“四不两直”是指：不发通知、不打招呼、不听汇报、不用陪同接待，直奔基层、直插现场","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0601","type":"简答题","category":"事故管理与持续改进","question":"安全生产事故调查中的“四不放过”原则，是哪“四不放过”？","options":[],"answer":"事故原因未查清不放过，责任人未受到处理不放过，整改措施未落实不放过，有关人员未受到教育不放过","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0602","type":"简答题","category":"事故管理与持续改进","question":"安全生产事故调查的要求是？","options":[],"answer":"“依法依规，实事求是，科学严谨，注重实效”","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0603","type":"简答题","category":"安全生产综合知识","question":"什么是安全生产“三同时”？","options":[],"answer":"生产经营单位新建、改建、扩建工程项目的安全设施，必须与主体工程同时设计、同时施工、同时投入生产和使用","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0604","type":"简答题","category":"安全生产责任与制度","question":"安全生产“三违”指什么？","options":[],"answer":"三违是违章指挥、违章作业和违反劳动纪律","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0605","type":"简答题","category":"安全生产综合知识","question":"安全生产事故主要分为哪几个等级？","options":[],"answer":"一般事故、较大事故、重大事故、特别重大事故","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0606","type":"简答题","category":"安全生产责任与制度","question":"安全生产“三管三必须”的是指什么？","options":[],"answer":"管行业必须管安全、管业务必须管安全、管生产经营必须管安全","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0607","type":"简答题","category":"安全风险管控与隐患排查","question":"安全生产双重预防机制是指什么？","options":[],"answer":"安全风险分级管控和隐患排查治理。","explanation":"","basis":"","source":"综合题库2.docx","status":"已从题干分离参考答案"},{"id":"Q0608","type":"简答题","category":"安全风险管控与隐患排查","question":"安全风险等级分为几级，其中最高等级用什么颜色表示？","options":[],"answer":"安全风险等级分为四级，最高等级用红色表示","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0609","type":"简答题","category":"动火及特殊作业安全","question":"动火作业三个一律是指什么？","options":[],"answer":"动火前一律不准进行交叉作业，一律清除现场可燃物质，一律检测可燃气体含量","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0610","type":"简答题","category":"高处作业安全","question":"高处作业五个必须是指什么？","options":[],"answer":"一是必须培训持证上岗。二是必须实行作业审批。三是必须做好个人防护。四是必须落实工程措施。五是必须安排专人监护","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0611","type":"简答题","category":"安全生产综合知识","question":"物质燃烧三个必要条件是什么？","options":[],"answer":"可燃物、助燃物、引火源","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0612","type":"简答题","category":"安全生产综合知识","question":"“四不伤害”是指什么？","options":[],"answer":"不伤害自己，不伤害他人，不被他人伤害，保护他人不被伤害","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0613","type":"简答题","category":"安全标志与现场管理","question":"安全标志分为几类？各是什么？","options":[],"answer":"常见的安全标志有四种，红、黄、蓝、绿。分别表示禁止、警告、指令、提示","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0614","type":"简答题","category":"消防安全","question":"我国将火灾分为哪几类,具体是什么火灾?","options":[],"answer":"分为A、B、C、D、E、F类火灾。A类火灾为固体火灾；B类火灾为液体火灾；C类火灾为电气火灾；D类火灾为金属火灾;E电气火灾；F类火灾为烹饪火灾","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0615","type":"简答题","category":"自然灾害防范","question":"台风预警信号有哪几个级别，分别是什么？","options":[],"answer":"有五个预警级别分别是：白色预警信号、蓝色预警信号、黄色预警信号、橙色预警信号和红色预警信号","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0616","type":"简答题","category":"动火及特殊作业安全","question":"一机一闸一漏一箱是指什么？","options":[],"answer":"即每台用电设备由一个独立的开关箱控制，箱内设隔离开关（或同时具备隔 离功能的断路器）、断路器（或熔断器）和漏电保护器","explanation":"","basis":"","source":"综合题库2.docx","status":"已整理"},{"id":"Q0617","type":"简答题","category":"动火作业安全","question":"“四要一清”要求是指什么？","options":[],"answer":"一要审批（办理动火证）。 二要监护（专人监护）。三要检查（检查可燃物和灭火器材）。四要注意（注意风向和周围环境）。一清（清除动火点下方和周边的可燃物）。","explanation":"","basis":"","source":"综合题库2.docx","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0618","type":"简答题","category":"有限空间作业安全","question":"有限空间作业“七不准”指哪七不准备？","options":[],"answer":"1.未经风险辨识不准作业；\n　　2.未经通风和检测合格不准作业；\n　　3.不佩戴劳动防护用品不准作业；\n　　4.没有监护不准作业；\n　　5.电气设备不符合规定不准作业；\n　　6.未经审批不准作业；\n7.未经培训演练不准作业。","explanation":"","basis":"","source":"综合题库2.docx","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0619","type":"简答题","category":"应急管理与救援","question":"对重症中暑者,应如何急救?","options":[],"answer":"对高温昏迷者,治疗以迅速降温为主,对循环衰竭或患热瘟孪者,以调节水、电解质平衡和防治休克为主。","explanation":"","basis":"","source":"综合题库2.docx","status":"已从题干分离参考答案"},{"id":"Q0620","type":"简答题","category":"电气安全管理","question":"有人低压触电时怎么办?","options":[],"answer":"用木棍或其他绝缘物先使触电者脱离电源，再对伤者进行急救。","explanation":"","basis":"","source":"综合题库2.docx","status":"已从题干分离参考答案"},{"id":"Q0621","type":"简答题","category":"高处作业安全","question":"高处坠落如何处理？","options":[],"answer":"（1）坠落在地的伤员，应初步检查伤情，不乱搬摇动，应立即呼叫救护车。 （2）采取救护措施，初步止血、包扎、固定。 （3）昏迷伤员要保持呼吸道畅通。 （4）怀疑脊柱骨折，按脊柱骨折的搬运原则。切忌一人抱胸，一人抱腿搬运；伤员上下担架应由3－4人分别抱住头、胸、臀、腿，保持动作一致平稳，避免脊柱弯曲扭动加重伤情","explanation":"","basis":"","source":"综合题库2.docx","status":"已从题干分离参考答案"},{"id":"Q0622","type":"简答题","category":"消防安全","question":"事故报警应包括的内容？","options":[],"answer":"（1）发生事故的单位、地点；\n（2）事故的类型（火灾、爆炸、中毒）及事故简要情况；\n（3）报告人姓名、电话。","explanation":"","basis":"","source":"综合题库2.docx","status":"已从题干括号标注识别答案"},{"id":"Q0623","type":"简答题","category":"应急管理与救援","question":"紧急疏散应注意的事项？","options":[],"answer":"（1）应佩戴个体防护用品或采用简易有效的防护措施；\n（2）应向上风向转移，明确专人引导和护送疏散人员到安全区；\n（3）不要再低洼处滞留； \n（4）清点疏散人数并查明是否有人滞留在事故区。","explanation":"","basis":"","source":"综合题库2.docx","status":"来源已补录；题干答案沿用原文，专业准确性未复核"},{"id":"Q0624","type":"简答题","category":"消防安全","question":"灭火的基本方法？","options":[],"answer":"（1）隔离法 （2）冷却法 （3）窒息法 （4）化学中断法（化学抑制法）","explanation":"","basis":"","source":"综合题库2.docx","status":"已从题干分离参考答案"},{"id":"Q0625","type":"简答题","category":"消防安全","question":"简述高层建筑人员的逃生可以采取的应急措施？","options":[],"answer":"（1）利用避难层或疏散楼梯逃生。 （2）利用楼房的阳台、落水管和避雷管线进行逃生。 （3）封闭房间门窗的缝隙，阻止烟雾和有毒气体的进入。 （4）用绳子或床单撕成布条连接起来，把一端捆扎在牢固的固定物件上，顺另一端落到地面。","explanation":"","basis":"","source":"综合题库2.docx","status":"已从题干分离参考答案"},{"id":"Q0626","type":"简答题","category":"消防安全","question":"火灾时，遇身上衣服着火时，为什么不能奔跑，应采取什么应急措施?","options":[],"answer":"因为奔跑时，会形成一股小风，大量新鲜空气冲到着火人的身上，火会越烧越旺。此外，如果身上着火的人到处乱跑，还会把火带到其他场所，引起新的燃烧点。所以人身上着火后，必须想方设法脱掉衣物，如来不及脱，可把衣服撕碎扔掉，或者卧倒在地上打滚，也可跳人附近池塘、小河等水中去。","explanation":"","basis":"","source":"综合题库2.docx","status":"已从题干分离参考答案"},{"id":"Q0627","type":"单选题","category":"安全生产法律法规与综合管理","question":"安全生产工作应当以人为本，坚持（），把保护人民生命安全摆在首位，树牢安全发展理 念。","options":["公民至上、群众至上","人民至上、生命至上","员工至上、科学严谨"],"answer":"B","explanation":"答案为B（人民至上、生命至上）。《安全生产法》明确安全生产工作应当以人为本，坚持人民至上、生命至上，把保护人民生命安全摆在首位，树牢安全发展理念。该表述强调安全生产工作的价值取向和根本目标，安全生产工作不能以牺牲人的生命安全为代价换取经济效益或进度。","basis":"《中华人民共和国安全生产法》第三条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0628","type":"单选题","category":"安全风险管控与隐患排查","question":"安全生产工作应当坚持（）的方针，从源头上防范化解重大安全风险。","options":["安全第一、预防为主、综合治理","生命第一、预防为主、综合治理","安全第一、防消结合、综合治理"],"answer":"A","explanation":"答案为A（安全第一、预防为主、综合治理）。这是我国安全生产工作坚持的基本方针。“安全第一”强调安全在生产经营活动中的优先地位；“预防为主”强调风险辨识、隐患排查和源头防范；“综合治理”强调综合运用法律、经济、行政、科技和教育等手段。题干强调从源头防范化解重大安全风险，与该方针一致。","basis":"《中华人民共和国安全生产法》第三条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第2批：已按题库答案补充；未修改原题、选项、答案及分类。"},{"id":"Q0629","type":"单选题","category":"安全生产法律法规","question":"生产经营单位必须执行依法制定的保障安全生产的（）。","options":["行业标准","国家标准或者行业标准","地方标准"],"answer":"B","explanation":"答案为B（国家标准或者行业标准）。生产经营单位必须执行依法制定的保障安全生产的国家标准或者行业标准。标准是安全生产条件和作业要求的重要依据，单位不能以内部规定、地方惯例或自行制定的较低要求替代依法适用的国家标准、行业标准。","basis":"《中华人民共和国安全生产法》第十七条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干语义基本准确；“依法制定”强调标准须依法发布并适用于相关行业、活动或设备。"},{"id":"Q0630","type":"单选题","category":"安全教育培训与职业健康","question":"下列不属于生产经营单位主要负责人的职责是（）。","options":["组织制定并实施本单位安全生产教育和培训计划","组织开展危险源辨识和评估，督促落实本单位重大危险源的安全管理措施","保证本单位安全生产投入的有效实施"],"answer":"B","explanation":"答案按题库为B。主要负责人法定职责包括组织制定并实施安全生产教育和培训计划、保证安全生产投入有效实施等；组织开展危险源辨识和评估、督促落实重大危险源安全管理措施，属于安全生产管理人员职责条款中的明确职责。因此B不属于主要负责人职责的直接列举项。需要注意，主要负责人仍负有全面领导责任，不能据此理解为其对重大危险源管理不承担责任。","basis":"《中华人民共和国安全生产法》第二十一条、第二十五条第一款第（三）项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干使用“不属于职责”应理解为法条职责项目的直接归属，而非免除主要负责人的全面责任。"},{"id":"Q0631","type":"单选题","category":"应急管理与救援","question":"下列不属于生产经营单位安全生产管理人员的职责是（）。","options":["组织制定并实施本单位的生产安全事故应急救援预案","制止和纠正违章指挥、强令冒险作业、违反操作规程的行为","组织开展危险源辨识和评估，督促落实本单位重大危险源的安全管理措施"],"answer":"A","explanation":"答案为A。组织制定并实施生产安全事故应急救援预案，是生产经营单位主要负责人的法定职责；安全生产管理人员的职责包括组织或者参与拟订规章制度、操作规程和应急救援预案，组织或者参与应急救援演练，以及制止和纠正违章指挥、强令冒险作业、违反操作规程的行为，并组织开展危险源辨识和评估等。因此A表述为主要负责人职责，不属于安全生产管理人员独立承担的法定职责。","basis":"《中华人民共和国安全生产法》第二十一条第（六）项、第二十五条第一款。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干用“不属于安全生产管理人员职责”较概括；管理人员仍负有参与预案拟订、演练等职责。"},{"id":"Q0632","type":"单选题","category":"安全生产法律法规与综合管理","question":"人、物、环境和管理四个因素是相互牵连的，就像正方形的四条边一样，其中的一条边变化， 另外三条边也就跟着变化。决定另外三条边的就是( )的因素。","options":["人","物","环境"],"answer":"A","explanation":"题库答案为A（人）。本题属于安全管理系统理论中的人、物、环境、管理因素相互作用的概括性观点。人在生产活动中既是操作主体，也是风险辨识、决策和管理活动的重要参与者；人的行为、能力和意识变化会影响设备使用、环境控制和管理落实。但该说法是教材模型，不应理解为所有事故都由人的因素单独决定。","basis":"安全管理系统理论的教材性知识；未对应单一法律条文。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干“决定另外三条边的就是人的因素”表述较绝对，属于理论模型化表达；保留原题及答案。"},{"id":"Q0633","type":"单选题","category":"消防安全","question":"《中华人民共和国消防法》工作方针是（）。","options":["以防为主、防消结合","安全第一、预防为主","预防为主、防消结合"],"answer":"C","explanation":"答案为C（预防为主、防消结合）。这是消防工作的方针。“预防为主”强调通过消防安全责任制、日常检查、隐患整改和宣传教育预防火灾；“防消结合”强调在做好预防的同时，做好灭火救援准备，发生火灾时能够及时有效处置。选项A将“以防为主”作为用语，不是法律规定的规范表述。","basis":"《中华人民共和国消防法》第二条。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第3批：题干“《中华人民共和国消防法》工作方针”可更准确表述为“消防工作贯彻的方针”；本批不修改题干。"},{"id":"Q0634","type":"单选题","category":"消防安全","question":"《中华人民共和国消防法》实行()的原则，实行消防安全责任制，建立健全社会化的消防工 作网络。","options":["政府统一领导、部门依法监管、单位积极参与、公民全面负责","政府统一领导、部门依法监管、单位全面负责、公民积极参与","政府依法监管、部门统一领导、单位全面负责、公民积极参与"],"answer":"B","explanation":"答案为B。消防工作实行政府统一领导、部门依法监管、单位全面负责、公民积极参与的原则，并建立健全社会化消防工作网络。单位是本单位消防安全责任主体，应落实消防安全责任制；公民依法履行维护消防安全、保护消防设施、预防火灾和报告火警等义务。","basis":"《中华人民共和国消防法》第二条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干换行不影响理解；选项B与法律条文原文一致。"},{"id":"Q0635","type":"单选题","category":"消防安全","question":"消防法规定，（）都有维护消防安全、保护消防设施、预防火灾、报告火警的义务。","options":["任何单位和个人","任何单位和成年人","重点单位和个人"],"answer":"A","explanation":"答案为A（任何单位和个人）。消防法规定，任何单位和个人都有维护消防安全、保护消防设施、预防火灾、报告火警的义务。这是社会单位和公众共同承担消防安全责任的基本要求，不限于成年人或消防安全重点单位。","basis":"《中华人民共和国消防法》第五条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干表述与法条基本一致。"},{"id":"Q0636","type":"单选题","category":"消防安全","question":"《中华人民共和国消防法》规定，国务院( )对全国的消防工作实施监督管理。","options":["应急管理部门","环保部门","公安部门"],"answer":"A","explanation":"答案为A（应急管理部门）。国务院应急管理部门对全国消防工作实施监督管理；县级以上地方人民政府应急管理部门对本行政区域内消防工作实施监督管理，并由本级人民政府消防救援机构负责实施。题干考查国务院层面的主管部门，故选应急管理部门。","basis":"《中华人民共和国消防法》第四条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干在“（ ）”后又出现“、应急管理部门”，疑似答案文字误粘入题干；建议核对并清理重复文字，但本批不改原题。"},{"id":"Q0637","type":"单选题","category":"消防安全","question":"消防法规定，（ ）不属于机关、团体、企业、事业等单位应当履行的消防安全职责。","options":["确定消防安全管理人，组织实施本单位的消防安全管理工作","组织防火检查，及时消除火灾隐患","组织进行有针对性的消防演练"],"answer":"A","explanation":"题库答案为A，但该题存在答案适用范围疑点。消防法第十六条规定机关、团体、企业、事业等单位应履行建立消防责任制、组织防火检查、组织有针对性的消防演练等职责；“确定消防安全管理人”在第十七条对消防安全重点单位有明确要求。若题干主体是一般单位，A可作为“不属于一般单位第十六条普遍职责”的答案；若包括消防安全重点单位，则其需确定消防安全管理人。","basis":"《中华人民共和国消防法》第十六条、第十七条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：需复核题干是否应限定为“一般单位”。因重点单位依法应确定消防安全管理人，原题范围不清；保留答案A并标记。"},{"id":"Q0638","type":"单选题","category":"消防安全","question":"消防法规定，下列（ ）不属于消防重点单位履行的职责。","options":["建立消防档案，确定消防安全重点部位，设置防火标志，实行严格管理","实行每周防火巡查，并建立巡查记录","对职工进行岗前消防安全培训，定期组织消防安全培训和消防演练"],"answer":"B","explanation":"答案为B（实行每周防火巡查）。消防安全重点单位应实行每日防火巡查，并建立巡查记录，而不是每周巡查。重点单位还应建立消防档案、确定消防安全重点部位、设置防火标志并实行严格管理，对职工进行岗前消防安全培训，定期组织培训和消防演练。因此B的频次不符合规定。","basis":"《中华人民共和国消防法》第十七条第二款。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干及选项B的“每周”与法条规定的“每日”不一致，属于本题考点；保留原题选项及答案。"},{"id":"Q0639","type":"单选题","category":"消防安全","question":"人员密集场所室内装修、装饰，应当按照消防技术标准的要求，使用（ ）材料。","options":["难燃","不燃","不燃、难燃"],"answer":"C","explanation":"答案为C（不燃、难燃）。人员密集场所室内装修、装饰材料的燃烧性能应符合相应消防技术标准。不同建筑类别、使用功能、部位及装修材料，对燃烧性能等级有不同要求，不能理解为所有部位均可在不燃与难燃材料之间任意选择。题目选项中C概括了按标准选用不燃或难燃材料的要求。","basis":"《中华人民共和国消防法》第二十六条；《建筑内部装修设计防火规范》GB 50222—2017。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干概括性较强；具体材料等级须按建筑类型、部位及规范表格确定。"},{"id":"Q0640","type":"单选题","category":"消防安全","question":"消防法规定，生产经营单位埋压、圈占、遮挡消火栓或者占用防火间距的，处（ ）罚款。","options":["五千元以上二万元以下","五千元以上五万元以下","一万元以上五万元以下"],"answer":"B","explanation":"答案为B（五千元以上五万元以下）。单位埋压、圈占、遮挡消火栓或者占用防火间距，影响消防设施使用和消防救援展开，消防法规定责令改正，并对单位处五千元以上五万元以下罚款；个人实施相关行为的处罚幅度不同。","basis":"《中华人民共和国消防法》第六十条第一款相关项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干未明确“单位”或“个人”，但选项B对应单位罚款幅度；建议题干明确违法主体，保留原题答案。"},{"id":"Q0641","type":"单选题","category":"消防安全","question":"消防法规定，人员密集场所在门窗上设置影响逃生和灭火救援的障碍物的，处（ ）罚款。","options":["五千元以上一万元以下","五千元以上五万元以下","一万元以上十万元以下"],"answer":"B","explanation":"答案为B（五千元以上五万元以下）。人员密集场所在门窗上设置影响逃生和灭火救援的障碍物，会妨碍人员疏散及消防救援。消防法对此规定责令改正，并对单位处五千元以上五万元以下罚款；对个人实施的相关行为另有处罚规定。","basis":"《中华人民共和国消防法》第六十条第一款相关项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干处罚对象未明确；选项B对应单位罚款幅度，建议后续核对题干是否应明确“单位”。"},{"id":"Q0642","type":"单选题","category":"消防安全","question":"消防法规定， 生产、储存、经营易燃易爆危险品的场所与居住场所设置在同一建筑物内，或 者未与居住场所保持安全距离的，责令停产停业，处（ ）罚款。","options":["五千元以上五万元以下","一万元以上五万元以下","二万元以上五万元以下"],"answer":"A","explanation":"答案为A（五千元以上五万元以下）。生产、储存、经营易燃易爆危险品的场所与居住场所设置在同一建筑物内，或者未与居住场所保持安全距离，属于消防法明确禁止的情形。消防法规定责令停产停业，并处五千元以上五万元以下罚款。","basis":"《中华人民共和国消防法》第六十一条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干基本对应法条；实际适用时应区分场所用途、居住场所及危险品经营储存性质。"},{"id":"Q0643","type":"单选题","category":"消防安全","question":"消防法规定， 指使或者强令他人违反消防安全规定，冒险作业的，尚不构成犯罪的，处（ ） 拘留，可以并处五百元以下罚款；情节较轻的，处警告或者五百元以下罚款。","options":["五日以上十日以下","五日以上十五日以下","十日以上十五日以下"],"answer":"C","explanation":"答案为C（十日以上十五日以下）。指使或者强令他人违反消防安全规定冒险作业，尚不构成犯罪的，消防法规定处十日以上十五日以下拘留，可以并处五百元以下罚款；情节较轻的，处警告或者五百元以下罚款。该规定针对指使、强令他人冒险作业的行为。","basis":"《中华人民共和国消防法》第六十四条相关项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干引用的处罚幅度与消防法条文一致。"},{"id":"Q0644","type":"单选题","category":"消防安全","question":"消防法规定， 在火灾发生后阻拦报警，或者负有报告职责的人员不及时报警，尚不构成犯罪 的，处（ ）拘留，可以并处五百元以下罚款；情节较轻的，处警告或者五百元以下罚款。","options":["五日以上十日以下","十日以上十五日以下","十日以上二十日以下"],"answer":"B","explanation":"答案为B（十日以上十五日以下）。火灾发生后阻拦报警，或者负有报告职责的人员不及时报警，可能延误灭火救援和人员疏散。尚不构成犯罪的，消防法规定处十日以上十五日以下拘留，可以并处五百元以下罚款；情节较轻的，处警告或者五百元以下罚款。","basis":"《中华人民共和国消防法》第六十四条相关项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干基本准确；应注意“不及时报警”主体限于负有报告职责的人员。"},{"id":"Q0645","type":"单选题","category":"消防安全","question":"消防法规定， 在火灾发生后故意破坏或者伪造火灾现场，尚不构成犯罪的，处（ ）拘留，可 以并处五百元以下罚款；情节较轻的，处警告或者五百元以下罚款。","options":["十日以上十五日以下","五日以上十五日以下","十日以上二十日以下"],"answer":"A","explanation":"答案为A（十日以上十五日以下）。故意破坏或者伪造火灾现场会妨碍火灾原因调查、责任认定和证据收集。尚不构成犯罪的，消防法规定处十日以上十五日以下拘留，可以并处五百元以下罚款；情节较轻的，处警告或者五百元以下罚款。","basis":"《中华人民共和国消防法》第六十四条相关项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干基本准确。"},{"id":"Q0646","type":"单选题","category":"消防安全","question":"消防法规定， 公众聚集场所未经消防救援机构许可，擅自投入使用、营业的， 或者经核查发 现场所使用、营业情况与承诺内容不符的， 由住房和城乡建设主管部门、消防救援机构按照各自 职权责令停止施工、停止使用或者停产停业，并处（ ）罚款。","options":["三万元以上十万元以下","三万元以上三十万元以下","十万元以上三十万元以下"],"answer":"B","explanation":"答案为B（三万元以上三十万元以下）。公众聚集场所未经消防救援机构许可擅自投入使用、营业，或者经核查发现实际使用、营业情况与承诺内容不符的，由住房和城乡建设主管部门、消防救援机构按各自职权责令停止施工、停止使用或者停产停业，并处三万元以上三十万元以下罚款。","basis":"《中华人民共和国消防法》第五十八条第一款相关项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干将“未经许可”和“承诺内容不符”并列，整体对应现行消防法相关规定。"},{"id":"Q0647","type":"单选题","category":"安全生产责任与制度","question":"（ ）是生产经营单位各项安全生产制度的核心，是生产经营单位行政岗位责任和经济责任制 度的重要组成部分。","options":["安全生产责任制","安全生产培训","安全生产技术措施"],"answer":"A","explanation":"答案为A（安全生产责任制）。安全生产责任制明确单位各层级、各部门和各岗位的安全生产职责，是安全生产制度体系的核心。它将行政岗位责任与安全生产责任相衔接，使责任落实到人、落实到岗位，并为考核、奖惩和责任追究提供依据。","basis":"《中华人民共和国安全生产法》第二十一条、第二十二条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干属于安全管理制度概括性表述。"},{"id":"Q0648","type":"单选题","category":"安全教育培训与职业健康","question":"生产经营单位应当建立健全( )制度，加强对职工安全生产的教育培训；未经安全生产教育培 训的人员，不得上岗作业。","options":["安全生产教育培训","劳保用品和学习资料统一配发","岗位责任"],"answer":"A","explanation":"答案为A（安全生产教育培训制度）。生产经营单位应建立健全安全生产教育和培训制度，保证从业人员掌握必要的安全生产知识、岗位操作技能和应急处置能力。未经安全生产教育培训合格的人员，不得上岗作业。劳保用品发放和岗位责任制度均不能替代教育培训制度。","basis":"《中华人民共和国安全生产法》第二十八条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干基本准确。"},{"id":"Q0649","type":"单选题","category":"安全生产法律法规与综合管理","question":"国家对女职工和未成年工实行( )。","options":["特殊社会保障","特殊劳动保护","特殊劳动保险"],"answer":"B","explanation":"答案为B（特殊劳动保护）。女职工和未成年工在生理特点、劳动能力保护及特定岗位禁忌方面有特殊保护要求，用人单位应遵守有关劳动保护规定，不得安排法律禁止的劳动或违反保护条件。该制度旨在保护特定劳动者群体的身体健康和合法权益。","basis":"《中华人民共和国劳动法》第五十八条；《女职工劳动保护特别规定》；《未成年工特殊保护规定》。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第3批：题干基本准确；具体保护事项应分别适用女职工和未成年工规定。"},{"id":"Q0650","type":"单选题","category":"安全风险管控与隐患排查","question":"安全生产管理的根本目的是（ ）。","options":["消除隐患、杜绝事故","避免造成人员伤亡","保证生产经营活动中的人身安全，财产安全，促进经济发展"],"answer":"C","explanation":"答案为C。安全生产管理的根本目的在于保障生产经营活动中人的生命安全与健康，同时保护财产安全、维护生产经营活动正常进行，并促进经济社会持续健康发展。选项A“消除隐患、杜绝事故”属于安全管理的重要目标或努力方向，但“杜绝事故”作为绝对结果并非一般管理目的的完整表述；选项B仅强调避免人员伤亡，范围较窄。","basis":"《中华人民共和国安全生产法》第三条、第四条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干为概括性管理理论题；“根本目的”表述可能因教材体系不同而略有差异，按题库答案解释。"},{"id":"Q0651","type":"单选题","category":"安全生产综合知识","question":"生产经营单位的安全生产规章制度所约束的对象是（）","options":["管理人员","主要负责人","所有从业人员"],"answer":"C","explanation":"答案为C（所有从业人员）。安全生产规章制度是生产经营单位内部开展安全生产管理和作业活动的行为规范，约束对象不仅包括主要负责人和管理人员，也包括所有从业人员。不同岗位承担的具体义务和责任有所区别，但均须遵守与岗位相关的规章制度和操作规程。","basis":"《中华人民共和国安全生产法》第二十八条、第五十七条；《生产经营单位安全培训规定》第四条。","source":"综合题库3.docx","status":"来源已补录；题干答案沿用原文，专业准确性未复核；解析补充第3批：题干“所约束的对象”可理解为本单位全体相关从业人员；外包、承包单位人员还需结合合同及现场统一协调管理关系确定。"},{"id":"Q0652","type":"单选题","category":"安全生产责任与制度","question":"生产经营单位各项安全生产制度的核心是（ ）。","options":["安全生产责任制","安全生产培训","安全生产技术措施"],"answer":"A","explanation":"答案为A（安全生产责任制）。安全生产责任制明确各岗位、各层级在安全生产中的职责，是其他安全生产制度有效运行的基础。安全培训和技术措施是制度体系中的重要组成部分，但不能替代责任制对职责分工、责任落实和考核标准的基础作用。","basis":"《中华人民共和国安全生产法》第二十一条、第二十二条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：与Q0648考点重复，保留本题原题及答案。"},{"id":"Q0653","type":"单选题","category":"安全生产法律法规与综合管理","question":"为了加强安全生产管理，防止发生生产安全事故，生产经营单位配备( )。","options":["劳动保护用品","安全生产管理人员","安全管理制度"],"answer":"B","explanation":"答案为B（安全生产管理人员）。生产经营单位应根据生产经营特点和规模，依法设置安全生产管理机构或者配备专兼职安全生产管理人员；法律对矿山、金属冶炼、建筑施工、运输单位及危险物品生产经营储存单位等另有具体要求。配备安全管理人员有助于组织日常检查、隐患治理和安全培训。","basis":"《中华人民共和国安全生产法》第二十四条。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第3批：题干表述不完整，未交代单位类型和规模；不同单位配备要求不同，建议作为通用原则题理解。"},{"id":"Q0654","type":"单选题","category":"安全生产法律法规与综合管理","question":"安全管理中的本质化原则是指从一开始从本质上实现安全化，从根本上消除事故发生的( )。","options":["可能性","严重性","概率性"],"answer":"A","explanation":"答案为A（可能性）。安全管理本质化原则强调从设计、设备、工艺和系统源头采取措施，使生产系统本身具备安全性，尽量消除或降低事故发生的可能性，而不是仅在事故发生后降低后果严重性。选项A与“从本质上实现安全化”的表述相符。","basis":"安全管理理论中的本质安全化原则；具体工程措施应结合设备、工艺和适用的安全技术标准。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第3批：属于安全管理理论题，非单一法规条文。"},{"id":"Q0655","type":"单选题","category":"安全风险管控与隐患排查","question":"下列安全检查制度描述不正确的是（ ）。","options":["是安全管理工作的重要内容","是消除隐患的重要手段","是一项追究安全生产责任的重要制度"],"answer":"C","explanation":"题库答案为C。安全检查是识别和发现事故隐患、验证安全管理措施落实情况的重要手段，也是推动整改闭环的管理活动。其主要目的在于预防事故、发现并消除隐患，而不是将追究安全生产责任作为制度本身的主要目的。对发现的问题可以依法依规追责，但追责不是安全检查制度的核心定义。","basis":"《中华人民共和国安全生产法》第四十一条、第四十六条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：选项C表述把安全检查制度与责任追究制度混为一谈，题库答案按此理解。"},{"id":"Q0656","type":"单选题","category":"安全生产法律法规与综合管理","question":"在可能发生人身伤害、设备或设施损坏和环境破坏的场合，事先采取措施，防止事故的发生。 这体现了 ( )的运用。","options":["预防原理","本质安全化原则","安全第一原则"],"answer":"A","explanation":"答案为A（预防原理）。预防原理强调在事故发生之前识别危险因素并采取控制措施，避免事故发生或降低事故发生概率。题干描述“事先采取措施，防止事故发生”，直接体现预防原理。安全第一和本质安全化原则与预防思想相关，但本题问的是管理原理名称。","basis":"安全管理理论中的预防原理；《中华人民共和国安全生产法》第四条确立安全风险分级管控和事故隐患排查治理双重预防机制。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干属于理论概念题，法律条文作为实践制度支撑。"},{"id":"Q0657","type":"单选题","category":"安全生产法律法规与综合管理","question":"“3E 原则 ”指的是利用 ( )防止事故的发生。","options":["工程技术对策、教育对策、管理对策","安全管理对策、预防对策、法规对策","工程技术对策、教育对策、法制对策"],"answer":"C","explanation":"题库答案为C（工程技术对策、教育对策、法制对策）。安全管理中的“3E原则”通常指Engineering（工程技术）、Education（教育）、Enforcement（强制/法制管理）。通过工程技术消除或控制危险，通过教育提高安全意识和技能，通过法制和管理要求促使人员遵守安全规则。不同教材可能将Enforcement译为强制、法制或管理对策，需统一术语。","basis":"安全管理理论中的3E原则，属于教材性理论概念，不是单一法律条文的法定术语。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干答案C采用“法制对策”译法；部分教材译作“强制对策”，建议统一教材术语但本次不改答案。"},{"id":"Q0658","type":"单选题","category":"安全生产法律法规与综合管理","question":"预防原理的( )原则告诉我们，造成人的不安全行为和物的不安全状态原因可归结四个方面。","options":["偶然损失","本质安全化","因果关系"],"answer":"C","explanation":"答案为C（因果关系）。预防原理中的因果关系原则强调事故发生具有原因和结果之间的联系，人的不安全行为和物的不安全状态往往由多种因素导致。通过分析事故链条和深层原因，采取针对性措施，能够防止同类事故重复发生。","basis":"安全管理理论中的因果关系原则，属于教材性概念。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干“原因可归结四个方面”需与对应教材的具体四类原因表述配套；本题只考查原则名称。"},{"id":"Q0659","type":"单选题","category":"安全生产责任与制度","question":"生产经营单位建立健全安全生产责任制体现了系统原理中 ( )。","options":["动态相关性原则","整分合原则","反馈原则"],"answer":"B","explanation":"答案为B（整分合原则）。整分合原则要求在整体规划基础上进行合理分工，并通过协调和综合使各部分形成有机整体。生产经营单位建立健全安全生产责任制，是将整体安全目标分解到部门、岗位和人员，再通过协调考核实现整体安全管理目标，体现整分合原则。","basis":"安全管理理论中的系统原理及整分合原则；《中华人民共和国安全生产法》第二十二条规定责任制应明确岗位责任人员、责任范围和考核标准。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干属于理论应用题，法条用于说明责任分解的制度基础。"},{"id":"Q0660","type":"单选题","category":"安全生产法律法规与综合管理","question":"( )用系统论的观点、理论和方法来认识和处理管理中出现的问题。","options":["人体模型原理","预防原理","系统原理"],"answer":"C","explanation":"答案为C（系统原理）。系统原理是运用系统论的观点、理论和方法认识、分析和处理管理问题，强调从整体出发，考虑各组成部分之间的联系、相互作用和环境影响。安全生产管理不能孤立看待单一设备或人员，应综合考虑人、机、料、法、环及管理因素。","basis":"安全管理理论中的系统原理；可结合《中华人民共和国安全生产法》第四条关于建立安全风险分级管控和隐患排查治理双重预防机制理解。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干语句基本准确。"},{"id":"Q0661","type":"单选题","category":"安全生产法律法规与综合管理","question":"在管理系统中，建立一套合理能级，根据单位和个人能量的大小安排工作，发挥不同的能量， 保证结构的( )和管理的有效性，这就是能级原则。","options":["稳定性","动态性","组织性"],"answer":"A","explanation":"答案为A（稳定性）。能级原则要求根据组织成员能力、岗位要求和授权层级合理配置工作，使不同层级各司其职、协调运行，从而保持管理结构相对稳定并提高管理有效性。能级并非简单按职位高低分配，而应与能力、责任和授权相匹配。","basis":"安全管理理论中的能级原则，属于组织管理理论概念。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干基本准确；“能量大小”是传统教材的比喻性表述。"},{"id":"Q0662","type":"单选题","category":"安全生产责任与制度","question":"生产经营单位的主要负责人和（ ）应当具备必安的安全生产知识和管理能力。","options":["安全生产管理人员","特种作业人员","从业人员"],"answer":"A","explanation":"答案为A（安全生产管理人员）。生产经营单位主要负责人和安全生产管理人员必须具备与本单位生产经营活动相适应的安全生产知识和管理能力。特种作业人员另须接受专门安全技术培训并取得相应资格或操作证；普通从业人员也须接受岗位安全培训，但本题所问是与主要负责人并列的法定管理岗位。","basis":"《中华人民共和国安全生产法》第二十七条第一款。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干存在明显错字：“必安的”应为“必要的”或应按法条原文改为“相应的”；本批只标记，不修改题干。"},{"id":"Q0663","type":"单选题","category":"安全教育培训与职业健康","question":"生产经营单位安全培训规定，生产经营单位新上岗的从业人员， 岗前安全培训时间不得少于 （ ）学时。",
