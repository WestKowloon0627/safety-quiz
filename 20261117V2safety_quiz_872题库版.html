"options":["16","24","36"],"answer":"B","explanation":"答案为B（24学时）。一般生产经营单位新上岗从业人员岗前安全培训时间不得少于24学时。煤矿、非煤矿山、危险化学品、烟花爆竹、金属冶炼等单位新上岗人员的培训要求更高，不少于72学时，且每年再培训不少于20学时。因此本题应结合一般单位与高危行业的区别理解。","basis":"《生产经营单位安全培训规定》第十三条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干未限定一般单位；按该条一般规定答案为24学时，但高危行业适用72学时，题干宜明确适用范围。"},{"id":"Q0664","type":"单选题","category":"安全教育培训与职业健康","question":"生产经营单位主要负责人和安全生产管理人员初次安全培训时间不得少于（ ）学时。","options":["24","32","48"],"answer":"B","explanation":"答案为B（32学时）。一般生产经营单位主要负责人和安全生产管理人员初次安全培训不得少于32学时；煤矿、非煤矿山、危险化学品、烟花爆竹、金属冶炼等单位不得少于48学时。题干未限定行业，按一般生产经营单位的基本要求选32学时。","basis":"《生产经营单位安全培训规定》第九条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干未区分一般行业与高危行业，答案32学时仅适用于一般生产经营单位；建议标注适用范围。"},{"id":"Q0665","type":"单选题","category":"安全教育培训与职业健康","question":"生产经营单位主要负责人和安全生产管理人员每年再培训时间不得少于（ ）学时。","options":["12","18","20"],"answer":"A","explanation":"答案为A（12学时）。一般生产经营单位主要负责人和安全生产管理人员每年再培训时间不得少于12学时；煤矿、非煤矿山、危险化学品、烟花爆竹、金属冶炼等单位每年再培训不得少于16学时。题干未限定行业，按一般生产经营单位要求选12学时。","basis":"《生产经营单位安全培训规定》第九条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干未区分行业，12学时适用于一般生产经营单位；高危行业要求为16学时。"},{"id":"Q0666","type":"单选题","category":"安全教育培训与职业健康","question":"对新员工进行安全培训教育是生产经营单位的重要工作， 其中（ ）是主要的教育培训方式之 一。","options":["安全技能培训","应急救援演练","“三级 ”教育培训"],"answer":"C","explanation":"答案为C（“三级”教育培训）。新员工安全培训通常按照厂（矿）级、车间（工段、区、队）级和班组级开展，帮助其逐级了解单位安全制度、作业环境风险、岗位操作规程和应急处置要求。不同类型生产经营单位的具体培训内容和学时，应按适用法规及行业规定执行。","basis":"《生产经营单位安全培训规定》第十二条、第十四条至第十六条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干“安全训教培育”存在明显错字和词序错误，疑似应为“安全教育培训”；本批不修改。"},{"id":"Q0667","type":"单选题","category":"安全教育培训与职业健康","question":"生产经营单位主要负责人安全培训可不包括( )的内容。","options":["国家安全生产方针、政策和有关安全生产的法律、法规、规章及标准","安全生产管理基本知识，安全生产技术、安全生产专业知识","伤亡事故统计、报告及职业病鉴定的方法"],"answer":"C","explanation":"题库答案为C。按《生产经营单位安全培训规定》第七条，主要负责人安全培训内容包括安全生产方针政策和法律标准、安全管理及技术知识、重大危险源管理、重大事故防范、应急管理和救援组织、职业危害及其预防措施、事故案例等；“伤亡事故统计、报告及职业危害的调查处理方法”属于安全生产管理人员培训内容的明确列项。因此C不属于主要负责人培训内容的直接列举项。","basis":"《生产经营单位安全培训规定》第七条、第八条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干“可不包括”应理解为规章列举内容的区分；主要负责人仍需了解事故统计和报告相关管理要求。"},{"id":"Q0668","type":"单选题","category":"应急管理与救援","question":"下列 ( )不属于生产经营单位主要负责人安全培训的内容。","options":["应急管理、应急预案编制以及应急处置的内容和要求","重大危险源管理、重大事故防范、应急管理和救援组织以及事故调查处理的有关规定","职业危害及其预防措施"],"answer":"A","explanation":"题库答案为A，但本题答案存在疑点。根据《生产经营单位安全培训规定》第七条，主要负责人培训内容包括重大危险源管理、重大事故防范、应急管理和救援组织、事故调查处理等；第七条还包含事故应急救援案例，但并未以“应急预案编制以及应急处置的内容和要求”作为主要负责人条款的原文列项，该表述更接近第八条对安全生产管理人员的培训内容。B中的重大危险源管理、重大事故防范、应急管理和救援组织及事故调查处理，反而是主要负责人培训明确内容。选项C职业危害及预防措施也属于主要负责人培训内容。因此按现行规章文本，A可能是预期答案，但题干“下列不属于”仍需结合选项完整原文和教材来源复核。","basis":"《生产经营单位安全培训规定》第七条、第八条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：标记待核：A与B、C的区分需按培训规定条文逐项核对；现有题库答案A暂予保留，不擅自更改。"},{"id":"Q0669","type":"单选题","category":"安全生产法律法规与综合管理","question":"用人单位与劳动者订立劳动合同时， 应当将工作过程中可能产生的（ ）如实告知劳动者，并 在劳动合同中写明，不得隐瞒或者欺骗。","options":["职业病危害及其后果","职业病防护措施和待遇","职业病病名"],"answer":"A","explanation":"答案为A（职业病危害及其后果）。用人单位与劳动者订立劳动合同时，应如实告知工作过程中可能产生的职业病危害及其后果，并在劳动合同中写明；还应告知职业病防护措施和待遇。题干所问括号位置对应“可能产生的”内容，A是职业病危害及其后果。","basis":"《中华人民共和国职业病防治法》第三十三条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干只考查告知内容的一部分；完整法定义务还包括职业病防护措施和待遇。"},{"id":"Q0670","type":"单选题","category":"安全生产法律法规与综合管理","question":"依据《劳动法》，用人单位必须为劳动者提供符合国家规定的劳动安全卫生条件和必要的劳动 防护用品，对从事有职业危害作业的劳动者应当 ( )。","options":["给予劳动津贴","定期进行健康检查","定期休假"],"answer":"B","explanation":"答案为B（定期进行健康检查）。从事有职业危害作业的劳动者，应按照职业健康监护要求接受上岗前、在岗期间及离岗时等职业健康检查，检查结果应依法告知劳动者并建立职业健康监护档案。题目引用《劳动法》的劳动安全卫生义务，B最符合对职业危害作业劳动者的健康保护要求。","basis":"《中华人民共和国劳动法》第五十四条；《中华人民共和国职业病防治法》第三十五条。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第3批：题干引用《劳动法》时，建议同时核对职业病防治法关于职业健康检查的更具体规定。"},{"id":"Q0671","type":"单选题","category":"安全教育培训与职业健康","question":"生产经营单位应在（ ）期限内对管理人员和作业人员至少进行一次安全生产教育培训。","options":["3 个月","半年","一年"],"answer":"C","explanation":"题库答案为C（一年）。生产经营单位应对从业人员开展经常性安全生产教育和培训；具体培训频次、内容和学时应根据法律法规、行业规定、岗位风险及单位制度确定。对于特定主要负责人、安全管理人员和高危行业从业人员，法规还规定年度再培训学时要求。本题以“一年至少一次”作为一般性培训周期表述。","basis":"《中华人民共和国安全生产法》第二十八条；《生产经营单位安全培训规定》第九条、第十三条及有关培训要求。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干“一年期限内至少一次”不是对所有岗位、所有行业统一的完整法定频次表述；应结合岗位、行业专项规定及单位制度。"},{"id":"Q0672","type":"单选题","category":"安全教育培训与职业健康","question":"安全生产教育和培训范围是（ ）。","options":["总包单位的职工","分包单位的职工","本企业的职工与分包单位的职工"],"answer":"C","explanation":"答案为C（本企业职工与分包单位职工）。施工现场通常由总承包单位对施工现场安全生产负总责，并对分包单位安全生产工作进行统一协调、管理；总包、分包单位均应依法对各自人员开展安全教育培训，不能因劳动关系属于分包单位就将其排除在施工现场安全培训管理之外。","basis":"《中华人民共和国安全生产法》第二十八条、第四十九条；《建设工程安全生产管理条例》第二十四条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干未明确行业和总分包关系；按建设工程施工现场安全管理语境解释。"},{"id":"Q0673","type":"单选题","category":"应急管理与救援","question":"按照有关法律要求， 告知从业人员作业场所和工作岗位的危险因素、防范措施以及事故应急 措施，是保障从业人员的（ ）重要内容。","options":["教育权","知情权","建议权"],"answer":"B","explanation":"答案为B（知情权）。生产经营单位应如实告知从业人员作业场所和工作岗位存在的危险因素、防范措施以及事故应急措施，使员工能够了解岗位风险并采取防护措施。这体现从业人员对工作环境安全信息的知情权。","basis":"《中华人民共和国安全生产法》第四十四条第一款；从业人员安全生产权利义务相关规定。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干基本准确。"},{"id":"Q0674","type":"单选题","category":"安全生产法律法规与综合管理","question":"人本原理体现了以人为本的指导思想，包括三个原则，下列不包括在人本原理中的原则是（ ）。","options":["安全第一原則","动力原则","激励原则"],"answer":"A","explanation":"答案为A（安全第一原则）。人本原理强调以人的需要、积极性和主体作用为中心，教材中常列举动力原则、能级原则、激励原则等；“安全第一”是安全生产工作的方针或原则，不属于该教材分类中的人本原理具体原则。因此选A。","basis":"安全管理理论中的人本原理及动力、能级、激励等原则；《中华人民共和国安全生产法》第三条体现以人为本和人民至上、生命至上理念。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：人本原理具体分项属于教材理论体系，不同教材分类可能略有差异。"},{"id":"Q0675","type":"单选题","category":"安全教育培训与职业健康","question":"从业人员依法获得芳动安全生产保障，是劳动者应享有基本的（ ）。","options":["义务","公共安全","权利"],"answer":"C","explanation":"答案为C（权利）。从业人员依法享有获得安全生产保障的权利，包括了解作业场所和工作岗位危险因素、防范措施及应急措施，获得符合标准的劳动防护用品，接受安全教育培训，以及对违章指挥和强令冒险作业予以拒绝等。安全生产保障不是用人单位可任意取消的福利，而是法定权利。","basis":"《中华人民共和国安全生产法》第六条、第五十三条至第五十五条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干基本准确。"},{"id":"Q0676","type":"单选题","category":"安全教育培训与职业健康","question":"从业人员有依法获得劳动安全生产保障权利，同时应履行劳动安全生产方面的（ ）。","options":["义务","权力","权利"],"answer":"A","explanation":"答案为A（义务）。从业人员在依法享有安全生产保障权利的同时，也应遵守本单位安全生产规章制度和操作规程，服从管理，正确佩戴和使用劳动防护用品，接受安全教育培训并报告事故隐患。权利与义务相对应，不能只主张权利而不履行法定义务。","basis":"《中华人民共和国安全生产法》第六条、第五十七条。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第3批：题干基本准确。"},{"id":"Q0677","type":"单选题","category":"消防安全","question":"公共建筑物、厂房、库房的安全疏散出口的数量不应少于( )个。","options":["1","2","3"],"answer":"B","explanation":"答案为B（2个）。公共建筑、厂房、仓库的安全出口数量应根据建筑类别、层数、建筑面积、使用人数、疏散距离及防火分区等因素确定。一般情况下，每个防火分区或一个防火分区的每个楼层安全出口不应少于两个，但规范对面积较小、人数较少且满足特定条件的场所有例外。因此不能将“至少两个”脱离建筑条件理解为绝对无例外。","basis":"《建筑防火通用规范》GB 55037—2022有关安全疏散出口设置要求；《建筑设计防火规范》GB 50016—2014（2018年版）相关条款在不与强制性通用规范冲突的范围内配套使用。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第3批：题干将适用条件简化为普遍规则，未列出规范例外；具体建筑应按现行强制性规范及建筑类别核定。"},{"id":"Q0678","type":"单选题","category":"消防安全","question":"发现消防通道被堵塞或封闭时，个人采取以下哪种行为最正确（ ）","options":["带一伙人去强行破拆","向公安机关消防机构举报","视而不见"],"answer":"B","explanation":"答案B。消防通道被堵塞、封闭会妨碍消防车辆通行和灭火救援。个人不应组织人员强行破拆，应向消防救援机构或有关主管部门反映，由有权部门依法处理。","basis":"《中华人民共和国消防法》第二十八条、第六十条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干中的“公安机关消防机构”属于旧称，现行机构名称为消防救援机构；建议后续更新措辞，本批不改题干。"},{"id":"Q0679","type":"单选题","category":"安全教育培训与职业健康","question":"对产生严重职业病危害的作业岗位，应当在其醒目位置，设置（ ）。","options":["警示标识和中文警示说明","警示标识","警示说明"],"answer":"A","explanation":"答案A。产生严重职业病危害的作业岗位，应在醒目位置同时设置警示标识和中文警示说明，说明危害种类、后果、预防及应急处置措施。仅设置图形标识不足以完整履行告知义务。","basis":"《中华人民共和国职业病防治法》第二十五条；GBZ 158—2003《工作场所职业病危害警示标识》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：警示标识具体形式应按现行职业卫生标准目录和岗位危害因素核定。"},{"id":"Q0680","type":"单选题","category":"安全标志与现场管理","question":"根据《安全色》规定，安全色分为红、黄、蓝、绿四种颜色，分别表示（ ）。","options":["警告、禁止、指令、提示","指令、警告、禁止、提示","禁止、警告、指令、提示"],"answer":"C","explanation":"答案C。安全色通常分为红、黄、蓝、绿：红色表示禁止、停止、危险；黄色表示警告、注意；蓝色表示指令、必须遵守；绿色表示安全状态、通行或提示。","basis":"GB 2893—2008《安全色》；GB 2894—2008《安全标志及其使用导则》。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0681","type":"单选题","category":"消防安全","question":"根据现行有关规定，我国目前使用的安全色中的（ ），表示禁止、停止， 也代表防火。","options":["蓝色","黄色","红色"],"answer":"C","explanation":"答案C（红色）。红色安全色表示禁止、停止、危险等含义，也用于消防设备和消防相关标志；黄色表示警告，蓝色表示指令，绿色表示安全状态或通行。","basis":"GB 2893—2008《安全色》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0682","type":"单选题","category":"安全标志与现场管理","question":"根据理行有关規定，我国目前使用的安全色中的（ ），表示警告、注意。","options":["红色","黄色","緑色"],"answer":"B","explanation":"答案B（黄色）。黄色安全色表示警告、注意，常用于警告标志及需要提醒人员注意的危险部位。","basis":"GB 2893—2008《安全色》；GB 2894—2008《安全标志及其使用导则》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干存在OCR错字：“理行”“規定”疑为“现行”“规定”，本批不修改。"},{"id":"Q0683","type":"单选题","category":"安全标志与现场管理","question":"根据现行有关规定，我国目前使用的安全色中的（ ）表示安全状态、提 示或通行。","options":["蓝色","黄色","绿色"],"answer":"C","explanation":"答案C（绿色）。绿色安全色表示安全状态、通行或提示，常见于安全出口、疏散方向及安全状态指示。","basis":"GB 2893—2008《安全色》；GB 2894—2008《安全标志及其使用导则》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干“安全状恋、提 示”存在明显OCR错字，疑为“安全状态、提示”，本批不修改。"},{"id":"Q0684","type":"单选题","category":"安全生产法律法规与综合管理","question":"我国目前常用的安全警示标志中的（ ）即圆形内划一斜杠，并用红色描 划成较粗的圆环和斜杠。","options":["禁止标志","警告标志","指令标志"],"answer":"A","explanation":"答案A（禁止标志）。禁止标志通常为圆形，采用红色圆环和斜杠，图形符号为黑色、背景为白色，用于禁止或制止不安全行为。警告标志通常为黄色三角形，指令标志通常为蓝色圆形。","basis":"GB 2894—2008《安全标志及其使用导则》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0685","type":"单选题","category":"安全生产法律法规与综合管理","question":"我国日前常用的安全警示标志中的（ ），以绿色为背景的长方几何图 形，配以白色的文字和国形符号，并标明目标的方向。","options":["警告标志","指令标志","提示标志"],"answer":"C","explanation":"答案C（提示标志）。提示标志用于提供安全设施或场所等信息，常见形式为绿色背景、白色图形符号或文字，并可配合方向辅助标志指示目标。","basis":"GB 2894—2008《安全标志及其使用导则》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干有多处OCR错字，建议核对原始资料：“日前”“几何图形”“国形符号”等，本批不修改。"},{"id":"Q0686","type":"单选题","category":"安全标志与现场管理","question":"下列哪种标志的安全色为红色？（ ）","options":["安全出口","禁止吸烟","当心触电"],"answer":"B","explanation":"答案B（禁止吸烟）。禁止吸烟属于禁止标志，安全色为红色，通常采用红色圆环和斜杠覆盖图形符号。安全出口为绿色提示标志；当心触电为黄色警告标志。","basis":"GB 2894—2008《安全标志及其使用导则》。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0687","type":"单选题","category":"安全标志与现场管理","question":"下列含义不能使用蓝色安全色表示的是（ ）。","options":["必须戴防尘口罩","必须戴防毒面具","当心高温烫伤"],"answer":"C","explanation":"答案C（当心高温烫伤）。蓝色表示指令或必须遵守的规定，例如必须戴防尘口罩、必须戴防毒面具；“当心高温烫伤”属于黄色警告标志。","basis":"GB 2893—2008《安全色》；GB 2894—2008《安全标志及其使用导则》。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0688","type":"单选题","category":"现场管理与作业规范","question":"“5S”作业现场管理起源于（ ）。","options":["美国","日本","中国"],"answer":"B","explanation":"答案B（日本）。5S现场管理通常指整理、整顿、清扫、清洁、素养，起源于日本企业的现场管理实践，旨在改善工作场所秩序、效率和员工行为习惯。","basis":"5S属于现场管理方法和管理实践，不是法律法规规定的法定制度。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0689","type":"单选题","category":"现场管理与作业规范","question":"（ ）企业在“5S”现场管理的基础上，结合安全生产活动，在原“5S”基础上增加了安全 (safety)要素，形成“6S”。","options":["美国","日本","中国"],"answer":"C","explanation":"按题库答案C（中国）解释：本题采用的培训资料口径认为，中国企业在5S基础上增加Safety要素形成6S。6S属于企业管理实践的扩展方法，各国和企业均有应用，不宜将其创设归属作绝对化历史断言。","basis":"6S属于企业现场管理方法，非法律法规或国家标准定义的统一制度。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题目缺少来源及历史限定，答案依赖教材口径，建议核对原培训资料；保留答案C。"},{"id":"Q0690","type":"单选题","category":"现场管理与作业规范","question":"6S 中哪一项能使工作场所消除脏污？（ ）","options":["清洁","整理","清扫"],"answer":"C","explanation":"题库答案C（清扫），“清扫”是清除工作场所垃圾、灰尘和污物的直接活动；“清洁”是将整理、整顿、清扫的成果标准化并持续保持。因此题干“使工作场所消除脏污”更直接对应“清扫”，题库答案A可能不准确（原答案A，百度后个人修改为C）。","basis":"5S/6S现场管理方法术语，非法律法规条文。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：重要待核：题库答案A与常见5S术语定义不完全吻合；保留原答案，不自行更改。"},{"id":"Q0691","type":"单选题","category":"现场管理与作业规范","question":"哪一项是 6S 的终极目标？（ ）","options":["安全","素养","整顿"],"answer":"A","explanation":"答案A（安全）。题库采用的6S框架在5S基础上增加安全要素，强调现场环境、设备、作业行为和管理流程的安全。“终极目标”属于培训材料的概括说法，并非国家标准统一定义。","basis":"6S属于企业现场管理方法，非法律法规规定的统一法定概念。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：“终极目标”属于教材性表述，建议核对原培训资料。"},{"id":"Q0692","type":"单选题","category":"现场管理与作业规范","question":"6S 活动是谁的责任？（ ）","options":["总经理","部门领导们","公司全体"],"answer":"C","explanation":"答案C（公司全体）。6S涉及工作场所整理、整顿、清扫、清洁、素养和安全，需要各层级、各部门及全体员工共同参与。管理层负责推动和资源支持，部门负责组织落实，员工负责维护岗位现场。","basis":"6S属于企业现场管理方法，具体职责由企业内部制度确定。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0693","type":"单选题","category":"安全生产法律法规与综合管理","question":"检查燃气用具是否漏气时，通常采用（ ）来寻找漏气点。","options":["用火试","肥皂水","闻气味"],"answer":"B","explanation":"答案B（肥皂水）。检查燃气器具或管道接口是否漏气，可在疑似部位涂抹肥皂水，观察是否持续产生气泡；严禁用明火试漏。若闻到燃气味，应避免开关电器和使用明火，按安全程序处置并联系燃气单位。","basis":"《城镇燃气管理条例》有关燃气安全使用要求；燃气器具说明书及燃气经营企业安全指引。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0694","type":"单选题","category":"消防安全","question":"灭火器应当摆放在( )和通风干燥、取用方便的地方。","options":["火源附近","被保护物附近","室外"],"answer":"B","explanation":"答案B（被保护物附近）。灭火器应设置在明显、便于取用且不影响疏散的位置，通常靠近其保护对象或保护区域，并避免高温、潮湿、腐蚀及遮挡。不能简单放在火源附近，以免火灾发生时无法安全接近。","basis":"GB 50140—2005《建筑灭火器配置设计规范》第5章；具体位置、数量和保护距离应结合场所危险等级确定。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0695","type":"单选题","category":"危险化学品安全","question":"施工作业现场氧气瓶、乙炔瓶应该分开放置，与明火之间的距离至少保持（ ）米。","options":["5","10","15"],"answer":"B","explanation":"答案B（10米）。GB 30871—2022规定，气焊、气割动火时氧气瓶与乙炔瓶间距不小于5m，二者与动火点间距不小于10m，并采取防晒、防倾倒措施。题干问气瓶与明火距离，故选10m。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第5.2.13条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：该标准适用于危险化学品生产、经营（带储存）企业及化工、医药企业；其他施工现场还应核对适用规范。"},{"id":"Q0696","type":"单选题","category":"动火及特殊作业安全","question":"动火作业“三个一律”说法错误的是（ ）","options":["一律不准进行交叉作业","一律清除现场可燃物质","一律检测不燃气体含量、保持良好通风"],"answer":"C","explanation":"答案C。动火作业应检测可燃气体含量，而不是“不燃气体含量”。动火前还应清除可燃物、落实监护和隔离措施，按要求进行气体分析并确认合格。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第5.2、5.3条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：“三个一律”属于管理口号，不是标准原文术语；选项C“检测不燃气体”明显用词错误。"},{"id":"Q0697","type":"单选题","category":"动火及特殊作业安全","question":"危险化学品企业特殊作业安全规范（GB30871-2022）作业要求，特殊动火作业、一级动火作 业的《安全作业票》有效期不超过( )h。","options":["4","8","12"],"answer":"B","explanation":"答案B（8小时）。GB 30871—2022规定，特级、一级动火安全作业票有效期不超过8h；二级动火作业票有效期不超过72h。作业条件变化或达到标准规定的中断时限时，应重新分析或确认。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第5.1.5条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：适用范围限于该标准规定的危险化学品企业及化工、医药企业。"},{"id":"Q0698","type":"单选题","category":"动火及特殊作业安全","question":"危险化学品企业特殊作业安全规范（GB30871-2022）作业要求，二级动火作业的《安全作业 票》有效期不超过( )h。","options":["24","36","72"],"answer":"C","explanation":"答案C（72小时）。GB 30871—2022规定二级动火安全作业票有效期不超过72h；特级、一级不超过8h。作业票有效期内仍须持续落实监护、检测和现场安全措施。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第5.1.5条、第5.3.1条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：适用范围限于该标准规定的企业，不宜泛化至所有行业。"},{"id":"Q0699","type":"单选题","category":"动火及特殊作业安全","question":"危险化学品企业特殊作业安全规范（GB30871-2022）作业要求，动火期间，距动火点 30m 内 不应排放可燃气体;距动火点 15m 内不应排放可燃液体;在动火点 10m 范围内、动火点上方及下方 不应同时进行可燃溶剂清洗或喷漆作业;在动火点（）范围内不应进行可燃性粉尘清扫作业。","options":["5","10","15"],"answer":"B","explanation":"答案B（10m）。GB 30871—2022规定，动火点10m范围内不应进行可燃性粉尘清扫；另规定30m内不得排放可燃气体、15m内不得排放可燃液体，10m范围内及上下方不得同时进行可燃溶剂清洗或喷漆。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第5.2.9条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0700","type":"单选题","category":"动火及特殊作业安全","question":"使用电焊机作业时，电焊机与动火点的间距不应超过( )m，不能满足要 求时应将电焊机作为动火点进行管理。","options":["5","10","15"],"answer":"B","explanation":"答案B（10m）。使用电焊机动火时，电焊机与动火点间距不应超过10m；不能满足时，应将电焊机作为动火点进行管理，落实相应动火安全措施。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第5.2.12条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：该标准有明确适用范围，其他行业需结合相应作业规定。"},{"id":"Q0701","type":"单选题","category":"安全生产法律法规与综合管理","question":"安全“三宝 ”是指（ ）","options":["安全帽、安全带、安全绳","安全帽、安全带、安全网","安全斧、安全带、安全网"],"answer":"B","explanation":"答案B（安全帽、安全带、安全网）。建筑施工“三宝”分别用于头部防护、防止高处作业人员坠落或减轻坠落伤害，以及防止人员或物体坠落。应选用符合标准的产品并正确佩戴、设置和检查。","basis":"建筑施工安全防护通用要求；安全帽、安全带、安全网应符合对应现行产品标准。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0702","type":"单选题","category":"高处作业安全","question":"凡距坠落高度基准面( )m 及其以上，有可能坠落的高处进行的作业，称 为高处作业。","options":["1","2","3"],"answer":"B","explanation":"答案B（2m）。高处作业通常指在距坠落高度基准面2m及以上、有可能坠落的高处进行的作业。判断时既要看高度，也要看是否存在坠落可能及具体标准适用范围。","basis":"GB/T 3608—2008《高处作业分级》第3.1条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0703","type":"单选题","category":"高处作业安全","question":"高处作业“五个必须 ”说法错误的是（ ）","options":["必须培训持证上岗","必须实行作业审批、无须做好个人防护","必须落实工程措施、必须安排专人监护"],"answer":"B","explanation":"答案B。高处作业必须做好个人防护，不能表述为“无须做好个人防护”。应按风险落实审批、人员培训或资格要求、工程防护、个体防护和现场监护；安全带应正确选用并系挂于可靠锚固点。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第8章；JGJ 80—2016《建筑施工高处作业安全技术规范》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：“五个必须”属于管理口号，具体要求应按作业类型和适用标准执行。"},{"id":"Q0704","type":"单选题","category":"高处作业安全","question":"高处作业安全作业票的有效期最长为（ ）天。当作业中断，再次作业 前，应重新对环境条件和安全措施进行确认。","options":["3","7","10"],"answer":"B","explanation":"答案B（7天）。GB 30871—2022规定，高处安全作业票有效期最长为7天；作业中断后再次作业前，应重新确认环境条件和安全措施。条件发生变化时也应重新评估。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第8.2.11条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：适用范围限于该标准规定的企业；其他行业应核对本行业作业票制度。"},{"id":"Q0705","type":"单选题","category":"高处作业安全","question":"根据危险化学品企业特殊作业安全规范（GB30871-2022），高处作业共分四级，I 级是指（ ）","options":["2m≤h≤5m","5m＜h≤15m","15m＜h≤30m"],"answer":"A","explanation":"答案A（2m≤h≤5m）。GB 30871—2022将高处作业按作业高度分级：Ⅰ级2m≤h≤5m，Ⅱ级5m＜h≤15m，Ⅲ级15m＜h≤30m，Ⅳ级h＞30m。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第8.1条及表1。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0706","type":"单选题","category":"有限空间作业安全","question":"有限空间作业“七个不准 ”说法错误的是（ ）。","options":["经风险辨识不准作业","未经通风和检测合格不准作业","不佩戴劳动防护用品不准作业"],"answer":"A","explanation":"答案A。有限空间作业要求“未经风险辨识不准作业”，选项写成“经风险辨识不准作业”，把必须满足的前置条件写反了。风险辨识后还须落实通风、检测、审批、监护、个体防护和应急救援等措施。","basis":"《工贸企业有限空间作业安全规定》（应急管理部令第13号）；GB 30871—2022第6章（在其适用范围内）。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：“七不准”是口号式概括，具体作业条件以适用法规和标准为准。"},{"id":"Q0707","type":"单选题","category":"有限空间作业安全","question":"有限空间作业“七个不准 ”说法错误的是（ ）。","options":["未经审批、没有监护不准作业","电气设备符合规定不准作业","未经培训演练不准作业"],"answer":"B","explanation":"答案B。有限空间作业应确保电气设备符合环境安全要求后方可作业；选项B将条件写反为“电气设备符合规定不准作业”，因此错误。有限空间可能潮湿、腐蚀或存在易燃易爆气体，设备选型、防护、接地和照明要求应按环境确定。","basis":"《工贸企业有限空间作业安全规定》（应急管理部令第13号）；GB 30871—2022第6章（在其适用范围内）。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0708","type":"单选题","category":"有限空间作业安全","question":"有限空间作业前，要对有限空间作业条件逐项确认，下列是不需要必须确认项的是。（ ）","options":["作业方案审批完成","有限空间通风检测，气体检查合格","作业人员体检报告"],"answer":"C","explanation":"答案C（作业人员体检报告）。作业方案审批、通风和气体检测合格属于有限空间作业的重要前置条件。作业人员健康状况应纳入岗位适任性和职业健康管理，但“每次作业前必须核验体检报告”并非所有有限空间作业统一的法定前置项目；有专项健康要求的岗位应另行执行。","basis":"《工贸企业有限空间作业安全规定》（应急管理部令第13号）；GB 30871—2022第6章。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干“必须确认项”范围较绝对，需结合岗位健康要求和企业制度。"},{"id":"Q0709","type":"单选题","category":"有限空间作业安全","question":"企业将有限空间作业发包的， 承包单位应具备相应的安全生产条件。发包企业对发包有限空 间作业安全承担( )。","options":["次要责任","主体责任","连带责任"],"answer":"B","explanation":"答案B（主体责任）。有限空间作业发包不意味着安全生产责任随合同转移。发包企业应审查承包单位安全生产条件，进行安全交底，对承包作业统一协调、管理；承包单位也应履行自身安全生产责任。","basis":"《中华人民共和国安全生产法》第四十九条；《工贸企业有限空间作业安全规定》（应急管理部令第13号）。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：“主体责任”是概括性表达，具体责任应结合发包方、承包方各自法定义务。"},{"id":"Q0710","type":"单选题","category":"有限空间作业安全","question":"有限空间作业前应当制定工作方案，并经( )审批。","options":["监护人员","企业负责人","现场负责人"],"answer":"B","explanation":"题库答案B（企业负责人），但审批主体需结合企业类型、风险等级及内部授权制度确定。有限空间作业应制定工作方案并履行审批程序；不能仅凭本题选项将所有企业、所有有限空间作业的审批人一概规定为企业负责人。","basis":"《工贸企业有限空间作业安全规定》（应急管理部令第13号）关于作业方案和审批管理的规定；GB 30871—2022第6章（在其适用范围内）。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干未说明企业类型和授权制度，审批主体不够明确；保留原答案B并标记。"},{"id":"Q0711","type":"单选题","category":"安全生产法律法规与综合管理","question":"停电检修时， 在一经合闸即可送电到工作批点开关或刀闸操作把手上。应悬挂如下哪种标示 牌？（ ）","options":["在此工作","止步，高压危险","禁止合闸，有人检修"],"answer":"C","explanation":"答案C（禁止合闸，有人检修）。停电检修时，应在相关开关或刀闸操作把手上悬挂禁止合闸类标示牌，并落实停电、隔离、验电、接地、闭锁等措施，防止误送电。标示牌不能代替可靠的电气隔离。","basis":"适用电压等级的《电力安全工作规程》；GB 2894—2008《安全标志及其使用导则》。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干“工作批点开关”疑为“工作地点开关”；标示牌名称建议按实际适用电力规程统一，本批不改。"},{"id":"Q0712","type":"单选题","category":"动火及特殊作业安全","question":"特级动火现场应配置便携式或移动式（ ）。","options":["氧气浓度含量检测仪","二氧化碳浓度含量检测仪","可燃气体检测报警仪"],"answer":"C","explanation":"答案C（可燃气体检测报警仪）。特级动火风险较高，应按规定落实气体分析和监测。可燃气体检测报警仪用于监测可燃气体浓度，氧气或二氧化碳检测仪不能替代可燃气体检测。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第5.2.11条、第5.3条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：仪器配置须结合风险分析和标准要求，不能将单一仪器视为完整安全措施。"},{"id":"Q0713","type":"单选题","category":"电气安全管理","question":"有关电气火灾的说法，不正确的是（ ）","options":["开关、插座和照明灯具靠近可燃物体时，应采取隔热、散热等防火措施","安装电器火灾监控系统是有效的电气火灾救援措施","电气火灾占火灾发生的比例较大，且大部分电气火灾是由于电气线路引发"],"answer":"B","explanation":"答案B。电气火灾监控系统属于监测预警措施，不是火灾发生后的救援措施。救援措施包括报警、在确保安全前提下切断电源、选用适用灭火器材、疏散和专业救援。选项C关于“多数电气火灾由线路引发”属于统计性说法，缺少统计年份和来源。","basis":"GB 50116—2013《火灾自动报警系统设计规范》中电气火灾监控系统相关规定；电气火灾处置应按消防及电气安全规程执行。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：选项B概念错误；选项C统计结论缺少来源和时间范围。"},{"id":"Q0714","type":"单选题","category":"电气安全管理","question":"使用电动工具前，应( )。","options":["用水清洗，确保卫生，才可使用","看是否需要改装工具，提高效率","进行检查，确保机件正常"],"answer":"C","explanation":"答案C。使用电动工具前，应检查外壳、手柄、开关、电源线、插头、保护接地或双重绝缘标识、附件及防护装置是否完好，并确认工具适用于作业环境。不得擅自改装或用水清洗带电工具。","basis":"GB/T 3787—2017《手持式电动工具的管理、使用、检查和维修安全技术规程》。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0715","type":"单选题","category":"动火及特殊作业安全","question":"电焊时，下列措施中可避免伤及他人的是( )。","options":["放置警告牌，并在工作周围设置屏障","规定在场人员佩戴眼镜","规定在场人中佩戴防护口罩"],"answer":"A","explanation":"答案A。电焊会产生强烈弧光、飞溅和火花，设置警告牌并在作业周围设置屏障或焊接防护屏，可阻隔弧光、飞溅并提醒无关人员远离。仅要求在场人员佩戴眼镜或口罩，不能充分保护其他人员。","basis":"GB 9448—1999《焊接与切割安全》及适用焊接防护要求。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0716","type":"单选题","category":"电气安全管理","question":"任何电气设备在未验明无电之前，一律按( )处理。","options":["无电","也许有电","有电"],"answer":"C","explanation":"答案C（有电）。未经验电确认无电之前，任何电气设备都应按有电处理，避免感应电、反送电或误合闸导致触电。停电检修应履行停电、验电、接地、挂牌和必要的闭锁、隔离措施。","basis":"适用电压等级的《电力安全工作规程》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0717","type":"单选题","category":"安全教育培训与职业健康","question":"《安全生产法》规定:( )必须接受专门的培训，经考试合格取得操作资格证书的，方可上岗 作业。","options":["班组长","岗位工人","特种作业人员"],"answer":"C","explanation":"答案C（特种作业人员）。特种作业人员必须接受专门安全技术培训，经考核合格并取得相应资格或操作证后方可上岗。证书类别、考试和复审要求应按现行特种作业目录及考核规定执行。","basis":"《中华人民共和国安全生产法》第三十条；《特种作业人员安全技术培训考核管理规定》（应急管理部令第19号，自2026年6月1日起施行）。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干“操作资格证书”属概括性旧表述，证书名称及考核制度应按2026年新规核对。"},{"id":"Q0718","type":"单选题","category":"电气安全管理","question":"手持电动工具按电气安全保护措施分 I 类、II 类、III 类共三类。使用（ ）设备应配用绝 缘手套、绝缘鞋、绝缘垫等电工绝缘安全用具。","options":["I 类","II 类","III 类"],"answer":"A","explanation":"答案A（Ⅰ类）。Ⅰ类手持电动工具除基本绝缘外，还具有接地保护措施，使用时应按规定接入保护接地，并根据环境采取适当绝缘防护。Ⅱ类工具采用双重或加强绝缘，Ⅲ类工具采用安全特低电压供电。","basis":"GB/T 3787—2017《手持式电动工具的管理、使用、检查和维修安全技术规程》及相关产品标准。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干将Ⅰ类工具与绝缘防护用品直接关联较简化，实际防护还取决于电压、环境及工具结构。"},{"id":"Q0719","type":"单选题","category":"消防安全","question":"《仓库防火安全管理规则》库房内堆放物品应满足五距要求，堆垛上部与楼板、平屋顶之间 的距离不小于（ ）（人字屋架从横梁算起）。","options":["30 ㎝","50 ㎝","100 ㎝"],"answer":"A","explanation":"题库答案A（30cm），仓库“五距”是指：顶距、灯距、墙距、柱距、垛距。（引用标准：《仓储场所消防安全管理通则》（XF 1131-2014））\n1.顶距：堆垛上部与楼板、平屋顶之间的距离不小于0.3m（人字屋架从横梁算起）。\n2.灯距：物品与照明灯之间的距离不小于0.5m；以防止照明灯过于接近商品（灯光产生热量）而发生火灾。\n3.墙距：物品与墙之间的距离不小于0.5m；以便通风散热和防火，一旦发生火灾，可供消防人员出入。\n4.柱距：物品堆垛与柱之间的距离不小于0.3m。柱距的作用是防止柱散发的潮气使商品受潮，并保护柱脚，以免损坏建筑物。\n5.堆距：堆垛与堆垛之间的距离不小于1m。堆距的作用是使货堆与货堆之间，间隔清楚，防止混淆，也便于通风检查，一旦发生火灾，还便于抢救，疏散物资。","basis":"《仓库防火安全管理规则》关于堆垛上部与楼板、平屋顶间距的规定。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：重要待核：原答案30cm与规则规定0.5m不一致；保留原答案A，不自行更改。"},{"id":"Q0720","type":"单选题","category":"消防安全","question":"《仓库防火安全管理规则》库房内堆放物品应满足五距要求，物品与照明灯之间的距离不小 于（ ）。","options":["30 ㎝","50 ㎝","100 ㎝"],"answer":"B","explanation":"答案B（50cm）。仓库物品堆垛与照明灯之间保持距离，可减少灯具发热或故障烘烤可燃物的风险。仓库照明灯具和线路还应符合电气防火要求，不得使用不符合规定的灯具。","basis":"《仓库防火安全管理规则》关于堆垛与照明灯距离的规定；实际仓库还应符合现行建筑消防和电气标准。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：具体条次建议最终定稿时据官方全文复核。"},{"id":"Q0721","type":"单选题","category":"消防安全","question":"《仓库防火安全管理规则》库房内堆放物品应满足五距要求，物品与墙之间的距离不小于（ ）。","options":["30 ㎝","50 ㎝","100 ㎝"],"answer":"B","explanation":"答案B（50cm）。堆垛与墙壁之间留出距离，有利于通风、检查、清点和消防处置；传统“五距”要求中垛与墙间距为0.5m。实际库房还应结合物品类别、货架布置及现行消防要求执行。","basis":"《仓库防火安全管理规则》关于堆垛与墙间距的规定。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：具体仓库还应核对现行强制性消防规范和仓储设计条件。"},{"id":"Q0722","type":"单选题","category":"消防安全","question":"《仓库防火安全管理规则》库房内堆放物品应满足五距要求，物品堆垛与梁、柱之间的距离 不小于（ ）。","options":["30 ㎝","50 ㎝","100 ㎝"],"answer":"A","explanation":"答案A（30cm）。传统仓库“五距”要求中，物品堆垛与梁、柱之间应保持不小于0.3m距离，以便检查、通风并减少热量积聚和火灾蔓延风险。","basis":"《仓库防火安全管理规则》关于堆垛与梁、柱间距的规定。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：题干与答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0723","type":"单选题","category":"消防安全","question":"《仓库防火安全管理规则》库房内堆放物品应满足五距要求，物品堆垛与堆垛之间的距离不 小于（ ）。","options":["30 ㎝","50 ㎝","100 ㎝"],"answer":"C","explanation":"答案C（100cm）。传统仓库“五距”要求中，堆垛之间应留出不小于1m间距，便于通行、检查和消防处置。实际通道宽度还须满足仓库面积、储存类别、消防设施和机械化作业需要。","basis":"《仓库防火安全管理规则》关于堆垛间距的规定。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：1m不能替代具体仓库消防通道、疏散通道的规范宽度要求。"},{"id":"Q0724","type":"单选题","category":"仓储与现场消防管理","question":"库房内因物品防冻必须采暖时， 应当采用水暖，其散热器、供暖管道与储存物品的距离不小 于（ ）。","options":["30 ㎝","50 ㎝","100 ㎝"],"answer":"A","explanation":"答案A（30cm）。库房因防冻确需采用水暖采暖时，散热器、供暖管道与储存物品应保持安全距离，避免热源直接烘烤可燃物或造成物品受热。具体还应考虑储存物品性质和温度控制要求。","basis":"《仓库防火安全管理规则》有关库房采暖及散热器、供暖管道与储存物品间距的规定。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；解析补充第4批：建议核对该规则官方全文及现行适用性；部分物品可能要求更大间距或禁止采暖。"},{"id":"Q0725","type":"单选题","category":"安全风险管控与隐患排查","question":"重大危险源根据其危险程度，分为一级、二级、三级和四级， ( )级为最高级别。","options":["一","三","四"],"answer":"A","explanation":"答案A（一级）。危险化学品重大危险源按危险程度分为一级、二级、三级和四级，一级为最高级别。分级须按辨识单元、危险化学品数量、校正系数及标准规定方法计算，不能仅凭储量直观判断。","basis":"《危险化学品重大危险源监督管理暂行规定》有关分级规定及附件；GB 18218—2018《危险化学品重大危险源辨识》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：该分级适用于危险化学品重大危险源，不应泛化为所有类型的重大危险源。"},{"id":"Q0726","type":"单选题","category":"安全生产法律法规与综合管理","question":"从安全生产的角度看，（ ）是指可能造成人员伤害、疾病、财产损失、作业环境破坏或其他 损失的根源或状态。","options":["危险","事故隐患","危险源"],"answer":"C","explanation":"答案C（危险源）。危险源是可能导致人员伤害、疾病、财产损失、工作环境破坏或其他损失的根源、状态或行为。危险源辨识用于识别其存在并确定其特性；危险源不等同于已经形成的事故隐患或事故。","basis":"GB/T 45001—2020《职业健康安全管理体系 要求及使用指南》有关危险源术语；安全生产风险管理相关标准。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干属于教材化概括表述，正式引用宜与现行风险管理标准术语统一。"},{"id":"Q0727","type":"单选题","category":"安全生产法律法规与综合管理","question":"（ ）泛指生产系统中可导致事故发生的人的不安全行为、物的不安全状态和管理上缺陷。","options":["危险","事故隐患","危险源"],"answer":"B","explanation":"答案B（事故隐患）。事故隐患通常指生产经营活动中违反安全生产法律法规、规章、标准、规程或管理制度，或者因其他因素导致的人的不安全行为、物的不安全状态、管理上的缺陷。危险源是可能导致伤害或损失的根源或状态；事故隐患强调现实存在、需要排查治理的问题。","basis":"《安全生产事故隐患排查治理暂行规定》第三条；《中华人民共和国安全生产法》第四十一条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；解析补充第4批：题干为事故隐患概括性定义，正式引用宜采用现行规定完整定义。"},{"id":"Q0728","type":"单选题","category":"安全生产法律法规","question":"《安全生产法》规定，国家对严重危及生产安全的工艺、设备实行（ ）制度。","options":["淘汰","检查","年检"],"answer":"A","explanation":"答案A（淘汰）。国家对严重危及生产安全的工艺、设备实行淘汰制度。淘汰的目的在于从源头消除已被证明风险过高、无法通过一般管理措施有效控制的工艺和设备，防止继续使用造成事故。生产经营单位不得使用国家明令淘汰、禁止使用的危及生产安全的工艺、设备。","basis":"《中华人民共和国安全生产法》第三十八条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0729","type":"单选题","category":"安全风险管控与隐患排查","question":"（ ）对事故隐患或者安全生产违法行为，均有权向负有安全生产监督管理职责的部门报告或 者举报。","options":["单位领导和群众","安全管理人员和技术人员","任何单位或者个人"],"answer":"C","explanation":"答案C（任何单位或者个人）。安全生产监督管理需要社会监督。任何单位或者个人发现事故隐患或者安全生产违法行为，均有权向负有安全生产监督管理职责的部门报告或者举报；举报应尽量提供具体地点、事实和相关线索。","basis":"《中华人民共和国安全生产法》第七十四条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0730","type":"单选题","category":"安全风险管控与隐患排查","question":"事故隐患泛指生产中（ ）的人的不安全行为、物的不安全状态和管理上的缺陷。","options":["经过评估","可预见","存在"],"answer":"C","explanation":"答案C（存在）。事故隐患是生产经营活动中已经存在的人的不安全行为、物的不安全状态或管理上的缺陷，可能导致事故发生。排查治理应关注现场实际存在的问题，不能仅凭主观推测，也不能因尚未发生事故就忽略隐患。","basis":"《安全生产事故隐患排查治理暂行规定》第三条；《中华人民共和国安全生产法》第四十一条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0731","type":"单选题","category":"安全生产法律法规与综合管理","question":"安全管理中的本质化原则是指从一开始从本质上实现安全化，从( )消除事故发生的可能性。","options":["技术上","根本上","管理上"],"answer":"B","explanation":"答案B（根本上）。本质安全化强调从设计、工艺、设备和系统源头采取措施，使系统本身具备安全性，从根本上消除或降低事故发生的可能性。它不同于仅依靠人员注意、警示或事后补救。","basis":"安全管理理论中的本质安全化原则；具体工程措施应依据适用的设备、工艺和安全技术标准。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0732","type":"单选题","category":"安全生产法律法规与综合管理","question":"安全生产管理的目标是减少、控制危害和事故， 尽量避免生产过程中由于( )所造成的人身伤 害、财产损失及其他损失。","options":["事故","管理不善","危险源"],"answer":"A","explanation":"答案A（事故）。安全生产管理通过风险辨识、隐患治理、工程控制、教育培训和应急准备，减少或控制危害和事故，尽量避免事故造成的人身伤害、财产损失及其他损失。题干考查的是事故作为损失发生的直接事件载体。","basis":"《中华人民共和国安全生产法》第四条及第二十一条关于安全生产管理职责的规定。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0733","type":"单选题","category":"安全生产法律法规与综合管理","question":"下面( )是海因里希事故连锁理论事故发生过程中的五个部分。","options":["管理缺陷；环境缺陷；人的不安全行为和物的不安全状态；事故；伤害","基本原因；间接原因；人的不安全行为和物的不安全状态；事故；损失","遗传及社会环境；人的缺点；人的不安全行为和物的不安全状态；事故；伤害"],"answer":"C","explanation":"答案C。海因里希事故连锁理论通常将事故链概括为遗传及社会环境、人的缺点、人的不安全行为和物的不安全状态、事故、伤害五个环节。该理论强调事故并非孤立发生，前序因素可能逐步导致事故和伤害；现代安全管理还应结合系统性风险分析，不宜将事故简单归因于个人。","basis":"海因里希事故连锁理论，属于安全管理理论。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：理论模型来源于传统事故致因理论，应用时应结合现代系统安全观点。"},{"id":"Q0734","type":"单选题","category":"安全风险管控与隐患排查","question":"安全检查表是事先对系统加以剖析， 列出各层次的（ ），确定检查项目，并把检查项目按系 统的组成顺序编织成表，以便进行检查。","options":["组成部分","要点","不安全因素"],"answer":"C","explanation":"答案C（不安全因素）。安全检查表法是在检查前对系统进行分析，识别可能导致事故的危险因素或不安全因素，再按系统组成、部位和检查顺序编制清单。检查人员按表逐项核查，可减少漏项并提高检查的系统性。","basis":"安全评价与安全检查表方法，属于安全管理技术方法。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0735","type":"单选题","category":"仓储与现场消防管理","question":"员工集体宿舍不得与车间、商店、仓库在同一座建筑物内，并应当与其保持一定距离的主要 目的，是为了保障单位员工的（ ）。","options":["生命财产安全","隐私权","财产安全"],"answer":"A","explanation":"答案A（生命财产安全）。员工集体宿舍与车间、商店、仓库分开设置并保持安全距离，主要是为了降低生产、经营、储存场所发生火灾、爆炸等事故时对住宿人员的威胁，保障人员生命和财产安全。","basis":"《中华人民共和国消防法》第十九条；《建筑防火通用规范》GB 55037—2022相关防火分隔及人员住宿场所要求。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：具体是否允许设置及安全距离，应按建筑用途、危险类别和现行强制性规范核定。"},{"id":"Q0736","type":"单选题","category":"安全风险管控与隐患排查","question":"生产经营单位应当高度关注危险源变化后的风险状况，出现下列（ ）情形时，不用及时调 整风险登记和控制措施。","options":["物料、作业条件、生产工艺流程或关键设备设施没有发生变化","新建、改建、扩建项目建设","检维修、试生产、试运行"],"answer":"A","explanation":"答案A。题干问“不用及时调整风险登记和控制措施”的情形。物料、作业条件、生产工艺流程或关键设备设施没有发生变化，通常不构成因变化而触发重新评估的情形；新建、改建、扩建项目，以及检维修、试生产、试运行等情形会带来新的风险，应及时开展辨识评估并调整管控措施。","basis":"《中华人民共和国安全生产法》第四十一条；风险分级管控相关制度要求。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：选项A中的“没有发生变化”是本题关键；单位仍应按制度定期复核风险。"},{"id":"Q0737","type":"单选题","category":"消防安全","question":"灭火器上的压力表用红、黄、绿三色表示灭火器的压力情况，当指针指在绿色区域表示（ ）。","options":["压力正常，可以正常使用","压力小，不能喷出，已经失效","压力过大，可以喷出，但有爆破爆炸危险"],"answer":"A","explanation":"答案A（压力正常，可以正常使用）。灭火器压力表通常以绿色区域表示压力处于正常范围，红色区域一般表示压力不足，黄色区域一般表示压力偏高。压力表颜色只是日常检查提示，仍须检查铅封、保险销、筒体、喷管、有效期及维修标识。","basis":"灭火器产品标准及维护管理要求；GB 50444—2008《建筑灭火器配置验收及检查规范》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：不同型号压力表应以产品标识和制造商说明为准。"},{"id":"Q0738","type":"单选题","category":"消防安全","question":"灭火有三种基本的方法，包括冷却法、窒息法和（ ）。","options":["隔离法","吹风法","冲击法"],"answer":"A","explanation":"答案A（隔离法）。灭火基本方法包括冷却、窒息、隔离和化学抑制。隔离法是将可燃物与火源或助燃条件分开，例如关闭燃气阀门、移走未燃烧的可燃物；它与冷却、窒息和抑制共同构成常见灭火原理。","basis":"GB 50140—2005《建筑灭火器配置设计规范》及消防灭火原理通用知识。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0739","type":"单选题","category":"消防安全","question":"发生火灾后，如何正确报火警（ ）","options":["讲清着火单位、详细地址、着火物质及火势大小","讲清着火单位、详细地址、着火物质及火势大小，是否有人被困，留下报 警人姓名及联系式","告知着火方位后迅速挂断电话，返回火场"],"answer":"B","explanation":"答案B。报警时应讲清着火单位和详细地址、着火物质、火势大小、是否有人被困，并留下报警人姓名和可联系的电话。报警后应保持电话畅通，必要时安排人员到安全地点引导消防救援力量；不能只报方位后挂断，也不能为补充信息而延误报警。","basis":"《中华人民共和国消防法》第四十四条关于任何人发现火灾应立即报警的规定。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0740","type":"单选题","category":"消防安全","question":"（ ）燃烧的火灾不能用水扑灭。","options":["木制品","电气装置","玻璃钢制品"],"answer":"B","explanation":"答案B（电气装置）。电气装置带电时用水灭火可能造成触电、短路和电弧危险。应优先在确保安全的前提下切断电源，再根据火灾类型和设备情况选择适用灭火器材；未确认断电前，不得使用不适用于带电设备的水基灭火剂。","basis":"GB 50140—2005《建筑灭火器配置设计规范》有关带电火灾灭火器选择要求。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0741","type":"单选题","category":"消防安全","question":"发生火灾时，以下哪种物质可以用来灭火。 ( )","options":["油性漆","水性漆","氮气"],"answer":"C","explanation":"答案C（氮气）。氮气属于惰性气体，可在适用的封闭或受控灭火系统中通过降低氧浓度发挥窒息灭火作用。油性漆、水性漆均不是灭火介质。需要注意，氮气灭火可能造成缺氧窒息，不能在有人区域随意释放，使用气体灭火系统必须按设计、警报、撤离和防护程序执行。","basis":"气体灭火系统设计及安全使用要求；GB 50370—2005《气体灭火系统设计规范》。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：氮气不适用于无防护的开放空间随意灭火；本题按受控灭火介质原理解释。"},{"id":"Q0742","type":"单选题","category":"安全生产法律法规与综合管理","question":"下列属于困于火场正确的处理方法是（ ）。","options":["立即躺下，用纤维织物包佳身体在地上滚 乘电梯下楼 从楼梯跑下楼","将门关上，用毛毡将门底的空隙塞住，立即致电报警及走向近街的窗前呼 救 用毛巾堵住口鼻","将门、窗打开，立即致电报警 7、高层楼发生火灾后，不能（A）。"],"answer":"B","explanation":"答案B。火场被困时，应尽量关闭房门、用湿毛巾或织物封堵门缝，减少烟气进入，及时拨打火警电话并向外界发出求救信号。不要贸然开门进入浓烟区域，不乘坐普通电梯，也不要在没有可靠条件时自行攀爬或跳楼。","basis":"《中华人民共和国消防法》第四十四条；消防应急疏散与自救常识。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及选项文字疑似排版错乱，选项A、C含多项内容混杂，建议回查原始题目；本批保留答案B。"},{"id":"Q0743","type":"单选题","category":"电气安全管理","question":"人身触电的危险程度与（ ）直接有关。","options":["电压大小","温度高低","通过人体的电流值"],"answer":"C","explanation":"答案C（通过人体的电流值）。触电危险程度与通过人体的电流大小、持续时间、电流路径、频率及人体状况等因素有关。电压会影响电流大小，但决定人体生理反应的重要直接因素是通过人体的电流及其持续时间。","basis":"GB/T 13870.1《电流对人和家畜的效应 第1部分：通用部分》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题目用“直接有关”简化了影响因素；触电风险不能只用单一电流数值判断。"},{"id":"Q0744","type":"单选题","category":"消防安全","question":"金属钠着火可以用哪种方法灭火。（ ）","options":["用干砂覆盖着火的金属钠","用泡沫灭火器喷向金属钠","用二氧化碳灭火器喷向金属钠"],"answer":"A","explanation":"答案A（用干砂覆盖）。金属钠遇水会剧烈反应并可能产生氢气、放热，使用水或含水泡沫可能加剧燃烧甚至引发爆炸。金属钠火灾应使用适用于该类金属火灾的专用干粉或干燥惰性覆盖材料，按现场化学品SDS和应急预案处置。","basis":"金属火灾灭火剂选择应依据GB 50140—2005及涉事金属钠的安全技术说明书（SDS）。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题目选项A为传统应急知识答案；实际处置应优先使用适用的D类金属火灾专用灭火剂，干砂是否适用需依据钠的状态、数量和现场规程确认。"},{"id":"Q0745","type":"单选题","category":"消防安全","question":"下列（ ）是扑救精密仪器火灾的最佳选择。","options":["二氧化碳灭火器","干粉灭火器","泡沫灭火器"],"answer":"A","explanation":"答案A（二氧化碳灭火器）。精密仪器火灾通常希望减少灭火剂残留和二次污染。二氧化碳灭火后一般不留下固体粉末或泡沫残留，适用于符合其灭火适用范围的电气设备和精密仪器火灾。但应注意二氧化碳可能造成窒息和低温冻伤，且对深位阴燃火灾的效果有限。","basis":"GB 50140—2005《建筑灭火器配置设计规范》有关灭火器适用范围。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0746","type":"单选题","category":"消防安全","question":"干粉灭火剂的主要灭火作用是（ ）。","options":["窒息作用","化学抑制作用","冷却作用"],"answer":"B","explanation":"答案B（化学抑制作用）。干粉灭火剂主要通过抑制燃烧链式反应发挥灭火作用，同时具有一定的窒息和冷却作用。不同干粉类型适用火灾类别不同，不能将普通ABC干粉用于金属火灾，金属火灾需采用专用D类灭火剂。","basis":"GB 50140—2005《建筑灭火器配置设计规范》及干粉灭火器产品标准。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0747","type":"单选题","category":"电气安全管理","question":"发生人身触电事故，在进行救护时，首先应采取的措施是（ ）。","options":["立即检查触电者是否还有心跳呼吸，如没有立即进行心肺复苏","立即断开电源使触电者与带电部份脱离","立即拨打 120 呼叫救护车"],"answer":"B","explanation":"答案B（立即断开电源使触电者与带电部分脱离）。救护触电者的首要步骤是确保施救者安全并尽快切断电源或采用绝缘方法使其脱离电源，防止持续电流伤害。确认脱离电源后，再评估意识和呼吸，必要时立即进行心肺复苏并呼叫急救。不能在未断电时直接徒手接触触电者。","basis":"触电急救基本原则；电力安全工作规程及急救规范。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0748","type":"单选题","category":"应急管理与救援","question":"由于电击、窒息或其他原因所致心搏骤停时，应使用（ ）进行急救。","options":["口对口人工呼吸法","胸外心脏挤压法","口对鼻人工呼吸法"],"answer":"B","explanation":"题库答案B（胸外心脏挤压法），但表述不完整。心搏骤停的现场急救应立即呼叫急救、尽快开始高质量心肺复苏，胸外按压与人工呼吸按施救者能力和规范配合进行，并尽早使用AED。仅做胸外按压或仅做人工呼吸均不能概括所有情形。","basis":"现行心肺复苏指南及急救规范；《中国心肺复苏专家共识》相关要求。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干选项只列单一方法，未体现现代心肺复苏的按压、通气和AED综合流程；保留题库答案。"},{"id":"Q0749","type":"单选题","category":"消防安全","question":"重点消防单位至少（ ）进行一次灭火和应急疏散演练。","options":["每半年","每一年","至少每两年"],"answer":"A","explanation":"答案A（每半年）。消防安全重点单位应按照消防法规和本单位灭火、应急疏散预案，定期组织演练。现行《机关、团体、企业、事业单位消防安全管理规定》要求消防安全重点单位至少每半年进行一次演练，并结合实际不断完善预案。","basis":"《机关、团体、企业、事业单位消防安全管理规定》第四十条。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0750","type":"单选题","category":"自然灾害防范","question":"台风预警共分为 4 级，下列哪一种颜色的等级最高？（ ）","options":["黄色","蓝色","红色"],"answer":"C","explanation":"答案C（红色）。台风预警信号的最高等级为红色，表示台风影响特别严重或达到最高级别预警条件。预警信号等级和发布标准由气象主管部门规定，收到预警后应按属地防御指引采取停工、避险、加固和人员转移等措施。","basis":"《气象灾害预警信号发布与传播办法》及国家气象部门台风预警信号标准。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：台风预警信号颜色体系应按所在地区现行规定；部分地区信号种类、颜色设置曾有调整。"},{"id":"Q0751","type":"单选题","category":"应急管理与救援","question":"制定应急预案的目的是抑制( )，减少对人员、财产和环境的危害。","options":["突发事件","火灾爆炸事件","中毒事件"],"answer":"A","explanation":"答案A（突发事件）。应急预案用于明确突发事件发生前的准备、发生时的响应和处置、发生后的恢复等安排，以降低事件发生概率、控制事态发展并减少对人员、财产和环境的危害。严格说，应急预案主要是为应对突发事件提供行动依据，并非保证能够“抑制”所有突发事件。","basis":"《中华人民共和国突发事件应对法》；《生产安全事故应急条例》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干“抑制突发事件”措辞不够准确，应理解为预防、控制突发事件及减轻后果；本批不改原题。"},{"id":"Q0752","type":"单选题","category":"应急管理与救援","question":"依据《安全生产法》，生产经营单位( )应组织制定并实施本单位的生产安全事故应急救援预 案。","options":["安全管理人员","消防队人员","主要负责人"],"answer":"C","explanation":"答案C（主要负责人）。生产经营单位主要负责人依法组织制定并实施本单位生产安全事故应急救援预案，并对本单位安全生产工作全面负责。安全管理人员、消防队员可以参与预案编制、培训和演练，但不能替代主要负责人承担该项法定组织职责。","basis":"《中华人民共和国安全生产法》第二十一条第（六）项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0753","type":"单选题","category":"安全生产法律法规与综合管理","question":"安全现状综合评价是针对一个生产经营单位总体或局部的生产经营活动安全现状进行的（ ）。","options":["专项评价","特殊评价","全面评价"],"answer":"C","explanation":"答案C（全面评价）。安全现状综合评价针对生产经营单位总体或局部生产经营活动当前安全状况进行系统分析，综合考虑危险有害因素、管理措施、设备设施及事故风险，形成整体性评价结论和改进建议。它与只针对某一专项或特殊事项的评价不同。","basis":"安全评价相关标准及安全评价通用方法。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：属于安全评价概念题；具体评价范围和方法应根据评价目的及适用法规确定。"},{"id":"Q0754","type":"单选题","category":"应急管理与救援","question":"生产经营单位对（ ）应当登记建档，定期检测、评估、监控， 并制定应急预案，告知从业人 员和相关人员应当采取紧急措施。","options":["事故频发场所","重大事故隐患","重大危险源"],"answer":"C","explanation":"答案C（重大危险源）。重大危险源应按规定辨识、登记建档，定期检测、评估和监控，并制定应急预案或现场处置措施，告知从业人员和相关人员在紧急情况下应采取的措施。事故频发场所和重大事故隐患也需要管理，但题干所列“登记建档、定期检测评估监控”对应重大危险源管理。","basis":"《中华人民共和国安全生产法》第四十条；《危险化学品重大危险源监督管理暂行规定》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0755","type":"单选题","category":"应急管理与救援","question":"应急管理是对重大事故的全过程管理， 贯穿于事故发生前、中、后的动态过程，下列有关重 大事故应急管理的说法中，错误的是( )。","options":["应急响应是在事故发生后立即采取的应急救援行动","应急准备是针对可能发生的事故，为迅速有效地开展应急行动而预先所做的各种准备工作","恢复工作应在事故发生后立即进行"],"answer":"C","explanation":"答案C。恢复工作并非事故发生后立即开展的首要工作。事故应急管理通常包括预防、准备、响应和恢复等阶段；事故发生后首先要开展应急响应和救援，控制危险源、抢救人员、保护现场。待事故得到控制、危险消除并经评估后，才逐步开展恢复重建。","basis":"《生产安全事故应急条例》及生产安全事故应急预案管理相关规定。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0756","type":"单选题","category":"应急管理与救援","question":"安全生产事故综合应急预案包括下列内容（ ）","options":["总则、应急组织机构及职责、应急响应、后期处置、应急保障","总则、适用范围、应急响应、后期处置、应急保障","总则、应急组织机构及职责、应急工作职责、后期处置、应急保障"],"answer":"A","explanation":"答案A。综合应急预案通常从总体上规定事故应急工作的组织指挥体系、响应机制、主要任务和保障措施，内容包括总则、应急组织机构及职责、应急响应、后期处置和应急保障等。具体章节名称应与现行应急预案编制导则及单位实际相适应。","basis":"GB/T 29639—2020《生产经营单位生产安全事故应急预案编制导则》。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干采用概括性章节列举，实际预案结构应按现行导则和单位风险特点编制。"},{"id":"Q0757","type":"单选题","category":"应急管理与救援","question":"安全生产事故专项应急预案包括下列内容（ ）","options":["总则、应急组织机构及职责、响应启动、处置措施、应急保障","适用范围、应急组织机构及职责、响应启动、处置措施、应急保障","适用范围、应急组织机构及职责、应急工作职责、处置措施、应急保障"],"answer":"B","explanation":"答案B。专项应急预案针对某一种或多种事故风险，重点明确适用范围、应急组织机构及职责、响应启动、处置措施和应急保障等内容。专项预案应与综合预案衔接，并与现场处置方案相互配套。","basis":"GB/T 29639—2020《生产经营单位生产安全事故应急预案编制导则》。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0758","type":"单选题","category":"应急管理与救援","question":"安全生产事故现场处置方案包括下列内容（ ）","options":["适用范围、应急工作职责、应急处置、注意事项","事故风险描述、应急工作职责、应急响应、应急处置","事故风险描述、应急工作职责、应急处置、注意事项"],"answer":"C","explanation":"答案C。现场处置方案针对具体场所、装置或设施，主要明确事故风险描述、应急工作职责、应急处置措施和注意事项。它强调现场人员能够在事故初期迅速采取具体行动，内容应简明、可操作，并与综合、专项应急预案衔接。","basis":"GB/T 29639—2020《生产经营单位生产安全事故应急预案编制导则》。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0759","type":"单选题","category":"应急管理与救援","question":"生产经营单位应急预案编制程序步骤正确的是","options":["成立应急预案编制工作组、资料收集、风险评估、应急资源调查、应急预案编制、桌面推演、 应急预案评审和批准实施 8 个步骤","成立应急预案编制工作组、资料收集、桌面推演、风险评估、应急资源调查、应急预案编制、 应急预案评审和批准实施 8 个步骤","成立应急预案编制工作组、资料收集、应急资源调查、风险评估、应急预案编制、应急预案 评审、桌面推演和批准实施 8 个步骤"],"answer":"A","explanation":"答案A（按题库答案）。应急预案编制通常先成立工作组、收集资料，再开展风险评估和应急资源调查，形成预案文本，组织桌面推演或其他检验，最后评审、批准并实施。风险评估与资源调查的先后在实际编制中可根据工作安排交叉推进，但二者均应在预案成稿前完成。","basis":"GB/T 29639—2020《生产经营单位生产安全事故应急预案编制导则》及《生产安全事故应急预案管理办法》。","source":"综合题库3.docx","status":"来源已补录；题干答案沿用原文，专业准确性未复核；剩余解析补充：题干将编制步骤固定为八步，属于概括流程；具体程序应结合现行预案管理规定执行。"},{"id":"Q0760","type":"单选题","category":"安全生产法律法规","question":"企业开展安全生产标准化工作的核心要素包括（ ）","options":["目标职责、制度化管理、教育培目标职责、制度化管理、教育培训、现场管理、安全风险管控及隐患排查治理、应急管理、事故管理、持续改进训、现场管理、安全风险管控及隐患排查治理、应急管理、事故管理、持续改进","目标职责、制度化管理、现场管理、安全风险管控及隐患排查治理、应急管理、应急处置、事故管理、持续改进","目标职责、制度化管理、教育培训、安全风险管控、隐患排查治理、应急管理、事故管理、持 续改进"],"answer":"A","explanation":"答案A（按题库答案）。安全生产标准化围绕目标职责、制度化管理、教育培训、现场管理、安全风险管控及隐患排查治理、应急管理、事故管理和持续改进等要素建立运行体系。选项A完整涵盖这些核心要素；选项B、C存在要素缺失或表述不完整。","basis":"《企业安全生产标准化基本规范》GB/T 33000—2016。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干选项A存在明显文本粘连和重复：“教育培目标职责……教育培训”应回查原始选项；本批不修改原文。"},{"id":"Q0761","type":"单选题","category":"安全生产法律法规与综合管理","question":"造成 3 人以下死亡，或者 10 人以下重伤，或者 1000 万元以下直接经济损失的事故是( )。","options":["一般事故","较大事故","重大事故"],"answer":"A","explanation":"答案A（一般事故）。生产安全事故按死亡人数、重伤人数或直接经济损失划分等级。一般事故是造成3人以下死亡、10人以下重伤，或者1000万元以下直接经济损失的事故；三项指标中任一项达到相应等级标准即可认定。","basis":"《生产安全事故报告和调查处理条例》第三条第（四）项。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0762","type":"单选题","category":"安全生产法律法规与综合管理","question":"造成 3 人以上 10 人以下死亡，或者 10 人以上 50 人以下重伤，或者 1000 万元以上 5000 万元 以下直接经济损失的事故是( )。","options":["特别重大事故","重大事故","较大事故"],"answer":"C","explanation":"答案C（较大事故）。较大事故的标准为造成3人以上10人以下死亡，或者10人以上50人以下重伤，或者1000万元以上5000万元以下直接经济损失。事故等级按死亡、重伤、直接经济损失三项指标中达到的较高等级确定。","basis":"《生产安全事故报告和调查处理条例》第三条第（三）项。","source":"综合题库3.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0763","type":"单选题","category":"安全生产法律法规与综合管理","question":"造成 30 人以上死亡，或者 100 人以上重伤，或者 1 亿元以上直接经济损失的事故是( )。","options":["特别重大事故","重大事故","较大事故"],"answer":"A","explanation":"答案A（特别重大事故）。造成30人以上死亡、100人以上重伤或者1亿元以上直接经济损失的，属于特别重大事故。三项指标是并列判断条件，任一项达到特别重大事故标准即可。","basis":"《生产安全事故报告和调查处理条例》第三条第（一）项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0764","type":"单选题","category":"安全生产法律法规","question":"安全生产法规定，生产经营单位发生重大事故的，处（ ）罚款。","options":["200 万元以上 1000 万以下","200 万元以上 500 万以下","100 万元以上 1000 万以下"],"answer":"A","explanation":"答案A（200万元以上1000万元以下）。现行《安全生产法》对发生重大事故的生产经营单位规定罚款幅度为200万元以上1000万元以下；事故等级应按《生产安全事故报告和调查处理条例》认定。具体处罚还应结合事故性质、责任主体及法律规定执行。","basis":"《中华人民共和国安全生产法》第一百一十四条第一款第（三）项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0765","type":"单选题","category":"安全生产法律法规","question":"安全生产法规定，生产经营单位发生特别重大事故的，处（ ）罚款。","options":["500 万元以上 1000 万以下","500 万元以上 2000 万以下","1000 万元以上 2000 万以下"],"answer":"C","explanation":"答案C（1000万元以上2000万元以下）。现行《安全生产法》对发生特别重大事故的生产经营单位规定罚款1000万元以上2000万元以下。题干考查的是单位发生特别重大事故后的行政罚款幅度，不是对直接责任人员的个人处罚。","basis":"《中华人民共和国安全生产法》第一百一十四条第一款第（四）项。","source":"综合题库3.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0766","type":"单选题","category":"消防安全","question":"以下几种逃生方法中，(   )是不正确的。","options":["用湿毛巾捂着嘴巴和鼻子","弯着身子快速跑到安全地点","躲在床底下，等待消防人员救援","向木质家具及门窗泼水防止火势蔓延"],"answer":"C","explanation":"答案C（躲在床底下等待救援）。火灾时躲在床底下容易被烟气、高温和火势困住，也不利于消防救援人员发现。应根据火势和烟气情况选择安全通道撤离；若通道被烟火封堵，应关闭房门、封堵缝隙、报警并在可被发现的安全位置等待救援。","basis":"《中华人民共和国消防法》第四十四条；消防应急疏散与自救常识。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0767","type":"单选题","category":"消防安全","question":"大型活动现场发生突发事件，需要紧急疏散时在场人员要(   )。","options":["按顺序迅速撤离现场","争先恐后逃跑","围观看热闹","边跑边喊叫"],"answer":"A","explanation":"答案A（按顺序迅速撤离现场）。大型活动发生突发事件需要疏散时，应听从现场指挥，按疏散指示和工作人员引导有序撤离，避免逆行、推挤、围观和大声惊叫造成踩踏。撤离时应保持通道畅通，照顾行动不便人员。","basis":"大型群众性活动安全管理及人员密集场所疏散管理要求。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0768","type":"单选题","category":"消防安全","question":"楼失火时，当通道被火封住，欲逃无路时，可靠近窗户或（  ）呼救，同时关紧门窗，用湿手巾、湿布堵塞门缝，用水淋透房门，防止烟火侵入。","options":["阳台","房间","卫生间","房门"],"answer":"A","explanation":"答案A（阳台）。当房门外有火或烟、通道无法安全通行时，应尽量留在相对安全的房间，关闭房门、封堵门缝并向消防部门报警，可到阳台或靠近外窗的安全位置发出求救信号。不得贸然跳楼；是否转移应根据火势、楼层和救援条件判断。","basis":"消防应急疏散与自救常识；《中华人民共和国消防法》第四十四条。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干“楼失火”疑为“楼房失火”或“楼道失火”，建议核对原文，本批不修改。"},{"id":"Q0769","type":"单选题","category":"消防安全","question":"火灾中对人员威胁最大的是(   )，因此，首先应该做好防护再逃生。","options":["火","烟气","可燃物","温度"],"answer":"B","explanation":"答案B（烟气）。火灾烟气含有高温气体、颗粒物及一氧化碳等有毒成分，能迅速降低能见度并造成中毒、窒息，是火场人员伤亡的重要危险因素。逃生时应尽量避开烟气，低姿前进并使用湿毛巾等简易防护，但简易防护不能替代专业呼吸防护。","basis":"消防火灾烟气危害及人员疏散基本知识。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0770","type":"单选题","category":"消防安全","question":"火灾使人致命的最主要的原因是（   ）。","options":["被人践踏","窒息","烧伤","烫伤"],"answer":"B","explanation":"答案B（窒息）。火灾致死的重要原因包括烟气中毒和缺氧窒息，尤其是一氧化碳等有毒气体以及高温烟气造成的呼吸道损伤。烧伤也可能致命，但在建筑火灾中烟气相关伤害是主要致死因素之一。","basis":"消防火灾烟气危害及火灾调查、医学救治相关知识。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题目将主要原因简化为“窒息”，更严谨应同时说明烟气中毒和缺氧。"},{"id":"Q0771","type":"单选题","category":"消防安全","question":"下列(   )是扑救精密仪器火灾的最佳选择。","options":["二氧化碳灭火器","干粉灭火器","泡沫灭火器","水"],"answer":"A","explanation":"答案A（二氧化碳灭火器）。二氧化碳灭火剂不留下粉末或泡沫残留，适用于符合其适用范围的精密仪器和电气设备火灾，可减少设备污染。但使用时要防止低温冻伤和密闭空间缺氧；对深位阴燃火灾可能复燃，应持续观察。","basis":"GB 50140—2005《建筑灭火器配置设计规范》。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0772","type":"单选题","category":"消防安全","question":"使用然气灶具时，(   )。","options":["应先开气阀后点火，即“气等火”","应先点火后再开气，即“火等气”","先点火还是先开气阀都无所谓，二者都是正确的","手动点火"],"answer":"B","explanation":"答案B（先点火后开气，即“火等气”）。使用燃气灶具时，应按灶具设计和使用说明先形成点火火源，再开启燃气，避免燃气先大量释放后遇火造成爆燃。现代灶具应按产品说明操作；若点火失败，应关闭燃气、通风并等待残余燃气散尽后再重新点火。","basis":"燃气器具产品安全标准及制造商使用说明；《城镇燃气管理条例》有关安全使用义务。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干选项D“手动点火”表述不完整，无法作为完整操作顺序；按选项B判定。"},{"id":"Q0773","type":"单选题","category":"消防安全","question":"用灭火器灭火时，灭火器的喷射口应该对准火焰的(   )。","options":["上部","中部","根部","火苗的外围"],"answer":"C","explanation":"答案C（根部）。使用灭火器时，喷射口通常应对准燃烧物根部或火焰根部，采用扫射方式覆盖燃烧区域，使灭火剂作用于燃烧物。不同灭火器操作方式略有差异，应遵照筒体操作说明，保持安全距离并选择上风或侧上风位置。","basis":"GB 50140—2005《建筑灭火器配置设计规范》及灭火器产品使用说明。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0774","type":"单选题","category":"消防安全","question":"如果电器着火，哪一种灭火器不能用（ ）","options":["干粉ABC","1211","二氧化碳","泡沫灭火器。"],"answer":"D","explanation":"答案D（泡沫灭火器）。传统泡沫灭火器含水，通常不适用于未断电的电气火灾，可能导致触电或设备短路。电气设备起火应先在确保安全的情况下切断电源，再选用适用于相应火灾类别的灭火器材。","basis":"GB 50140—2005《建筑灭火器配置设计规范》有关带电火灾灭火器选择要求。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0775","type":"单选题","category":"消防安全","question":"灭火器的压力表指针指在（ ）位置时，压力为正常 ？","options":["红区","黄区","绿区","蓝区"],"answer":"C","explanation":"答案C（绿区）。压力表指针处于绿色区域通常表示灭火器内部压力处于正常工作范围。若指针进入红区或超出正常范围，应按维护要求检查、维修或更换；还应检查灭火器有效期、铅封、喷管和筒体状态。","basis":"GB 50444—2008《建筑灭火器配置验收及检查规范》及灭火器产品标准。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0776","type":"单选题","category":"消防安全","question":"所居住的高层建筑发生火灾时，可通过 （ ）方法逃生？","options":["乘坐电梯","向楼顶奔跑","从窗口跳出","从安全通道有秩序下楼。"],"answer":"D","explanation":"答案D（从安全通道有秩序下楼）。高层建筑发生火灾时，应根据火势和疏散指示，优先使用安全疏散楼梯有序撤离，不能乘坐普通电梯，也不能轻易跳楼。若楼梯间已被烟火封堵，应退回相对安全区域，关闭房门、报警并等待救援。","basis":"《建筑防火通用规范》GB 55037—2022有关安全疏散要求；《中华人民共和国消防法》第四十四条。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0777","type":"单选题","category":"消防安全","question":"带电物体火灾时，不能选用下列哪种灭火器（ ）","options":["二氧化碳灭火器","清水泡沫灭火器","干粉灭火器","1211灭火器。"],"answer":"B","explanation":"答案B（清水泡沫灭火器）。带电物体火灾在未确认断电前，不应使用导电性灭火剂。清水泡沫灭火器含水，可能造成触电危险；应优先切断电源并选择适用的二氧化碳或干粉灭火器，具体取决于电压、设备和火灾类别。","basis":"GB 50140—2005《建筑灭火器配置设计规范》有关带电火灾灭火器选择要求。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0778","type":"单选题","category":"动火及特殊作业安全","question":"凡是在易燃易爆场所的动火必须办理（ ）。","options":["相关手续","许可证","特级动火证","动火证"],"answer":"D","explanation":"答案D（动火证）。易燃易爆场所动火属于高风险特殊作业，应履行作业审批，办理相应动火安全作业票，进行风险辨识、气体分析、清理可燃物、隔离、监护和应急准备。动火等级及票证名称按适用行业标准和企业制度确定，并非所有动火都一律办理“特级动火证”。","basis":"GB 30871—2022《危险化学品企业特殊作业安全规范》第5章。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：该标准适用范围限于危险化学品企业及化工、医药企业；其他行业按适用规定执行。"},{"id":"Q0779","type":"单选题","category":"应急管理与救援","question":"以下对报警电话描述不正确的是(   )。","options":["119报警电话是免费的","发生火灾时任何人都可以无偿拨打119","为了演练，平时可以拨打119","以上都正确"],"answer":"C","explanation":"答案C。119是火灾报警电话，可免费拨打；发生火灾时任何单位和个人均应及时报警。不能为演练、测试或咨询而随意占用119线路，以免影响真实火灾报警和救援调度。演练应通过单位内部演练程序或与有关部门协调安排。","basis":"《中华人民共和国消防法》第四十四条。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0780","type":"单选题","category":"消防安全","question":"对加工爆炸危险物品车间的厂房房顶描述正确的是(   )。","options":["为泄爆，安装轻质房顶","为坚固，应采用重型房顶","为了泄爆，应采用重型与轻型相结合的房顶","以上都不对"],"answer":"A","explanation":"答案A（轻质房顶）。有爆炸危险的厂房应根据爆炸危险性采取泄压、抗爆和合理布置等措施。轻质屋面或泄压构件可在爆炸发生时按设计方向泄压，降低主体结构承受的爆炸压力；具体泄压面积、构造和泄压方向必须由专业设计确定，不能仅靠更换轻质屋顶代替整体防爆设计。","basis":"《建筑设计防火规范》GB 50016—2014（2018年版）有关有爆炸危险厂房泄压设计要求；《建筑防火通用规范》GB 55037—2022。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干为概括性旧题，现行工程应按强制性通用规范及专业防爆设计要求核定。"},{"id":"Q0781","type":"单选题","category":"消防安全","question":"身上着火后，下列哪种灭火方法是错误的(   )。","options":["就地打滚","用厚重衣物覆盖压灭火苗","迎风快跑","跳入水中"],"answer":"C","explanation":"答案C（迎风快跑）。身上衣物着火后奔跑会增加空气流动，使火焰燃烧更旺，也可能将火带到其他区域。应立即停止奔跑，就地卧倒打滚，或用厚重且不易燃的衣物覆盖压灭火焰；如有安全条件可利用水灭火。","basis":"消防应急自救常识。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0782","type":"单选题","category":"消防安全","question":"(   )必须分间、分库储存。","options":["灭火方法相同的物品","容易相互发生化学反应的物品","理化性质相同的物质","以上都正确"],"answer":"B","explanation":"答案B（容易相互发生化学反应的物品）。性质相互抵触、容易发生化学反应或灭火方法不同的危险物品，应按规定分区、分库或隔离储存，防止泄漏、混存后发生反应、燃烧或爆炸。不能仅以灭火方法相同或理化性质相似作为混存依据。","basis":"GB 15603—2022《危险化学品仓库储存通则》关于禁忌物料和分类储存的规定。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0783","type":"单选题","category":"仓储与现场消防管理","question":"架空线路的下方(   )堆放物品。","options":["可以","不可以","经批准后可以","以上都不正确"],"answer":"B","explanation":"答案B（不可以）。架空线路下方堆放物品可能影响线路安全距离、检修和应急处置，也可能因堆物过高触及带电线路，造成触电、短路或火灾。线路保护区及周边应保持规定安全距离，不得堆放影响安全的物品。","basis":"《电力设施保护条例》及配套实施细则关于架空电力线路保护区内禁止行为的规定。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：具体保护区宽度随电压等级而异，题目不宜理解为只要在“正下方”以外就可任意堆放。"},{"id":"Q0784","type":"单选题","category":"消防安全","question":"依据《仓库防火安全管理规则》，进入甲，乙类物品库区的人员，必须(   )，并交出携带的火种。","options":["检查身体","戴安全帽","登记","出示身份证"],"answer":"C","explanation":"答案C（登记）。进入甲、乙类物品库区的人员应按规定登记并交出携带的火种，防止火种进入危险品储存区域引发火灾爆炸。库区还应落实人员、车辆管理，禁止携带火种和使用不符合防爆要求的设备。","basis":"《仓库防火安全管理规则》有关甲、乙类物品库区人员出入管理规定。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干引用规则名称，具体执行还应核对仓库现行管理制度及危险化学品储存要求。"},{"id":"Q0785","type":"单选题","category":"消防安全","question":"依据《仓库防火安全管理规则》,库区以及周围(   )米内,不得燃放烟花爆竹。","options":["25","50","75","100"],"answer":"B","explanation":"答案B（50米）。按题干引用的《仓库防火安全管理规则》传统规定，库区及其周围一定范围内禁止燃放烟花爆竹，题库答案为50m。实际仓库应根据储存物品火灾危险性、周边环境和地方规定执行更严格的禁火范围。","basis":"《仓库防火安全管理规则》有关库区禁火、禁放烟花爆竹规定。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：该题具体距离应以规则官方全文和当地现行规定复核；本批保留原答案。"},{"id":"Q0786","type":"单选题","category":"消防安全","question":"发现液化石油气灶上的导气管有裂纹，用 (   )。","options":["用燃着的打火机查找漏气地方","用着的火柴查找漏气地方","把肥皂水涂在裂纹处,起泡处就是漏气的","鼻子嗅的方法找漏气的地方应"],"answer":"C","explanation":"答案C（肥皂水）。液化石油气导气管有裂纹时，可在怀疑漏气处涂抹肥皂水，观察是否连续冒泡；严禁用打火机或火柴检漏，也不应仅靠嗅觉寻找漏点。发现泄漏应停止使用、关闭气源（确保安全时）、通风并联系专业人员维修或更换导气管。","basis":"《城镇燃气管理条例》有关燃气安全使用要求；燃气器具产品说明及燃气经营企业安全指引。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0787","type":"单选题","category":"消防安全","question":"据统计，火灾中死亡的人有80%以上属于(   )","options":["被火直接烧死","烟气窒息致死","跳楼或惊吓致死","被踩死"],"answer":"B","explanation":"题库答案B（烟气窒息致死）。火灾烟气可含一氧化碳等有毒气体，并伴随高温和缺氧，可能造成中毒、窒息和呼吸道损伤，是火灾人员伤亡的重要原因。题干“80%以上”属于统计性比例，受统计年份、地区、建筑类型和统计口径影响，不宜作为不带来源的恒定数据。","basis":"火灾烟气危害及火灾调查统计资料。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：重要提示：80%以上的具体比例需补充权威统计来源及时间范围；本批仅解释烟气危害，不将比例视为永久固定值。"},{"id":"Q0788","type":"单选题","category":"消防安全","question":"发现室外着火，触摸门把已发烫时，应(   )。","options":["迅速开门冲出去","用湿物垫在门把上开门撤离，以防烫伤","用湿物堵塞门缝，向门泼水降温，等待火势熄灭或消防队救援","立即从窗户跳出去逃生"],"answer":"C","explanation":"答案C。门把手发烫说明门外可能有高温火焰或烟气，贸然开门可能使火焰和烟气涌入。应关闭房门、用湿布等封堵门缝，视情况向门及周围适当降温，并立即报警、在安全位置呼救等待救援；不要盲目跳楼或冲出房间。","basis":"消防应急疏散与自救常识；《中华人民共和国消防法》第四十四条。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0789","type":"单选题","category":"消防安全","question":"事故火花是电器或线路故障时产生的火花，下列（   ）不是事故火花。","options":["雷电火花","静电火花","开关分合时产生有火花","发生短路时产生的火花"],"answer":"C","explanation":"题库答案C，但题目概念有疑点。开关分合时产生的火花通常属于正常操作火花或工作火花，若开关设备设计、选型和维护符合要求，不一定属于故障导致的“事故火花”；雷电、静电和短路产生的火花则可能成为异常点火源。题干将“事故火花”限定为电器或线路故障产生的火花，按此定义C为非事故火花。","basis":"电气防火与防爆安全技术基本知识；相关电气设备防爆标准。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：需核实教材对“事故火花”“工作火花”的定义；普通开关分合火花也可能在危险环境中成为点火源，不能据此认定安全。"},{"id":"Q0790","type":"单选题","category":"消防安全","question":"下列场所不属于公司消防重点部位的是（   ）","options":["空压机房","危险化学品库","油库","试验场"],"answer":"D","explanation":"答案D（试验场），但属于单位内部消防重点部位识别题。空压机房、危险化学品库和油库通常存在设备、电气或可燃危险物质风险，常被列为消防重点部位；试验场是否属于重点部位取决于具体试验内容、危险物质、设备和单位消防安全评估。","basis":"《中华人民共和国消防法》第十六条、第十七条；单位消防安全重点部位应结合火灾危险性确定。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：“公司”未明确具体单位和试验场用途，D不能作为跨单位通用结论；保留题库答案。"},{"id":"Q0791","type":"多选题","category":"消防安全","question":"高层楼上发生火灾时，我们不应该做（   ）。","options":["乘坐电梯","从楼梯逃生","跳楼","到窗户呼救"],"answer":"AC","explanation":"答案AC。高层建筑发生火灾时，不应乘坐普通电梯，也不应跳楼；电梯可能因断电、烟气侵入或消防控制而停运，跳楼通常会造成严重伤害。应优先按疏散指示使用安全楼梯；若通道被烟火封堵，应到相对安全位置关门、报警并向外呼救。","basis":"《建筑防火通用规范》GB 55037—2022有关安全疏散要求；消防应急自救常识。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：选项D“到窗户呼救”在无法安全撤离时可作为求救措施，并非通常应避免的行为；题库仅将A、C列为“不应该”，建议复核题目问法和答案完整性。"},{"id":"Q0792","type":"多选题","category":"消防安全","question":"发生火灾时可以使用(      )灭火方法灭火？","options":["隔离","窒息","冷却","化学抑制。"],"answer":"ABCD","explanation":"答案ABCD。常见灭火基本方法包括隔离、窒息、冷却和化学抑制：隔离可燃物，窒息降低氧浓度，冷却降低温度，化学抑制中断燃烧链式反应。应根据火灾类别、物质性质和现场条件选择适用方法。","basis":"GB 50140—2005《建筑灭火器配置设计规范》及消防灭火原理通用知识。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0793","type":"多选题","category":"消防安全","question":"报火警时，应注意以下（    ）。","options":["讲清着火的单位或地点","讲清火险所处的楼号、楼层","尽可能讲清着火物质","讲清报警人的姓名和电话"],"answer":"ABCD","explanation":"答案ABCD。报警时应准确说明着火单位或地点、楼号楼层、燃烧物质和火势情况，并提供报警人姓名及联系电话。若有人被困、危险化学品或爆炸风险等情况，也应一并说明。报警后保持电话畅通并在安全地点引导救援力量。","basis":"《中华人民共和国消防法》第四十四条。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0794","type":"多选题","category":"消防安全","question":"遭遇火险正确脱险方法有下面的（    ）。","options":["用湿毛巾掩住口鼻，从安全通道匍匐前进","披上浸湿的衣物，向安全出口方向逃生","用床单、衣服等自制简易救生绳从楼上小心滑下","身上着火，可就地打滚或用厚重的衣物压灭火苗"],"answer":"ABCD","explanation":"题库答案ABCD。用湿毛巾或衣物遮挡口鼻、低姿沿安全通道撤离，可减少吸入烟气；若衣物着火，应就地打滚或用厚重衣物压灭火焰。利用床单等自制绳索从高层滑下风险很高，只有在专业救援无法到达、确有安全锚固和操作条件且无其他出路的极端情况下才可能考虑，不应作为一般逃生建议。","basis":"消防应急疏散与自救常识；《中华人民共和国消防法》第四十四条。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：重要待核：选项C“自制简易救生绳从楼上滑下”具有较高坠落风险，不宜作为普遍推荐逃生方法；保留题库答案ABCD但明确风险。"},{"id":"Q0795","type":"多选题","category":"消防安全","question":"使用灭火器时，应注意以下（  ）。","options":["站在上风方向灭火","站在下风方向灭火","对准燃烧点根部喷射","对准燃烧点上部喷射"],"answer":"AC","explanation":"答案AC。灭火时通常应选择上风或侧上风方向，避免烟气和火焰向施救者扑来；喷射口应对准燃烧物根部，按灭火器说明扫射。站在下风方向或对准火焰上部喷射，可能降低灭火效果并增加人员暴露风险。","basis":"灭火器使用通用操作要求；GB 50140—2005《建筑灭火器配置设计规范》。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0796","type":"多选题","category":"消防安全","question":"使用ABC类干粉灭火器可以扑灭（    ）火灾？","options":["含碳固体火灾","可燃液体火灾","可燃气体火灾","金属火灾"],"answer":"ABC","explanation":"题库答案ABC。ABC类干粉灭火器通常适用于A类固体物质、B类可燃液体、C类可燃气体火灾；D类金属火灾需使用与具体金属相适应的专用D类灭火剂，普通ABC干粉不应作为D类金属火灾的通用灭火剂。题库原答案将D也列入，建议列为答案待核，不在本次擅自改答案。（原答案ABCD，经百度后个人修改为ABC）","basis":"GB 50140—2005《建筑灭火器配置设计规范》关于灭火器适用火灾类别的规定；灭火器产品标识和说明书。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：重要答案疑点：题库答案ABCD不符合普通ABC干粉灭火器的适用类别；D类金属火灾应使用专用灭火剂。保留原答案并标记。"},{"id":"Q0797","type":"多选题","category":"消防安全","question":"灭火的基本原理有（      ）方面？","options":["冷却","窒息","隔离","化学抑制","连锁"],"answer":"ABCD","explanation":"答案ABCD。灭火的基本原理包括冷却、窒息、隔离和化学抑制。选项E“连锁”是燃烧链式反应的过程，不是独立灭火方法；化学抑制通过干扰链式反应实现灭火。","basis":"消防灭火原理通用知识；GB 50140—2005《建筑灭火器配置设计规范》。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0798","type":"多选题","category":"消防安全","question":"为了自身安全，进入陌生场所应该先了解（    ） 。","options":["避难逃生方向","安全门、梯位置，及是否未关闭、是否上锁","查看消防栓、缓降机、救助袋等各项灭火、避难器具位置","报警电话及紧急情况下的联系方式","场所的建筑设计图"],"answer":"ABCD","explanation":"答案ABCD。进入陌生场所时，应先了解安全出口和疏散方向、楼梯和安全门是否畅通、消防栓和避难设施位置，以及报警和紧急联系方法。了解这些信息有助于突发事件时迅速选择安全路线。一般公众无需查看建筑设计图，且不能将消防设施位置等同于可自行操作的许可。","basis":"《中华人民共和国消防法》第十六条关于保障疏散通道、安全出口畅通和消防设施完好有效的规定。","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0799","type":"多选题","category":"消防安全","question":"何种公共场所尽可能不要前往消费？ (     )","options":["只有单一出入口之场所","位于地下层之场所","用易燃物装修之场所","消防安全设备不合格之场所","防火区域受破坏之场所"],"answer":"ABCDE","explanation":"答案ABCDE。只有单一出入口、位于地下、使用易燃材料装修、消防设施不合格或防火分隔受破坏的场所，均可能增加火灾发生后疏散困难和火势蔓延风险。选择公共场所时，应留意安全出口数量、疏散通道、消防设施和装修材料等情况。","basis":"《中华人民共和国消防法》第十六条、第二十六条；《建筑防火通用规范》GB 55037—2022。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：“地下场所一律不宜前往”表述过宽，地下场所是否安全应结合建筑合规性、疏散设施和消防管理情况判断。"},{"id":"Q0800","type":"多选题","category":"消防安全","question":"火灾发生后应如何报案（     ）。","options":["应保持镇定","拨打911电话","详细述明灾害地点或附近目标","简述灾情状况","留下电话及地址以便进一步联系"],"answer":"ACDE","explanation":"题库答案ACDE，但B项“拨打911电话”与中国大陆火灾报警电话不符。中国大陆应拨打119；911是部分国家或地区的综合紧急电话。报警应保持镇定，准确说明地点、灾情、是否有人被困，并留下可联系的电话和地址。","basis":"《中华人民共和国消防法》第四十四条；中国大陆火灾报警电话为119。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：重要地域性错误：题目来源可能来自使用911的地区，若用于中国大陆题库，应将911核对为119；保留原答案ACDE并标记。"},{"id":"Q0801","type":"多选题","category":"消防安全","question":"公共娱乐场所安全出口处的疏散用门不得采用（      ）。","options":["卷帘门","外开门","转门","侧拉门","吊门"],"answer":"ACDE","explanation":"题库答案ACDE。公共娱乐场所安全出口的疏散门应便于人员向疏散方向开启，不得采用影响紧急疏散的卷帘门、转门、侧拉门、吊门等形式；外开门通常符合人员疏散方向要求。具体门型、开启方向和设置数量应符合建筑防火规范。","basis":"《建筑防火通用规范》GB 55037—2022；《建筑设计防火规范》GB 50016—2014（2018年版）相关安全疏散规定。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：需按场所类型、门的用途及现行强制性规范核定；本题为概括性选择题。"},{"id":"Q0802","type":"多选题","category":"消防安全","question":"根据有关消防管理规定，下列场所属于公共娱乐场所的有（     ）。","options":["影剧院","室外旱冰场","保龄球馆","桑拿浴室","室外网球场"],"answer":"ACD","explanation":"答案ACD。影剧院、保龄球馆、桑拿浴室等通常属于公共娱乐场所管理范围内的场所；室外旱冰场、室外网球场是否属于公共娱乐场所，需结合是否具有娱乐经营属性及具体管理规定判断。","basis":"《娱乐场所管理条例》第二条及相关公共娱乐场所消防安全管理规定。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干“有关消防管理规定”未明确具体文件；室外经营场所的认定可能受具体经营形式影响。"},{"id":"Q0803","type":"多选题","category":"仓储与现场消防管理","question":"居民楼内堆放杂物具有的危险性有（    ）","options":["容易引起火灾，并使火灾扩大蔓延","发生火灾后，通道堵塞，人员、物资不易疏散","不利于火灾的扑救","使空气流通不畅","无危险性"],"answer":"ABC","explanation":"答案ABC。居民楼内堆放杂物可能增加可燃物荷载、引发或扩大火灾；杂物堵塞走道和楼梯会影响人员疏散，并妨碍消防人员进入和灭火救援。题干所列“使空气流通不畅”并非该行为最直接、普遍的主要危险，因此题库答案未选D。","basis":"《中华人民共和国消防法》第十六条；《高层民用建筑消防安全管理规定》有关公共区域堆放杂物、占用疏散通道的要求（适用时）。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0804","type":"多选题","category":"消防安全","question":"使用液化石油气时应注意 (       )。","options":["不准倒灌钢瓶，严禁将钢瓶卧放使用","不准在漏气时使用任何明火和电器，严禁倾倒残液","不准将气瓶靠近火源、热源，严禁用火、蒸汽、热水对气瓶加温","不准在使用时人离开，小孩、病残人不宜使用，严禁将气瓶放在卧室内使用","不准使用不符合标准的气瓶，严禁私自拆修角阀或减压阀。"],"answer":"ABCDE","explanation":"答案ABCDE。液化石油气钢瓶应直立使用，不得倒灌、卧放或倾倒残液；发现泄漏不得使用明火或开关电器；钢瓶应远离火源热源，不得自行加热；使用时应保持通风并注意看护；不得使用不合格钢瓶或擅自拆修阀门、减压阀。","basis":"《城镇燃气管理条例》有关燃气安全使用规定；液化石油气钢瓶及燃气器具相关国家标准和产品说明。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0805","type":"多选题","category":"消防安全","question":"火灾中逃生的基本原则是（      ）","options":["熟悉逃生路线","不滞留没有消防设施的场所，充分利用楼内各种消防设施","发扬团结友爱，舍己救人的精神。","避免聚集，拥挤和践踏","第一时间向门口跑"],"answer":"ABCD","explanation":"答案ABCD。火灾逃生应熟悉疏散路线，利用合规的疏散设施，避免拥挤、聚集和踩踏，并在确保自身安全的前提下帮助他人。不能把“第一时间向门口跑”作为绝对原则，应根据火源、烟气和安全出口位置选择可用路线。","basis":"《建筑防火通用规范》GB 55037—2022有关安全疏散要求；消防应急疏散常识。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0806","type":"多选题","category":"消防安全","question":"下列属于公司重点消防部位的是（      ）","options":["成品库、化工库","配电间、燃烧房","木模车间","存漆点、调漆间","机加车间"],"answer":"ABCD","explanation":"答案ABCD按题库设定。成品库、化工库、配电间、燃烧房、木模车间、存漆点和调漆间等场所可能存在可燃物、危险化学品、电气或动火风险，通常需要纳入重点消防部位评估。机加车间是否为重点部位，应结合设备、油品、粉尘和实际火灾危险性判断。","basis":"《中华人民共和国消防法》第十六条、第十七条；单位消防安全重点部位应依据火灾危险性评估确定。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：“公司”未指明具体单位，重点部位清单属于单位内部管理信息；答案不宜泛化到其他公司。"},{"id":"Q0807","type":"多选题","category":"消防安全","question":"住宿与生产储存经营合用场所不应设置在（      ）：","options":["有甲、乙类火灾危险性的生产、储存、经营的建筑","建筑耐火等级为三级及三级以下的建筑","厂房和仓库","建筑面积大于2500m2的商场市场等公共建筑","地下建筑"],"answer":"ABCDE","explanation":"题库答案ABCDE。住宿与生产、储存、经营合用场所存在人员居住与生产经营火灾危险相互影响的问题。题库所列甲乙类危险性建筑、耐火等级较低建筑、厂房仓库、大型公共建筑及地下建筑均属于需要严格限制或禁止设置住宿与生产储存经营合用场所的情形。具体禁止范围和例外条件应按现行建筑防火规范逐项判断。","basis":"《住宿与生产储存经营合用场所消防安全技术要求》及《建筑防火通用规范》GB 55037—2022。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：选项范围可能来自旧版技术要求，建筑面积阈值、耐火等级及地下建筑限制需按现行标准复核。"},{"id":"Q0808","type":"多选题","category":"消防安全","question":"员工岗位防火检查应包括(       ):","options":["用火、用电有无违章","疏散通道、安全出口是否畅通","消防器材、消防安全标志完好情况","场所有无遗留火种","其他消防安全情况"],"answer":"ABCDE","explanation":"答案ABCDE。员工岗位防火检查应关注用火用电是否违规、疏散通道和安全出口是否畅通、消防器材及标志是否完好、是否遗留火种，以及其他可能影响消防安全的情况。检查发现问题应及时报告和整改，形成闭环。","basis":"《机关、团体、企业、事业单位消防安全管理规定》关于防火检查和巡查的规定；《中华人民共和国消防法》第十六条。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0809","type":"多选题","category":"消防安全","question":"（    ）应当接受消防安全专门培训：","options":["单位的消防安全责任人、消防安全管理人","专、兼职消防管理人员","消防控制室的值班、操作人员","其他依照规定应当接受消防安全专门培训的人员","全体员工"],"answer":"ABCD","explanation":"答案ABCD。单位消防安全责任人、消防安全管理人、专兼职消防管理人员、消防控制室值班和操作人员，以及依法规定需要接受专门培训的人员，应接受相应消防安全专门培训。全体员工都应接受消防安全教育培训，但并非所有员工都属于“专门培训”对象。","basis":"《机关、团体、企业、事业单位消防安全管理规定》第三十八条、第三十九条；消防控制室管理相关规定。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0810","type":"多选题","category":"消防安全","question":"下列设施中，（    ） 属于防火分隔设施。","options":["防火墙","挡烟垂壁","防火阀","防火门","喷淋系统"],"answer":"ABCD","explanation":"题库答案ABCD。挡烟垂壁、防火阀和防火门均具有阻止烟气或火势蔓延、形成防火或防烟分隔的功能；喷淋系统属于自动灭火设施，不是防火分隔设施。防火墙也是典型防火分隔构件，因此选项A同样属于防火分隔设施，题库答案BCD可能漏选A。(原答案BCD，经百度后个人修改为ABCD）","basis":"《建筑防火通用规范》GB 55037—2022；《建筑设计防火规范》GB 50016—2014（2018年版）；防火阀、防火门相关产品标准。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：重要答案疑点：A“防火墙”明显属于防火分隔设施，题库答案BCD疑似漏选A；本批不修改原答案。"},{"id":"Q0811","type":"多选题","category":"消防安全","question":"可燃粉尘发生爆炸应具备的条件是（    ）","options":["粉尘本身必须是可燃性的","粉尘必须具有相当大的相对表面积","粉尘必须悬浮在空气中与空气形成爆炸极限范围以内的混合物","有足够的点火能量","粉尘的湿度"],"answer":"ABCD","explanation":"答案ABCD。可燃粉尘爆炸通常需要粉尘本身具有可燃性、具有较大的比表面积、以适当浓度悬浮并与空气形成爆炸性混合物，同时存在足够点火能量。粉尘湿度会影响粉尘分散和爆炸敏感性，但并非题目列举的基本必要条件。","basis":"GB 15577—2018《粉尘防爆安全规程》；可燃粉尘爆炸防护相关标准。","source":"综合题库4.docx","status":"已从题干括号标注识别答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0812","type":"填空题","category":"消防安全","question":"水灭火的作用有______、______、______、______、______。","options":[],"answer":"冷却作用、窒息作用、稀释作用、分离作用、乳化作用","explanation":"参考答案：冷却作用、窒息作用、稀释作用、分离作用、乳化作用。水灭火主要通过吸热降温发挥冷却作用；水蒸气可在一定条件下稀释可燃气体、降低局部氧浓度；水流也可冲散或隔离部分可燃物。乳化作用仅适用于特定不溶于水的液体及适当喷雾条件，不能把水直接用于所有油类或遇水反应物质。","basis":"消防灭火原理及灭火介质适用范围；GB 50140—2005《建筑灭火器配置设计规范》。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：答案中的五种作用属于教材归纳，水不能用于遇水反应物质、带电设备或不适用的油类火灾。"},{"id":"Q0813","type":"填空题","category":"消防安全","question":"火灾过程一般可以分为______、______、______、______、______五个阶段。","options":[],"answer":"初起、发展、猛烈、下降、熄灭","explanation":"参考答案：初起、发展、猛烈、下降、熄灭。该划分描述典型室内火灾从起火到燃烧增强、达到猛烈燃烧、燃烧减弱直至熄灭的过程。实际火灾受通风、燃料、建筑结构和灭火行动影响，发展阶段可能不完全呈现标准曲线，也可能发生轰燃、回燃等现象。","basis":"建筑火灾发展过程及消防基础理论；建筑防火相关标准。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0814","type":"填空题","category":"消防安全","question":"公共场所发生火灾时，该公共场所的现场工作人员有_____、_____的义务。","options":[],"answer":"组织、引导在场群众疏散","explanation":"参考答案：组织、引导在场群众疏散。公共场所发生火灾时，现场工作人员负有组织、引导在场群众疏散的义务，应熟悉疏散通道和安全出口，按预案引导人员有序撤离，避免拥挤和踩踏。","basis":"《中华人民共和国消防法》第四十四条第二款。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0815","type":"填空题","category":"消防安全","question":"火灾处于 ______ 阶段是扑救的最好时机。","options":[],"answer":"初始阶段","explanation":"参考答案：初起阶段。火灾初起阶段燃烧范围通常较小、热释放速率相对较低，若发现及时并具备安全条件，可使用适用灭火器材扑救。若火势或烟气已威胁人员安全，应立即报警、疏散，不应冒险扑救。","basis":"消防初期火灾扑救及单位消防安全管理基本要求。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0816","type":"填空题","category":"电气安全管理","question":"发生电气火灾时应该首先 ______ ，防止触电事故 。","options":[],"answer":"应切断电源再进行扑救","explanation":"参考答案：切断电源。发生电气火灾时，应首先在确保人员安全、具备操作条件的前提下切断电源，防止施救人员触电，并防止带电设备扩大故障。未确认断电前不得使用水或不适用于带电设备的灭火剂；随后按火灾类别选择适用灭火器材。","basis":"GB 50140—2005《建筑灭火器配置设计规范》有关带电火灾灭火器选择要求；电气安全作业规程。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：原答案“应切断电源再进行扑救”表达合理；如无法安全断电，应由专业人员处置并使用适用器材。"},{"id":"Q0817","type":"填空题","category":"消防安全","question":"事故照明供电时间不应少于 分钟。","options":[],"answer":"30","explanation":"题库答案：30分钟。事故照明或应急照明的持续供电时间并非所有建筑统一为30分钟，具体取决于建筑类别、规模、用途、疏散和消防应急照明系统设计要求。题库给出的30分钟可能来自旧教材或特定场所要求，不能直接作为所有项目的现行通用标准。","basis":"《建筑防火通用规范》GB 55037—2022；《消防应急照明和疏散指示系统技术标准》GB 51309—2018。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：重要待核：题干未说明建筑类型和“事故照明”具体系统，30分钟不是所有建筑统一适用的现行要求。"},{"id":"Q0818","type":"填空题","category":"消防安全","question":"爆炸可分为 ______ 、______两类。","options":[],"answer":"物理爆炸；化学爆炸","explanation":"参考答案：物理爆炸、化学爆炸。物理爆炸主要由物质状态或压力快速变化造成，如压力容器超压破裂；化学爆炸由快速化学反应产生大量热量和气体，导致压力骤增，如可燃气体或粉尘爆炸。两者事故机理和防护措施不同。","basis":"爆炸危险环境及压力设备安全基础知识；特种设备安全相关法规和标准。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0819","type":"填空题","category":"消防安全","question":"一个灭火器配置场所内的灭火器不应少于2具，不宜多于 具。","options":[],"answer":"5","explanation":"题库答案：5具。该题采用传统灭火器配置教材中“一个配置场所灭火器数量不宜多于5具”的表述。但现行灭火器配置应根据火灾种类、危险等级、保护面积、最大保护距离和计算单元确定，不能仅以“最多5具”替代配置计算。","basis":"GB 50140—2005《建筑灭火器配置设计规范》有关灭火器配置数量及计算单元要求。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：需复核该“最多5具”是否仍适用于题干场景；现行配置应以规范计算和场所条件为准。"},{"id":"Q0820","type":"填空题","category":"消防安全","question":"灭火器放置时其顶部离地面高度应小于 ______，底部离地面高度不能小于 ______。","options":[],"answer":"1.5米；0.08米","explanation":"题库答案：顶部离地面高度小于1.5m，底部离地面高度不小于0.15m。该题答案顺序与题干空格顺序疑似相反：灭火器顶部离地面高度不应大于1.5m；底部离地面高度不宜小于0.08m（具体按灭火器重量、设置方式及现行规范要求）。题库给出的“顶部0.15m、底部1.5m”明显颠倒，且底部数值也需核对。\n核对后，《建筑灭火器配置设计规范》（GB 50140）要求手提式灭火器设置在挂钩、托架或灭火器箱内时，顶部离地面高度不应大于1.5米，底部离地面高度不宜小于0.08米。将答案修改为1.5m；0.08m","basis":"GB 50140—2005《建筑灭火器配置设计规范》第5.1.3条关于灭火器设置高度的要求。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：重要答案/空格疑点：题库答案“0.15米；1.5米”与题干顺序及规范常见要求不一致；本批保留原答案并标记，建议回查原题。"},{"id":"Q0821","type":"填空题","category":"消防安全","question":"使用二氧化碳灭火器时，在室外使用的，应选择在 ______ 方向喷射。","options":[],"answer":"上风向","explanation":"参考答案：上风向。室外使用二氧化碳灭火器时，施救人员应尽量站在上风方向，避免二氧化碳气体和燃烧产物吹向自身；应握住专用喷筒手柄，避免直接接触低温部件造成冻伤。狭小、通风不良空间使用二氧化碳还需特别防范窒息。","basis":"灭火器产品使用说明及GB 50140—2005《建筑灭火器配置设计规范》。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0822","type":"填空题","category":"消防安全","question":"火灾致人死亡的主要原因有 ______ ；______ 、 ______ ； ______ ； ______ 。","options":[],"answer":"有毒气体中毒；缺氧；窒息；烧伤致死；吸入热气","explanation":"参考答案：有毒气体中毒、缺氧窒息、烧伤致死、吸入热气。火灾死亡原因包括一氧化碳等有毒气体中毒、氧含量下降导致窒息、高温烟气损伤呼吸道以及严重烧伤等。题干分列五个空，但答案将“缺氧、窒息”作为两个并列内容，存在概念重叠，建议按原教材核对空格设置。","basis":"火灾烟气危害、火灾医学救援及消防基础知识。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题目五个空与答案项目逻辑不完全对应，“缺氧”和“窒息”概念重叠；保留答案原文并提示。"},{"id":"Q0823","type":"填空题","category":"消防安全","question":"油锅着火最简单的灭火方法 ______ 、 ______ 。","options":[],"answer":"盖锅盖；往锅里倒菜","explanation":"题库答案：盖锅盖；往锅里倒菜。安全做法是立即关闭热源，在确保安全的情况下盖上锅盖或使用合适的灭火毯，隔绝空气使火焰熄灭；严禁向燃烧的油锅泼水，也不应把菜或其他物品倒入油锅，以免热油飞溅、溢出引发更大火灾。（补充：使用合适的灭火毯）","basis":"消防厨房火灾处置常识；燃气和食用油火灾安全处置指引。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：重要答案疑点：第二空“往锅里倒菜”不属于安全灭火方法，可能造成热油飞溅和火势扩大；正确做法应以盖锅盖、关闭热源为主。保留原答案并标记。"},{"id":"Q0824","type":"填空题","category":"消防安全","question":"______ 传播的方向是火灾蔓延的方向。","options":[],"answer":"烟气","explanation":"参考答案：烟气。火灾烟气会随气流和压力差传播，常沿走道、楼梯间、竖井和其他连通空间扩散，烟气蔓延方向往往决定人员危险区域的扩大方向。逃生时应观察烟气流动，避免进入充满烟气的通道。","basis":"建筑火灾烟气流动与防排烟基础知识；GB 55037—2022有关防烟、排烟和疏散要求。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0825","type":"填空题","category":"消防安全","question":"电视机着火用毛毯、棉被覆盖时，人要站在 ______ ，以防显像管爆裂伤人。","options":[],"answer":"电视机侧后面","explanation":"题库答案：电视机侧后面。题目来源于传统显像管电视机的安全提示，目的是避免显像管受热或破裂时碎片向正面飞散。现代平板电视结构不同，且用毛毯、棉被覆盖电器可能导致散热不良或触电风险；电器起火应先断电（确保安全时）、报警并使用适用灭火器材。","basis":"电器火灾处置常识及电器产品安全使用要求。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题目针对传统显像管电视机，已不适合直接作为现代平板电视通用处置建议；保留原答案并标记时代局限。"},{"id":"Q0826","type":"填空题","category":"消防安全","question":"严禁堵塞消防 ______ 及随意挪用或 ______ 。","options":[],"answer":"通道；损坏消防设施","explanation":"参考答案：通道；损坏消防设施。消防通道应保持畅通，消防设施、器材不得擅自挪用、拆除或损坏。堵塞通道会延误人员疏散和消防救援，损坏设施会削弱报警、灭火和防护功能。","basis":"《中华人民共和国消防法》第二十八条、第十六条。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：原题第二空答案为“损坏消防设施”，语义可通；句子结构略显不完整，建议后续核对原文。"},{"id":"Q0827","type":"填空题","category":"仓储与现场消防管理","question":"爆炸品仓库的“五双”制度是 ______ 、 ______ 、 ______ 、 ______ 、 ______ 。","options":[],"answer":"双人保管；双把锁；双本账；双人发货；双人领用","explanation":"参考答案：双人保管、双把锁、双本账、双人发货、双人领用。该“五双”制度是对爆炸品等高危险物品实施严格的人员、钥匙、账目、发放和领用管理，目的是防止丢失、误发、违规使用和非法流失。具体管理要求应以现行危险化学品、民用爆炸物品和单位仓储制度为准。","basis":"危险化学品和民用爆炸物品储存管理相关法规及仓库管理制度。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：“五双”制度的适用物品类别和具体操作要求需按现行法规、行业规定及物品属性确定。"},{"id":"Q0828","type":"填空题","category":"消防安全","question":"基本灭火的方法有 ______ 、 ______ 、 ______ 、 ______。","options":[],"answer":"冷却法；窒息法；抑制法；隔离法","explanation":"参考答案：冷却法、窒息法、抑制法、隔离法。冷却法降低燃烧物温度；窒息法降低氧浓度；抑制法中断燃烧链式反应；隔离法移走或切断可燃物。不同火灾类别需选择相容灭火方法，不能对遇水反应物或带电设备盲目用水。","basis":"消防灭火基本原理及GB 50140—2005《建筑灭火器配置设计规范》。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0829","type":"填空题","category":"消防安全","question":"锅炉因超压发生的爆炸属于 ______ 爆炸。","options":[],"answer":"物理性","explanation":"参考答案：物理性爆炸。锅炉超压时，承压部件可能因压力超过设计承载能力而破裂，储存的压力能迅速释放，属于物理性爆炸；若锅炉内发生燃料或可燃气体爆燃，则属于化学爆炸，机理不同。","basis":"《特种设备安全法》及锅炉安全技术规程（TSG 11系列现行版本）。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题目说的是因超压导致的锅炉承压部件爆炸，按物理性爆炸解释；实际事故应查明是否伴随燃烧爆炸。"},{"id":"Q0830","type":"填空题","category":"消防安全","question":"任何单位、个人都有______ 、 ______ 、______的义务报告火警的义务。","options":[],"answer":"维护消防设施；扑救；报告火警","explanation":"题库答案：维护消防设施、扑救、报告火警。该题原句“任何单位、个人都有……的义务报告火警的义务”存在语病，且与消防法规范表述不完全一致。消防法规定任何单位和个人都有维护消防安全、保护消防设施、预防火灾、报告火警的义务；发现火灾应立即报警。","basis":"《中华人民共和国消防法》第五条、第四十四条。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干存在明显语病和答案项目缺漏：法条原文还包括“维护消防安全、预防火灾”；本批保留原答案，不擅自修订。"},{"id":"Q0831","type":"填空题","category":"消防安全","question":"火灾逃生的四个要点是：______。","options":[],"answer":"防烟熏、果断迅速逃离火场、寻找逃生之路、等待他救","explanation":"参考答案：防烟熏、果断迅速逃离火场、寻找逃生之路、等待他救。火灾逃生应优先避免吸入烟气，选择安全出口和疏散楼梯迅速撤离；若通道被烟火封堵，应退回相对安全区域，关闭房门、封堵缝隙、报警并等待救援。不能将“等待他救”理解为在可安全撤离时消极停留。","basis":"消防应急疏散与自救常识；《中华人民共和国消防法》第四十四条。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：“四个要点”属于教材归纳，具体行动应根据现场火势、烟气和可用疏散路线决定。"},{"id":"Q0832","type":"填空题","category":"消防安全","question":"火灾致人死亡的主要原因有： ______ 、 ______ 、 ______ 、 ______。","options":[],"answer":"有毒气体中毒、窒息、 烧伤致死、吸入热气","explanation":"参考答案：有毒气体中毒、窒息、烧伤致死、吸入热气。火灾致死机制包括烟气中一氧化碳等有毒气体中毒、缺氧窒息、严重烧伤及吸入高温烟气导致呼吸道损伤。各项之间存在关联，题目按四项列举，属于教材归纳。","basis":"火灾烟气危害及火灾医学救援基础知识。","source":"综合题库4.doc","status":"来源已补录；题干答案沿用原文，专业准确性未复核；剩余解析补充：与Q0823考点重复，保留独立题目。"},{"id":"Q0833","type":"填空题","category":"消防安全","question":"当火灾处于初起阶段时，______ 成为热传播的主要形式。","options":[],"answer":"热对流","explanation":"参考答案：热对流。火灾初起阶段，火焰和高温烟气形成的热气流运动会把热量带到周围区域，热对流是题库所考查的主要热传播形式之一。实际火灾中热传导、热辐射和热对流会同时发生，主导方式随火灾发展、空间和通风条件变化。","basis":"建筑火灾热传播基本原理。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干“初起阶段以热对流为主要形式”属于教材简化归纳，不应理解为其他热传播方式不存在。"},{"id":"Q0834","type":"填空题","category":"消防安全","question":"当火灾处于发展阶段时，______ 成为热传播的主要形式。","options":[],"answer":"热辐射","explanation":"参考答案：热辐射。火灾发展阶段火焰和高温烟气温度升高，热辐射增强，可使周围可燃物受热、热解并达到着火条件，促进火势扩大。实际火灾中热对流和热传导也同时存在。","basis":"建筑火灾热传播基本原理。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干属于阶段性教材归纳，具体主导热传播方式受火灾条件影响。"},{"id":"Q0835","type":"填空题","category":"消防安全","question":"进入油库（站）不准带______ 、 ______及______，并禁止______。","options":[],"answer":"火柴、打火机，其他能发火的物品，穿钉子鞋","explanation":"参考答案：火柴、打火机；其他能发火的物品；穿钉子鞋。油库及加油站存在易燃蒸气，火柴、打火机和其他点火源可能引发燃烧爆炸；鞋钉与地面碰撞也可能产生火花。进入前应遵守禁火、静电防护、车辆管理和人员登记等规定。","basis":"油库、加油站防火防爆安全管理规定及危险化学品储存安全要求。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：具体禁带物品和防静电要求应按油库现场制度、危险区域划分和适用标准执行。"},{"id":"Q0836","type":"填空题","category":"消防安全","question":"露天存放物品应当分类、分堆、分组和分垛，并留出必要的 ______ 。","options":[],"answer":"防火间距","explanation":"参考答案：防火间距。露天存放物品应分类、分堆、分组、分垛，并保持必要防火间距，以防止火灾蔓延，便于消防人员接近和灭火。间距应根据储存物品类别、堆垛高度、储量及适用消防规范确定。","basis":"《仓库防火安全管理规则》有关露天堆场储存及防火间距规定；现行仓储消防规范。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0837","type":"填空题","category":"消防安全","question":"建筑物内的走道、楼梯、出口等部位，要经常保持 ______ ，严禁 ______ ，疏散标志和指示灯，要保证完整好用。，","options":[],"answer":"畅通；堆放物品","explanation":"参考答案：畅通；堆放物品。建筑物走道、楼梯和出口属于人员疏散及消防救援的重要通道，应保持畅通，不得堆放杂物、锁闭或以其他方式妨碍疏散。疏散标志和应急照明应保持完整、有效。","basis":"《中华人民共和国消防法》第十六条；《建筑防火通用规范》GB 55037—2022。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干末尾多余标点，属于排版问题；本批不修改。"},{"id":"Q0838","type":"填空题","category":"消防安全","question":"救火时，不要贸然打开房门，以免 ______ ，加速火势蔓延。","options":[],"answer":"空气对流","explanation":"参考答案：空气对流。火灾时贸然打开房门可能使新鲜空气进入燃烧区域，增强燃烧并促使火焰、烟气向其他区域蔓延；同时可能使烟气迅速涌入人员所在空间。应先判断门外温度和烟气情况，避免盲目开门。","basis":"建筑火灾烟气流动及火场逃生基本知识。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0839","type":"填空题","category":"消防安全","question":"当遇到火灾时，要迅速向 ______ 逃生。","options":[],"answer":"安全出口方向","explanation":"参考答案：安全出口方向。发生火灾时，应根据疏散指示标志、应急照明和现场工作人员引导，向可用的安全出口及疏散楼梯撤离；不要乘坐普通电梯，不要返回取物，也不要盲目进入浓烟区域。","basis":"《建筑防火通用规范》GB 55037—2022有关安全疏散要求。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0840","type":"填空题","category":"消防安全","question":"高层建筑火灾特点是 ______ 、 ______ 、 ______ 。","options":[],"answer":"蔓延快；逃生困难；扑救困难","explanation":"参考答案：蔓延快、逃生困难、扑救困难。高层建筑竖向空间和管井可能形成烟囱效应，火灾烟气及火势可能沿竖向通道迅速扩散；楼层高、疏散距离长、人员集中，增加逃生难度；消防救援和供水、登高作业也更复杂。","basis":"《建筑防火通用规范》GB 55037—2022有关高层建筑防火、疏散和消防救援要求。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0841","type":"填空题","category":"电气安全管理","question":"库房内铺设有配电线路，需要 ______ 或 ______保护。","options":[],"answer":"穿金属管；用难燃硬塑料","explanation":"题库答案：穿金属管；用难燃硬塑料。库房配电线路应采用符合防火、防爆和电气安全要求的敷设方式，防止线路机械损伤、短路和电弧引燃可燃物。具体应根据仓库火灾危险类别、环境和线路用途选择金属导管或符合要求的阻燃/难燃电缆及保护方式，不能把“难燃硬塑料”泛化为所有危险仓库均可使用。","basis":"《建筑电气与智能化通用规范》GB 55024—2022；《低压配电设计规范》GB 50054—2011；危险场所还应符合防爆电气标准。","source":"综合题库4.docx","status":"需人工核对：原题未明确标出空格答案；剩余解析补充：题干和答案属于旧式概括，具体材料、管线及防爆要求应按仓库类别和现行标准设计。"},{"id":"Q0842","type":"判断题","category":"消防安全","question":"泡沫灭火器可用于带电灭火。（ ）","options":["对","错"],"answer":"B","explanation":"答案B（错）。普通泡沫灭火器含水，通常不适用于未断电的带电设备火灾，可能造成触电危险。带电设备起火应先在确保安全的情况下切断电源，再选用适用于相应火灾类别的灭火器。","basis":"GB 50140—2005《建筑灭火器配置设计规范》有关带电火灾灭火器选择要求。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0843","type":"判断题","category":"消防安全","question":"物质的燃点越低、越不容易引起火灾。（ ）","options":["对","错"],"answer":"B","explanation":"答案B（错）。燃点越低，表示物质在较低温度下就可能持续燃烧，通常越容易达到着火条件，火灾危险性可能越高。物质是否容易起火还受闪点、点火能量、浓度、通风和储存条件等影响，不能只凭燃点单一判断。","basis":"可燃物燃烧特性及危险化学品分类基础知识。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0844","type":"判断题","category":"消防安全","question":"使用过的油棉纱、油手套等沾油纤维物品以及可燃包装，应放在安全地点，且定期处理。( )","options":["对","错"],"answer":"A","explanation":"答案A（对）。沾有油品的棉纱、手套等纤维物品可能因油脂氧化积热而发生自燃，也可能成为火灾的可燃物。应放入带盖的专用金属容器或指定安全地点，分类收集并及时按规定清理处置，不得随意堆放在作业现场。","basis":"《中华人民共和国消防法》第十六条；企业防火管理及可燃废弃物收集处置要求。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0845","type":"判断题","category":"消防安全","question":"火场上扑救原则是先人后物、先重点后一般、先控制后消灭。（ ）","options":["对","错"],"answer":"A","explanation":"答案A（对）。火场扑救应坚持先救人后救物、先控制后消灭，并根据火灾危险性和现场条件优先控制重点部位，防止火势扩大。实际灭火救援应服从统一指挥，优先保障被困人员和救援人员安全。","basis":"消防灭火救援基本原则及《中华人民共和国消防法》有关组织灭火救援规定。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0846","type":"判断题","category":"仓储与现场消防管理","question":"凡是设有仓库或生产车间的建筑内，不得设职工集体宿舍。（ ）","options":["对","错"],"answer":"A","explanation":"答案A（按题库答案）。生产、储存、经营场所与员工集体宿舍混设，会使人员居住区域直接暴露于生产火灾、爆炸和有害物质风险。对存在火灾危险的厂房、仓库，应按现行建筑防火规范落实住宿与生产储存经营场所分隔或禁止合用要求。题干“凡是设有仓库或生产车间的建筑”范围过于绝对，需结合建筑用途和现行规范判断。","basis":"《中华人民共和国消防法》第十九条；《建筑防火通用规范》GB 55037—2022。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干“凡是”表述过宽，具体禁止范围需依据建筑类型、火灾危险性和现行规范；保留原答案。"},{"id":"Q0847","type":"判断题","category":"消防安全","question":"消防通道的宽度不应小于3.5米。（ ）","options":["对","错"],"answer":"A","explanation":"答案A（按题库答案），但题干将消防通道宽度统一规定为3.5m，表述不够严谨。消防车道的净宽度、净空高度、转弯半径和承载能力应按建筑类型、消防车通行需求和现行强制性规范确定；不同道路、场地和建筑条件可能存在不同要求。不能仅凭3.5m判断所有消防通道均合规。","basis":"《建筑防火通用规范》GB 55037—2022有关消防车道、消防救援场地要求；《建筑设计防火规范》GB 50016—2014（2018年版）相关条款。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干“消防通道”未区分消防车道与人员疏散通道，3.5m不能作为所有通道统一宽度；需按具体对象复核。"},{"id":"Q0848","type":"判断题","category":"消防安全","question":"在特殊情况下，单位和个人可以挪用、拆除、埋压、圈占消火栓，临时占用消防通道。 （ ）","options":["对","错"],"answer":"B","explanation":"答案B（错）。任何单位和个人不得损坏、挪用或者擅自拆除、停用消防设施器材，不得埋压、圈占、遮挡消火栓，也不得占用、堵塞、封闭消防车通道。确因施工等特殊情况需要临时占用的，应依法履行审批或报备并采取保障消防通行的措施，不能自行决定。","basis":"《中华人民共和国消防法》第二十八条；涉及临时占用消防车通道的还应遵守属地管理规定。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0849","type":"判断题","category":"消防安全","question":"安装在爆炸危险场所的灯具应是防爆型的。( )","options":["对","错"],"answer":"A","explanation":"答案A（对）。爆炸危险场所存在可燃气体、蒸气或粉尘时，普通灯具可能产生电弧、火花或高温表面，成为点火源。灯具和电气设备应根据危险区域等级、爆炸性物质组别和温度组别选用相应防爆型式，并由符合要求的人员安装、维护。","basis":"GB 50058—2014《爆炸危险环境电力装置设计规范》；相关防爆电气产品标准。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0850","type":"判断题","category":"消防安全","question":"灭火器材设置点附近不能堆放物品，以免影响灭火器的取用。( )","options":["对","错"],"answer":"A","explanation":"答案A（对）。灭火器设置点附近不应堆放物品或设置障碍物，确保发生火灾时人员能够迅速发现并取用灭火器。灭火器还应设置在明显、便于取用且不影响疏散的位置，并定期检查压力、铅封、喷管和有效状态。","basis":"GB 50444—2008《建筑灭火器配置验收及检查规范》；GB 50140—2005《建筑灭火器配置设计规范》。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0851","type":"判断题","category":"消防安全","question":"凡是能引起可燃物着火或爆炸的热源统称为点火源。（ ）","options":["对","错"],"answer":"A","explanation":"答案A（对）。能够引起可燃物着火或爆炸的能源或热作用来源通常称为点火源，包括明火、高温表面、电气火花、静电放电、雷电、摩擦撞击火花等。危险场所应识别并控制各类点火源，采取防静电、防爆电气、动火审批和隔离等措施。","basis":"GB 50058—2014《爆炸危险环境电力装置设计规范》及防火防爆安全技术要求。","source":"综合题库4.docx","status":"已录入原资料答案；未提供解析；剩余解析补充：题干及答案未见明显冲突；保留原题、选项、答案和分类。"},{"id":"Q0852","type":"简答题","category":"电气安全管理","question":"配电室、配电柜、配电箱和电缆井等部位的消防要求和规定是什么？","options":[],"answer":"清理其中的杂物；严禁在配电室内住人；严禁遮挡配电室、配电柜、配电箱的门；严禁在电缆井内堆放任何物品和其它杂物。","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0853","type":"简答题","category":"消防安全","question":"报警时应注意的事项有哪些？","options":[],"answer":"（1）报警时要沉着冷静，及时准确，要说清楚起火的部门和部位，燃烧的物质，火势大小； （2）讲清楚起火单位名称、详细地址、报警电话号码 ； （3）指派人员到消防车可能来到的路口接应； （4）主动及时地介绍燃烧的性质和火场内部情况，以便迅速组织扑救","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0854","type":"简答题","category":"消防安全","question":"穿过浓烟逃生时，为什么要尽量使身体贴近地面，并用湿毛巾捂住口鼻?","options":[],"answer":"火场中大多数死亡的人都是因烟气中毒而死。因此在遇到烟时，一定要用湿毛 巾捂住口鼻，并使毛巾过滤烟的面积尽量大。同时由于烟热气体是向上弥漫的，所以要尽量使身体贴近地面。","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0855","type":"简答题","category":"消防安全","question":"火灾时，遇身上衣服着火时，为什么不能奔跑，应采取什么措施?","options":[],"answer":"因为奔跑时，会形成一股小风，大量新鲜空气冲到着火人的身上，火会越烧越旺。此外，如果身上着火的人到处乱跑，还会把火带到其他场所，引起新的燃烧点。所以人身上着火后，必须想方设法脱掉衣物，如来不及脱，可把衣服撕碎扔掉，或者卧倒在地上打滚，也可跳人附近池塘、小河等水中去。","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0856","type":"简答题","category":"电气安全管理","question":"我国将火灾分为哪几类?","options":[],"answer":"（1）A类火灾为固体可燃材料的火灾，包括木材、布料、纸张、橡胶以及塑料等； （2）B类火灾为易燃可燃液体、易燃气体和油脂类火灾； （3）C类火灾为带电电气设备火灾； （4）D类火灾为部分可燃金属，如镁、钠、钾及其合金等火灾。","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0857","type":"简答题","category":"消防安全","question":"高层建筑火灾逃生时为什么不能乘电梯?","options":[],"answer":"电梯井直通大楼各层，烟雾、高温、热气很容易涌人形成”烟囱效应”，烟雾、热气流可能危及人的生命。在高温的作用下，电梯有可能因失控或因变形而不能运行。此外，扑救高层建筑火灾时，建筑供电系统随时可能被切断。","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0858","type":"简答题","category":"消防安全","question":"为什么空气重的可燃气体的火灾危险性大？","options":[],"answer":"比空气重可燃气体在空间下浮，不易挥发，并且易和空气形成爆炸混合物，再加上接触地面火源的机会多，很容易燃烧或爆炸，所以火灾危险性大。","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0859","type":"简答题","category":"消防安全","question":"为什么喷漆未干的工件不应立即烘干？","options":[],"answer":"喷漆未干的工件上还附着有许多易燃溶剂和蒸气，当这些蒸气在空气中的含量达到一定浓度时，遇到烘干所用的火源就会引起爆炸和火灾的危险。","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0860","type":"简答题","category":"消防安全","question":"公共建筑的疏散门为什么应向疏散方向开启？","options":[],"answer":"疏散门是人员安全逃生的必经之地，当疏散门朝疏散方向开启，人们很快把门推开，迅速撤离到安全地带，因此向疏散方向开启且不应使用侧拉门、转门、吊门等","explanation":"","basis":"","source":"综合题库4.docx","status":"已从题干分离参考答案"},{"id":"Q0861","type":"简答题","category":"电气安全
