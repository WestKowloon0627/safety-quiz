生产安全事故应急预案编制导则》第6 综合应急预案内容条：综合应急预案应包括下列主要内容：6.1 总则；6.2 应急组织机构及职责；6.3 应急响应；6.4 后期处置；6.5 应急保障。","basis":"GB/T 29639-2020《生产经营单位生产安全事故应急预案编制导则》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0229","type":"单选题","category":"起重作业安全管理","question":"开动桥式起重机前，必须注意轨道两侧和地面上人员的安全，应先按（），然后推上开关开动行车。","options":["音响信号","灯光信号","闪烁信号","脉冲信号"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0230","type":"单选题","category":"现场操作规范","question":"在存在较大危险因素的作业场所或有关设备上，按照规定，设置（）。","options":["安全警示标志","案例图形","反面宣传","规章制度"],"answer":"A","explanation":"《中华人民共和国安全生产法》第三十五条：生产经营单位应当在有较大危险因素的生产经营场所和有关设施、设备上，设置明显的安全警示标志。","basis":"《中华人民共和国安全生产法》（2021年修正版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0231","type":"单选题","category":"现场操作规范","question":"下列关于安全色含义的描述，（）是正确的。","options":["黄色传递注意、警告的信息","蓝色表示提示、安全状态、通行的含义","红色表示指令、必须遵守的含义"],"answer":"A","explanation":"GB 2894-2025《安全色和安全标志》第4.1.1条：黄色——传递注意、警告的信息。","basis":"GB 2894-2025《安全色和安全标志》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0232","type":"单选题","category":"事故报告与调查处理","question":"事故原因中存在（）的问题应确定为领导责任。","options":["违章作业","同类事故重复发生","未使用个人防护用品"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0233","type":"单选题","category":"劳动防护用品管理","question":"特种劳动防护用品的“三证一标志”中的标志指（）。","options":["产品标志","安全标签","安全标志"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0234","type":"单选题","category":"危险化学品安全","question":"搬运剧毒化学品后,应该（）。","options":["用流动的水洗手","吃东西补充体力","休息"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0235","type":"单选题","category":"职业病防治","question":"产生职业病危害的用人单位的工作场所应当生产布局合理，符合有害与无害作业（）的原则。","options":["职业卫生","分开","劳动保护"],"answer":"B","explanation":"《中华人民共和国职业病防治法》第十五条：产生职业病危害的用人单位的工作场所应当符合下列职业卫生要求：……（三）生产布局合理，符合有害与无害作业分开的原则……","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0236","type":"单选题","category":"危险化学品安全","question":"国家对危险化学品生产、储存实行（）制度。","options":["审查","备案","核准","审批"],"answer":"D","explanation":"《中华人民共和国安全生产法》（2021 修正）第第三十九条：第三十九条生产、经营、运输、储存、使用危险物品或者处置废弃危险物品的,由有关主管部门依照有关法律、法规的规定和国家标准或者行业标准审批并实施监督管理。 生产经营单位生产、经营、运输、储存、使用危险物品或者处置废弃危险物品,必须执行有关法律、法规和国家标准或者行业标准,建立专门的安全管理制度,采取可靠的安全措施,接受有关主管部门依法实施的监督管理。","basis":"《中华人民共和国安全生产法》（2021修正）第三十九条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0237","type":"单选题","category":"高处作业安全管理","question":"拆除脚手架应遵循的原则是（）。","options":["先上后下","先外后内","先搭后拆，后搭先拆"],"answer":"C","explanation":"GB 55023-2022《施工脚手架通用规范》第5.4.2条：5.4.2 脚手架的拆除作业应符合下列规定:","basis":"GB 55023-2022《施工脚手架通用规范》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0238","type":"单选题","category":"从业人员劳动保护","question":"在较热的环境下，由于身体热量不能及时散发，体温失调，则容易引起（）。","options":["中暑","脱水","虚脱","死亡"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0239","type":"单选题","category":"职业病防治","question":"职工应当正确使用、维护职业病防护设备和个人使用的（）。","options":["职业病防护用品","生产工具","生产设施"],"answer":"A","explanation":"《中华人民共和国职业病防治法》第二十二条：用人单位必须采用有效的职业病防护设施，并为劳动者提供个人使用的职业病防护用品。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0240","type":"单选题","category":"职业病防治","question":"用人单位要做好职工的职业健康防治和（）。","options":["监护","管理","保护"],"answer":"A","explanation":"《中华人民共和国职业病防治法》第三十六条：用人单位应当为劳动者建立职业健康监护档案，并按照规定的期限妥善保存。职业健康监护档案应当包括劳动者的职业史、职业病危害接触史、职业健康检查结果和职业病诊疗等有关个人健康资料。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0241","type":"单选题","category":"职业病防治","question":"职业危害因素就是生产劳动过程中，存在于（）中的危害劳动者健康的因素。","options":["公共场所","作业环境","自然环境"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0242","type":"单选题","category":"通用安全法律法规","question":"为了杜绝违章行为，切实做到“反违章人人有责”，在反习惯性违章活动中，每个职工都应做到：明确活动的目的和意义，自觉加入到反违章行列中，重新学习安全规程，（）典型事例中吸取经验教训，提高自己的安全意识和防护能力。","options":["从正面","从反面","从正反两面"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0243","type":"单选题","category":"通用安全法律法规","question":"事故演练以模拟实体操作为主，或采用（），使职工能从训练中学会处理突发事件。","options":["情景模拟训练","实际操作训练","预案文本训练"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0244","type":"单选题","category":"通用安全法律法规","question":"在日常工作中，违章操作现象屡禁不止，其思想根源往往不包括以下哪一项？（ ）","options":["心存侥幸，认为事故不会发生在自己身上","盲目自信，高估自己的操作能力和经验","严格遵守操作规程，追求高质量工作成果"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0245","type":"单选题","category":"从业人员安全生产权利义务","question":"生产经营单位应当向从业人员如实告知作业场所和工作岗位存在的（）防范措施以及事故应急措施。","options":["危险因素","事故隐患","设备缺陷"],"answer":"A","explanation":"《中华人民共和国安全生产法》第四十四条：生产经营单位应当教育和督促从业人员严格执行本单位的安全生产规章制度和安全操作规程；并向从业人员如实告知作业场所和工作岗位存在的危险因素、防范措施以及事故应急措施。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0246","type":"单选题","category":"通用安全法律法规","question":"安全生产管理包括安全生产法制管理、行政管理、监督检查、工艺技术管理、设备设施管理、作业环境和条件管理等。安全生产管理的基本对象是（）。","options":["生产工艺","设备设施","人员","作业环境"],"answer":"C","explanation":"《中华人民共和国安全生产法》第四条：生产经营单位必须遵守本法，加强安全生产管理，建立健全全员安全生产责任制和安全生产规章制度（管理涵盖法制、行政、监督检查、工艺技术、设备设施、作业现场等）。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0247","type":"单选题","category":"通用安全法律法规","question":"班组长在安全生产上的职责是:贯彻执行本单位对安全生产的规定和要求，督促本班组的工人遵守有关安全生产的规章制度和安全操作规程，切实做到（）","options":["尽职尽责，措施完善","班前班后检查、评比","不违章指挥，不违章作业，遵守劳动纪律","事事有人管"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0248","type":"单选题","category":"高处作业安全管理","question":"从事一般性高处作业脚上应穿（）。","options":["硬底鞋","软底防滑鞋","普通胶鞋","绝缘鞋"],"answer":"B","explanation":"《JGJ 80-2016 建筑施工高处作业安全技术规范》第3.0.8条等规定高处作业人员应采取防滑措施、穿防滑鞋等个人防护用品（从事高处作业应穿软底防滑鞋）。","basis":"《JGJ 80-2016 建筑施工高处作业安全技术规范》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0249","type":"单选题","category":"安全培训教育","question":"从业人员应当接受（）教育和培训。","options":["操作规程","技术措施","安全生产","基本技能"],"answer":"C","explanation":"《中华人民共和国安全生产法》第五十八条：从业人员应当接受安全生产教育和培训，掌握本职工作所需的安全生产知识，提高安全生产技能，增强事故预防和应急处理能力。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0250","type":"单选题","category":"劳动防护用品管理","question":"根据《特种劳动防护用品安全标志实施细则》，特种劳动防护用品标志上盾牌中间采用字母“LA”，其表示的含意是（）","options":["生产安全","劳动安全","人身安全","劳保安全"],"answer":"B","explanation":"《特种劳动防护用品安全标志实施细则》（安监总规划〔2005〕149号）规定，特种劳动防护用品安全标志标识盾牌中间采用字母“LA”，其中“LA”为“劳动安全”的拼音缩写，表示劳动安全。 〔注：原依据《特种劳动防护用品安全标志实施细则》（安监总规划字〔2005〕149号）已按2016年按安监总办〔2016〕13号宣布失效；LA标志转为自愿申请〕","basis":"《特种劳动防护用品安全标志实施细则》（安监总规划〔2005〕149号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0251","type":"单选题","category":"危险化学品安全","question":"危险化学品单位应当制定本单位危险化学品事故应急预案，配备应急救援人员和必要的应急救援器材、设备，并（）。","options":["实施监督","签订安全责任书","定期组织应急救援演练"],"answer":"C","explanation":"《危险化学品安全管理条例》第七十条：危险化学品单位应当制定本单位危险化学品事故应急预案，配备应急救援人员和必要的应急救援器材、设备，并定期组织应急救援演练。","basis":"《危险化学品安全管理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0252","type":"单选题","category":"安全生产费用管理","question":"下列表述不正确的是（）","options":["生产经营单位作出涉及安全生产的经营决策，应当听取安全生产管理人员的意见。","生产经营单位制定或者修改有关安全生产的规章制度，应当听取工会的意见。","有关生产经营单位应当按照规定提取和使用安全生产费用，专门用于职工安全生产培训。","生产经营单位应当建立安全生产教育和培训档案，如实记录安全生产教育和培训的时间、内容、参加人员以及考核结果等情况。"],"answer":"C","explanation":"《中华人民共和国安全生产法》第二十三条：有关生产经营单位应当按照规定提取和使用安全生产费用，专门用于改善安全生产条件（而非“专门用于职工安全生产培训”）；故C项表述错误。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0253","type":"单选题","category":"职业病防治","question":"职业病病人变动工作单位，其依法享有的待遇（）。","options":["不变","终止","与下一个工作单位协商解决"],"answer":"A","explanation":"《中华人民共和国职业病防治法》第六十条：职业病病人变动工作单位，其依法享有的待遇不变。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0254","type":"单选题","category":"通用安全法律法规","question":"干粉灭火器扑救可燃、易燃液体火灾时，应对准（）扫射？","options":["火焰根部","火焰顶部","火焰中部","朝天喷射"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0255","type":"单选题","category":"通用安全法律法规","question":"火灾疏散与逃生的基本原则是（）","options":["确保安全、迅速撤离、顾全大局、救助结合","以抢救贵重物品为主","只要自己能跑掉就行","以救人为主，舍己为人"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0256","type":"单选题","category":"劳动防护用品管理","question":"生产经营单位应当（）用于配备劳动防护用品、进行安全生产培训的经费。","options":["安排","不安排","安排一半"],"answer":"A","explanation":"《中华人民共和国安全生产法》第四十七条：生产经营单位应当安排用于配备劳动防护用品、进行安全生产培训的经费。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0257","type":"单选题","category":"安全生产法律责任","question":"两个以上生产经营单位在同一作业区域内进行可能危及对方安全生产的生产经营活动，未签订安全生产管理协议或者未指定专职安全生产管理人员进行安全检查与协调的，责令限期改正；逾期未改正的（）。","options":["责令停产停业","依法进行罚款","照常经营"],"answer":"A","explanation":"《中华人民共和国安全生产法》第一百零四条：两个以上生产经营单位在同一作业区域内进行可能危及对方安全生产的生产经营活动，未签订安全生产管理协议或者未指定专职安全生产管理人员进行安全检查与协调的，责令限期改正，处五万元以下的罚款；逾期未改正的，责令停产停业。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0258","type":"单选题","category":"通用安全法律法规","question":"电脑着火了，正确的做法是（）","options":["迅速往电脑上泼水灭火","先断电后灭火","用泡沫灭火器扑救","将电脑搬离其它可燃物"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0259","type":"单选题","category":"通用安全法律法规","question":"当空气不流通的场所发生火灾，使用二氧化碳灭火器灭火可能造成（）。","options":["中毒","缺氧窒息","爆炸"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0260","type":"单选题","category":"通用安全法律法规","question":"发生火灾后，如何正确报火警（）","options":["讲清着火单位、详细地址、着火物质及火势大小","讲清着火单位、详细地址、着火物质及火势大小，是否有人被困，留下报警人姓名及联系方式","告知着火方位后迅速挂断电话，返回火场"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0261","type":"单选题","category":"消防安全","question":"个人损坏、挪用或擅自拆除、停用消防设施、器材，埋压、圈占、遮挡消火栓的，处（）处罚。","options":["警告或五百元以下罚款","十日以下行政拘留","劳动教养"],"answer":"A","explanation":"《中华人民共和国消防法》第六十条：个人损坏、挪用或者擅自拆除、停用消防设施、器材，埋压、圈占、遮挡消火栓……有前款行为的，处警告或者五百元以下罚款。","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0262","type":"单选题","category":"消防安全","question":"火灾扑灭后，起火单位应（）。","options":["速到现场抢救物资","尽快抢修设施争取复产","予以保护现场","拨打119"],"answer":"C","explanation":"《中华人民共和国消防法》第五十一条：火灾扑灭后，发生火灾的单位和相关人员应当按照消防救援机构的要求保护现场，接受事故调查，如实提供与火灾有关的情况。","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0263","type":"单选题","category":"消防安全","question":"灭火器应该放置在（）。","options":["隐蔽的地方","易于取用，不受阻碍的地方","专门放置灭火器的仓库"],"answer":"B","explanation":"GB 50140-2005《建筑灭火器配置设计规范》第5.1.1条：灭火器应设置在位置明显和便于取用的地点，且不得影响安全疏散。","basis":"GB 50140-2005《建筑灭火器配置设计规范》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0264","type":"单选题","category":"通用安全法律法规","question":"未切断电源的电器设备火，不可以用（）灭火器灭火。","options":["干粉","水基","二氧化碳"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0265","type":"单选题","category":"通用安全法律法规","question":"火场逃生的原则是（）。","options":["抢救国家财产为上","安全撤离、救助结合","先带上日后生活必需钱财要紧"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0266","type":"单选题","category":"通用安全法律法规","question":"遇到高楼发生火灾，正确的处理措施是（）。","options":["乘坐普通电梯逃生","向上逃生","躲避到防烟楼梯间、避难层等地等待救援"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0267","type":"单选题","category":"消防安全","question":"手提式灭火器挂在墙上，其顶部一般离地面高度不应大于（）米。","options":["1米","1.2米","1.5米"],"answer":"C","explanation":"GB 50140-2005《建筑灭火器配置设计规范》第5.1.3条：手提式灭火器宜设置在灭火器箱内或挂钩、托架上，其顶部离地面高度不应大于1.50m；底部离地面高度不宜小于0.08m。 〔依据法规已收录条款库：GB 50140-2005《建筑灭火器配置设计规范》；部分强制性条文被GB 55036-2022《消防设施通用规范》自2023-03-01起废止〕","basis":"GB 50140-2005《建筑灭火器配置设计规范》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0268","type":"单选题","category":"通用安全法律法规","question":"有限空间专项应急预案的演练频次要求为（）","options":["每半年至少1次","每年至少1次","每季度至少1次","每2年至少1次"],"answer":"B","explanation":"《GB 46768-2025 有限空间作业安全技术规范》4.6.2：作业单位应组织有限空间作业事故应急预案演练，专项应急预案应每年至少演练1次，现场处置方案应每半年至少演练1次。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0269","type":"单选题","category":"通用安全法律法规","question":"交通事故报警电话是（）。","options":["112","122","121"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0270","type":"单选题","category":"通用安全法律法规","question":"下列止血方式，错误的是（）。","options":["不去除血液浸透的敷料，直接在其上另加敷料","对嵌有异物或者骨折断端外露的伤口采用直接压迫止血法","将受伤的肢体区域抬高到超过心脏的高度"],"answer":"B","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0271","type":"单选题","category":"通用安全法律法规","question":"在对溺水者进行施救时，施救者首先应该（）。","options":["确认溺水区域的水深度","确认患者的性别","确认自身安全"],"answer":"C","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0272","type":"单选题","category":"通用安全法律法规","question":"仅有一名急救员对呼吸心跳骤停的伤员进行心肺复苏时，其位置应是（）。","options":["蹲在伤员胸侧","跪在伤员胸侧","跪在伤员肩与胸平齐的侧面"],"answer":"C","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0273","type":"单选题","category":"应急救护技能","question":"对多根多发性肋骨骨折，胸部出现反常呼吸运动的胸部创伤病人，应最先进行急救措施是（）。","options":["用厚实的敷料覆盖伤区胸壁，并在伤员呼气时加压包扎","吸入氧气","静脉输液"],"answer":"A","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0274","type":"单选题","category":"应急救护技能","question":"病人下颌骨严重损伤骨折致舌肌失去支持而舌根后缩，发生气道阻塞，急救时应首选（）。","options":["用开口器张开口腔","用压舌板将舌下压","用舌钳将舌拉出"],"answer":"C","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0275","type":"单选题","category":"应急救护技能","question":"一氧化碳中毒者应立即吸入（），以缓解机体缺氧并促进毒物排除。","options":["氧气或新鲜空气","臭氧","氢气"],"answer":"A","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0276","type":"单选题","category":"消防安全","question":"下列行为属于安全使用燃气的是（）。","options":["未安装燃气泄漏报警装置，或安装位置不符合要求","不使用国家明令禁止的燃气设备，和超期的燃气设备","私拉乱接软管，私自增加用气设备"],"answer":"B","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0277","type":"单选题","category":"电气作业安全管理","question":"使用电热水器沐浴时，应使用（）的电热淋浴器或加装漏电保护器。要擦干双手再接触各类电源开关，使用电吹风等小电器时，注意不要让电线缠绕住身体。","options":["接地线","报警功能","指示灯","带有漏电保护功能"],"answer":"D","explanation":"GB/T 13955-2017《剩余电流动作保护装置安装和运行》第4.4.1条 g) 项：游泳池、喷水池、浴室、浴池的电气设备应安装末端保护RCD；第5.8条：安装在潮湿场所及浴室的电气设备应选用额定剩余动作电流小于30 mA（特定区域10 mA）、无延时的RCD。故本题“电热水器沐浴时应使用带有漏电保护功能的电热淋浴器或加装漏电保护器”成立。","basis":"GB/T 13955-2017《剩余电流动作保护装置安装和运行》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0278","type":"单选题","category":"安全检查与隐患治理","question":"（）排查、评估记录，隐患整改复查验收记录等，应单独建档管理。","options":["事故隐患","一般事故隐患","重大事故隐患"],"answer":"C","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0279","type":"单选题","category":"现场操作规范","question":"在有限空间作业过程中，应当采取持续通风措施，保持空气流通，（）","options":["禁止采用纯氧通风换气","有条件的可以采用纯氧通风换气","空气和纯氧都可以作为通风气源"],"answer":"A","explanation":"《GB 46768-2025 有限空间作业安全技术规范》5.10.1：应向有限空间内输送清洁空气，不应使用纯氧或富氧空气进行通风。","basis":"GB 46768-2025《有限空间作业安全技术规范》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0280","type":"单选题","category":"通用安全法律法规","question":"《消防法》规定，禁止非法携带（）进入公共场所或乘坐公共交通工具。","options":["易燃易爆危险品","香烟","火种"],"answer":"A","explanation":"《中华人民共和国消防法》第二十三条","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0281","type":"单选题","category":"现场操作规范","question":"根据危险化学品企业特殊作业安全规范，一级动火作业的动火工作票有效期最长为？","options":["8小时","24小时","3天","7天"],"answer":"A","explanation":"GB 30871-2022《危险化学品企业特殊作业安全规范》第5.1.5条：特级、一级动火安全作业票有效期不应超过8h，答案A（8小时）","basis":"《危险化学品企业特殊作业安全规范》GB 30871-2022","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0282","type":"单选题","category":"现场操作规范","question":"根据焊接作业安全规范，焊接作业时，氧气瓶与乙炔瓶的安全距离不得小于？","options":["2米","5米","10米","15米"],"answer":"B","explanation":"GB 9448-2025《焊接与切割安全》第11.5.5条（气瓶与作业点距离一般为5m以上）","basis":"《焊接与切割安全》GB 9448-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0283","type":"单选题","category":"现场操作规范","question":"根据动火作业安全规范，在易燃易爆场所进行动火作业，必须办理的是？","options":["工作票","操作票","动火工作票","无需办理票据，只要做好防护即可"],"answer":"C","explanation":"GB 30871-2022《危险化学品企业特殊作业安全规范》第4.6条：作业前应组织办理作业审批手续（动火须办理动火安全作业票），答案C","basis":"《危险化学品企业特殊作业安全规范》GB 30871-2022","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0284","type":"单选题","category":"现场操作规范","question":"根据焊接作业安全规范，焊接作业人员必须佩戴的核心个人防护用品是？","options":["安全帽","安全带","焊接防护面罩、绝缘手套、防护鞋","护目镜"],"answer":"C","explanation":"《GB 9448-2025 焊接与切割安全》5.2.2：作业人员在观察电弧时，应使用带有滤光镜的头罩或手持面罩，或佩戴安全镜、护目镜或其他合适的眼镜；《GB 9448-2025 焊接与切割安全》5.2.3.2：所有焊工和切割工应佩戴耐火的防护手套；《GB 9448-2025 焊接与切割安全》5.2.1：按GB39800.1选择防护用品。","basis":"《焊接与切割安全》GB 9448-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0285","type":"单选题","category":"现场操作规范","question":"根据焊接作业安全规范，焊接作业时，以下哪种做法是正确的？","options":["焊接作业前，清理作业区域周围的易燃易爆物品，无法清理的采取隔离防护措施","在易燃易爆物品附近直接进行焊接作业，无需采取防护措施","焊接作业结束后，立即离开现场，无需检查是否有残留火种","使用损坏的焊接设备进行作业，只要能正常焊接即可"],"answer":"A","explanation":"《GB 9448-2025 焊接与切割安全》7.3.1：焊接或切割作业只应在无火灾隐患的条件下实施。有条件时，应将工件移至指定的安全区进行焊接或切割作业；《GB 9448-2025 焊接与切割安全》7.3.2：工件不可移动时，应将火灾隐患周围所有可移动的物体移至安全位置。","basis":"《焊接与切割安全》GB 9448-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0286","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，成人胸外按压的深度和频率分别是？","options":["深度3-4厘米，频率80-100次/分钟","深度4-5厘米，频率100-120次/分钟","深度5-6厘米，频率100-120次/分钟","深度6-7厘米，频率120-140次/分钟"],"answer":"C","explanation":"T/CRHA 308—2026《心肺复苏培训相关规范》：成人胸外按压深度5~6cm、频率100~120次/分（与中国红十字会现场成人CPR操作流程一致），答案C","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0287","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，自动体外除颤器（AED）的核心作用是？","options":["对患者进行人工呼吸","对患者进行胸外按压","对心脏骤停的患者进行电击除颤，恢复正常心律","监测患者的生命体征"],"answer":"C","explanation":"T/CRHA 308—2026：AED（自动体外除颤器）对心脏骤停患者电击除颤、恢复正常心律，答案C","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0288","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于严重出血的患者，应首先采取的止血方法是？","options":["止血带止血法","加压包扎止血法","直接压迫止血法","填塞止血法"],"answer":"C","explanation":"应急救护通用规范（通用急救要求，无单一强制法条依据）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0289","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于脊柱损伤的患者，转运时必须采取的正确方法是？","options":["单人抱持患者转运","双人抬持患者四肢转运","使用脊柱板固定患者，多人平托转运，保持脊柱平直，严禁弯曲、扭转","将患者放在轮椅上转运"],"answer":"C","explanation":"应急救护通用规范（通用急救要求，无单一强制法条依据）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0290","type":"单选题","category":"安全生产","question":"生产经营单位发生生产安全事故后，事故现场有关人员应当立即报告（）。","options":["当地应急管理局","当地派出所","本单位负责人","上级行业主管部门"],"answer":"C","explanation":"《中华人民共和国安全生产法》第八十三条","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0291","type":"单选题","category":"安全生产","question":"依据《安全生产法》，生产经营单位必须保证安全生产投入，用于安全生产培训、防护用品、隐患治理等，安全生产费用（）","options":["可挪作经营周转使用","由单位财务自由调配","专款专用，不得挤占挪用","仅大型企业需要单独列支"],"answer":"C","explanation":"《中华人民共和国安全生产法》第二十三条","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0292","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于脊柱骨折的患者，急救时严禁进行的操作是？","options":["用脊柱板固定患者","多人平托转运患者","单人抱持患者，或让患者坐起、站立","保持患者脊柱平直"],"answer":"C","explanation":"应急救护通用规范（通用急救要求，无单一强制法条依据）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0293","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于化学品皮肤接触中毒患者，以下哪种做法是正确的？","options":["用纸巾擦拭皮肤表面的化学品","用热水冲洗皮肤接触部位","用大量流动的清水冲洗皮肤接触部位，脱去被污染的衣物","在皮肤接触部位涂抹药膏"],"answer":"C","explanation":"应急救护通用规范（通用急救要求，无单一强制法条依据）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0294","type":"单选题","category":"应急救护技能","question":"对骨折伤员进行急救时，首先应采取的措施是（ ）。","options":["立即移动伤员，送往医院","对骨折部位进行固定，避免二次伤害","立即对伤员进行心肺复苏","立即给伤员喂食补充能量"],"answer":"B","explanation":"应急救护通用规范（通用急救要求，无单一强制法条依据）","basis":"创伤急救规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0295","type":"单选题","category":"通用安全法律法规","question":"根据《工贸企业重大事故隐患判定标准》，以下哪一项不属于工贸企业重大事故隐患？","options":["某企业员工在普通作业区未穿安全鞋","特种作业人员未取得相应资格上岗作业","未对承包单位安全生产工作统一协调管理","铝镁等金属粉尘、木质粉尘的干式除尘系统未设置锁气卸灰装置"],"answer":"A","explanation":"《工贸企业重大事故隐患判定标准》（应急管理部令第10号）：选项A（普通作业区未穿安全鞋）不属该标准重大隐患情形；B/C/D分别对应第三条/第三条/第十一条，故A为『不属于』的正确答案","basis":"《工贸企业重大事故隐患判定标准》应急管理部10号令（2023版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0296","type":"单选题","category":"通用安全法律法规","question":"根据《工贸企业重大事故隐患判定标准》，使用液氨制冷的工贸企业，包装、分割、产品整理场所的空调系统采用（）的，应判定为重大事故隐患。","options":["氨直接蒸发制冷","氟利昂制冷","水循环制冷","风冷制冷"],"answer":"A","explanation":"《工贸企业重大事故隐患判定标准》（应急管理部令第10号）第十二条（一）：使用液氨制冷企业，包装、分割、产品整理场所空调系统采用氨直接蒸发制冷的，判定为重大事故隐患，答案A","basis":"《工贸企业重大事故隐患判定标准》应急管理部10号令（2023版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0297","type":"单选题","category":"现场操作规范","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业审批实行（）制度，严禁无票作业。","options":["一人一票","一班一票","一作业一票","一天一票"],"answer":"C","explanation":"《有限空间作业安全技术规范》GB 46768-2025 第5.2条（作业审批）","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0298","type":"单选题","category":"现场操作规范","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业结束后，必须完成（），确认无安全隐患后方可关闭作业现场。","options":["工具清点","人员清点","作业验收","现场清扫"],"answer":"C","explanation":"《有限空间作业安全技术规范》GB 46768-2025 第7.1条（作业验收）","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0299","type":"多选题","category":"通用安全法律法规","question":"当在脚手架上架设临时施工用电线路时，需要做到（ ）。","options":["有绝缘措施","操作人员应穿绝缘防滑鞋","可以不设置接地、防雷设施","脚手架与架空输电线路之间应设有安全距离"],"answer":"ABD","explanation":"《施工脚手架通用规范》GB 55023-2022 第5.1.3条","basis":"施工脚手架通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0300","type":"多选题","category":"危险化学品安全","question":"危险化学品是指具有毒害、腐蚀、（）等性质，对人体、设施、环境具有危害的剧毒化学品和其他化学品。","options":["爆炸","燃烧","不燃","助燃"],"answer":"ABD","explanation":"《危险化学品安全管理条例》第三条：本条例所称危险化学品，是指具有毒害、腐蚀、爆炸、燃烧、助燃等性质，对人体、设施、环境具有危害的剧毒化学品和其他化学品。","basis":"《危险化学品安全管理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0301","type":"多选题","category":"事故报告与调查处理","question":"根据《生产安全事故报告和调查处理条例》，报告事故应当包括（）。","options":["事故发生单位概况","事故发生的时间、地点以及事故现场情况","事故的简要经过","事故已经造成或者可能造成的伤亡人数"],"answer":"ABCD","explanation":"《生产安全事故报告和调查处理条例》第十二条：报告事故应当包括下列内容：（一）事故发生单位概况；（二）事故发生的时间、地点以及事故现场情况；（三）事故的简要经过；（四）事故已经造成或者可能造成的伤亡人数（包括下落不明的人数）和初步估计的直接经济损失；（五）已经采取的措施；（六）其他应当报告的情况。","basis":"《生产安全事故报告和调查处理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0302","type":"多选题","category":"安全生产","question":"根据《安全生产法》规定，下列关于生产经营单位与从业人员订立劳动合同的说法，错误的是（ ）。","options":["生产经营单位可以与从业人员订立协议，减轻其对从业人员因生产安全事故伤亡依法应承担的责任","生产经营单位与从业人员订立的劳动合同，只需载明保障从业人员劳动安全的事项","生产经营单位与从业人员订立的劳动合同，应当载明有关保障从业人员劳动安全、防止职业危害的事项，以及依法为从业人员办理工伤保险的事项","生产经营单位与从业人员订立的劳动合同，无需载明防止职业危害的事项"],"answer":"ABD","explanation":"《中华人民共和国安全生产法》第五十二条","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0303","type":"多选题","category":"应急管理","question":"依据《生产经营单位生产安全事故应急预案编制导则》规定，综合应急预案内容包括（ ）。","options":["总则","应急响应","后期处置","应急保障"],"answer":"ABCD","explanation":"GB/T 29639-2020《生产经营单位生产安全事故应急预案编制导则》第6 综合应急预案内容条：综合应急预案应包括下列主要内容：6.1 总则；6.2 应急组织机构及职责；6.3 应急响应；6.4 后期处置；6.5 应急保障。 〔依据法规已收录条款库〕","basis":"GB/T 29639-2020《生产经营单位生产安全事故应急预案编制导则》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0304","type":"多选题","category":"安全检查与隐患治理","question":"专业检查由各管理部门负责人组织专业人员进行，包括并不限于（）等。","options":["电气安全检查","设备安全检查","登高作业检查","危险化学品检查"],"answer":"ABCD","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0305","type":"多选题","category":"高处作业安全管理","question":"高处作业人员不准在不安全的位置上休息，（）不准在高处作业区域追逐打闹，不违章作业等。","options":["不准随意往下面扔东西","酒后、严重睡眠不足不得进行高处作业","不准打赌、斗气"],"answer":"ABC","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0306","type":"多选题","category":"应急救护技能","question":"骨折固定常用的夹板有（）。","options":["木制夹板","充气夹板","钢丝夹板","可塑性夹板"],"answer":"ABCD","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0307","type":"多选题","category":"安全培训教育","question":"安全教育的种类包括（）。","options":["转岗教育","三级安全教育","特种作业人员安全教育","经常性安全教育"],"answer":"ABCD","explanation":"依据《生产经营单位安全培训规定》（国家安全生产监督管理总局令第3号）相关规定（第十二条、第十七条、第二十条等），安全教育种类包括三级安全培训教育、转岗（复岗）安全教育、特种作业人员安全教育以及经常性安全教育等。 〔依据法规已收录条款库：《生产经营单位安全培训规定》〕","basis":"《生产经营单位安全培训规定》（国家安全生产监督管理总局令第3号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0308","type":"多选题","category":"应急管理","question":"应急预案分为（）三个层次。","options":["综合预案","单项预案","专项预案","现场处置方案"],"answer":"ACD","explanation":"《生产安全事故应急预案管理办法》第六条：生产经营单位应急预案分为综合应急预案、专项应急预案和现场处置方案。 〔依据法规已收录条款库：《生产安全事故应急预案管理办法》〕","basis":"《生产安全事故应急预案管理办法》（应急管理部令第2号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0309","type":"多选题","category":"消防安全管理","question":"在（）时，地方各级人民政府应当组织开展有针对性的消防宣传教育，采取防火措施，进行消防安全检查。","options":["农业收获季节","重大节假日期间","火灾多发季节"],"answer":"ABC","explanation":"《中华人民共和国消防法》第三十一条：在农业收获季节、森林和草原防火期间、重大节假日期间以及火灾多发季节，地方各级人民政府应当组织开展有针对性的消防宣传教育，采取防火措施，进行消防安全检查。","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0310","type":"多选题","category":"通用安全法律法规","question":"根据《中华人民共和国安全生产法》，企业应当对从业人员进行安全生产教育和培训，保证从业人员具备必要的安全生产知识，熟悉有关的（ ），掌握本岗位的安全操作技能。","options":["安全生产规章制度","安全操作规程","事故应急处理措施","安全生产方面的权利和义务"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第二十八条、第五十八条","basis":"《中华人民共和国安全生产法》第二十八条、第五十八条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0311","type":"多选题","category":"应急管理","question":"根据《中华人民共和国突发事件应对法》，企业应当针对可能发生的突发事件，建立健全突发事件应急预案体系，应急预案应当包括（ ）等内容。","options":["突发事件应急管理工作的组织指挥体系与职责","突发事件的预防与预警机制","突发事件的应急处置程序、应急保障措施","突发事件的责任追究条款"],"answer":"ABC","explanation":"《中华人民共和国突发事件应对法》第二十八条","basis":"《中华人民共和国突发事件应对法》（2024修订）第二十八条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0312","type":"多选题","category":"应急管理","question":"根据《中华人民共和国安全生产法》，生产经营单位进行（）以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理。","options":["爆破","吊装","动火","临时用电"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四十三条：生产经营单位进行爆破、吊装、动火、临时用电……危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0313","type":"多选题","category":"应急管理","question":"根据《中华人民共和国安全生产法》，企业应急管理工作必须落实的要求有（ ）。","options":["制定完善的生产安全事故应急预案，定期组织评审修订","按照规定建立应急救援队伍，配备应急救援人员和器材","定期组织开展应急演练，检验应急预案的可行性和有效性","事故发生后，立即启动应急预案，采取应急处置措施，防止事故扩大"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第八十一条：生产经营单位应当制定本单位生产安全事故应急救援预案，与所在地县级以上地方人民政府组织制定的生产安全事故应急救援预案相衔接，并定期组织演练；《中华人民共和国安全生产法》第八十二条：危险物品的生产、经营、储存单位以及矿山、金属冶炼、城市轨道交通运营、建筑施工单位应当建立应急救援组织……应当配备必要的应急救援器材、设备和物资，并进行经常性维护、保养，保证正常运转；《中华人民共和国安全生产法》第八十三条：生产经营单位发生生产安全事故后，事故现场有关人员应当立即报告本单位负责人……迅速采取有效措施，组织抢救，防止事故扩大……按照国家有关规定立即如实报告当地负有安全生产监督管理职责的部门，不得隐瞒不报、谎报或者迟报。","basis":"《中华人民共和国安全生产法》（2021年修订版）第五章、《中华人民共和国突发事件应对法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0314","type":"多选题","category":"重大危险源管理","question":"根据《中华人民共和国安全生产法》，企业重大危险源管理必须落实的要求有（ ）。","options":["对重大危险源进行登记建档，定期进行检测、评估、监控","制定重大危险源专项应急预案，定期组织应急演练","将重大危险源及安全措施、应急措施报相关部门备案","告知应急处置措施"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四十条","basis":"《中华人民共和国安全生产法》（2021年修订版）第四十条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0315","type":"多选题","category":"安全检查与隐患治理","question":"根据《中华人民共和国安全生产法》，企业安全检查必须落实的要求有（ ）。","options":["建立健全安全生产检查制度，定期开展全面安全检查、专项安全检查、日常安全检查","安全检查必须如实记录检查时间、检查内容、发现的安全隐患、整改措施、整改责任人、整改时限","对检查发现的重大安全隐患，必须立即停产停业整改，整改合格后方可恢复生产","对检查发现的安全隐患，必须实行闭环管理，确保整改到位、隐患清零"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四十六条、第四十七条","basis":"《中华人民共和国安全生产法》（2021年修订版）第四十六条、第四十七条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0316","type":"多选题","category":"事故报告与调查处理","question":"根据《中华人民共和国安全生产法》，企业事故报告和调查处理必须落实的要求有（ ）。","options":["发生生产安全事故后，事故现场有关人员必须立即向本单位负责人报告","单位负责人接到事故报告后，必须立即采取有效措施，组织抢救，防止事故扩大，减少人员伤亡和财产损失","按照国家规定及时、如实向相关部门报告事故，不得迟报、漏报、谎报、瞒报","积极配合事故调查处理，如实提供事故相关资料，不得伪造、毁灭证据"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第八十三条、第八十四条","basis":"《中华人民共和国安全生产法》（2021年修订版）第八十三条、第八十四条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0317","type":"多选题","category":"消防安全管理","question":"根据《中华人民共和国消防法》，企业消防安全责任人、消防安全管理人必须履行的职责有（ ）。","options":["贯彻执行消防法规，保障单位消防安全符合规定，掌握本单位的消防安全情况","将消防工作与本单位的生产、经营、管理等活动统筹安排，批准实施年度消防工作计划","为本单位的消防安全提供必要的经费和组织保障，确定逐级消防安全责任，批准实施消防安全制度和保障消防安全的操作规程","组织防火检查，督促落实火灾隐患整改，及时处理涉及消防安全的重大问题，组织制定符合本单位实际的灭火和应急疏散预案，并实施演练"],"answer":"ABCD","explanation":"《中华人民共和国消防法》第十六条、第十七条","basis":"《中华人民共和国消防法》（2021年修订版）第十六条、第十七条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0318","type":"多选题","category":"职业病防治","question":"根据《中华人民共和国职业病防治法》，企业职业病防治工作必须落实的要求有（ ）。","options":["用人单位应当建立、健全职业病防治责任制，加强对职业病防治的管理，提高职业病防治水平，对本单位产生的职业病危害承担责任","用人单位的工作场所必须符合国家职业卫生标准和卫生要求，有与职业病危害防护相适应的设施，为劳动者提供个人使用的职业病防护用品","用人单位应当对劳动者进行上岗前的职业卫生培训和在岗期间的定期职业卫生培训，普及职业卫生知识，督促劳动者遵守职业病防治法律、法规、规章和操作规程","用人单位应当按照国务院卫生行政部门的规定，定期对工作场所进行职业病危害因素检测、评价，定期组织接触职业病危害作业的劳动者进行职业健康检查，建立职业健康监护档案"],"answer":"ABCD","explanation":"《中华人民共和国职业病防治法》第五条：用人单位应当建立、健全职业病防治责任制，加强对职业病防治的管理，提高职业病防治水平，对本单位产生的职业病危害承担责任。；《中华人民共和国职业病防治法》第十五条：产生职业病危害的用人单位的工作场所应当符合下列职业卫生要求：（一）职业病危害因素的强度或者浓度符合国家职业卫生标准；（二）有与职业病危害防护相适应的设施。；《中华人民共和国职业病防治法》第三十四条：用人单位应当对劳动者进行上岗前的职业卫生培训和在岗期间的定期职业卫生培训，普及职业卫生知识，督促劳动者遵守职业病防治法律、法规、规章和操作规程。；《中华人民共和国职业病防治法》第二十六条：用人单位应当按照国务院卫生行政部门的规定，定期对工作场所进行职业病危害因素检测、评价。；《中华人民共和国职业病防治法》第三十六条：用人单位应当为劳动者建立职业健康监护档案，并按照规定的期限妥善保存。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0319","type":"多选题","category":"安全生产法律责任","question":"根据《中华人民共和国行政处罚法》，安全生产相关的行政处罚种类包括（ ）。","options":["警告、通报批评","罚款、没收违法所得、没收非法财物","暂扣许可证件、降低资质等级、吊销许可证件","责令停产停业、责令关闭、限制开展生产经营活动"],"answer":"ABCD","explanation":"《中华人民共和国行政处罚法》第九条 〔依据法规已收录条款库：《中华人民共和国行政处罚法》〕","basis":"《中华人民共和国行政处罚法》第九条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0320","type":"多选题","category":"公司安全生产管理","question":"根据《中华人民共和国公司法》，企业公司安全生产管理的要求包括（ ）。","options":["公司从事经营活动，必须遵守法律、行政法规，遵守社会公德、商业道德，诚实守信，接受政府和社会公众的监督，承担社会责任","公司应当建立健全安全生产管理制度，落实安全生产主体责任，保障职工的生命安全和身体健康","公司的控股股东、实际控制人、董事、监事、高级管理人员不得利用其关联关系损害公司利益，不得指使、强令公司从事违反安全生产法律、法规的行为","公司应当为安全生产提供必要的经费保障，确保安全生产投入的有效实施"],"answer":"ABCD","explanation":"《中华人民共和国公司法》第十九条：公司从事经营活动，必须遵守法律、行政法规，依法建立健全安全生产管理制度，落实安全生产责任。 〔依据法规已收录条款库：《中华人民共和国公司法》；题库原按旧版引用，现行版第16、17条等亦规定公司应建立健全安全生产管理制度〕","basis":"《中华人民共和国公司法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0321","type":"多选题","category":"高处作业安全管理","question":"根据《中华人民共和国安全生产法》及相关法规，企业脚手架搭设作业必须落实的安全要求有（ ）。","options":["脚手架搭设前必须编制专项施工方案，对作业人员进行安全技术交底，明确搭设流程、安全注意事项和应急处置措施","脚手架搭设作业人员必须取得特种作业操作资格证书，持证上岗，正确佩戴和使用劳动防护用品，严禁无资质人员搭设脚手架","脚手架搭设必须严格按照专项施工方案和国家规范进行，确保脚手架的稳定性、强度和刚度，严禁偷工减料、违规搭设","脚手架搭设现场必须设置安全警示区域，严禁无关人员进入，安排专人进行现场监护，搭设完成后必须验收合格后方可使用"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四十三条 〔依据法规已收录条款库：《危险性较大的分部分项工程安全管理规定》〕 〔依据法规已收录条款库〕","basis":"《中华人民共和国安全生产法》（2021年修订版）第四十三条、《危险性较大的分部分项工程安全管理规定》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0322","type":"多选题","category":"应急管理","question":"根据《中华人民共和国安全生产法》，生产经营单位必须为从业人员提供符合（）或者（）的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用。 。","options":["国家标准","行业标准","地方标准","企业标准"],"answer":"AB","explanation":"《中华人民共和国安全生产法》第45条","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0323","type":"多选题","category":"现场操作规范","question":"根据安全操作规范，电气设备停电检修时，必须执行的安全技术措施有哪些？","options":["停电","验电","装设接地线","悬挂警示牌和装设遮栏"],"answer":"ABCD","explanation":"《GB 26860-2011 电力安全工作规程》4.2 及第6章：电气设备停电检修必须执行停电、验电、接地、悬挂标示牌和装设遮栏的安全技术措施。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0324","type":"多选题","category":"现场操作规范","question":"根据起重作业安全规范，起重作业时，严禁进行的操作有哪些？","options":["斜拉、斜吊重物","起吊埋在地下或冻结在地面的重物","起重作业时，人员在吊物下方行走或停留","起吊重量超过起重设备额定起重量的重物"],"answer":"ABCD","explanation":"《GB/T 6067.1-2010 起重机械安全规程 第1部分：总则》17.2.2（不得起吊超载或埋地/重量不清物件）、17.2.5（不许斜拉歪吊、吊物不得从人员上方通过）。","basis":"《起重机械安全规程 第1部分：总则》GB/T 6067.1-2010","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0325","type":"多选题","category":"现场操作规范","question":"根据电气作业安全规范，在带电设备上工作时，必须采取的安全防护措施有哪些？","options":["使用合格的绝缘工具","穿戴合格的绝缘防护用品","设置专人监护","保持与带电设备的最小安全距离"],"answer":"ABCD","explanation":"《GB 26860-2011 电力安全工作规程》第4章 作业要求：在带电设备上工作必须采取绝缘防护等安全措施，作业人员应持证并遵守安全距离规定。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0326","type":"多选题","category":"应急救护技能","question":"根据应急救护规范，使用自动体外除颤器（AED）的正确操作步骤有哪些？","options":["打开AED电源，按照语音提示操作","将电极片正确粘贴在患者的胸部","AED分析心律时，严禁接触患者","AED提示需要除颤时，确保所有人都离开患者，再按下除颤按钮"],"answer":"ABCD","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》：AED 操作——开机、按语音贴电极片、分析心律、如需除颤则确认无人接触后电击。","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0327","type":"单选题","category":"应急救护技能","question":"根据 《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025），安全生产标准化管理体系采用的运行模式是？","options":["PDCA","LS-PDCA","Deming 循环","6S 管理"],"answer":"B","explanation":"《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025）GB/T 33000-2025 引言 0.5（L 领导、S 支持、P 策划、D 实施、C 检查、A 改进）","basis":"《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0328","type":"多选题","category":"现场操作规范","question":"电气设备检修作业时，必须严格执行的安全规定包括（ ）。","options":["严格执行工作票制度，严禁无票作业","严格执行停电、验电、接地、挂牌、上锁制度","作业前必须进行安全技术交底，明确作业范围和安全措施","作业人员必须具备相应的电气作业资格，严禁无证作业"],"answer":"ABCD","explanation":"《GB 26860-2011 电力安全工作规程》4.2 安全技术措施：电气检修作业必须严格执行停电、验电、接地、悬挂标示牌和装设遮栏。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0329","type":"单选题","category":"安全管理","question":"根据《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025），标准构建的安全生产风险系统防控\"三道防线\"是指？","options":["安全规划、安全培训、安全检查","安全风险管控、隐患排查治理、应急处置","设备安全、作业安全、环境安全","领导作用、基础保障、持续改进"],"answer":"B","explanation":"GB/T 33000-2025 引言 0.4（对应第 7、8、11 章）","basis":"《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0330","type":"判断题","category":"安全生产法律责任","question":"工头王某强令李某等人冒险作业，发生事故，造成4人死亡，经调查王某负事故主要责任，对王某可以处五年以上有期徒刑。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国刑法》第一百三十四条第二款【强令、组织他人违章冒险作业罪】：强令他人违章冒险作业，或者明知存在重大事故隐患而不排除，仍冒险组织作业，因而发生重大伤亡事故或者造成其他严重后果的，处五年以下有期徒刑或者拘役；情节特别恶劣的，处五年以上有期徒刑。 〔依据法规已收录条款库：《中华人民共和国刑法》〕","basis":"《中华人民共和国刑法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0331","type":"判断题","category":"通用安全法律法规","question":"消防救援机构应当对各类机关遵守消防法律、法规的情况依法进行监督检查。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国消防法》第五十三条","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0332","type":"判断题","category":"安全生产主体责任","question":"生产经营单位的主要负责人是本单位安全生产第一责任人。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》第五条：生产经营单位的主要负责人是本单位安全生产第一责任人，对本单位的安全生产工作全面负责。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0333","type":"判断题","category":"安全生产","question":"生产经营单位应当在有较大危险因素的生产经营场所和有关设施、设备上,设置明显的安全警示标志。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》第三十五条：生产经营单位应当在有较大危险因素的生产经营场所和有关设施、设备上，设置明显的安全警示标志。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0334","type":"判断题","category":"安全检查与隐患治理","question":"只有存在重大危险源的生产经营单位才需建立安全风险分级管控制度。","options":["对","错"],"answer":"B","explanation":"《中华人民共和国安全生产法》第四十一条：生产经营单位应当建立安全风险分级管控制度，按照安全风险分级采取相应的管控措施。生产经营单位应当建立健全并落实生产安全事故隐患排查治理制度……（并未限定仅重大危险源单位，故“只有存在重大危险源的生产经营单位才需建立安全风险分级管控制度”错误。）","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0335","type":"判断题","category":"工伤保险","question":"经从业人员同意，生产经营单位可不为从业人员购买工伤保险。","options":["对","错"],"answer":"B","explanation":"《中华人民共和国安全生产法》第五十一条：生产经营单位必须依法参加工伤保险，为从业人员缴纳保险费。（工伤保险为法定强制，不得经从业人员同意免除，故该说法错误。）","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0336","type":"判断题","category":"从业人员安全生产权利义务","question":"从业人员在作业过程中，应当严格落实岗位安全责任。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》第五十七条：从业人员在作业过程中，应当严格落实岗位安全责任，遵守本单位的安全生产规章制度和操作规程，服从管理，正确佩戴和使用劳动防护用品。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0337","type":"判断题","category":"事故报告与调查处理","question":"较大事故由事故发生地的市级人民政府负责调查，且不得授权或委托有关部门组织事故调查组进行调查。","options":["对","错"],"answer":"B","explanation":"《生产安全事故报告和调查处理条例》第十九条：\"重大事故、较大事故、一般事故分别由事故发生地省级人民政府、设区的市级人民政府、县级人民政府负责调查。省级人民政府、设区的市级人民政府、县级人民政府可以直接组织事故调查组进行调查，也可以授权或者委托有关部门组织事故调查组进行调查。\"（较大事故由市级人民政府负责调查，但可授权或委托有关部门调查，故题干中\"不得授权或委托\"错误）","basis":"《生产安全事故报告和调查处理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0338","type":"判断题","category":"应急管理","question":"根据《生产安全事故应急条例》，安全生产面临的风险发生重大变化，生产安全事故应急救援预案制定单位应当及时修订相关预案。","options":["对","错"],"answer":"A","explanation":"《生产安全事故应急条例》第六条：\"有下列情形之一的，生产安全事故应急救援预案制定单位应当及时修订相关预案：……（三）安全生产面临的风险发生重大变化；……\"","basis":"《生产安全事故应急条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0339","type":"判断题","category":"安全生产保险保障","question":"我国各行各业都强制实施安全生产责任保险制度。","options":["对","错"],"answer":"B","explanation":"《中华人民共和国安全生产法》第五十一条：\"国家鼓励生产经营单位投保安全生产责任保险；属于国家规定的高危行业、领域的生产经营单位，应当投保安全生产责任保险。\"（仅高危行业、领域强制，并非各行各业强制实施）","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0340","type":"判断题","category":"危险化学品安全","question":"生产、经营、储存、使用危险物品的车间、商店、仓库可以与员工宿舍在同一座建筑物内。（）","options":["对","错"],"answer":"B","explanation":"《中华人民共和国安全生产法》第四十二条：\"生产、经营、储存、使用危险物品的车间、商店、仓库不得与员工宿舍在同一座建筑物内，并应当与员工宿舍保持安全距离。\"","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0341","type":"判断题","category":"建设项目安全管理","question":"危险化学品建设项目竣工投入生产或者使用前，必须由安监部门组织对其安全设施进行验收；验收合格后，方可投入生产和使用。（）","options":["对","错"],"answer":"B","explanation":"《中华人民共和国安全生产法》第三十一条：\"矿山、金属冶炼建设项目和用于生产、储存、装卸危险物品的建设项目竣工投入生产或者使用前，应当由建设单位负责组织对安全设施进行验收；验收合格后，方可投入生产和使用。\"（由建设单位组织验收，而非必须由安监部门组织验收）","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0342","type":"判断题","category":"危险化学品安全","question":"化学性质相抵触或灭火方法不同的两类危险化学品，不得混合贮存。（）","options":["对","错"],"answer":"A","explanation":"《危险化学品安全管理条例》第二十四条：\"危险化学品的储存方式、方法以及储存数量应当符合国家标准或者国家有关规定。\"GB 15603-1995《常用危险化学品贮存通则》规定：化学性质相抵触或灭火方法不同的危险化学品，不得混合贮存。 〔依据法规已收录条款库：GB 15603-2022《危险化学品仓库储存通则》；替代GB 15603-1995《常用化学危险品贮存通则》〕","basis":"GB 15603-2022《危险化学品仓库储存通则》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0343","type":"判断题","category":"现场操作规范","question":"根据高处作业安全规范，高处作业必须使用安全带，安全带应高挂低用，严禁低挂高用。","options":["对","错"],"answer":"A","explanation":"《JGJ 80-2016 建筑施工高处作业安全技术规范》：高处作业必须系挂安全带，安全带应高挂低用，严禁低挂高用。","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0344","type":"判断题","category":"应急救护技能","question":"根据应急救护规范，对于骨折的患者，急救时必须先固定骨折部位，避免骨折端移动造成二次伤害，严禁随意复位骨折部位。","options":["对","错"],"answer":"A","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0345","type":"判断题","category":"现场操作规范","question":"电气设备检修作业前，必须严格执行停电、验电、接地、挂牌、上锁的安全技术措施，确保设备完全断电，防止触电事故。","options":["对","错"],"answer":"A","explanation":"《GB 26860-2011 电力安全工作规程》4.2 及第6章：作业前必须严格执行停电、验电、接地、挂牌、上锁（闭锁）的安全技术措施。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0346","type":"判断题","category":"应急救护技能","question":"发生高温烫伤事故时，首先应立即用流动的常温清水冲洗烫伤部位15-30分钟，快速降温，严禁立即涂抹烫伤膏或用冰块直接冷敷。","options":["对","错"],"answer":"A","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"烧烫伤急救规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0347","type":"判断题","category":"现场操作规范","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业必须严格执行“先通风、再检测、后作业”的原则，严禁无防护盲目进入。","options":["对","错"],"answer":"A","explanation":"《GB 46768-2025 有限空间作业安全技术规范》5.7.1：作业人员应在有限空间外上风侧开启出入口及其他与外界大气环境相连通的设施，进行自然通风；《GB 46768-2025 有限空间作业安全技术规范》5.9.1：初始检测结果符合下列所有条件时，方可实施有限空间作业（氧含量为19.5% VOL~23.5% VOL等）；《GB 46768-2025 有限空间作业安全技术规范》6.1.1：作业负责人确认作业环境、现场安全防护措施、应急救援措施，以及作业设备、工具符合安全要求，签字同意后，作业人方可进入有限空间实施作业。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0348","type":"判断题","category":"应急救护技能","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业遇险情时，严禁监护人在未做好个人防护的情况下进入空间施救，必须立即报警并启动应急预案。","options":["对","错"],"answer":"A","explanation":"《GB 46768-2025 有限空间作业安全技术规范》6.3.1：监护人应佩戴明显标识在有限空间外全程持续监护，不应离开作业现场或进入有限空间参与作业；《GB 46768-2025 有限空间作业安全技术规范》6.2.8：作业过程中一旦发生事故，应立即启动有限空间作业事故专项应急预案或现场处置方案……应急救援人员应在做好危害控制和自身防护的前提下开展救援，不应盲目施救。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0349","type":"单选题","category":"消防安全","question":"任何单位，（）都有参加有组织的灭火工作的义务。","options":["男性公民","女性公民","成年人"],"answer":"C","explanation":"《中华人民共和国消防法》第五条：\"任何单位和个人都有维护消防安全、保护消防设施、预防火灾、报告火警的义务。任何单位和成年人都有参加有组织的灭火工作的义务。\"","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0350","type":"单选题","category":"安全生产主体责任","question":"生产经营单位发生生产安全事故时，单位的（）应当立即组织抢救，并不得在事故调查处理期间擅离职守。","options":["行政人员","主要负责人","后勤人员"],"answer":"B","explanation":"《中华人民共和国安全生产法》第五十条：\"生产经营单位发生生产安全事故时，单位的主要负责人应当立即组织抢救，并不得在事故调查处理期间擅离职守。\"","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0351","type":"单选题","category":"设备安全管理","question":"生产经营单位（）使用应当淘汰的危及生产安全的工艺、设备。","options":["报备后可以","不得","根据实际需求"],"answer":"B","explanation":"《中华人民共和国安全生产法》第三十八条：\"生产经营单位不得使用应当淘汰的危及生产安全的工艺、设备。\"","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0352","type":"单选题","category":"职业病防治","question":"用人单位的（）对本单位的职业病防治工作全面负责。","options":["工会","法人代表","主要负责人"],"answer":"C","explanation":"《中华人民共和国职业病防治法》第六条：\"用人单位的主要负责人对本单位的职业病防治工作全面负责。\"","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0353","type":"单选题","category":"职业健康","question":"新、改、扩建、技术改造、技术引进项目，应在（）申报变更职业病危害项目内容。","options":["竣工验收日起5日内","竣工验收日起15日内","竣工验收日起30日内"],"answer":"C","explanation":"《职业病危害项目申报办法》第八条：\"用人单位有下列情形之一的，应当按照本条规定向原申报机关申报变更职业病危害项目内容：（一）进行新建、改建、扩建、技术改造或者技术引进建设项目的，自建设项目竣工验收之日起30日内进行申报；……\" 〔依据法规已收录条款库：《职业病危害项目申报办法》〕","basis":"《职业病危害项目申报办法》（国家安全生产监督管理总局令第48号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0354","type":"单选题","category":"从业人员劳动保护","question":"保障劳动安全既是每个用人单位的法定职责，也是劳动者个人的责任。下列行为中，不正确的是（）。","options":["某单位以某女员工怀孕为由，辞退该员工","某职工在进行高空作业时，用人单位要求必须佩戴安全帽","某单位对从事有职业危害作业的职工定期进行健康检查"],"answer":"A","explanation":"《女职工劳动保护特别规定》第五条：\"用人单位不得因女职工怀孕、生育、哺乳降低其工资、予以辞退、与其解除劳动或者聘用合同。\"（以怀孕为由辞退女员工属不正确行为） 〔依据法规已收录条款库：《女职工劳动保护特别规定》〕","basis":"《女职工劳动保护特别规定》（国务院令第619号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0355","type":"单选题","category":"职业健康","question":"建设项目的职业病防护设施应当与主体工程（）。","options":["同时设计，同时投入生产和使用","同时设计，同时施工","同时设计，同时施工，同时投入生产和使用"],"answer":"C","explanation":"《中华人民共和国职业病防治法》第十八条：\"建设项目的职业病防护设施所需费用应当纳入建设项目工程预算，并与主体工程同时设计，同时施工，同时投入生产和使用。\"","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0356","type":"单选题","category":"劳动防护用品管理","question":"夏季是各类安全生产事故的多发期，下列有关高温作业的做法错误的是（）。","options":["尽可能避开高温时段生产","夏季气温高，可不佩戴安全帽","对易燃易爆品要加强储存和使用管理工作"],"answer":"B","explanation":"《中华人民共和国安全生产法》第四十五条：\"生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用。\"（高温作业仍须正确佩戴安全帽等劳动防护用品，\"可不佩戴安全帽\"为错误做法）","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0357","type":"单选题","category":"通用安全法律法规","question":"（）是浓烟中对人危害最严重的气体，一般在可燃物燃烧不完全时产生。","options":["一氧化碳","二氧化碳","一氧化氮"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0358","type":"单选题","category":"通用安全法律法规","question":"按照生产过程危险和有害因素分类方式，机械、设备、设施、材料等方面存在的危险和有害因素属于（）。","options":["环境因素","人的因素","物的因素"],"answer":"C","explanation":"GB/T 13861-2022《生产过程危险和有害因素分类与代码》将危险和有害因素分为人的因素、物的因素、环境因素、管理因素四大类；机械、设备、设施、材料等方面存在的危险和有害因素属于\"物的因素\"。 〔依据法规已收录条款库：GB/T 13861-2022《生产过程危险和有害因素分类与代码》〕","basis":"GB/T 13861-2022《生产过程危险和有害因素分类与代码》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0359","type":"单选题","category":"消防安全管理","question":"高层民用建筑应在当（）的显著位置张贴安全疏散示意图，高层公共建筑还应在（）显著位置提示公众注意火灾危险，以及安全出口、疏散通道和灭火器材的位置。","options":["首层；每层","每层；每层","每层；首层","首层；首层"],"answer":"C","explanation":"《高层民用建筑消防安全管理规定》第四十二条：\"高层民用建筑应当在每层的显著位置张贴安全疏散示意图，公共区域电子显示屏应当播放消防安全提示和消防安全知识。高层公共建筑除遵守本条第一款规定外，还应当在首层显著位置提示公众注意火灾危险，以及安全出口、疏散通道和灭火器材的位置。\" 〔依据法规已收录条款库：《高层民用建筑消防安全管理规定》〕","basis":"《高层民用建筑消防安全管理规定》（应急管理部令第5号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0360","type":"单选题","category":"通用安全法律法规","question":"静电的危害不可忽视，（）是静电最为严重的危险。","options":["静电电击","妨碍生产","引起爆炸和火灾"],"answer":"C","explanation":"GB 12158-2024《防止静电事故通用要求》第4.1.1条：作业场所应减少高引燃能力静电放电类型（如火花放电、传播型刷形放电）的产生；不同放电形式具有不同的引燃能力，火花放电释放能量集中，可达1 J，引燃、引爆能力很强。","basis":"GB 12158-2024《防止静电事故通用要求》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0361","type":"单选题","category":"通用安全法律法规","question":"电气设备的绝缘应符合相应的（）。","options":["电压等级、环境条件和使用条件","电压等级、电流等级和使用人员","电流等级、使用人员和设备价格"],"answer":"A","explanation":"《GB/T 13869-2017 用电安全导则》3/5：电气设备的绝缘应符合相应标准，确保人身与设备安全。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0362","type":"单选题","category":"通用安全法律法规","question":"（）是指电气设备中电压等级在1kV以上的设备及设施。","options":["特高压设备","高压设备","直流设备","低压设备"],"answer":"B","explanation":"GB/T 2900.50-2008《电工术语 发电、输电及配电》：高压设备指电压等级在1kV（交流1000V）以上的设备及设施，答案B","basis":"《电工术语 发电、输电及配电》GB/T 2900.50-2008","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0363","type":"单选题","category":"通用安全法律法规","question":"在触电事故中，绝大部分是（）导致人身伤亡的。","options":["人体接触电流遭到电击","烧伤","电休克"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0364","type":"单选题","category":"动火作业安全管理","question":"依据《危险化学品企业特殊作业安全规范》（GB 30871-2022）第 5.2.4 条，对于动火点周围多少米范围内有可能泄漏易燃、可燃物料的设备设施，应采取隔离措施？","options":["10m","12m","15m","20m"],"answer":"C","explanation":"GB 30871-2022 第 5.2.4 条","basis":"《危险化学品企业特殊作业安全规范》GB 30871-2022","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0365","type":"单选题","category":"电气作业安全管理","question":"电器设备外壳的明显处有清晰的永久性凸纹标志“EX”表示（）。","options":["是经安全认证的电气设备","是防爆型电气设备","是节能型电气设备"],"answer":"B","explanation":"GB 3836.1-2010《爆炸性环境 第1部分：设备 通用要求》规定，爆炸性环境用电气设备须施加防爆标志\"Ex\"（Explosion protection），\"Ex\"表示设备为防爆型电气设备。","basis":"GB 3836.1-2010《爆炸性环境 第1部分：设备 通用要求》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0366","type":"单选题","category":"通用安全法律法规","question":"依据 GB 30871-2022 第 5.2.5 条，在有可燃物构件和使用可燃物做（）内衬的设备内部进行动火作业时，应采取防火隔绝措施？","options":["防腐","隔热","绝缘"],"answer":"A","explanation":"GB 30871-2022 第 5.2.5 条（\"使用可燃物做防腐内衬\"）","basis":"《危险化学品企业特殊作业安全规范》GB 30871-2022","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0367","type":"单选题","category":"通用安全法律法规","question":"增加空气的湿度可以消除静电危害，其作用主要是（）。","options":["减少静电荷产生","减少静电荷积聚","将静电荷中和"],"answer":"B","explanation":"GB 12158-2024《防止静电事故通用要求》第4.2.2.6条：工艺允许情况下，局部环境的相对湿度应增加至50%以上，但增湿不应用在爆炸性气体环境0区。（注：增湿可提高材料表面导电性，减少静电荷积聚）","basis":"GB 12158-2024《防止静电事故通用要求》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0368","type":"单选题","category":"通用安全法律法规","question":"电气安全装置中，漏电断路器（漏电保护器）的使用是防止（）危险事故的发生。","options":["火警","触电","电荷超负"],"answer":"B","explanation":"《GB/T 13869-2017 用电安全导则》5.1.2：当系统接地的形式采用保护接地系统（TT系统）时，应在电路采用剩余电流保护器进行保护，并且保护应具有选择性。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0369","type":"单选题","category":"通用安全法律法规","question":"根据《工贸企业重大事故隐患判定标准》第十三条规定，存在硫化氢、一氧化碳等中毒风险的有限空间作业的工贸企业，下列哪种情形不会被判定为重大事故隐患？","options":["作业人员未佩戴安全帽进入有限空间作业","未对有限空间进行辨识、建立安全管理台账，并且未设置明显的安全警示标志","未落实有限空间作业审批","未执行“先通风、再检测、后作业”要求，或者作业现场未设置监护人员"],"answer":"A","explanation":"《工贸企业重大事故隐患判定标准》第十三条：存在硫化氢、一氧化碳等中毒风险的有限空间作业的工贸企业有下列情形之一的，应当判定为重大事故隐患：（一）未对有限空间进行辨识、建立安全管理台账，并且未设置明显的安全警示标志的；（二）未落实有限空间作业审批，或者未执行“先通风、再检测、后作业”要求，或者作业现场未设置监护人员的。前款所列情形之外的事项（如作业人员未佩戴安全帽）未被列入，故不应判定为重大事故隐患。","basis":"《工贸企业重大事故隐患判定标准》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0370","type":"单选题","category":"通用安全法律法规","question":"皮肤潮湿按电力开关掣时，会比干爽时有较大触电危险，原因是人体（）数值减少所致的。","options":["电容","电压","电阻"],"answer":"C","explanation":"《GB/T 13869-2017 用电安全导则》9 对人员的要求：皮肤潮湿时人体电阻减小，触电危险增大，作业时应采取绝缘防护。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0371","type":"单选题","category":"通用安全法律法规","question":"（）是双重绝缘电动工具的构造。","options":["指工具外壳以绝缘材料所制造","指工具内部充电部份有绝缘保护","指工具除内部的充电部份已绝缘外，其外壳亦以绝缘材料所制造"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0372","type":"单选题","category":"应急救护技能","question":"人发生触电事故，若触电者受伤严重，停止呼吸和无心脏跳动，应尽全力施行（）和胸外心脏按压。","options":["人中点压","心脏按摩","人工呼吸"],"answer":"C","explanation":"心肺复苏培训相关规范 T/CRHA 308—2026（人工呼吸）：成人人工呼吸：捏鼻包嘴吹气，每次约1秒，潮气量使胸廓隆起（约500~600 mL），按压与人工呼吸比例30:2，避免过度通气。 心肺复苏培训相关规范 T/CRHA 308—2026（成人胸外按压）：成人胸外按压：按压深度5~6厘米，按压频率100~120次/分，按压部位为两乳头连线中点（胸骨下半部），保证每次按压后胸廓完全回弹；按压与人工呼吸比例为30:2。（与中国红十字会《现场成人心肺复苏操作流程》及T/CRHA 308—2026一致，对应题库Q286）","basis":"心肺复苏培训相关规范 T/CRHA 308—2026（人工呼吸、成人胸外按压）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0373","type":"单选题","category":"起重作业安全管理","question":"（）发出的紧急停车信号起重机司机应立即执行","options":["起重指挥人员","起重现场安全管理人员","任何人"],"answer":"C","explanation":"GB/T 6067.1-2010《起重机械安全规程 第1部分：总则》第17.1条c)款：\"司机应接受起重作业人员的起重作业指挥信号的指挥。……无论何时，司机随时都应执行来自任何人发出的停止信号。\"（对紧急停车/停止信号，任何人发出均应立即执行）","basis":"GB/T 6067.1-2010《起重机械安全规程 第1部分：总则》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0374","type":"单选题","category":"通用安全法律法规","question":"机械设备的安全装置的作用是（）。","options":["在设备失灵、故障或操作人员操作失误时保护人员、设备的安全","节约能源","提高生产效率"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0375","type":"单选题","category":"起重作业安全管理","question":"起重机必须设置（）保护，并在开始运转和恢复供电时只有先将各机构控制器置于零位后，所有机构的电动机才能起动。","options":["连锁","零位","极限位置"],"answer":"B","explanation":"GB/T 6067.1-2010《起重机械安全规程 第1部分：总则》零位保护要求：起重机各传动机构应设置零位保护；在接通电源或开动设备之前，司机应查看所有控制器，使其处于\"零位\"或空档位置；机构因故障或失压停止运行后恢复供电时，若控制器不在零位，机构不得自行动作，必须先将各机构控制器置于零位后，所有机构的电动机才能起动。","basis":"GB/T 6067.1-2010《起重机械安全规程 第1部分：总则》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0376","type":"单选题","category":"起重作业安全管理","question":"桥式起重机吊着重物行走时，应遵守以下（）规定。（1）禁止重物从人和设备的上方通过；（2）空车行走时，吊钩应离地面2m以上；（3）起重机上禁止有人停留。","options":["（1）和（2）","（1）和（3）","（1）、（2）、（3）"],"answer":"C","explanation":"第17.2.5条：起吊过程中应注意……吊运载荷时，不得从人员上方通过；起重机械安全操作还应遵守空吊钩离地高度、机上严禁站人等规定。","basis":"《起重机械安全规程 第1部分：总则》（GB/T 6067.1-2010）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0377","type":"单选题","category":"生产经营单位的安全生产保障","question":"（）不得与员工宿舍在同一座建筑物内，并应当与员工宿舍保持安全距离。","options":["办公楼","商场","生产、使用危险物品的车间"],"answer":"C","explanation":"《中华人民共和国安全生产法》四十二条","basis":"《中华人民共和国安全生产法》四十二条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0378","type":"单选题","category":"总则","question":"生产经营单位的工会依法组织职工参加本单位安全生产工作的民主管理和民主监督，维护职工在安全生产方面的合法权益。生产经营单位制定或者修改有关安全生产的规章制度，（）听取工会的意见。","options":["不用","考虑","应当"],"answer":"C","explanation":"《中华人民共和国安全生产法》七条","basis":"《中华人民共和国安全生产法》七条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0379","type":"单选题","category":"总则","question":"安全生产工作应当以人为本，坚持人民至上、生命至上，把保护人民生命安全摆在首位，树牢安全发展理念，坚持（ ）的方针，从源头上防范化解重大安全风险。","options":["安全第一、预防为主、防消结合","安全第一、预防为主、综合治理","安全第一、预防为主、防治结合"],"answer":"B","explanation":"《中华人民共和国安全生产法》三条","basis":"《中华人民共和国安全生产法》三条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0380","type":"单选题","category":"高处作业安全管理","question":"高空作业是特殊作业，危险系数高。下列有关预防高处坠落的做法，错误的是（）。","options":["作业人员无需系好安全带","施工单位的主要负责人要对本单位的安全生产全面负责","脚手架的作业人员上下应有专用通道，不得攀爬架体"],"answer":"A","explanation":"第五十七条：从业人员在作业过程中，应当……正确佩戴和使用劳动防护用品；高处作业属危险性作业，作业人员必须系挂安全带，不系安全带为错误做法。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0381","type":"单选题","category":"电气作业安全管理","question":"电焊工（）属于违章作业。","options":["转移工作地点时，在切断电焊机电源情况下移动焊机","切断电源后检查电焊机的故障","带电改接电焊机接头"],"answer":"C","explanation":"第五十七条：从业人员在作业过程中，应当遵守本单位的安全生产规章制度和操作规程；电焊机接头改接属电气接线作业，应断电并由持证电工操作，带电改接属违章作业。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0382","type":"单选题","category":"电气作业安全管理","question":"电焊机的电源接线、修理应由（）人来进行。","options":["持有特种作业操作证的电工","持有特种作业操作证的焊工","持有特种作业操作证的电工或焊工"],"answer":"A","explanation":"第三十条：特种作业人员必须按照国家有关规定经专门的安全作业培训，取得相应资格，方可上岗作业；电工作业列入特种作业目录，电焊机电源接线、修理应由持电工特种作业操作证的人员进行。 〔注：原依据《特种作业人员安全技术培训考核管理规定》（安监总局令第30号）已于2026-06-01被应急管理部令第19号取代；取消3年复审、改为6年换证，理论考试不限次、实操可考5次、跨省通办、学历要求放宽〕","basis":"《中华人民共和国安全生产法》（2021年修订版）、《特种作业人员安全技术培训考核管理规定》（应急管理部令第19号，2026-06-01施行）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0383","type":"单选题","category":"现场操作规范","question":"进入有限空间作业，应遵循的基本原则是（）。","options":["先通风、再检测、后作业","先进入、再检测、后作业","先检测、再进入、后作业"],"answer":"A","explanation":"第十二条：有限空间作业应当严格遵守“先通风、再检测、后作业”的原则；未经通风和检测合格，任何人员不得进入有限空间作业。 〔注：原依据《工贸企业有限空间作业安全管理与监督暂行规定》（安监总局令第59号）已于2024-01-01被《工贸企业有限空间作业安全规定》（应急管理部令第13号，2024-01-01施行）；另GB 46768-2025《有限空间作业安全技术规范》已收录〕","basis":"《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全生产监督管理总局令第59号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0384","type":"单选题","category":"现场操作规范","question":"在进入有限空间作业前，必须先进行气体检测，原因是（）。","options":["避免易燃、有毒气体或氧气不足给人员造成伤害","查看是否有沼气，以便作为能源使用","可有效提供工作效率"],"answer":"A","explanation":"第十二条：检测指标包括氧浓度、易燃易爆物质（可燃性气体、爆炸性粉尘）浓度、有毒有害气体浓度；进入前先检测，目的是防止易燃、有毒气体或氧含量不足造成伤害。 〔注：原依据《工贸企业有限空间作业安全管理与监督暂行规定》（安监总局令第59号）已于2024-01-01被《工贸企业有限空间作业安全规定》（应急管理部令第13号，2024-01-01施行）；另GB 46768-2025《有限空间作业安全技术规范》已收录〕","basis":"《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全生产监督管理总局令第59号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0385","type":"单选题","category":"从业人员安全生产权利义务","question":"进入有限空间的作业人员对违章指挥，强令冒险作业，安全措施未落实等情况下，作业人员（）作业。","options":["有权拒绝","不能拒绝","可以正常"],"answer":"A","explanation":"第五十四条：从业人员有权对本单位安全生产工作中存在的问题提出批评、检举、控告；有权拒绝违章指挥和强令冒险作业。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0386","type":"单选题","category":"安全检查与隐患治理","question":"进行密闭空间风险评估的基本步骤为：分拆工序、危害识别、风险分析以及（）。","options":["制定控制措施","善后处理","报告上级"],"answer":"A","explanation":"第四十一条：生产经营单位应当建立安全风险分级管控制度，按照安全风险分级采取相应的管控措施（含辨识、评估、控制等步骤）；密闭空间风险评估应按工序拆解、危害识别、风险分析、制定控制措施的程序进行。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0387","type":"单选题","category":"安全生产","question":"生产经营单位未如实记录安全生产教育和培训情况的，责令限期改正，可以处（ ）的罚款。","options":["二万元以下","三万元以下","五万元以下","十万元以下"],"answer":"D","explanation":"《中华人民共和国安全生产法》第九十七条","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0388","type":"单选题","category":"劳动防护用品管理","question":"个人防护用品是劳动保护的辅助措施，（）作为职工的福利的一部分发放。","options":["不能","可以","随时"],"answer":"A","explanation":"第四十五条：生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用；劳动防护用品是劳动保护的辅助措施，依法强制配备，不得作为职工福利发放。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0389","type":"单选题","category":"特种作业安全管理","question":"特种作业人员应按规定参加特种作业人员培训，取得（）资格证书，并定期复审。","options":["电工","安全培训","特种作业操作"],"answer":"C","explanation":"第三十条：特种作业人员必须按照国家有关规定经专门的安全作业培训，取得相应资格，方可上岗作业；《特种作业人员安全技术培训考核管理规定》明确特种作业人员应取得特种作业操作资格证书并定期复审。 〔注：原依据《特种作业人员安全技术培训考核管理规定》（安监总局令第30号）已于2026-06-01被应急管理部令第19号取代；取消3年复审、改为6年换证，理论考试不限次、实操可考5次、跨省通办、学历要求放宽〕 〔内容提示：19号令已取消\"3年复审\"，改为\"6年换证\"；题干中\"并定期复审\"表述按新规应修正为\"并按规定换证\"〕","basis":"《中华人民共和国安全生产法》（2021年修订版）、《特种作业人员安全技术培训考核管理规定》（应急管理部令第19号，2026-06-01施行）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0390","type":"单选题","category":"电气作业安全管理","question":"变配电间门（），高压间门应向低压间开，相邻配电间门应双向开。门应为非燃烧体或难燃烧体材料制作的实体门。","options":["向外开","向内开","无特别要求"],"answer":"A","explanation":"第6.2.2条：变压器室、配电室、电容器室的门应向外开启；相邻配电室之间有门时，应采用不燃材料制作的双向弹簧门。 〔依据法规已收录条款库：GB 50053-2013《20kV及以下变电所设计规范》〕","basis":"《20kV及以下变电所设计规范》（GB 50053-2013）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0391","type":"单选题","category":"现场操作规范","question":"进入有限空间作业安全要求，应执行作业许可审批制度，首先采取可靠的（）措施，按规定进行气体检测，合格后方可进入，要有专人监护，采取便于有限空间内外人员联系的措施。","options":["领导同意","置换或通风措施","静电防护","降温"],"answer":"B","explanation":"第十一条：应当采取可靠的隔断（隔离）措施；第十二条：先通风、再检测、后作业；第十九条：监护人员不得离开作业现场，并与作业人员保持联系。 〔注：原依据《工贸企业有限空间作业安全管理与监督暂行规定》（安监总局令第59号）已于2024-01-01被《工贸企业有限空间作业安全规定》（应急管理部令第13号，2024-01-01施行）；另GB 46768-2025《有限空间作业安全技术规范》已收录〕","basis":"《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全生产监督管理总局令第59号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0392","type":"单选题","category":"安全检查与隐患治理","question":"根据隐患排查的结果，及时进行整改。无法立即整改的，要建立台账实行闭环管理，切实做到（）、措施、资金、期限和应急预案“五落实”。","options":["责任","保险与评估","风险管理"],"answer":"A","explanation":"《安全生产事故隐患排查治理暂行规定》第十五条：重大事故隐患治理方案应当包括治理的目标和任务、采取的方法和措施、经费和物资的落实、负责治理的机构和人员、治理的时限和要求、安全措施和应急预案（即责任、措施、资金、期限、应急预案“五落实”）；无法立即整改的应建立台账闭环管理。 〔依据法规已收录条款库：《安全生产事故隐患排查治理暂行规定》〕","basis":"《安全生产事故隐患排查治理暂行规定》（国家安全生产监督管理总局令第16号）、《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0393","type":"单选题","category":"危险化学品安全","question":"易燃易爆场所不能穿（）。","options":["纯棉工作服","化纤工作服","防静电工作服"],"answer":"B","explanation":"GB 12158-2006 第6.1.2条：在静电危险场所，所有属于静电导体的物体必须接地；易燃易爆场所应穿防静电服、防静电鞋，化纤工作服易产生静电，禁止穿戴。 〔依据法规已收录条款库：GB 12158-2024《防止静电事故通用要求》；替代GB 12158-2006《防止静电事故通用导则》及GB 13348-2009〕","basis":"GB 12158-2024《防止静电事故通用要求》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0394","type":"单选题","category":"危险化学品安全","question":"防止静电的主要措施是（）。","options":["接地","通风","防潮"],"answer":"A","explanation":"第6.1.2条：在静电危险场所，所有属于静电导体的物体必须接地；接地是防止静电积聚、避免静电火花的最基本措施。 〔依据法规已收录条款库：GB 12158-2024《防止静电事故通用要求》；替代GB 12158-2006《防止静电事故通用导则》及GB 13348-2009〕","basis":"GB 12158-2024《防止静电事故通用要求》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0395","type":"单选题","category":"应急管理","question":"化学品泄漏事故发生时,下面（）做法是错误的。","options":["报警","进行交通管制","所有人员参加事故救援"],"answer":"C","explanation":"第八十五条：参与事故抢救的部门和单位应当服从统一指挥，采取有效的应急救援措施，并根据事故救援的需要采取警戒、疏散等措施；危险化学品泄漏时，救援应由专业人员按预案组织进行，并非所有人员均应参加救援。","basis":"《中华人民共和国安全生产法》（2021年修订版）、《危险化学品安全管理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0396","type":"单选题","category":"危险化学品安全","question":"在易燃易爆场所穿（）最危险。","options":["布鞋","胶鞋","带钉鞋"],"answer":"C","explanation":"易燃易爆场所应穿防静电鞋、禁止穿带钉鞋；带钉鞋走动时易产生火花，最危险（防静电相关标准要求穿防静电鞋、不得穿易产生火花或静电的鞋靴）。 〔依据法规已收录条款库：GB 12158-2024《防止静电事故通用要求》；替代GB 12158-2006《防止静电事故通用导则》及GB 13348-2009〕","basis":"GB 12158-2024《防止静电事故通用要求》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0397","type":"单选题","category":"通用安全法律法规","question":"电气工具和用具应由专人保管，每六个月由（）进行定期检查。","options":["安监部门","劳动部门","电气试验单位"],"answer":"C","explanation":"《电力安全工作规程》：电气工具和用具应由专人保管，每六个月由电气试验单位进行定期检查（不合格不得使用）。","basis":"《电力安全工作规程》等电气安全规程（电气工具每6个月定期检查）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0398","type":"单选题","category":"现场操作规范","question":"密闭容器内作业存在的主要危险点是（），应采取（）的措施。","options":["缺氧窒息，（加装轴流风机）进行强制通风","爆炸，不准同时进行电焊及气焊作业","缺氧窒息，打开人孔进行通风"],"answer":"A","explanation":"第十五条：在有限空间作业过程中，工贸企业应当采取通风措施，保持空气流通；密闭容器（有限空间）作业主要危险为缺氧窒息，应采取强制通风等措施。 〔注：原依据《工贸企业有限空间作业安全管理与监督暂行规定》（安监总局令第59号）已于2024-01-01被《工贸企业有限空间作业安全规定》（应急管理部令第13号，2024-01-01施行）；另GB 46768-2025《有限空间作业安全技术规范》已收录〕","basis":"《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全生产监督管理总局令第59号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0399","type":"单选题","category":"安全培训教育","question":"根据法律规定，生产经营单位应当对从业人员进行安全生产教育和培训。一般情况下，对新从业人员要进行（）安全生产教育培训。","options":["一级","二级","三级","四级"],"answer":"C","explanation":"第十二条：加工、制造业等生产单位的其他从业人员，在上岗前必须经过厂（矿）、车间（工段、区、队）、班组三级安全培训教育。 〔依据法规已收录条款库：《生产经营单位安全培训规定》〕","basis":"《生产经营单位安全培训规定》（国家安全生产监督管理总局令第3号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0400","type":"单选题","category":"从业人员安全生产权利义务","question":"以下生产经营单位从业人员的安全生产权利表述不准确的是（）","options":["了解生产经营单位存在的危险有害因素和职业危害，并获得相应的保护","对本单位的安全生产工作提出建议","有权要求生产经营单位为其购买安全生产责任保险","有权拒绝违章指挥和强令冒险作业"],"answer":"C","explanation":"第五十一条：国家鼓励生产经营单位投保安全生产责任保险；属于国家规定的高危行业、领域的生产经营单位，应当投保安全生产责任保险（投保安责险是单位义务/政策鼓励，并非从业人员可单方要求购买的权利）；从业人员权利见第五十四条等。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0401","type":"单选题","category":"工伤保险","question":"所谓“工伤认定”是指有关部门，根据国家有关法律、法规的规定确认职工所受伤害是因工还是非因工造成的（）。“被认定为工伤”，是受伤害职工能够享受工伤保险待遇的最关键的前提条件。","options":["情况","地点","事实"],"answer":"C","explanation":"工伤认定是社会保险行政部门根据《工伤保险条例》确认职工所受伤害是否因工作原因（因工）造成的法定行政确认行为，其核心在于确认“因工”这一事实（第十四条、第十七条等）。 〔依据法规已收录条款库：《工伤保险条例》〕","basis":"《工伤保险条例》（国务院令第586号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0402","type":"单选题","category":"通用安全法律法规","question":"在有限空间作业时，（ ）是导致缺氧窒息的常见原因。","options":["空间内存在大量生锈的金属物品","空间内原本残留有二氧化碳等惰性气体","空间内进行涂装作业，有机溶剂挥发","空间内微生物呼吸作用消耗氧气"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0403","type":"单选题","category":"重大危险源管理","question":"新安法中特别加强了对重大危险源的监控，生产经营单位对重大危险源应当采取的安全管理措施不包括（）","options":["定期进行检测、评估、监控","对重大危险源登记建档","重大危险源应远离厂区"],"answer":"C","explanation":"第四十条：生产经营单位对重大危险源应当登记建档，进行定期检测、评估、监控，并制定应急预案，告知从业人员和相关人员在紧急情况下应当采取的应急措施（所列管理措施不含“重大危险源应远离厂区”）。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0404","type":"单选题","category":"消防安全","question":"根据《建筑防火通用规范》（GB 55037-2022），防火墙的耐火极限不应低于多少？其中甲、乙类厂房和甲、乙、丙类仓库内的防火墙，耐火极限还应不低于多少？","options":["2.00h；3.00h","3.00h；4.00h","2.50h；3.00h","3.00h；3.50h"],"answer":"B","explanation":"《建筑防火通用规范》（GB 55037-2022）第 6.1.3 条","basis":"《建筑防火通用规范》（GB 55037-2022）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0405","type":"单选题","category":"职业病防治","question":"《职业病防治法》规定：用人单位应当设置或者指定职业卫生管理机构或者组织，配备专职或者兼职的（），负责本单位的职业病防治工作。","options":["职业卫生管理人员","应急管理人员","工会督察员"],"answer":"A","explanation":"第二十条：用人单位应当采取下列职业病防治管理措施：（一）设置或者指定职业卫生管理机构或者组织，配备专职或者兼职的职业卫生管理人员，负责本单位的职业病防治工作。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0406","type":"单选题","category":"职业病防治","question":"医疗机构建设项目可能产生放射性职业病危害的，建设单位在可行性论证阶段应当向（）提交职业病危害预评价报告。","options":["安全生产监督管理部门","卫生行政部门","劳动保障行政部门"],"answer":"B","explanation":"第十七条：医疗机构建设项目可能产生放射性职业病危害的，建设单位应当向卫生行政部门提交放射性职业病危害预评价报告。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0407","type":"单选题","category":"安全生产责任制","question":"在生产经营单位的安全生产工作中，最基本的安全管理制度是（）。","options":["安全生产目标管理制","安全生产承包责任制","安全生产奖励制度","安全生产责任制"],"answer":"D","explanation":"《中华人民共和国安全生产法》（2021年修订版）第四条、第二十一条、第二十二条：生产经营单位应当建立健全并落实全员安全生产责任制，加强安全生产标准化建设；全员安全生产责任制应当明确各岗位的责任人员、责任范围和考核标准等内容。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0408","type":"单选题","category":"安全生产主体责任","question":"生产经营单位的安全生产管理机构是专门负责（）的内设机构，其工作人员是安全生产管理人员。","options":["安全生产管理专职或兼职","安全生产管理专业","安全生产教育培训专职","安全生产监督管理专职"],"answer":"D","explanation":"《中华人民共和国安全生产法》（2021年修订版）第二十四条：矿山、金属冶炼、建筑施工、运输单位和危险物品的生产、经营、储存、装卸单位，应当设置安全生产管理机构或者配备专职安全生产管理人员；第二十五条明确安全生产管理机构及安全生产管理人员履行安全生产监督管理职责。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0409","type":"单选题","category":"危险化学品安全","question":"危险化学品的生产、储存、使用单位，应当在生产、储存和使用场所设置（）装置。","options":["防爆、报警","通信、报警","通风、报警","防爆、通风"],"answer":"B","explanation":"《危险化学品安全管理条例》第二十一条：生产、储存危险化学品的单位，应当在其作业场所设置通信、报警装置，并保证处于适用状态。","basis":"《危险化学品安全管理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0410","type":"单选题","category":"应急管理","question":"县级以上地方各级人民政府应当组织有关部门制定本行政区域内生产安全事故（），建立应急救援体系。","options":["预防措施","管理检查措施","应急救援预案","善后赔偿事宜"],"answer":"C","explanation":"《中华人民共和国安全生产法》（2021年修订版）第八十条：县级以上地方各级人民政府应当组织有关部门制定本行政区域内生产安全事故应急救援预案，建立应急救援体系。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0411","type":"单选题","category":"安全管理","question":"根据《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025），该标准规定的安全生产标准化管理体系一级要素共有多少个？","options":["8 个","9 个","10 个","13 个"],"answer":"C","explanation":"GB/T 33000-2025 第 4 章至第 13 章（领导作用、基础保障、策划、安全风险分级管控、事故隐患排查治理、人员管理、现场管理、应急准备与处置、检查评价、持续改进）","basis":"《大中型企业安全生产标准化管理体系要求》（GB/T 33000-2025）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0412","type":"单选题","category":"现场操作规范","question":"气焊施工现场的乙炔瓶与火源的距离不得少于（）。","options":["5m","10m","15m","20m"],"answer":"B","explanation":"《焊接与切割安全》（GB 9448）相关规定：进行焊接、切割等动火作业时，气瓶应与明火、火源保持安全距离，作业点周围易燃物应满足10m安全距离要求。","basis":"《焊接与切割安全》（GB 9448）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0413","type":"单选题","category":"劳动防护用品管理","question":"正确佩戴安全帽有两个要点：一是安全帽的帽衬与帽壳之间应有一定间隙；二是（）。","options":["必须系紧下鄂带","必须时刻配带","必须涂上黄色"],"answer":"A","explanation":"《头部防护 安全帽》（GB 2811）及安全帽佩戴使用相关规定：安全帽应正确佩戴，帽衬与帽壳之间应留有间隙，并必须系紧下颏带。 〔依据法规已收录条款库：GB 2811-2019《头部防护 安全帽》〕","basis":"《头部防护 安全帽》（GB 2811）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0414","type":"单选题","category":"职业病防治","question":"非法用工单位对其患职业病的职工（）。","options":["不承担赔偿责任","适当承担赔偿责任","依法承担赔偿责任"],"answer":"C","explanation":"《中华人民共和国职业病防治法》第五十八条：职业病病人除依法享有工伤保险外，依照有关民事法律，尚有获得赔偿的权利的，有权向用人单位提出赔偿要求。（非法用工单位对其患职业病的职工依法承担赔偿责任）","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0415","type":"单选题","category":"消防安全","question":"电器着火的正确扑救方法是（）","options":["直接用水或泡沫灭火器灭火","先切断电源，再用水或泡沫灭火器灭火","直接用干粉灭火器灭火","先切断电源，再用干粉灭火器或二氧化碳灭火器灭火"],"answer":"D","explanation":"GB 50140-2005《建筑灭火器配置设计规范》第4.2.5条：E类火灾场所应选择磷酸铵盐干粉灭火器、碳酸氢钠干粉灭火器、卤代烷灭火器或二氧化碳灭火器，但不得选用装有金属喇叭喷筒的二氧化碳灭火器。","basis":"GB 50140-2005《建筑灭火器配置设计规范》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0416","type":"单选题","category":"特种设备安全管理","question":"对特种设备的管理，国家实行（）的监管。","options":["定期检查","不定期检查","全过程"],"answer":"C","explanation":"《中华人民共和国特种设备安全法》第四条：国家对特种设备的生产、经营、使用，实施分类的、全过程的安全监督管理。","basis":"《中华人民共和国特种设备安全法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0417","type":"单选题","category":"设备安全管理","question":"国家对严重危及生产安全的工艺、设备实行（）。","options":["专管制度","淘汰制度","责任制度"],"answer":"B","explanation":"《中华人民共和国安全生产法》（2021年修订版）第三十八条：国家对严重危及生产安全的工艺、设备实行淘汰制度，具体目录由国务院应急管理部门会同国务院有关部门制定并公布。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0418","type":"单选题","category":"现场操作规范","question":"生产经营单位进行爆破、吊装等危险作业，应当安排（）进行现场安全管理，确保操作规程的遵守和安全措施的落实。","options":["专门人员","专业人员","非专业人员","任何人都行"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第四十三条：生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0419","type":"单选题","category":"通用安全法律法规","question":"火灾致人死亡的最主要原因是（）","options":["吸入有毒烟气窒息死亡","直接被火烧死","人员拥挤致死","跳楼或惊吓致死"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0420","type":"单选题","category":"消防安全","question":"根据《建筑防火通用规范》（GB 55037-2022），一类高层民用建筑的耐火等级应为？","options":["二级","一级","三级","不低于二级"],"answer":"B","explanation":"GB 55037-2022 第 5.3.1 条","basis":"《建筑防火通用规范》（GB 55037-2022）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0421","type":"单选题","category":"通用安全法律法规","question":"阻拦报火警或者谎报火警的，给予（）处罚。","options":["劳动教养","撤掉其电话","警告、罚款或者十日以上十五日以下拘留"],"answer":"C","explanation":"《消防法》（2021修正）第六十四条：阻拦报火警或者谎报火警的，处警告、罚款或者十日以上十五日以下拘留","basis":"《中华人民共和国消防法》（2021修正）第六十四条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0422","type":"单选题","category":"消防","question":"遇到消防车执行灭火或抢险救援任务时，社会车辆及行人应当（）。","options":["靠边让行","穿插其中","超越消防车"],"answer":"A","explanation":"《中华人民共和国消防法》（2021年修订版）第四十七条：消防车、消防艇前往执行火灾扑救或者应急救援任务……其他车辆、船舶以及行人应当让行，不得穿插超越。","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0423","type":"单选题","category":"通用安全法律法规","question":"公共娱乐场所安全出口的疏散门应（）。","options":["自由开启","向外开启","向内开启"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0424","type":"单选题","category":"通用安全法律法规","question":"在浓烟中逃生，逃生姿势也很重要，（）是正确的逃生姿势。","options":["昂首挺胸步行前进","设法蹲低或贴近地面爬行","正常前行"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0425","type":"单选题","category":"通用安全法律法规","question":"以下经常使用的物品中属于易燃易爆物品的是（）。","options":["摩丝","餐洗剂","洗发水"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0426","type":"单选题","category":"通用安全法律法规","question":"当在狭小空间或空气不流通空间进行搭设、使用和拆除脚手架作业时，应采取的措施不包括（ ）","options":["保证足够的氧气供应措施","防止有毒有害、易燃易爆物质积聚","大量喷洒空气清新剂","加强通风"],"answer":"C","explanation":"《GB 55023-2022 施工脚手架通用规范》5.1.4：当在狭小空间或空气不流通空间进行搭设、使用和拆除脚手架作业时，应采取保证足够的氧气供应措施，并应防止有毒有害、易燃易爆物质积聚。","basis":"施工脚手架通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0427","type":"单选题","category":"通用安全法律法规","question":"遇到地铁发生火灾，错误的处理措施是（）。","options":["按照车站工作人员的引导有序疏散","跳入铁轨逃生","用车厢内的消防器材控制小火灾"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0428","type":"单选题","category":"消防安全","question":"可燃气体火灾场所不应配置（）灭火器。","options":["泡沫灭火器","二氧化碳灭火器","碳酸氢钠干粉灭火器"],"answer":"A","explanation":"GB 50140-2005《建筑灭火器配置设计规范》第4.2.3条：C类火灾场所应选择磷酸铵盐干粉灭火器、碳酸氢钠干粉灭火器、二氧化碳灭火器或卤代烷灭火器。","basis":"GB 50140-2005《建筑灭火器配置设计规范》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0429","type":"单选题","category":"职业病防治","question":"职业病是指劳动者在职业活动中，因接触粉尘、放射性物质和其他有毒、有害（）而引起的疾病。","options":["因素","物质","环境"],"answer":"A","explanation":"《中华人民共和国职业病防治法》第二条：本法所称职业病，是指企业、事业单位和个体经济组织等用人单位的劳动者在职业活动中，因接触粉尘、放射性物质和其他有毒、有害因素而引起的疾病。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0430","type":"单选题","category":"通用安全法律法规","question":"关于车辆自燃，错误的是（）。","options":["立即靠边停车、熄火，关闭电源能够迅速断开油泵，减少汽油燃烧","人员在车内等待救援","拨打119火警电话"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0431","type":"单选题","category":"通用安全法律法规","question":"发生骨折后，应及时将骨折部位固定，固定时应（）。","options":["尽可能紧","尽可能松","松紧适当，不影响血液流动为宜"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0432","type":"单选题","category":"通用安全法律法规","question":"中暑常见的降温方式有（）。","options":["脱掉患者多余衣物，洒水在患者身上","将化学冰袋贴身放在患者颈部或腋下等主动脉部位","以上都对"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0433","type":"单选题","category":"消防安全","question":"根据《建筑防火通用规范》（GB 55037-2022），关于仓库内辅助用房的设置，下列正确的是？","options":["甲、乙类仓库内不应设置办公室、休息室等辅助用房","甲、乙类仓库内可设置办公室，但应设独立安全出口","丙、丁类仓库内不得设置任何办公室","仓库内可以设置员工宿舍"],"answer":"A","explanation":"GB 55037-2022 第 4.2.7 条","basis":"《建筑防火通用规范》（GB 55037-2022）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0434","type":"单选题","category":"特殊作业","question":"依据 《危险化学品企业特殊作业安全规范》GB 30871-2022，受限空间作业前与可能危及安全的管道进行安全隔离时，下列做法正确的是？","options":["采用关闭阀门代替盲板作为隔断","应采用加盲板或拆除一段管道的方式进行隔离","采用水封代替盲板作为隔断","保持阀门微开便于泄压"],"answer":"B","explanation":"GB 30871-2022 第 6.1 条 a 款","basis":"《危险化学品企业特殊作业安全规范》GB 30871-2022","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0435","type":"单选题","category":"应急救护技能","question":"在决定施行心肺复苏术前，应检查患者颈动脉（）。","options":["1～3s","5～10s","3～5s"],"answer":"B","explanation":"T/CRHA 308—2026《中国心肺复苏培训体系建设规范》相关规定：实施心肺复苏前应评估患者大动脉搏动/呼吸，检查时间约5～10秒。","basis":"T/CRHA 308—2026《中国心肺复苏培训体系建设规范》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0436","type":"单选题","category":"通用安全法律法规","question":"一氧化碳中毒一般经过（）的途径进入人体。","options":["呼吸道","消化道","皮肤粘膜"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0437","type":"单选题","category":"通用安全法律法规","question":"进入人员密集场所，做好安全防范尤为重要。以下哪种行为是不安全的（）。","options":["注意观察安全出口位置和疏散通道","发现有大批人群涌来，尽量避开，等人群离开","在拥挤的人流中贸然系鞋带、弯腰捡东西"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0438","type":"单选题","category":"从业人员安全生产权利义务","question":"各班组、岗位人员每班定期开展班组、岗位隐患排查，发现隐患应（），并协助整改，若不能及时整改，则采取临时措施避免事故发生。","options":["立即记录","不必立即上报","立即上报"],"answer":"C","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五十九条：从业人员发现事故隐患或者其他不安全因素，应当立即向现场安全生产管理人员或者本单位负责人报告；接到报告的人员应当及时予以处理。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0439","type":"单选题","category":"现场操作规范","question":"依据《危险化学品企业特殊作业安全规范》 GB 30871-2022，遇几级风以上（含）天气，禁止露天动火作业？","options":["四级","五级","六级","七级"],"answer":"B","explanation":"GB 30871-2022 第 5.2.15 条","basis":"《危险化学品企业特殊作业安全规范》 GB 30871-2022","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0440","type":"单选题","category":"通用安全法律法规","question":"（）有权向安全监管监察部门举报安全生产非法违法行为。","options":["任何单位和个人","只有单位在职员工","只有安全监察人员"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第七十四条：任何单位或者个人对事故隐患或者安全生产违法行为，均有权向负有安全生产监督管理职责的部门报告或者举报。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0441","type":"单选题","category":"现场操作规范","question":"根据安全操作规范，电气设备停电检修时，必须执行的首要操作是？","options":["断开电源并悬挂“禁止合闸，有人工作”警示牌","直接对设备进行验电操作","拆除设备的接地保护线","办理工作票后即可开始检修"],"answer":"A","explanation":"《GB 26860-2011 电力安全工作规程》6.5.1：一经合闸即可送电到工作地点的操作把手上，应悬挂“禁止合闸，有人工作！”标示牌；检修前应先停电。","basis":"《电力安全工作规程》（停电检修悬挂警示牌）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0442","type":"单选题","category":"现场操作规范","question":"根据有限空间作业安全规范，进入有限空间作业前，必须首先进行的操作是？","options":["通风换气，确保有限空间内氧气含量合格","直接进入作业，同时开启通风设备","办理工作票后即可进入","先进行气体检测，再通风换气"],"answer":"A","explanation":"《GB 46768-2025 有限空间作业安全技术规范》5.7.1：作业人员应在有限空间外上风侧开启出入口及其他与外界大气环境相连通的设施，进行自然通风；《GB 46768-2025 有限空间作业安全技术规范》5.9.1：初始检测结果符合下列所有条件时，方可实施有限空间作业（氧含量为19.5% VOL~23.5% VOL）。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0443","type":"单选题","category":"现场操作规范","question":"根据安全规范，所有现场作业人员必须佩戴的基础个人防护用品是？","options":["安全帽","安全带","绝缘手套","护目镜"],"answer":"A","explanation":"《中华人民共和国安全生产法》第四十五条：生产经营单位必须为从业人员提供符合标准的劳动防护用品（如安全帽），并监督、教育正确佩戴、使用。","basis":"《中华人民共和国安全生产法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0444","type":"单选题","category":"现场操作规范","question":"根据有限空间作业安全规范，有限空间作业必须严格执行的制度是？","options":["单人作业制","双人作业制，一人作业一人监护","先通风、再检测、后作业，全程专人监护","办理工作票后即可进入作业"],"answer":"C","explanation":"《GB 46768-2025 有限空间作业安全技术规范》5.7.1：作业人员应在有限空间外上风侧开启出入口及其他与外界大气环境相连通的设施，进行自然通风；《GB 46768-2025 有限空间作业安全技术规范》5.9.1：初始检测结果符合下列所有条件时，方可实施有限空间作业；《GB 46768-2025 有限空间作业安全技术规范》6.3.1：监护人应佩戴明显标识在有限空间外全程持续监护，不应离开作业现场或进入有限空间参与作业。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0445","type":"单选题","category":"现场操作规范","question":"根据高处作业安全规范，高处作业时，严禁将安全带挂在什么物体上？","options":["移动或不牢固的物体上","牢固的钢结构构件上","专用的安全带挂点上","牢固的混凝土构件上"],"answer":"A","explanation":"《JGJ 80-2016 建筑施工高处作业安全技术规范》：安全带应系挂在牢固的构件或专设安全绳上，严禁挂在移动或不牢固物体（如棱角、脚手架杆件）上。","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0446","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，发现人员触电后，必须首先采取的措施是？","options":["立即切断电源，或用干燥的绝缘物体使触电者脱离电源","立即对触电者进行心肺复苏","立即拨打急救电话","立即将触电者转移到安全区域"],"answer":"A","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0447","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，成人人工呼吸时，每次吹气的时间和潮气量分别是？","options":["吹气时间1秒，潮气量500-600毫升","吹气时间2秒，潮气量300-400毫升","吹气时间1秒，潮气量800-1000毫升","吹气时间2秒，潮气量500-600毫升"],"answer":"A","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》：成人人工呼吸每次吹气约1秒，潮气量使胸廓隆起（约500~600 mL），避免过度通气。","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0448","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，使用AED时，电极片的正确粘贴位置是？","options":["一片贴在患者右上胸壁（锁骨下方），一片贴在患者左乳头外侧","两片都贴在患者胸前","一片贴在患者胸前，一片贴在患者背后","两片都贴在患者腹部"],"answer":"A","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》：AED 电极片位置——右锁骨下（胸骨右缘）、左腋前线（心尖部）。","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0449","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，止血带止血法适用于以下哪种情况？","options":["四肢严重出血，用其他止血方法无法止血时","头部出血","胸部出血","腹部出血"],"answer":"A","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0450","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于烧伤的患者，急救的核心步骤是？","options":["立即用大量流动的冷水冲洗烧伤部位15-30分钟，降温止痛，再用干净的纱布覆盖烧伤部位","立即用冰块直接敷在烧伤部位","立即在烧伤部位涂抹牙膏、酱油等物品","立即将烧伤部位的水泡刺破"],"answer":"A","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0451","type":"单选题","category":"安全生产","question":"生产经营单位应当在有较大危险因素的生产经营场所和有关设施、设备上，设置明显的（ ）。","options":["安全警示标志","安全提示标志","安全宣传标语","安全广告牌"],"answer":"A","explanation":"《中华人民共和国安全生产法》第三十五条：生产经营单位应当在有较大危险因素的生产经营场所和有关设施、设备上，设置明显的安全警示标志。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0452","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于腹部外伤导致的肠管脱出患者，急救的核心措施是？","options":["立即用干净的纱布或毛巾覆盖脱出的肠管，用碗或盆扣住，避免肠管干燥、受压，立即拨打急救电话","立即将脱出的肠管塞回腹腔","立即给患者喝水、吃东西","立即将患者转运到医院"],"answer":"A","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0453","type":"单选题","category":"安全生产","question":"生产经营单位使用被派遣劳动者的，应当将被派遣劳动者纳入本单位从业人员（）管理，统一开展安全教育培训。","options":["统一","分开","专项","外包"],"answer":"A","explanation":"《中华人民共和国安全生产法》第二十八条：生产经营单位使用被派遣劳动者的，应当将被派遣劳动者纳入本单位从业人员统一管理，对被派遣劳动者进行岗位安全操作规程和安全操作技能的教育和培训。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0454","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于化学品眼睛接触中毒患者，以下哪种做法是正确的？","options":["用大量流动的清水或生理盐水冲洗眼睛，至少冲洗15分钟","用手揉搓眼睛","用热水冲洗眼睛","在眼睛里滴眼药水"],"answer":"A","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0455","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于心脏骤停的患者，心肺复苏的黄金抢救时间是？","options":["4分钟内","10分钟内","15分钟内","30分钟内"],"answer":"A","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》：心搏骤停的黄金抢救时间约4分钟，尽早实施心肺复苏（CPR）与除颤（AED）可显著提高存活率。","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0456","type":"单选题","category":"现场操作规范","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业过程中，气体检测数据应至少每（）记录一次，确保作业全程安全可控。","options":["15分钟","30分钟","1小时","2小时"],"answer":"A","explanation":"《GB 46768-2025 有限空间作业安全技术规范》6.2.3：作业过程中应对作业人活动区域进行实时气体监测，每15min记录1个瞬时值。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0457","type":"单选题","category":"应急救护技能","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业的应急救援人员必须佩戴（）方可进入有限空间实施救援，严禁无防护盲目施救。","options":["过滤式防毒面具","医用口罩","正压式空气呼吸器","防尘口罩"],"answer":"C","explanation":"《GB 46768-2025 有限空间作业安全技术规范》5.12.2：气体检测结果符合5.9.1所有条件，但作业过程中可能缺氧或有毒有害气体浓度可能突然升高的，作业人应……佩戴下列呼吸防护用品之一：……c) 正压式自给闭路压缩氧气呼吸器；《GB 46768-2025 有限空间作业安全技术规范》6.2.8：应急救援人员应在做好危害控制和自身防护的前提下开展救援，不应盲目施救。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0458","type":"单选题","category":"现场操作规范","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业的监护人员必须全程在岗监护，严禁（）。","options":["携带手机","与作业人员沟通","擅自离岗","记录气体数据"],"answer":"C","explanation":"《GB 46768-2025 有限空间作业安全技术规范》6.3.1：监护人应佩戴明显标识在有限空间外全程持续监护，不应离开作业现场或进入有限空间参与作业。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0459","type":"多选题","category":"通用安全法律法规","question":"作业过程中出现以下哪些情况时，作业人应立即中断作业，撤离有限空间（）。","options":["作业人出现身体不适","气体检测报警仪报警","安全防护设备设施失效","监护人或作业负责人下达撤离命令"],"answer":"ABCD","explanation":"《GB 46768-2025 有限空间作业安全技术规范》6.2.5：作业期间发生下列情况之一时，作业人应立即中断作业，撤离有限空间：a) 作业人出现身体不适；b) 气体检测报警仪报警；c) 安全防护设备设施失效；d) 监护人或作业负责人下达撤离命令；e) 其他可能危及作业人生命安全的情况。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0460","type":"多选题","category":"通用安全法律法规","question":"根据《中华人民共和国突发事件应对法》，下列关于可以预警的自然灾害、事故灾难和公共卫生事件的预警级别的说法，正确的有（）。","options":["预警级别按突发事件紧急程度、发展势态和可能造成的危害程度确定","分一级、二级、三级和四级预警，一级为最高级别","分一级、二级、三级和四级预警，四级为最高级别","一级、二级、三级和四级，分别用红色、橙色、黄色和蓝色标示"],"answer":"ABD","explanation":"《中华人民共和国突发事件应对法》第六十三条：可以预警的自然灾害、事故灾难和公共卫生事件的预警级别，按照突发事件发生的紧急程度、发展势态和可能造成的危害程度分为一级、二级、三级和四级，分别用红色、橙色、黄色和蓝色标示，一级为最高级别。","basis":"《中华人民共和国突发事件应对法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0461","type":"多选题","category":"应急管理","question":"根据《生产安全事故应急条例》，甲省乙市人民政府制定生产安全事故应急救援预案的依据包括（）。","options":["国务院制定的行政法规","应急管理部制定的标准","甲省政府制定的规章","甲省人大常委会颁布的地方法规"],"answer":"ABCD","explanation":"《生产安全事故应急条例》第六条：生产安全事故应急救援预案应当符合有关法律、法规、规章和标准的规定，具有科学性、针对性和可操作性，明确规定应急组织体系、职责分工以及应急救援程序和措施。","basis":"《生产安全事故应急条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0462","type":"多选题","category":"从业人员劳动保护","question":"依据《劳动法》的规定，禁止用人单位安排女工从事的劳动有（）","options":["矿山井下劳动","连续负重10公斤的劳动","国家规定的第四级体力劳动强度的劳动","电焊作业劳动"],"answer":"AC","explanation":"《中华人民共和国劳动法》（2018年修正）第五十九条：禁止安排女职工从事矿山井下、国家规定的第四级体力劳动强度的劳动和其他禁忌从事的劳动。","basis":"《中华人民共和国劳动法》（2018年修正）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0463","type":"多选题","category":"通用安全法律法规","question":"安全生产事故隐患治理措施包括（）","options":["工程技术措施","管理与教育措施","防护措施","应急措施"],"answer":"ABCD","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0464","type":"多选题","category":"安全生产","question":"根据《安全生产法》规定，生产经营单位的从业人员享有以下哪些权利（ ）。","options":["对本单位安全生产工作提出建议","拒绝违章指挥和强令冒险作业","因生产安全事故受到损害后依法享有工伤保险和获得民事赔偿","紧急情况下停止作业或者在采取可能的应急措施后撤离作业场所"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第五十三条：生产经营单位的从业人员有权了解其作业场所和工作岗位存在的危险因素、防范措施及事故应急措施，有权对本单位的安全生产工作提出建议。；《中华人民共和国安全生产法》第五十四条：从业人员有权对本单位安全生产工作中存在的问题提出批评、检举、控告；有权拒绝违章指挥和强令冒险作业。；《中华人民共和国安全生产法》第五十五条：从业人员发现直接危及人身安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所。；《中华人民共和国安全生产法》第五十六条：因生产安全事故受到损害的从业人员，除依法享有工伤保险外，依照有关民事法律尚有获得赔偿的权利的，有权提出赔偿要求。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0465","type":"多选题","category":"安全培训教育","question":"主要负责人和安全生产管理人员，必须具备与本单位所从事的生产经营活动相应的（），须经考核合格后方可任职，并应按规定进行再培训。","options":["安全生产知识","应急救援能力","管理能力","现场控制水平"],"answer":"AC","explanation":"《中华人民共和国安全生产法》（2021年修订版）第二十七条：生产经营单位的主要负责人和安全生产管理人员必须具备与本单位所从事的生产经营活动相应的安全生产知识和管理能力。危险物品的生产、经营、储存、装卸单位以及矿山、金属冶炼、建筑施工、运输单位的主要负责人和安全生产管理人员，应当由主管的负有安全生产监督管理职责的部门对其安全生产知识和管理能力考核合格。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0466","type":"多选题","category":"消防安全","question":"不允许在公共交通工具上携带的易燃易爆危险品有（）。","options":["蒸馏水","汽油、煤油","酒精、油漆","炸药、雷管"],"answer":"BCD","explanation":"《中华人民共和国消防法》（2021年修订版）第二十三条：生产、储存、运输、销售、使用、销毁易燃易爆危险品，必须执行消防技术标准和管理规定；进入生产、储存易燃易爆危险品的场所，必须执行消防安全规定。禁止非法携带易燃易爆危险品进入公共场所或者乘坐公共交通工具。","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0467","type":"多选题","category":"消防安全管理","question":"消防安全重点单位除履行机关、团体、企业、事业等单位应当履行下列哪些消防安全职责？（）","options":["确定消防安全管理人，组织实施本单位的消防安全管理工作","建立消防档案，确定消防安全重点部位，设置防火标志，实行严格管理","实行每日防火巡查，并建立巡查记录","对职工进行岗前消防安全培训，定期组织消防安全培训和消防演练"],"answer":"ABCD","explanation":"《中华人民共和国消防法》（2021年修订版）第十七条：消防安全重点单位除应当履行本法第十六条规定的职责外，还应当履行下列消防安全职责（包括确定消防安全管理人，组织实施本单位的消防安全管理
