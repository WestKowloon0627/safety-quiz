button{border:0;border-radius:9px;padding:10px 14px;background:var(--blue2);color:#fff;cursor:pointer;font-weight:600}button.secondary{background:#e8eef5;color:#24415e}button.ghost{background:transparent;color:var(--blue2);border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red);border:1px solid #f2cccc}button:disabled{opacity:.5;cursor:not-allowed}

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const QUESTIONS=[{"id":"Q0001","type":"判断题","category":"安全生产法律责任","question":"某单位因存在重大事故隐患被依法责令停产停业，但拒不执行整改要求，具有发生重大伤亡事故现实危险的，可能构成危险作业罪。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国刑法》第一百三十四条之一：在生产、作业中违反有关安全管理的规定，有下列情形之一，具有发生重大伤亡事故或者其他严重后果的现实危险的，处一年以下有期徒刑、拘役或者管制：……（二）因存在重大事故隐患被依法责令停产停业、停止施工、停止使用有关设备、设施、场所或者立即采取排除危险的整改措施，而拒不执行的；…… 〔依据法规已收录条款库：《中华人民共和国刑法》〕","basis":"《中华人民共和国刑法》（2020年修正）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0002","type":"判断题","category":"应急管理","question":"按照社会危害程度、影响范围等因素，自然灾害、事故灾难、公共卫生事件分为重大、较大和一般三级。","options":["对","错"],"answer":"B","explanation":"《中华人民共和国突发事件应对法》第三条：按照社会危害程度、影响范围等因素，自然灾害、事故灾难、公共卫生事件分为特别重大、重大、较大和一般四级。法律、行政法规或者国务院另有规定的，从其规定。","basis":"《中华人民共和国突发事件应对法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0003","type":"判断题","category":"消防安全管理","question":"同一建筑物由两个以上单位管理或者使用的，应当明确各方的消防安全责任，并确定责任人对共用的疏散通道、安全出口、建筑消防设施和消防车通道进行统一管理。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国消防法》（2021年修订版）第十八条：同一建筑物由两个以上单位管理或者使用的，应当明确各方的消防安全责任，并确定责任人对共用的疏散通道、安全出口、建筑消防设施和消防车通道进行统一管理。","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0004","type":"判断题","category":"安全生产主体责任","question":"生产经营单位可以设置专职安全生产分管负责人，协助本单位主要负责人履行安全生产管理职责。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第二十五条：生产经营单位的安全生产管理机构以及安全生产管理人员履行下列职责：……生产经营单位可以设置专职安全生产分管负责人，协助本单位主要负责人履行安全生产管理职责。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0005","type":"判断题","category":"设备安全管理","question":"生产经营单位不得关闭、破坏直接关系生产安全的监控、报警、防护、救生设备、设施，或者篡改、隐瞒、销毁其相关数据、信息。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第三十六条：生产经营单位不得关闭、破坏直接关系生产安全的监控、报警、防护、救生设备、设施，或者篡改、隐瞒、销毁其相关数据、信息。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0006","type":"判断题","category":"劳动防护用品管理","question":"生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第四十五条：生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0007","type":"判断题","category":"从业人员安全生产权利义务","question":"生产经营单位的从业人员有权拒绝违章指挥和强令冒险作业。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五十四条：从业人员有权对本单位安全生产工作中存在的问题提出批评、检举、控告；有权拒绝违章指挥和强令冒险作业。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0008","type":"判断题","category":"安全培训教育","question":"从业人员应当接受安全生产教育和培训，掌握本职工作所需的安全生产知识，提高安全生产技能，增强事故预防和应急处理能力。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五十八条：从业人员应当接受安全生产教育和培训，掌握本职工作所需的安全生产知识，提高安全生产技能，增强事故预防和应急处理能力。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0009","type":"判断题","category":"事故报告与调查处理","question":"生产安全事故主要分为：一般事故、较大事故、重大事故、特别重大事故四个等级。","options":["对","错"],"answer":"A","explanation":"《生产安全事故报告和调查处理条例》第三条：根据生产安全事故（以下简称事故）造成的人员伤亡或者直接经济损失，事故一般分为以下等级：特别重大事故、重大事故、较大事故、一般事故。","basis":"《生产安全事故报告和调查处理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0010","type":"判断题","category":"安全生产保险保障","question":"属于国家规定的高危行业、领域的，应当投保安全生产责任保险。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五十一条：国家鼓励生产经营单位投保安全生产责任保险；属于国家规定的高危行业、领域的生产经营单位，应当投保安全生产责任保险。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0011","type":"判断题","category":"安全生产主体责任","question":"生产经营单位的主要负责人负有组织本单位安全生产教育培训、如实记录安全生产教育培训情况的职责。","options":["对","错"],"answer":"B","explanation":"《中华人民共和国安全生产法》（2021年修订版）第二十一条规定生产经营单位主要负责人的七项法定职责（含组织制定并实施本单位安全生产教育和培训计划），而“组织或者参与本单位安全生产教育和培训，如实记录安全生产教育和培训情况”属于本法第二十五条第（二）项规定的安全生产管理机构及安全生产管理人员的职责，并非主要负责人的法定职责。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0012","type":"判断题","category":"现场操作规范","question":"作业人员在本单位进行危险作业活动时，可以不用带作业许可证。（）","options":["对","错"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0013","type":"判断题","category":"消防安全","question":"灭火的基本原理是：根据燃烧的基本条件，采取一切灭火措施，破坏已经形成的燃烧条件，或终止燃烧的连锁反应，使火熄灭或把火势控制在一定范围，最大限度减少火灾损失。（）","options":["对","错"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0014","type":"判断题","category":"现场操作规范","question":"气瓶使用到最后应该留有余压。（）","options":["对","错"],"answer":"A","explanation":"GB 9448-2025《焊接与切割安全》第11.5.5条：气瓶应配置手轮或专用扳手启闭瓶阀。气瓶在使用后不应放空，应留有余压。","basis":"GB 9448-2025《焊接与切割安全》第11.5.5条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0015","type":"判断题","category":"现场操作规范","question":"根据起重作业安全规范，起重作业前必须对起重设备、吊具、索具进行全面检查，确认完好后方可进行作业，严禁使用不合格的起重设备、吊具、索具。","options":["对","错"],"answer":"A","explanation":"《GB/T 6067.1-2010 起重机械安全规程 第1部分：总则》17.2 吊装作业：起重作业前应对起重设备、吊具、索具进行全面检查，确认完好；起吊载荷不得与其他物体卡住或连接，多根钢丝绳或链条不得缠绕。","basis":"《起重机械安全规程 第1部分：总则》GB/T 6067.1-2010","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0016","type":"判断题","category":"通用安全法律法规","question":"脚手架安装就位后应进行验收，验收不合格的不得使用。","options":["对","错"],"answer":"A","explanation":"《GB 55023-2022 施工脚手架通用规范》6.0.5：脚手架搭设达到设计高度或安装就位后，应进行验收，验收不合格的，不得使用。","basis":"施工脚手架通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0017","type":"判断题","category":"应急救护技能","question":"发生人员触电事故时，首先应立即切断电源，或用干燥的绝缘物体使触电者脱离电源，严禁用手直接拉拽触电者。","options":["对","错"],"answer":"A","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"触电急救通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0018","type":"判断题","category":"应急救护技能","question":"人员接触到腐蚀性化学品后，应立即用干布擦拭接触部位，无需用清水冲洗。","options":["对","错"],"answer":"B","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"危险化学品应急救援规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0019","type":"判断题","category":"现场操作规范","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业过程中，气体检测合格后即可关闭检测仪，无需持续监测。","options":["对","错"],"answer":"B","explanation":"《GB 46768-2025 有限空间作业安全技术规范》6.2.3：作业过程中应对作业人活动区域进行实时气体监测，每15min记录1个瞬时值。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0020","type":"判断题","category":"通用安全法律法规","question":"根据《工贸企业重大事故隐患判定标准》，未对承包单位、承租单位的安全生产工作统一协调、管理，或者未定期进行安全检查的，应判定为重大事故隐患。","options":["对","错"],"answer":"A","explanation":"《工贸企业重大事故隐患判定标准》第三条：工贸企业有下列情形之一的，应当判定为重大事故隐患：（一）未对承包单位、承租单位的安全生产工作统一协调、管理，或者未定期进行安全检查的；","basis":"《工贸企业重大事故隐患判定标准》应急管理部10号令（2023版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0021","type":"单选题","category":"通用安全法律法规","question":"《中华人民共和国安全生产法》第五条生产经营单位的主要负责人，对本单位的安全生产工作全面负责。其他负责人对职责范围内的（）负责。","options":["人员管理","工作品质","服务质量","安全生产工作"],"answer":"D","explanation":"《中华人民共和国安全生产法》第五条","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0022","type":"单选题","category":"消防安全管理","question":"企业单位的（）对本单位的消防安全工作全面负责。","options":["主要负责人","消防安全管理人","消防安全保卫干部"],"answer":"A","explanation":"《机关、团体、企业、事业单位消防安全管理规定》（公安部61号令）第四条：法人单位的法定代表人或者非法人单位的主要负责人是单位的消防安全责任人，对本单位的消防安全工作全面负责。","basis":"《机关、团体、企业、事业单位消防安全管理规定》（公安部61号令）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0023","type":"单选题","category":"消防安全管理","question":"在国内，消防安全重点单位（）进行一次灭火和应急疏散演练。","options":["至少每半年","至少每一年","至少每两年"],"answer":"A","explanation":"《机关、团体、企业、事业单位消防安全管理规定》（公安部61号令）第四十条：消防安全重点单位应当按照灭火和应急疏散预案，至少每半年进行一次演练，并结合实际，不断完善预案。","basis":"《机关、团体、企业、事业单位消防安全管理规定》（公安部61号令）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0024","type":"单选题","category":"从业人员安全生产权利义务","question":"关于生产经营单位从业人员安全生产方面权利，下列说法错误的是（）。","options":["从业人员有权了解其作业场所和工作岗位存在的危险因素、防范措施及事故应急措施","从业人员有权对本单位的安全生产工作提出建议","从业人员无权对本单位安全生产工作提出批评、检举、控告"],"answer":"C","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五十四条：从业人员有权对本单位安全生产工作中存在的问题提出批评、检举、控告；有权拒绝违章指挥和强令冒险作业。故“从业人员无权对本单位安全生产工作提出批评、检举、控告”的说法错误。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0025","type":"单选题","category":"职业病防治","question":"职业病防治事关劳动者身体健康和生命安全，用人单位的下列做法违反了职业病防治工作要求的是（）。","options":["安排未成年工从事接触职业病危害的作业","用人单位应当在职工上岗前安排职业健康检查","用人单位应当为劳动者建立职业健康监护档案"],"answer":"A","explanation":"《中华人民共和国职业病防治法》第三十八条：用人单位不得安排未成年工从事接触职业病危害的作业；不得安排孕期、哺乳期的女职工从事对本人和胎儿、婴儿有危害的作业。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0026","type":"单选题","category":"职业健康","question":"职业健康检查费用由（）承担。","options":["卫生部门","主要负责人","用人单位"],"answer":"C","explanation":"《中华人民共和国职业病防治法》第三十五条：对从事接触职业病危害的作业的劳动者，用人单位应当按照国务院卫生行政部门的规定组织上岗前、在岗期间和离岗时的职业健康检查，并将检查结果书面告知劳动者。职业健康检查费用由用人单位承担。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0027","type":"单选题","category":"职业健康","question":"用人单位应当为劳动者建立（）档案，并按照规定的期限妥善保存。","options":["员工健康检查","职业健康监护","定期健康检查"],"answer":"B","explanation":"《中华人民共和国职业病防治法》第三十六条：用人单位应当为劳动者建立职业健康监护档案，并按照规定的期限妥善保存。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0028","type":"单选题","category":"通用安全法律法规","question":"在道路上发生交通事故，未造成人身伤亡，当事人对事实及成因无争议的，可以（）。","options":["即行撤离现场，恢复交通，自行协商处理损害赔偿事宜","不即行撤离现场，迅速报告执勤的交通警察或者公安机关交通管理部门","现场占道处理损害赔偿事宜"],"answer":"A","explanation":"《中华人民共和国道路交通安全法》第七十条：在道路上发生交通事故，未造成人身伤亡，当事人对事实及成因无争议的，可以即行撤离现场，恢复交通，自行协商处理损害赔偿事宜；不即行撤离现场的，应当迅速报告执勤的交通警察或者公安机关交通管理部门。 〔依据法规已收录条款库：《中华人民共和国道路交通安全法》〕","basis":"《中华人民共和国道路交通安全法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0029","type":"单选题","category":"事故报告与调查处理","question":"下列事故的报告和调查处理不适用《生产安全事故报告和调查处理条例》的是（）。","options":["建筑施工过程中工人坠落身亡事故","煤矿瓦斯爆炸事故","核设施事故"],"answer":"C","explanation":"《生产安全事故报告和调查处理条例》第二条：生产经营活动中发生的造成人身伤亡或者直接经济损失的生产安全事故的报告和调查处理，适用本条例；环境污染事故、核设施事故、国防科研生产事故的报告和调查处理不适用本条例。","basis":"《生产安全事故报告和调查处理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0030","type":"单选题","category":"应急管理","question":"根据《生产安全事故应急预案管理办法》，生产经营单位编制的各类应急预案之间应当相互衔接，并与相关人民政府及其部门、应急救援队伍和涉及的其他单位的应急预案相（）。","options":["一致","衔接","补充"],"answer":"B","explanation":"《生产安全事故应急预案管理办法》第十八条：生产经营单位编制的各类应急预案之间应当相互衔接，并与相关人民政府及其部门、应急救援队伍和涉及的其他单位的应急预案相衔接。 〔依据法规已收录条款库：《生产安全事故应急预案管理办法》〕","basis":"《生产安全事故应急预案管理办法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0031","type":"单选题","category":"通用安全法律法规","question":"根据《中共中央国务院关于推进安全生产领域改革发展的意见》，建立健全安全生产法律法规立改废释工作协调机制。加强涉及安全生产相关法规（）审查，增强安全生产法制建设的系统性、可操作性。","options":["合法性","合宪性","一致性"],"answer":"C","explanation":"《中共中央 国务院关于推进安全生产领域改革发展的意见》（十三）健全法律法规体系：建立健全安全生产法律法规立改废释工作协调机制。加强涉及安全生产相关法规一致性审查，增强安全生产法制建设的系统性、可操作性。 〔依据法规已收录条款库：《中共中央 国务院关于推进安全生产领域改革发展的意见》〕","basis":"《中共中央 国务院关于推进安全生产领域改革发展的意见》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0032","type":"单选题","category":"消防安全","question":"身上着火后，灭火方法是错误的是（）。","options":["就地打滚","用厚重衣物覆盖压灭火苗","迎风快跑"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0033","type":"单选题","category":"电气作业安全管理","question":"施工用电配电箱、开关箱应装设在干燥、通风、无外来物体撞击的地方，其周围应有足够（）人同时工作的空间和通道。","options":["四","三","二","一"],"answer":"C","explanation":"JGJ/T 46-2024《建筑与市政工程施工现场临时用电安全技术标准》第4.1.4条：配电箱、开关箱应装设在干燥、通风及常温场所，不得装设在易受外来固体物撞击、强烈振动、液体浸溅及热源烘烤场所；第4.1.5条：配电箱、开关箱周围应有足够2人同时工作的空间和通道，不得堆放任何妨碍操作和维修的物品，不得有灌木和杂草。","basis":"JGJ/T 46-2024《建筑与市政工程施工现场临时用电安全技术标准》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0034","type":"单选题","category":"安全生产主体责任","question":"生产经营单位的主要负责人，对本单位的安全生产工作（）负责。","options":["主要","全部","全面"],"answer":"C","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五条：生产经营单位的主要负责人是本单位安全生产第一责任人，对本单位的安全生产工作全面负责。其他负责人对职责范围内的安全生产工作负责。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0035","type":"单选题","category":"通用安全法律法规","question":"任何电气设备在验明是否有电之前，均按（）处理。","options":["也许有电","无电","有电"],"answer":"C","explanation":"《GB/T 13869-2017 用电安全导则》及电气作业安全规则：任何电气设备在验明无电之前，均应按有电对待。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0036","type":"单选题","category":"通用安全法律法规","question":"下列电气防护技术中，（）是将可能触及的带电体置于可能触及的范围之外，其安全作用与屏护的安全作用基本相同。","options":["间距","绝缘","接地"],"answer":"A","explanation":"《GB/T 13869-2017 用电安全导则》3 用电产品安全防护措施：将可能触及的带电体置于伸臂范围之外（间距/屏护），其安全作用与绝缘、屏护相当。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0037","type":"单选题","category":"电气作业安全管理","question":"在工作场地潮湿的环境中工作，电工最好应用下列哪种方法来减少触电的危险。","options":["在站立处垫干木板","不穿任何鞋具","在站立处垫绝缘胶垫"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0038","type":"单选题","category":"电气作业安全管理","question":"人体某一部位与大地或与大地连通的金属构件接触，另一部位触及一相带电体的触电属于（）触电方式。","options":["单相触电","二相触电","三相触电"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0039","type":"单选题","category":"电气作业安全管理","question":"人体触电时，（）电流通路是最危险的。","options":["左手至胸部","左脚至右脚","右手至左手"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0040","type":"单选题","category":"特种作业安全管理","question":"生产经营单位使用未取得特种作业操作证的特种作业人员上岗作业的，依照《中华人民共和国安全生产法》的规定，责令限期改正，处（ ）万元以下的罚款。","options":["3","5","7","10"],"answer":"D","explanation":"《中华人民共和国安全生产法》第九十七条：生产经营单位有下列行为之一的，责令限期改正，处十万元以下的罚款；逾期未改正的，责令停产停业整顿，并处十万元以上二十万元以下的罚款……（七）特种作业人员未按照规定经专门的安全作业培训并取得相应资格，上岗作业的。 〔注：原依据《特种作业人员安全技术培训考核管理规定》（安监总局令第30号）已于2026-06-01被应急管理部令第19号取代；取消3年复审、改为6年换证，理论考试不限次、实操可考5次、跨省通办、学历要求放宽〕","basis":"《中华人民共和国安全生产法》 《特种作业人员安全技术培训考核管理规定》（应急管理部令第19号，2026-06-01施行）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0041","type":"单选题","category":"通用安全法律法规","question":"以下哪种电气线路故障不会引发火灾（）。","options":["绝缘损坏造成短路","接触不良","断电"],"answer":"C","explanation":"《GB/T 13869-2017 用电安全导则》及电气防火常识：短路、过载、接触不良等电气线路故障易引发火灾；绝缘合格、无故障的线路本身不会引发火灾。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0042","type":"单选题","category":"应急救护技能","question":"发生人身触电事故，在进行救护时，首先应采取（）。","options":["立即检查触电者是否还有心跳呼吸，如没有立即进行心肺复苏","立即断开电源使触电者与带电部份脱离","立即拨打120呼叫救护车"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0043","type":"单选题","category":"消防安全","question":"使用中的电器着火，在许可的情况下，应先（）。","options":["将有关之电源关掉","致电电力公司求助","找寻适合的灭火筒灌救"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0044","type":"单选题","category":"电气作业安全管理","question":"人体触电致死，主要是（）器官受到严重伤害。","options":["心脏","肝脏","肾脏"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0045","type":"单选题","category":"电气作业安全管理","question":"若胸部触电，触电者有（）伤害。","options":["胸肌痉挛","胸骨折断","胸肌松弛"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0046","type":"单选题","category":"电气作业安全管理","question":"漏电断路器的作用原理主要监测电路中（）的运作情况。","options":["地线和带电线","中性线和地线","带电线和中性线"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0047","type":"单选题","category":"通用安全法律法规","question":"（）灭火器不适用于扑灭电气火灾。","options":["二氧化碳灭火器","干粉灭火器","泡沫灭火器"],"answer":"C","explanation":"《GB/T 13869-2017 用电安全导则》及消防常识：电气火灾应使用二氧化碳、干粉等灭火器扑救，泡沫灭火器（含水导电）不适用于未断电的电气火灾。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0048","type":"单选题","category":"起重作业安全管理","question":"（）行为是禁止的。","options":["起吊重物先试吊，确认无危险后再起吊","用钢丝绳将氮气瓶两端绑扎牢固后直接起吊","严格落实操作规程"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0049","type":"单选题","category":"起重作业安全管理","question":"利用起重机将一半埋在地下的物件吊拔出来是属于（）作业。","options":["正常作业","违章作业","应预先制定起吊安全措施的危险作业"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0050","type":"单选题","category":"现场操作规范","question":"以下三种铲车作业有（）种是属违章操作的。（1）利用铲车的铲斗举升人员在高处作业；（2）在起升的铲斗下进行检修；（3）在码头岸边直接铲装船上的物料。","options":["一种","二种","三种"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0051","type":"单选题","category":"起重作业安全管理","question":"流动起重机吊臂与地平线所成角度增大，其最高安全吊重量会相应（）。","options":["增大","不变","减少"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0052","type":"单选题","category":"设备安全管理","question":"叉式起重车停泊时应将叉（）。","options":["调至任何位置都无问题","升至最高点","降至地上"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0053","type":"单选题","category":"安全检查与隐患治理","question":"企业应在有较大危险因素的生产经营场所和有关设备、设施上设置（）。","options":["详细的事故应急处理措施的标牌","显示该场所、设备安全管理责任人姓名、联系电话的标志","明显的安全警示标志"],"answer":"C","explanation":"《中华人民共和国安全生产法》（2021年修订版）第三十五条：生产经营单位应当在有较大危险因素的生产经营场所和有关设施、设备上，设置明显的安全警示标志。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0054","type":"单选题","category":"通用安全法律法规","question":"电焊工对采用电气接地保护的设备施焊时应先进行（）操作。","options":["暂时拆除设备的接地保护线","加大设备接地保护线的截面","将设备重复接地"],"answer":"A","explanation":"GB 9448-2025《焊接与切割安全》第12.3条：有接地（或接零）装置的焊件上弧焊，不应双重接地（施焊时暂时拆除设备接地保护线以避免双重接地）","basis":"《焊接与切割安全》GB 9448-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0055","type":"单选题","category":"动火作业安全管理","question":"气焊工（）属于违章作业。","options":["在乙炔气瓶上安装回火防止器","中午去吃饭时把与气源连着的带压焊枪放在施工的金属大球罐内","动焊用气时，乙炔气瓶阀只拧开3/4圈"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0056","type":"单选题","category":"动火作业安全管理","question":"气焊（割）作业中，乙炔气瓶和氧气瓶之间应有足够的安全距离（≧5m），与明火点应保持（）米以上的距离。","options":["8","5","10"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0057","type":"单选题","category":"现场操作规范","question":"有限空间是指密闭空间或受限制的空间，一般指管道、隧道、下水道、地窖、矿洞等。在有限空间进行生产作业时，下列做法正确的是（）。","options":["发包给不具备安全生产条件的单位","不佩戴安全帽","严格遵守“先通风、再检测、后作业”的原则"],"answer":"C","explanation":"《工贸企业重大事故隐患判定标准》（应急管理部10号令）第十三条：（二）存在硫化氢、一氧化碳等中毒风险的有限空间作业工贸企业，未落实有限空间作业审批，或者未执行“先通风、再检测、后作业”要求，或者作业现场未设置监护人员的，应当判定为重大事故隐患。","basis":"《工贸企业重大事故隐患判定标准》（应急管理部10号令）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0058","type":"单选题","category":"现场操作规范","question":"进入有限空间作业应编制（），各类救援物资应配备到位。","options":["安全工作方案和救援预案","气体检测方案和救援预案","气体检测方案和通风方案案"],"answer":"A","explanation":"GB 46768-2025《有限空间作业安全技术规范》第6（应急预案和演练）条：1 作业单位应根据有限空间作业特点,制定有限空间作业事故专项应急预案或现场处置方案,并 符合GB/T29639的规定。 4. 6.","basis":"GB 46768-2025《有限空间作业安全技术规范》第6条（应急预案和演练）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0059","type":"单选题","category":"现场操作规范","question":"有限空间作业前（）分钟，应再次对有限空间有害物质浓度采样，分析合格后方可进入有限空间。","options":["15","30","60"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0060","type":"单选题","category":"消防安全","question":"用电时要注意防火安全。下面哪些说法是正确的（）","options":["乱接乱拉电线，超负荷用电","及时更换老化电器设施和线路","外出时要打开电源开关","尽量减少电灯的开关次数"],"answer":"B","explanation":"GB/T 13869-2017《用电安全导则》第５条：５ 用电产品的安装与使用 ５．１ 安装 ５．１．１ 用电产品的安装 用电产品的安装应符合相应产品标准的规定。 ２ 犌犅／犜１３８６９—２０１７ 用电产品应按照制造商要求的使用环境条件进行安装，如果不能满足制造商的环境要求，应该采取 附加的安装措施，例如，为用电产品提供防止外来电气、机械、化学和物理应力的防护。 一般条件下，用电产品的周围应留有足够的安全通道和工作空间，且不应堆放易燃、易爆和腐蚀性 物品。 ５．１．２ 电气线路的安装 电气线路应具有足够的绝缘强度、机械强度和导电能力，其安装应符合相应产品标准的规定。 当系统接地的形式采用保护接地系统（ＴＴ系统）时，应在电路采用剩余电流保护器进行保护，并且 保护应具有选择性。 保护接地线应采用焊接、压接、螺栓联结或其他可靠方法联结，严禁缠绕或挂钩。电缆线中的绿／黄 双色线在任何情况只能用作保护接地线。 ５．１．３ 插头插座的安装 插头插座的安装应符合相应产品标准的规定。 插拔插头时，应保证电气设备和电气装置处于非工作状态，同时人体不得触及插头的导电极，并避 免对电源线施加外力。 插头与插座应按规定正确接线，插座的保护接地极在任何情况下都应单独与保护接地线可靠连接， 不得在插头（座）内将保护接地极与工作中性线连接在一起。 ５．２ 使用 ５．２．１ 通用要求 正确选用用电产品的规格型式、容量和保护方式（如过载保护等），不得擅自更改用电产品的结构、 原有配置的电气线路以及保护装置的整定值和保护元件的规格等。 选择用电产品，应确认其符合产品使用说明书规定的环境要求和使用条件，并根据产品使用说明书 的描述，了解使用时可能出现的危险及应采取的预防措施。用电产品检修后重新使用前应再次确认。 用电产品应该在规定的使用寿命期间内使用，超过使用寿命期限的应及时报废或更换，必要时按照 相关规定延长使用寿命。 任何用电产品在运行过程中，应有必要的监控或监视措施；用电产品不允许超负荷运行。 用电产品因停电或故障等情况而停止运行时，应及时切断电源。在查明原因、排除故障，并确认已 恢复正常后才能重新接通电源。 正常运行时会产生飞溅火花或外壳表面温度较高的用电产品，使用时应远离可燃物质或采取相应 的密闭、隔离等措施，用完后及时切断电源。 ５．２．２ 各类产品的特殊要求 移动使用的用电产品，应采用完整的铜芯橡皮套软电缆或护套软线作为电源线，移动时，应防止电 源线拉断或损坏。 固定使用的用电产品，应在断电状态移动，并防止任何降低其安全性能的损害。 ０类设备只能在非导电场所中使用，在其他场所不应使用０类设备。 Ⅰ类设备使用时，应先确认其金属外壳或构架已可靠接地，或已与插头插座内接地效果良好的保护 接地极可靠连接，同时应根据环境条件加装合适的电击保护装置。 自备发电装置应有措施保证与供电电网隔离，并满足用电产品的正常使用要求，不得擅自并入电 网。露天（户外）使用的用电产品应采取适用标准的防雨、防雾和防尘等措施。 ３ 犌犅／犜１３８６９—２０１７","basis":"GB/T 13869-2017《用电安全导则》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0061","type":"单选题","category":"高处作业安全管理","question":"高处作业必须正确佩戴劳保用品，其中安全带栓挂点必须牢固、并要（）否则易发生高坠事故。","options":["低挂高用","高挂低用","方便挂接","便于观察"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0062","type":"单选题","category":"厂区作业安全管理","question":"污水池、集水坑、地下室积水池等的（）缺损，人员不小心有可能掉入池中，发生淹溺事故。","options":["防护栏","安全告知牌","警示标志"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0063","type":"单选题","category":"危险化学品安全","question":"有毒有害气体发生泄漏，作业人员站在（），最有可能发生中毒和窒息事故。","options":["上风向","下风向","侧风向"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0064","type":"单选题","category":"通用安全法律法规","question":"任何电气设备上的标示牌,除（）或负责的运行值班人员外,其他任何人员不准移动。","options":["主管","原来放置人员","班组长","安全员"],"answer":"B","explanation":"《电力安全工作规程》及《GB/T 13869-2017 用电安全导则》：电气设备上的标示牌，除原放置人员或负责的运行值班人员外，其他人员不准移动。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0065","type":"单选题","category":"现场操作规范","question":"作业人员应严格执行（），不违章作业，作业人员在进行危险作业时，应持相应的作业许可证作业。","options":["领导要求","安全操作规程","作业告知","安全职责"],"answer":"B","explanation":"《中华人民共和国安全生产法》（2021年修订版）第四十四条：生产经营单位应当教育和督促从业人员严格执行本单位的安全生产规章制度和安全操作规程；第五十七条：从业人员在作业过程中，应当严格落实岗位安全责任，遵守本单位的安全生产规章制度和操作规程，服从管理，正确佩戴和使用劳动防护用品。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0066","type":"单选题","category":"安全生产责任制","question":"安全生产责任制的实质是（）。","options":["安全第一，预防为主","谁主管，谁负责","安全生产，人人有责"],"answer":"C","explanation":"依据《中华人民共和国安全生产法》（2021年修订版）相关规定（第四条、第二十二条等）：安全生产工作实行管行业必须管安全、管业务必须管安全、管生产经营必须管安全，强化和落实生产经营单位主体责任；生产经营单位应当建立健全并落实全员安全生产责任制。“安全生产，人人有责”即全员安全生产责任制的实质。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0067","type":"单选题","category":"动火作业安全管理","question":"下列情况中，可以进行动火作业的是（）？","options":["油船、油车停靠的区域","存放易燃易爆物品的容器未清理干净前","经动火分析合格且采取可靠防火措施的室内固定动火区作业","存放过易燃易爆液体且未进行彻底置换的反应釜内作业"],"answer":"C","explanation":"《机关、团体、企业、事业单位消防安全管理规定》（公安部61号令）第二十条：单位应当对动用明火实行严格的消防安全管理。因特殊情况需要进行电、气焊等明火作业的，动火部门和人员应当按照单位的用火管理制度办理审批手续，落实现场监护人，在确认无火灾、爆炸危险后方可动火施工。","basis":"《机关、团体、企业、事业单位消防安全管理规定》（公安部61号令）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0068","type":"单选题","category":"危险化学品安全","question":"在装卸易燃易爆品操作中,不能使用（）工具。","options":["铁制","木制","铜制"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0069","type":"单选题","category":"危险化学品安全","question":"储存危险化学品的仓库可以使用（）采暖。","options":["蒸汽","热水","机械"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0070","type":"单选题","category":"危险化学品安全","question":"发生危险化学品事故后,应该向（）方向疏散。","options":["下风","上风","顺风"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0071","type":"单选题","category":"通用安全法律法规","question":"毒物进入体内的总量超过转化和排出总量时，体内的毒物就会逐渐增加，这种现象称为毒物的积蓄。毒物在体内的积蓄是发生（）的基础。","options":["急性中毒","慢性中毒","亚急性中毒"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0072","type":"单选题","category":"通用安全法律法规","question":"在拆下的油管上进行焊接时，必须事先将管子（）。","options":["搬到安全地方","冲洗干净","采取防火措施"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0073","type":"单选题","category":"安全培训教育","question":"以劳务派遣形式用工的，生产经营单位与劳务派遣单位应当在劳务派遣协议中明确各自承担的安全生产教育培训职责。未明确职责的，由（）承担安全生产教育培训责任。","options":["劳务派遣单位","生产经营单位","有资质的中介机构","当地安监部门"],"answer":"B","explanation":"《中华人民共和国安全生产法》第二十八条：生产经营单位使用被派遣劳动者的，应当将被派遣劳动者纳入本单位从业人员统一管理，对被派遣劳动者进行岗位安全操作规程和安全操作技能的教育和培训。劳务派遣单位应当对被派遣劳动者进行必要的安全生产教育和培训。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0074","type":"单选题","category":"通用安全法律法规","question":"目前，我国职业病患者中，患病人数最多的职业病是（）。","options":["尘肺","化学因素所致职业中毒","物理因素所致职业病","生物因素所致职业病"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0075","type":"单选题","category":"从业人员安全生产权利义务","question":"从业人员发现事故隐患或者其他不安全因素，应当立即向现场安全生产管理人员或者（）报告。","options":["上级主管部门","本单位负责人","上级安监部门"],"answer":"B","explanation":"《中华人民共和国安全生产法》第五十九条：从业人员发现事故隐患或者其他不安全因素，应当立即向现场安全生产管理人员或者本单位负责人报告；接到报告的人员应当及时予以处理。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0076","type":"单选题","category":"起重作业安全管理","question":"每台起重机械的司机，都必须经过（），考核合格后，持证上岗操作。","options":["上级培训","企业培训","专门培训"],"answer":"C","explanation":"《特种作业人员安全技术培训考核管理规定》第五条：特种作业人员必须经专门的安全技术培训并考核合格，取得《中华人民共和国特种作业操作证》后，方可上岗作业。 〔注：原依据《特种作业人员安全技术培训考核管理规定》（安监总局令第30号）已于2026-06-01被应急管理部令第19号取代；取消3年复审、改为6年换证，理论考试不限次、实操可考5次、跨省通办、学历要求放宽〕","basis":"《特种作业人员安全技术培训考核管理规定》（应急管理部令第19号，2026-06-01施行）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0077","type":"单选题","category":"通用安全法律法规","question":"统计表明，习惯性违章作业、违章指挥是造成人身伤亡事故和误操作事故的（）原因。","options":["间接","主要","通常"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0078","type":"单选题","category":"通用安全法律法规","question":"安全技术知识的熟练并人性化的运用，一般情况下，都以学习掌握“操作规程\"等来完成，也有的通过教育指导者的言传身教来实现。但无论用什么方法，受教育者都要经过（），反复纠正错误动作，逐渐领会和掌握正确的操作要领，才能不断提高安全技能。","options":["自身的实践","刻苦学习","总结经验"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0079","type":"单选题","category":"通用安全法律法规","question":"从事单调、重复工作的人员，由于长时间重复不间断的、无变化的操作动作，缺乏自主性，感觉不到有意义和重要性，容易产生（）和厌倦感而导致违章。","options":["精神紧张","精神放松","心理疲劳"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0080","type":"单选题","category":"劳动防护用品管理","question":"用人单位应督促、指导劳动者按照使用规则正确佩戴、使用职业病防护用品，（）发放钱物替代发放职业病防护用品。","options":["不得","可以","部分可以"],"answer":"A","explanation":"《中华人民共和国职业病防治法》第二十二条：用人单位必须采用有效的职业病防护设施，并为劳动者提供个人使用的职业病防护用品。用人单位为劳动者个人提供的职业病防护用品必须符合防治职业病的要求；不符合要求的，不得使用。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0081","type":"单选题","category":"通用安全法律法规","question":"（）是指通过采用技术和管理手段使事故不发生。（）是通过采取技术和管理手段使事故发生后不造成严重后果或使后果尽可能减少。","options":["事故预防，劳动保护","事故预防，事故控制","安全生产，事故控制","安全生产，劳动保护"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0082","type":"单选题","category":"安全培训教育","question":"生产经营单位采用新工艺、新材料或者使用新设备，必须了解、掌握其安全技术特征，采取有效的安全防护措施，并对从业人员进行专门的安全生产（）。","options":["教育和考核","教育和培训","培训和考核","宣传和教育"],"answer":"B","explanation":"《中华人民共和国安全生产法》第二十九条：生产经营单位采用新工艺、新技术、新材料或者使用新设备，必须了解、掌握其安全技术特性，采取有效的安全防护措施，并对从业人员进行专门的安全生产教育和培训。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0083","type":"单选题","category":"从业人员安全生产权利义务","question":"从业人员有权拒绝（）指挥和（）冒险作业。","options":["正确、强令","违章、强令","正确、违章","冒险、强令"],"answer":"B","explanation":"《中华人民共和国安全生产法》第五十四条：从业人员有权对本单位安全生产工作中存在的问题提出批评、检举、控告；有权拒绝违章指挥和强令冒险作业。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0084","type":"单选题","category":"通用安全法律法规","question":"事故应急救援的目标是尽可能减少人员伤亡和财产损失。下列选项中，不属于事故应急救援基本任务的是（）。","options":["立即营救受害人员","迅速控制事态发展","进行应急能力评估","进行事故危害程度评估"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0085","type":"单选题","category":"现场操作规范","question":"《安全色和安全标志》标准中，表示指令、必须遵守的颜色为（）。","options":["红色","绿色","蓝色"],"answer":"C","explanation":"依据《安全色》（GB 2893-2008）相关规定：安全色中蓝色表示指令、必须遵守的规定（红色表示禁止、停止；黄色表示警告、注意；绿色表示提示、安全状态、通行）。 〔依据法规已收录条款库：GB 2894-2025《安全色和安全标志》；整合替代GB 2893-2008《安全色》及GB 2894-2008《安全标志及其使用导则》〕","basis":"GB 2894-2025《安全色和安全标志》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0086","type":"单选题","category":"高处作业安全管理","question":"安全带是进行高处作业人员预防坠落伤亡的个体防护用品，其正确使用方法是（）。","options":["低挂高用","高挂低用","水平挂用","钩挂牢靠，挂位不受限制"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0087","type":"单选题","category":"通用安全法律法规","question":"生产经营单位的从业人员不服从管理，违章操作，造成重大事故，构成犯罪的，应当依照《刑法》第一百三十四条关于（）的规定，追究其刑事责任。","options":["工作人员失职罪","重大责任事故罪","劳动安全事故罪"],"answer":"B","explanation":"《中华人民共和国刑法》第一百三十四条 〔依据法规已收录条款库：《中华人民共和国刑法》〕","basis":"《中华人民共和国刑法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0088","type":"单选题","category":"通用安全法律法规","question":"在使用干粉灭火器灭火时，以下操作步骤正确顺序是（ ）","options":["拔—提—握—压","提—拔—握—压","握—提—拔—压","提—握—拔—压"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0089","type":"单选题","category":"通用安全法律法规","question":"灭火器压力表用红、黄、绿三色表示压力情况，当指针指在绿色区域表示（）","options":["正常","偏低","偏高","需要更换"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0090","type":"单选题","category":"职业病防治","question":"用人单位工作场所存在职业病目录所列职业病的危害因素的，应当及时、如实向所在地（）申报危害项目，接受监督。","options":["卫生行政部门","安全生产监督管理部门","工会组织"],"answer":"A","explanation":"《中华人民共和国职业病防治法》第十六条：国家建立职业病危害项目申报制度。用人单位工作场所存在职业病目录所列职业病的危害因素的，应当及时、如实向所在地卫生行政部门申报危害项目，接受监督。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0091","type":"单选题","category":"从业人员安全生产权利义务","question":"从业人员在作业过程中，应当严格遵守本单位的安全生产规章制度和（），服从管理，正确佩戴和使用劳动防护用品。","options":["作业流程","操作规程","随心操作"],"answer":"B","explanation":"《中华人民共和国安全生产法》第五十七条：从业人员在作业过程中，应当严格落实岗位安全责任，遵守本单位的安全生产规章制度和操作规程，服从管理，正确佩戴和使用劳动防护用品。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0092","type":"单选题","category":"消防安全","question":"动火现场应配备必要的（），并将焊接区域内可燃物品清理干净。","options":["防护栏","通风设备","消防器材"],"answer":"C","explanation":"危险化学品企业特殊作业安全规范 GB 30871-2022第5.2.1条：动火作业应有专人监护，作业前应清除动火现场及周围的易燃物品，或采取其他有效安全防火措施，并配备消防器材，满足作业现场应急需求。","basis":"《危险化学品企业特殊作业安全规范》 GB 30871-2022","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0093","type":"单选题","category":"通用安全法律法规","question":"关于脚手架，下列说法错误的是（）。","options":["脚手架搭设和拆除作业前，应将脚手架专项施工方案向施工现场管理人员及作业人员进行安全技术交底。","脚手架使用过程中，不应改变其结构体系","当脚手架专项施工方案需要修改时，修改后的方案应经审批后实施。","为图便利，可以从上方将工具抛下来"],"answer":"D","explanation":"GB 55023-2022《施工脚手架通用规范》第5.4.5条：严禁高空抛掷拆除后的脚手架材料与构配件（D项做法错误，为正确答案）","basis":"施工脚手架通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0094","type":"单选题","category":"消防安全管理","question":"生产经营单位在营业期间,下列（）做法是错误的。","options":["遮挡消防安全疏散指示标志","在安全出口处设置疏散标志","当营业场所人数过多时,限制进入人数"],"answer":"A","explanation":"《中华人民共和国消防法》第二十八条：任何单位、个人不得损坏、挪用或者擅自拆除、停用消防设施、器材，不得埋压、圈占、遮挡消火栓或者占用防火间距，不得占用、堵塞、封闭疏散通道、安全出口、消防车通道；人员密集场所的门窗不得设置影响逃生和灭火救援的障碍物。","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0095","type":"单选题","category":"通用安全法律法规","question":"发现火灾隐患和消防安全违法行为，可以拨打火灾隐患举报电话（），向当地公安消防部门进行举报。","options":["12345","12580","12315","10086"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0096","type":"单选题","category":"通用安全法律法规","question":"用灭火器进行灭火的最佳位置是（）","options":["下风位置","上风或侧风位置","离起火点10米以上的位置","离起火点10米以下的位置"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0097","type":"单选题","category":"通用安全法律法规","question":"当打开房门闻到燃气气味时，要迅速（），以防止引起火灾。","options":["打开燃气灶具查找漏气部位","打开门窗通风","打电话报警"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0098","type":"单选题","category":"通用安全法律法规","question":"扑救初期电气火灾时，首先应当（）。","options":["切断电源","使用干粉灭火器","迅速撤离"],"answer":"A","explanation":"《GB/T 13869-2017 用电安全导则》及电气火灾扑救常识：扑救初期电气火灾，首先应切断电源，再选用二氧化碳或干粉灭火器灭火。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0099","type":"单选题","category":"通用安全法律法规","question":"逃离充满浓烟的火灾现场，正确的做法是（）。","options":["匍匐前进","直立奔跑","站着不动"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0100","type":"单选题","category":"通用安全法律法规","question":"火灾中引起人员大量伤亡的主要原因是（）。","options":["相互挤压致死","吸入烟气窒息死亡","被火烧死"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0101","type":"单选题","category":"消防安全","question":"泡沫灭火器扑救（）火灾效果最好。","options":["油类","化学药品","可燃气体"],"answer":"A","explanation":"GB 50140-2005《建筑灭火器配置设计规范》第4.2.2条：B类火灾场所应选择泡沫灭火器、碳酸氢钠干粉灭火器、磷酸铵盐干粉灭火器、二氧化碳灭火器、灭B类火灾的水型灭火器或卤代烷灭火器。极性溶剂的B类火灾场所应选择灭B类火灾的抗溶性灭火器。","basis":"GB 50140-2005《建筑灭火器配置设计规范》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0102","type":"单选题","category":"通用安全法律法规","question":"在脚手架上架设临时施工用电线路时，下列说法正确的是（ ）。","options":["无需绝缘措施，操作人员穿普通鞋即可","应有绝缘措施，操作人员应穿绝缘防滑鞋","应有绝缘措施，操作人员穿普通鞋即可","无需绝缘措施，操作人员应穿绝缘防滑鞋"],"answer":"B","explanation":"《GB 55023-2022 施工脚手架通用规范》5.1.3：当在脚手架上架设临时施工用电线路时，应有绝缘措施，操作人员应穿绝缘防滑鞋；脚手架与架空输电线路之间应设有安全距离，并应设置接地、防雷设施。","basis":"施工脚手架通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0103","type":"单选题","category":"通用安全法律法规","question":"人的不安全行为是导致事故发生的主要原因之一。下列属于人的不安全行为的是（）。","options":["设备防护装置齐全完好","作业现场安全警示标志清晰","未经许可擅自拆除安全防护装置","安全操作规程张贴在醒目位置"],"answer":"C","explanation":"GB/T 33000-2025《大中型企业安全生产标准化管理体系要求》第10.2.3 设备设施检维修条：因检维修拆除的安全设施应采取临时性防护措施，检维修完毕后应立即复原。","basis":"GB/T 33000-2025《大中型企业安全生产标准化管理体系要求》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0104","type":"单选题","category":"通用安全法律法规","question":"对于烧伤急救，以下说法正确的是（）。","options":["用干净、无粘性的布盖住伤口","直接在伤口上进行冰敷","刺破水泡"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0105","type":"单选题","category":"通用安全法律法规","question":"如果溺水患者没有反应但呼吸正常，在等待120的过程中，可以让患者保持（）。","options":["翻身侧卧，以保持气道开放","仰面平躺","俯身趴着"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0106","type":"单选题","category":"应急管理","question":"应建立应急救援通讯网络，设置固定报警应急值守电话，并保持（）小时畅通。","options":["8","12","24","1"],"answer":"C","explanation":"《生产安全事故应急条例》（国务院令第 708 号）第第十四条：第十四条 下列单位应当建立应急值班制度，配备应急值班人员：（一）县级以上人民政府及其负有安全生产监督管理职责的部门；（二）危险物品的生产、经营、储存、运输单位以及矿山、金属冶炼、城市轨道交通运营、建筑施工单位；（三）应急救援队伍。 规模较大、危险性较高的易燃易爆物品、危险化学品等危险物品的生产、经营、储存、运输单位应当成立应急处置技术组，实行24小时应急值班。","basis":"《生产安全事故应急条例》（国务院令第708号）第十四条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0107","type":"单选题","category":"通用安全法律法规","question":"对骨折的固定应注意（）。","options":["固定骨折局部","固定骨折部的下一个关节","固定骨折部位的两端和上下各一个环节"],"answer":"C","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0108","type":"单选题","category":"通用安全法律法规","question":"在生产车间，操作工人正在使用一台机械设备，突然发现设备有异常响声和轻微震动，此时工人正确的做法是（ ）。","options":["自行尝试对设备进行简单拆卸和调试，以查找问题原因","立即停止操作，切断设备电源，向上级报告并等待专业人员检修","为不影响生产进度，继续操作设备，等任务完成后再上报检查"],"answer":"B","explanation":"《中华人民共和国安全生产法》（2021 修正）第第五十五条：第五十五条从业人员发现直接危及人身安全的紧急情况时,有权停止作业或者在采取可能的应急措施后撤离作业场所。 生产经营单位不得因从业人员在前款紧急情况下停止作业或者采取紧急撤离措施而降低其工资、福利等待遇或者解除与其订立的劳动合同。","basis":"《中华人民共和国安全生产法》（2021修正）第五十五条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0109","type":"单选题","category":"通用安全法律法规","question":"进行心肺复苏时，病人体位宜取（）。","options":["头低足高仰卧位","头高足低仰卧位","水平仰卧位"],"answer":"C","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0110","type":"单选题","category":"通用安全法律法规","question":"一氧化碳使人体中毒的机理是（）。","options":["直接作用于中枢神经，导致人出现昏迷症状","经呼吸道吸收后与血红蛋白结合，使血红蛋白失去携氧能力","经呼吸道吸收后对人体脏器造成一定程度的破坏"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0111","type":"单选题","category":"通用安全法律法规","question":"定期对家庭用电电路进行安全检查，及时更换老化线路。在使用各类电器时，若发现冒烟或闻到异味时，要（）进行检查。","options":["准备消防器材","报警","找专业电工","迅速切断电源"],"answer":"D","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0112","type":"单选题","category":"安全检查与隐患治理","question":"企业应建立（），编制隐患排查清单、隐患整改通知单、隐患整改反馈单、隐患排查治理台账等记录文件。","options":["事故隐患排查治理制度","风险管控制度","培训教育制度"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第四十一条：生产经营单位应当建立健全并落实生产安全事故隐患排查治理制度，采取技术、管理措施，及时发现并消除事故隐患。事故隐患排查治理情况应当如实记录，并通过职工大会或者职工代表大会、信息公示栏等方式向从业人员通报。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0113","type":"单选题","category":"现场操作规范","question":"有限空间作业中发生事故，现场有关人员应当（）。应急救援人员实施救援时，应当做好自身防护，佩戴必要的呼吸器具、救援器材。","options":["立即组织救人，同时派人去拿救援器材","立即报警，禁止盲目施救","立即报警，等待专业救援人员"],"answer":"B","explanation":"《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全生产监督管理总局令第59号）第二十三条：有限空间作业中发生事故后，现场有关人员应当立即报警，禁止盲目施救。应急救援人员实施救援时，应当做好自身防护，佩戴必要的呼吸器具、救援器材。 〔注：原依据《工贸企业有限空间作业安全管理与监督暂行规定》（安监总局令第59号）已于2024-01-01被《工贸企业有限空间作业安全规定》（应急管理部令第13号，2024-01-01施行）；另GB 46768-2025《有限空间作业安全技术规范》已收录〕","basis":"《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全生产监督管理总局令第59号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0114","type":"单选题","category":"危险化学品安全","question":"储存危险化学品的单位应当建立危险化学品（）核查、登记制度","options":["出入库","购买","领取"],"answer":"A","explanation":"《危险化学品安全管理条例》第二十五条：储存危险化学品的单位应当建立危险化学品出入库核查、登记制度。","basis":"《危险化学品安全管理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0115","type":"单选题","category":"从业人员安全生产权利义务","question":"根据《中华人民共和国安全生产法》的规定，生产经营单位应当建立健全并落实生产安全事故隐患排查治理制度，采取技术、管理措施，及时发现并消除事故隐患。关于事故隐患的报告，下列说法正确的是（ ）？","options":["从业人员发现事故隐患后，应自行处理，无需向任何人报告","从业人员发现事故隐患或者其他不安全因素，应当立即向现场安全生产管理人员或者本单位负责人报告","只有当事故隐患可能引发重大伤亡时，从业人员才需要向上级报告","一般事故隐患由班组内部消化即可，不需要记录在案"],"answer":"B","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五十九条：从业人员发现事故隐患或者其他不安全因素，应当立即向现场安全生产管理人员或者本单位负责人报告；接到报告的人员应当及时予以处理。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0116","type":"单选题","category":"现场操作规范","question":"根据高处作业安全规范，在坠落高度基准面（）米及以上进行的作业，必须使用安全带？","options":["1米","1.5米","2米","3米"],"answer":"C","explanation":"《JGJ 80-2016 建筑施工高处作业安全技术规范》2.1.1：高处作业 working at height 在坠落高度基准面2m 或2m 以上有可能坠落的高处进行的作业。","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0117","type":"单选题","category":"现场操作规范","question":"根据起重作业安全规范，起重作业时，以下哪种情况是严格禁止的？","options":["起重作业前对吊具、索具进行检查","起重作业时设置警戒区域，禁止无关人员进入","斜拉、斜吊重物，或起吊埋在地下的重物","起重作业时由专人统一指挥"],"answer":"C","explanation":"《GB/T 6067.1-2010 起重机械安全规程 第1部分：总则》17.2.2（不得起吊埋地/重量不清物件）、17.2.5（不许斜拉歪吊、吊物不得从人员上方通过）。","basis":"《起重机械安全规程 第1部分：总则》GB/T 6067.1-2010","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0118","type":"单选题","category":"现场操作规范","question":"根据高处作业安全规范，安全带的正确使用方法是？","options":["高挂低用，挂在牢固可靠的构件上","低挂高用，方便作业人员操作","挂在作业人员附近的任意构件上","作业时将安全带解开，方便操作"],"answer":"A","explanation":"《JGJ 80-2016 建筑施工高处作业安全技术规范》：高处作业人员必须系挂安全带，安全带应高挂低用、系挂牢固，严禁低挂高用。","basis":"《建筑施工高处作业安全技术规范》JGJ 80-2016","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0119","type":"单选题","category":"现场操作规范","question":"根据起重作业安全规范，起重作业前，必须对起重设备进行的核心检查是？","options":["检查起重设备的外观是否完好","检查起重设备的制动系统、限位装置、钢丝绳、吊钩等关键部件是否完好有效","检查起重设备的运行速度是否正常","检查起重设备的操作手柄是否灵活"],"answer":"B","explanation":"《GB/T 6067.1-2010 起重机械安全规程 第1部分：总则》17.2 吊装作业：作业前应对起重设备（制动、限位、钢丝绳等安全装置）及吊具、索具进行检查，确认完好。","basis":"《起重机械安全规程 第1部分：总则》GB/T 6067.1-2010","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0120","type":"单选题","category":"现场操作规范","question":"根据起重作业安全规范，起重作业时，以下哪种情况是允许的？","options":["起重作业时，人员在吊物下方行走或停留","起吊重量超过起重设备额定起重量的重物","起重作业前，对吊具、索具进行全面检查，确认完好后再进行作业","夜间起重作业时，无足够的照明设备"],"answer":"C","explanation":"《GB/T 6067.1-2010 起重机械安全规程 第1部分：总则》17.2.5：起吊前应对吊具、索具进行检查（钢丝绳或链条不得扭结、缠绕），确认完好后方可作业。","basis":"《起重机械安全规程 第1部分：总则》GB/T 6067.1-2010","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0121","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，心肺复苏（CPR）的核心操作顺序是？","options":["开放气道→人工呼吸→胸外按压","胸外按压→开放气道→人工呼吸","人工呼吸→胸外按压→开放气道","开放气道→胸外按压→人工呼吸"],"answer":"B","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》成人胸外按压：按压与人工呼吸比例为30:2。","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0122","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，判断患者是否有呼吸的观察时间不得超过？","options":["5秒","10秒","15秒","20秒"],"answer":"B","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》：判断患者有无呼吸，观察时间不超过10秒（5~10秒）。","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0123","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于意识清醒的气道异物梗阻患者，应采取的急救方法是？","options":["立即进行心肺复苏","腹部冲击法（海姆立克急救法）","立即进行人工呼吸","立即拨打急救电话，等待医护人员到达"],"answer":"B","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》：清醒成人及1岁以上儿童气道异物梗阻（重度），采用海姆立克急救法（腹部冲击）；部分梗阻鼓励自主咳嗽。","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0124","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于骨折的患者，急救的核心原则是？","options":["立即将骨折部位复位","先固定骨折部位，避免骨折端移动造成二次伤害，再转运患者","立即将患者转运到医院","立即对骨折部位进行按摩"],"answer":"B","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0125","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于中暑的患者，急救的核心措施是？","options":["立即给患者喝大量的冰水","立即将患者转移到阴凉通风处，解开衣物，用冷水擦拭身体降温，补充淡盐水","立即给患者喝热水","立即将患者放在太阳下暴晒"],"answer":"B","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0126","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于高处坠落导致的头部外伤患者，急救的核心措施是？","options":["立即移动患者头部，检查是否有出血","立即用干净的纱布压迫止血，固定患者头部，避免晃动，立即拨打急救电话","立即给患者喝水","立即将患者扶起，检查是否有其他外伤"],"answer":"B","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0127","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于四肢骨折的患者，固定时必须注意的核心要求是？","options":["固定时必须将骨折部位复位","固定时必须超过骨折部位的上下两个关节，避免骨折端移动","固定时必须用绷带紧紧缠绕，越紧越好","固定时必须将患者的四肢伸直"],"answer":"B","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0128","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于中暑患者，以下哪种做法是正确的？","options":["给患者喝大量的冰水","将患者转移到阴凉通风处，用冷水擦拭身体降温","给患者喝热水","将患者放在太阳下暴晒"],"answer":"B","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0129","type":"单选题","category":"应急救护技能","question":"根据应急救护规范，对于头部外伤患者，以下哪种做法是正确的？","options":["移动患者头部，检查是否有出血","用干净的纱布压迫止血，固定患者头部，避免晃动","给患者喝水","将患者扶起，检查是否有其他外伤"],"answer":"B","explanation":"通用安全常识（无强制法条依据）——待甲方确认是否保留","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0130","type":"单选题","category":"现场操作规范","question":"电气设备检修作业前，必须执行（ ）的安全技术措施，确保设备完全断电。","options":["停电、验电、接地、挂牌、上锁","停电、验电、接地、挂牌、上锁、装设遮栏","停电、接地、挂牌、上锁","停电、验电、挂牌、上锁"],"answer":"B","explanation":"《GB 26860-2011 电力安全工作规程 发电厂和变电站电气部分》4.2 安全技术措施：停电、验电、接地、悬挂标示牌和装设遮栏（含上锁/闭锁）。","basis":"《电力安全工作规程》（停电、验电、接地、悬挂标示牌和装设遮栏）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0131","type":"单选题","category":"现场操作规范","question":"有限空间作业完成、作业人员全部撤离后，作业负责人应组织对有限空间内外进行全面检查，确认无遗留工具、杂物和安全隐患，然后（）。","options":["直接离开即可","关闭有限空间出入口并恢复隔离措施，清点人员后办理作业关闭手续","通知下一班组进场作业","拆除所有通风设备后通报负责人"],"answer":"B","explanation":"《GB 46768-2025 有限空间作业安全技术规范》7.1.1：作业完成后，作业负责人应至少对以下事项进行验收确认：作业人已全部安全出离有限空间；作业设备和工具已全部带离有限空间；有限空间出入口已关闭；作业前采取隔离措施的，已解除隔离。《GB 46768-2025 有限空间作业安全技术规范》7.1.2：完工验收记录应经作业负责人签字确认并归档保存。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0132","type":"单选题","category":"现场操作规范","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业过程中，当氧浓度低于（）或高于23.5%时，应立即报警并撤离作业人员。","options":["21%","20%","19.5%","18%"],"answer":"C","explanation":"《GB 46768-2025 有限空间作业安全技术规范》4.5.2：氧气应设定缺氧报警和富氧报警两级报警值，缺氧报警值为19.5% VOL（体积分数），富氧报警值为23.5% VOL；《GB 46768-2025 有限空间作业安全技术规范》5.9.1：初始检测结果符合下列所有条件时，方可实施有限空间作业：氧含量为19.5% VOL~23.5% VOL。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0133","type":"单选题","category":"通用安全法律法规","question":"根据《工贸企业重大事故隐患判定标准》，铝镁等金属粉尘除尘系统采用（）方式的，应判定为重大事故隐患。","options":["正压除尘","负压除尘","湿式除尘"],"answer":"A","explanation":"《工贸企业重大事故隐患判定标准》第十一条：存在粉尘爆炸危险的工贸企业有下列情形之一的，应当判定为重大事故隐患：……（四）铝镁等金属粉尘除尘系统采用正压除尘方式，或者其他可燃性粉尘除尘系统采用正压吹送粉尘时，未采取火花探测消除等防范点燃源措施的；","basis":"《工贸企业重大事故隐患判定标准》应急管理部10号令（2023版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0134","type":"单选题","category":"通用安全法律法规","question":"根据《工贸企业重大事故隐患判定标准》，未落实粉尘清理制度，造成作业现场积尘严重的，应判定为（）。","options":["重大事故隐患","较大隐患","一般隐患","轻微隐患"],"answer":"A","explanation":"《工贸企业重大事故隐患判定标准》第十一条：存在粉尘爆炸危险的工贸企业有下列情形之一的，应当判定为重大事故隐患：……（十）未落实粉尘清理制度，造成作业现场积尘严重的。","basis":"《工贸企业重大事故隐患判定标准》应急管理部10号令（2023版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0135","type":"多选题","category":"安全检查与隐患治理","question":"事故隐患按危害和整改难易程度分类，分为（）和（）。","options":["较大隐患","一般事故隐患","重大事故隐患","特大隐患"],"answer":"BC","explanation":"《安全生产事故隐患排查治理暂行规定》（国家安全生产监督管理总局令第16号）第三条：事故隐患分为一般事故隐患和重大事故隐患。一般事故隐患，是指危害和整改难度较小，发现后能够立即整改排除的隐患。重大事故隐患，是指危害和整改难度较大，应当全部或者局部停产停业，并经过一定时间整改治理方能排除的隐患，或者因外部因素影响致使生产经营单位自身难以排除的隐患。 〔依据法规已收录条款库：《安全生产事故隐患排查治理暂行规定》〕","basis":"《安全生产事故隐患排查治理暂行规定》（国家安全生产监督管理总局令第16号）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0136","type":"多选题","category":"通用安全法律法规","question":"根据《安全生产法》，下列属于生产经营单位的主要负责人对本单位安全生产工作所负职责的有（）。","options":["组织制定本单位安全生产规章制度和操作规程","建立健全并落实本单位全员安全生产责任制","及时、如实报告生产安全事故","保证本单位安全生产投入的有效实施"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第二十一条：生产经营单位的主要负责人对本单位安全生产工作负有下列职责：（一）建立健全并落实本单位全员安全生产责任制，加强安全生产标准化建设；（二）组织制定并实施本单位安全生产规章制度和操作规程；（三）组织制定并实施本单位安全生产教育和培训计划；（四）保证本单位安全生产投入的有效实施；（五）组织建立并落实安全风险分级管控和隐患排查治理双重预防工作机制，督促、检查本单位的安全生产工作，及时消除生产安全事故隐患；（六）组织制定并实施本单位的生产安全事故应急救援预案；（七）及时、如实报告生产安全事故。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0137","type":"多选题","category":"应急管理","question":"根据《生产安全事故应急预案管理办法》，应急预案的编制应当遵循的原则有（）。","options":["以人为本","依法依规","符合实际","注重实效"],"answer":"ABCD","explanation":"《生产安全事故应急预案管理办法》（应急管理部令第2号修正）第七条：应急预案的编制应当遵循以人为本、依法依规、符合实际、注重实效的原则，以应急处置为核心，明确应急职责、规范应急程序、细化保障措施。 〔依据法规已收录条款库：《生产安全事故应急预案管理办法》〕","basis":"《生产安全事故应急预案管理办法》（应急管理部令第2号修正）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0138","type":"多选题","category":"安全生产法律责任","question":"《安全生产违法行为行政处罚办法》规定的违法所得计算方法有（）。","options":["生产产品得，以产品销售收入计算","销售商品得，以销售收入计算","提供中介服务得，以服务收入计算","收入无法计算得，以同类同等规模生产经营单位最高收入计算"],"answer":"ABC","explanation":"《安全生产违法行为行政处罚办法》第六十九条：当事人有违法所得，除依法应当退赔的外，应当予以没收。本办法所称的违法所得，按照下列规定计算：（一）生产、加工产品的，以生产、加工产品的销售收入作为违法所得；（二）销售商品的，以销售收入作为违法所得；（三）提供安全生产中介、租赁等服务的，以服务收入或者报酬作为违法所得…… 〔依据法规已收录条款库：《安全生产违法行为行政处罚办法》〕","basis":"《安全生产违法行为行政处罚办法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0139","type":"多选题","category":"现场操作规范","question":"临时性的危险作业主要有（）：","options":["在易燃易爆区域和防火重点部位的动火作业","在有触电危险的环境作业或带电作业、临时用电作业。","在有急性中毒、窒息危险或密闭空间作业","两米以上的高处作业"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》（2021年修订版）第四十三条：生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0140","type":"多选题","category":"应急管理","question":"单位的生产安全事故应急救援预案包括：（）。","options":["综合预案","专项预案","现场处置方案","培训方案"],"answer":"ABC","explanation":"《生产安全事故应急预案管理办法》（应急管理部令第2号修正）第六条：生产经营单位应急预案分为综合应急预案、专项应急预案和现场处置方案。 〔依据法规已收录条款库：《生产安全事故应急预案管理办法》〕","basis":"《生产安全事故应急预案管理办法》（应急管理部令第2号修正）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0141","type":"多选题","category":"动火作业安全管理","question":"动火作业是指在直接或间接产生明火的工艺设施以外的，可能产生火焰、火花、炽热表面的非常规作业，包括（）等。","options":["电焊","气焊（割）","喷灯","螺丝刀拧螺丝"],"answer":"ABC","explanation":"《危险化学品企业特殊作业安全规范》GB 30871-2022 第3.1条（动火作业定义）：动火作业是指直接或间接产生明火的工艺设备以外的禁火区内可能产生火焰、火花或炽热表面的非常规作业，如使用电焊、气焊（割）、喷灯、电钻、砂轮等。","basis":"《危险化学品企业特殊作业安全规范》GB 30871-2022","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0142","type":"多选题","category":"职业病防治","question":"以下属于劳动者职业病防护措施的是（）。","options":["熟知职业病危害，严格遵守操作规程","正确使用个人防护用品","养成良好卫生习惯","接受职业健康检查"],"answer":"ABCD","explanation":"《中华人民共和国职业病防治法》第三十三条：劳动者应当学习和掌握相关的职业卫生知识，增强职业病防范意识，遵守职业病防治法律、法规、规章和操作规程，正确使用、维护职业病防护设备和个人使用的职业病防护用品……；第二十二条：用人单位必须采用有效的职业病防护设施，并为劳动者提供个人使用的职业病防护用品；第三十五条：对从事接触职业病危害的作业的劳动者，用人单位应当组织上岗前、在岗期间和离岗时的职业健康检查。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0143","type":"多选题","category":"从业人员安全生产权利义务","question":"生产经营单位应当对从业人员进行安全生产教育和培训，告知作业场所和工作岗位存在的（）。未经安全生产教育和培训合格的从业人员，不得上岗作业。","options":["危险因素","防范措施","事故隐患","事故应急措施"],"answer":"ABD","explanation":"《中华人民共和国安全生产法》（2021年修订版）第四十四条：生产经营单位应当教育和督促从业人员严格执行本单位的安全生产规章制度和安全操作规程；并向从业人员如实告知作业场所和工作岗位存在的危险因素、防范措施以及事故应急措施。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0144","type":"多选题","category":"通用安全法律法规","question":"《消防法》规定，（ ）等有关单位，应当有针对性地面向社会进行消防宣传教育。","options":["新闻","广播","电视","电影"],"answer":"ABC","explanation":"《中华人民共和国消防法》第六条：新闻、广播、电视等有关单位，应当有针对性地面向社会进行消防宣传教育。","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0145","type":"多选题","category":"通用安全法律法规","question":"依据安全生产法规定，以下是主要负责人职责的有（）。","options":["建立健全并落实本单位全员安全生产责任制，加强安全生产标准化建设","组织制定并实施本单位安全生产规章制度和操作规程","保证本单位安全生产投入的有效实施","督促落实本单位安全生产整改措施"],"answer":"ABC","explanation":"《中华人民共和国安全生产法》第二十一条：生产经营单位的主要负责人对本单位安全生产工作负有下列职责：（一）建立健全并落实本单位全员安全生产责任制，加强安全生产标准化建设；（二）组织制定并实施本单位安全生产规章制度和操作规程；（四）保证本单位安全生产投入的有效实施；（七）及时、如实报告生产安全事故。；《中华人民共和国安全生产法》第二十五条：生产经营单位的安全生产管理机构以及安全生产管理人员履行下列职责：……（七）督促落实本单位安全生产整改措施。（说明“督促落实本单位安全生产整改措施”属于安全生产管理人员职责，非主要负责人职责）","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0146","type":"多选题","category":"特种设备安全","question":"根据《特种设备安全法》，锅炉、压力容器、压力管道等特种设备，应当遵守的规定有（ ）。","options":["使用取得许可生产并经检验合格的特种设备","按照国家有关规定配备特种设备安全管理人员、检测人员和作业人员","对特种设备进行经常性维护保养和定期自行检查，并作出记录","特种设备出现故障或者发生异常情况，应当对其进行全面检查，消除事故隐患，方可继续使用"],"answer":"ABCD","explanation":"《特种设备安全法》第三十二条（使用取得许可生产并经检验合格的特种设备）、第十三条（配备安全管理/检测/作业人员）、第三十九条（经常性维护保养和定期自行检查）、第四十二条（故障异常全面检查消除隐患）","basis":"《中华人民共和国特种设备安全法》第三十二条、第十三条、第三十九条、第四十二条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0147","type":"多选题","category":"消防安全","question":"根据《机关、团体、企业、事业单位消防安全管理规定》（公安部61号令），企业的消防安全责任人应当履行的职责有（ ）。","options":["贯彻执行消防法律法规，保障本单位消防安全符合规定，掌握本单位消防安全情况","将消防工作与本单位的生产、经营、管理等活动统筹安排，批准实施年度消防工作计划","为本单位的消防安全提供必要的经费和组织保障","具体实施本单位的消防安全管理工作，组织开展日常防火检查"],"answer":"ABC","explanation":"公安部61号令第六条（消防安全责任人职责，对应A/B/C三项）；选项D『具体实施日常防火检查』属第七条『消防安全管理人』职责，故正确答案为ABC","basis":"《机关、团体、企业、事业单位消防安全管理规定》（公安部61号令）第六条、第七条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0148","type":"多选题","category":"安全生产","question":"根据《中华人民共和国安全生产法》，（ ）和危险物品的生产、经营、储存、装卸单位，应当设置安全生产管理机构或者配备专职安全生产管理人员。","options":["矿山","金属冶炼","建筑施工","运输单位"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第二十四条：矿山、金属冶炼、建筑施工、运输单位和危险物品的生产、经营、储存、装卸单位，应当设置安全生产管理机构或者配备专职安全生产管理人员。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0149","type":"多选题","category":"安全培训教育","question":"根据《中华人民共和国安全生产法》，企业安全培训教育必须覆盖的人员有（ ）。","options":["新入职员工，必须完成三级安全教育培训，考核合格后方可上岗","转岗、复岗员工，必须进行针对性的安全培训，考核合格后方可上岗","特种作业人员，必须定期进行安全培训和复审，确保证书有效","全体员工，必须定期进行安全生产再培训，持续提升安全意识和技能"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第二十八条、第二十九条","basis":"《中华人民共和国安全生产法》（2021年修订版）第二十八条、第二十九条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0150","type":"多选题","category":"承包商安全管理","question":"根据《中华人民共和国安全生产法》，企业承包商安全管理必须落实的要求有（ ）。","options":["严格审查承包商的安全生产资质和安全生产条件，严禁将项目发包给不具备资质的单位","与承包商签订安全生产管理协议，明确双方的安全生产责任和义务","对承包商作业人员进行安全培训和技术交底，考核合格后方可进入现场作业","对承包商的作业现场进行安全监督检查，发现安全隐患及时要求整改"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四十九条","basis":"《中华人民共和国安全生产法》（2021年修订版）第四十九条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0151","type":"多选题","category":"安全生产费用管理","question":"根据《中华人民共和国安全生产法》，企业安全生产费用管理必须落实的要求有（ ）。","options":["按照国家规定提取和使用安全生产费用，专门用于改善安全生产条件，不得挪作他用","安全生产费用在成本中据实列支，确保足额提取、规范使用","建立安全生产费用使用台账，详细记录费用提取、使用、结余情况","定期对安全生产费用使用情况进行审计和监督，确保使用合规、有效"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第二十三条","basis":"《中华人民共和国安全生产法》（2021年修订版）第二十三条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0152","type":"多选题","category":"建设工程安全管理","question":"根据建设工程施工安全管理规范，建设工程危大工程专项施工方案必须包括的内容有（ ）。","options":["工程概况、编制依据、施工计划、施工工艺技术","施工安全保证措施，包括组织保障、技术保障、应急处置措施","施工管理及作业人员配备和分工，特种作业人员资格要求","验收要求、应急处置预案、计算书及相关图纸"],"answer":"ABCD","explanation":"《建设工程安全生产管理条例》第二十六条：对危险性较大的分部分项工程，施工单位应编制专项施工方案，附安全验算结果，经技术负责人、总监理工程师签字后实施。 〔依据法规已收录条款库：《危险性较大的分部分项工程安全管理规定》〕","basis":"《建设工程安全生产管理条例》、《危险性较大的分部分项工程安全管理规定》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0153","type":"多选题","category":"从业人员劳动保护","question":"根据《中华人民共和国劳动法》，企业必须保障从业人员的劳动安全卫生权利包括（ ）。","options":["用人单位必须建立、健全劳动安全卫生制度，严格执行国家劳动安全卫生规程和标准，对劳动者进行劳动安全卫生教育，防止劳动过程中的事故，减少职业危害","用人单位必须为劳动者提供符合国家规定的劳动安全卫生条件和必要的劳动防护用品，对从事有职业危害作业的劳动者应当定期进行健康检查","劳动者对用人单位管理人员违章指挥、强令冒险作业，有权拒绝执行；对危害生命安全和身体健康的行为，有权提出批评、检举和控告","用人单位必须对女职工和未成年工实行特殊劳动保护，不得安排女职工和未成年工从事国家规定的禁忌劳动"],"answer":"ABCD","explanation":"《中华人民共和国劳动法》第六章","basis":"《中华人民共和国劳动法》第六章","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0154","type":"多选题","category":"安全生产法律责任","question":"根据《中华人民共和国刑法》，企业相关人员安全生产相关的刑事犯罪包括（ ）。","options":["重大责任事故罪：在生产、作业中违反有关安全管理的规定，因而发生重大伤亡事故或者造成其他严重后果的","重大劳动安全事故罪：安全生产设施或者安全生产条件不符合国家规定，因而发生重大伤亡事故或者造成其他严重后果的","强令、组织他人违章冒险作业罪：强令他人违章冒险作业，或者明知存在重大事故隐患而不排除，仍冒险组织作业，因而发生重大伤亡事故或者造成其他严重后果的","不报、谎报安全事故罪：在安全事故发生后，负有报告职责的人员不报或者谎报事故情况，贻误事故抢救，情节严重的"],"answer":"ABCD","explanation":"《中华人民共和国刑法》第一百三十四条、第一百三十五条、第一百三十九条之一 〔依据法规已收录条款库：《中华人民共和国刑法》〕","basis":"《中华人民共和国刑法》第一百三十四条、第一百三十五条、第一百三十九条之一","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0155","type":"多选题","category":"工伤保险","question":"根据《工伤保险条例》，企业职工应当认定为工伤的情形包括（ ）。","options":["在工作时间和工作场所内，因工作原因受到事故伤害的","工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的","在工作时间和工作场所内，因履行工作职责受到暴力等意外伤害的","因工外出期间，由于工作原因受到伤害或者发生事故下落不明的，在上下班途中，受到非本人主要责任的交通事故或者城市轨道交通、客运轮渡、火车事故伤害的"],"answer":"ABCD","explanation":"《工伤保险条例》第十四条 〔依据法规已收录条款库：《工伤保险条例》〕","basis":"《工伤保险条例》第十四条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0156","type":"多选题","category":"动火作业安全管理","question":"根据《中华人民共和国安全生产法》，企业管道焊接作业必须落实的安全要求有（ ）。","options":["焊接作业前必须办理动火工作票，落实防火措施，配备消防器材，设专人监护","焊接作业前必须对作业人员进行安全技术交底，明确作业流程、安全注意事项和应急处置措施","焊接作业人员必须取得特种作业操作资格证书，持证上岗，正确佩戴和使用劳动防护用品","焊接作业现场必须设置安全警示区域，严禁无关人员进入，作业结束后必须清理现场，确认无火灾隐患后方可离开"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第三十条","basis":"《中华人民共和国安全生产法》（2021年修订版）第三十条、《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0157","type":"多选题","category":"设备安全管理","question":"根据《中华人民共和国安全生产法》，企业设备调试作业必须落实的安全要求有（ ）。","options":["设备调试前必须编制专项调试方案，对作业人员进行安全技术交底，明确调试流程、安全注意事项和应急处置措施","设备调试前必须对设备、电气系统、控制系统、保护装置等进行全面检查和试验，确保完好有效","设备调试必须严格按照专项调试方案逐步进行，密切监视设备的运行参数，发现异常立即停止调试，采取应急处置措施","设备调试现场必须设置安全警示区域，严禁无关人员进入，安排专人进行现场监护，配备应急救援器材"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第四十三条：生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实；《中华人民共和国安全生产法》第四十五条：生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用。 〔依据法规已收录条款库：《危险性较大的分部分项工程安全管理规定》〕","basis":"《中华人民共和国安全生产法》（2021年修订版）、《危险性较大的分部分项工程安全管理规定》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0158","type":"多选题","category":"安全文化建设","question":"根据《中华人民共和国安全生产法》，企业安全文化建设必须落实的要求有（ ）。","options":["建立健全安全文化建设制度，制定安全文化建设规划和年度工作计划，明确安全文化建设的目标、内容和措施","加强安全宣传教育，通过安全培训、安全讲座、安全知识竞赛、安全警示教育等多种形式，普及安全知识，提升员工安全意识和技能","营造安全文化氛围，通过安全标语、安全宣传栏、安全文化墙、安全警示标识等多种形式，营造“人人讲安全、个个会应急”的安全文化氛围","建立安全激励机制，对安全生产工作中表现突出的个人和集体进行表彰和奖励，鼓励员工积极参与安全生产工作，主动排查安全隐患，提出安全改进建议"],"answer":"ABCD","explanation":"《中华人民共和国安全生产法》第十一条 〔依据法规已收录条款库：AQ/T 9004-2025《企业安全文化建设指南》；替代AQ/T 9004-2008《企业安全文化建设导则》及AQ/T 9005-2008〕","basis":"AQ/T 9004-2025《企业安全文化建设指南》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0159","type":"多选题","category":"现场操作规范","question":"生产经营单位的从业人员不落实岗位安全责任，不服从管理，违反安全生产规章制度或者操作规程的，以下处理方式正确的是（ ）。","options":["由生产经营单位给予批评教育","由生产经营单位依照有关规章制度给予处分","只要不构成犯罪，就无需任何处理","构成犯罪的，依照刑法有关规定追究刑事责任"],"answer":"ABD","explanation":"《中华人民共和国安全生产法》第一百零七条","basis":"《中华人民共和国安全生产法》第一百零七条","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0160","type":"多选题","category":"现场操作规范","question":"根据安全规范，所有现场作业人员必须严格遵守的“四不伤害”原则是指？","options":["不伤害自己","不伤害他人","不被他人伤害","保护他人不被伤害"],"answer":"ABCD","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据） 〔依据法规已收录条款库：GB/T 33000-2025《大中型企业安全生产标准化管理体系要求》〕","basis":"GB/T 33000-2025《大中型企业安全生产标准化管理体系要求》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0161","type":"多选题","category":"应急救护技能","question":"根据应急救护规范，心肺复苏（CPR）的核心操作要点有哪些？","options":["胸外按压的深度为5-6厘米，频率为100-120次/分钟","每次吹气的时间为1秒，潮气量为500-600毫升","按压与吹气的比例为30:2","持续进行心肺复苏，直到患者恢复呼吸、心跳，或医护人员到达"],"answer":"ABCD","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》成人胸外按压：按压深度5~6厘米，按压频率100~120次/分，按压部位为两乳头连线中点（胸骨下半部），保证每次按压后胸廓完全回弹；按压与人工呼吸比例为30:2。","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0162","type":"多选题","category":"应急救护技能","question":"根据应急救护规范，对于骨折的患者，急救的正确操作有哪些？","options":["先检查患者的生命体征，处理危及生命的伤情","用夹板或替代品固定骨折部位，超过骨折部位的上下两个关节","固定时松紧适度，避免影响血液循环","固定后将患者平稳转运到医院，避免骨折端移动"],"answer":"ABCD","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0163","type":"多选题","category":"应急救护技能","question":"根据应急救护规范，对于中暑的患者，急救的正确操作有哪些？","options":["立即将患者转移到阴凉通风处，解开衣物","用冷水擦拭患者的身体，尤其是额头、颈部、腋下、腹股沟等部位，降温","如果患者意识清醒，可给患者喝少量淡盐水或清凉饮料","如果患者症状严重，立即拨打急救电话，等待医护人员到达"],"answer":"ABCD","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"应急救护通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0164","type":"多选题","category":"应急救护技能","question":"进行心肺复苏时，正确的操作要点包括（ ）。","options":["胸外按压的位置在两乳头连线中点的胸骨中下段","胸外按压的深度为5-6厘米，频率为100-120次/分钟","人工呼吸时，每次吹气时间约1秒，看到胸廓起伏即可","为了节省体力，可只进行人工呼吸，不进行胸外按压"],"answer":"ABC","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》成人胸外按压：按压部位为两乳头连线中点（胸骨下半部），按压深度5~6厘米，按压频率100~120次/分。","basis":"2020版心肺复苏指南","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0165","type":"多选题","category":"现场操作规范","question":"根据《有限空间作业安全技术规范》GB 46768-2025，有限空间作业前必须完成的准备工作包括以下哪些？","options":["风险辨识与评估","作业审批","气体检测与通风","个体防护装备配备"],"answer":"ABCD","explanation":"《GB 46768-2025 有限空间作业安全技术规范》5.1.1：作业前，作业单位应对有限空间作业环境及作业过程进行风险评估，分析可能存在的危险因素，提出消除、控制危险的措施；《GB 46768-2025 有限空间作业安全技术规范》5.2.1：作业前，作业单位应填写有限空间作业审批表并进行作业审批；《GB 46768-2025 有限空间作业安全技术规范》5.7.1：作业人员应在有限空间外上风侧开启出入口及其他与外界大气环境相连通的设施，进行自然通风；《GB 46768-2025 有限空间作业安全技术规范》5.8.2：应根据有限空间内可能存在的危害气体进行针对性检测，应至少检测氧气、可燃气、硫化氢和一氧化碳；《GB 46768-2025 有限空间作业安全技术规范》4.5.1：作业单位应配备有限空间作业安全防护和应急救援设备设施并建立设备设施管理台账。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0166","type":"判断题","category":"安全生产法律责任","question":"重大责任事故罪的犯罪主体包括对生产、作业负有组织、指挥或者管理职责的负责人、管理人员、实际控制人、投资人等人员，以及直接从事生产、作业的人员。","options":["对","错"],"answer":"A","explanation":"《最高人民法院、最高人民检察院关于办理危害生产安全刑事案件适用法律若干问题的解释》第一条：刑法第一百三十四条第一款规定的犯罪主体，包括对生产、作业负有组织、指挥或者管理职责的负责人、管理人员、实际控制人、投资人等人员，以及直接从事生产、作业的人员。 〔依据法规已收录条款库：《两高关于办理危害生产安全刑事案件适用法律若干问题的解释（二）》（法释〔2022〕19号）〕 〔依据法规已收录条款库：《中华人民共和国刑法》〕","basis":"《中华人民共和国刑法》《最高人民法院、最高人民检察院关于办理危害生产安全刑事案件适用法律若干问题的解释》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0167","type":"判断题","category":"通用安全法律法规","question":"《中华人民共和国突发事件应对法》中的突发事件包括自然灾害、事故灾难、公共卫生事件和社会安全事件四类。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国突发事件应对法》第二条：本法所称突发事件，是指突然发生，造成或者可能造成严重社会危害，需要采取应急处置措施予以应对的自然灾害、事故灾难、公共卫生事件和社会安全事件。","basis":"《中华人民共和国突发事件应对法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0168","type":"判断题","category":"通用安全法律法规","question":"依据《安全生产法》，安全生产工作应当以人为本，坚持人民至上、生命至上，把保护人民生命安全摆在首位，树牢安全发展理念。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》第三条：安全生产工作应当以人为本，坚持人民至上、生命至上，把保护人民生命安全摆在首位，树牢安全发展理念，坚持安全第一、预防为主、综合治理的方针，从源头上防范化解重大安全风险。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0169","type":"判断题","category":"安全培训教育","question":"生产经营单位使用被派遣劳动者的，无需对被派遣劳动者进行岗位安全操作规程和安全操作技能的教育和培训，相关培训由劳务派遣单位负责。","options":["对","错"],"answer":"B","explanation":"《中华人民共和国安全生产法》（2021年修订版）第二十八条：生产经营单位使用被派遣劳动者的，应当将被派遣劳动者纳入本单位从业人员统一管理，对被派遣劳动者进行岗位安全操作规程和安全操作技能的教育和培训。劳务派遣单位应当对被派遣劳动者进行必要的安全生产教育和培训。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0170","type":"判断题","category":"重大危险源管理","question":"对于重大危险源，生产经营单位应当登记建档，并制定应急预案。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第四十条：生产经营单位对重大危险源应当登记建档，进行定期检测、评估、监控，并制定应急预案，告知从业人员和相关人员在紧急情况下应当采取的应急措施。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0171","type":"判断题","category":"承包商安全管理","question":"生产经营单位不得将生产经营项目、场所、设备发包给不具备安全生产条件相应资质的单位。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第四十九条：生产经营单位不得将生产经营项目、场所、设备发包或者出租给不具备安全生产条件或者相应资质的单位或者个人。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0172","type":"判断题","category":"工伤保险","question":"因生产安全事故受到损害的从业人员，除依法享有工伤保险外，依照有关民事法律尚有获得赔偿的权利的，有权提出赔偿要求。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五十三条：因生产安全事故受到损害的从业人员，除依法享有工伤保险外，依照有关民事法律尚有获得赔偿的权利的，有权提出赔偿要求。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0173","type":"判断题","category":"应急管理","question":"国家鼓励生产经营单位和其他社会力量建立应急救援队伍，配备相应的应急救援装备和物资，提高应急救援的专业化水平。","options":["对","错"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第七十九条：国家加强生产安全事故应急能力建设……鼓励生产经营单位和其他社会力量建立应急救援队伍，配备相应的应急救援装备和物资，提高应急救援的专业化水平。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0174","type":"判断题","category":"通用安全法律法规","question":"安全生产事故调查中的“四不放过”原则是指：事故原因未查清不放过，责任人未受到处理不放过，整改措施未落实不放过，有关人员未受到教育不放过。","options":["对","错"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0175","type":"判断题","category":"工伤保险","question":"职工在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的，视同工伤。","options":["对","错"],"answer":"A","explanation":"《工伤保险条例》第十五条：职工有下列情形之一的，视同工伤：（一）在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的；（二）在抢险救灾等维护国家利益、公共利益活动中受到伤害的；（三）职工原在军队服役，因战、因公负伤致残，已取得革命伤残军人证，到用人单位后旧伤复发的。 〔依据法规已收录条款库：《工伤保险条例》〕","basis":"《工伤保险条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0176","type":"判断题","category":"通用安全法律法规","question":"电气设备发生火灾的时候，在未断电的情况下，可以使用化学泡沫灭火器灭火。","options":["对","错"],"answer":"B","explanation":"《GB/T 13869-2017 用电安全导则》及消防常识：电气设备发生火灾未断电时，不得使用泡沫灭火器（含水导电），应使用二氧化碳或干粉灭火器。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0177","type":"判断题","category":"从业人员安全生产权利义务","question":"危险化学品从业人员发现直接危及人身安全的紧急情况时，不得停止作业或者在采取可能的应急措施后撤离作业场所。（）","options":["对","错"],"answer":"B","explanation":"《中华人民共和国安全生产法》（2021年修订版）第五十五条：从业人员发现直接危及人身安全的紧急情况时，有权停止作业或者在采取可能的应急措施后撤离作业场所。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0178","type":"判断题","category":"通用安全法律法规","question":"火灾使人致命的最主要原因是被人践踏。（）","options":["对","错"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0179","type":"判断题","category":"危险化学品安全","question":"危险化学品仓库应该设有避雷设施，并且每5年至少检测一次。（）","options":["对","错"],"answer":"B","explanation":"《防雷减灾管理办法》第十九条：投入使用后的防雷装置实行定期检测制度。防雷装置应当每年检测一次，对爆炸和火灾危险环境场所的防雷装置应当每半年检测一次。（危险化学品仓库属爆炸和火灾危险环境，避雷设施检测周期并非“每5年”，故原题“每5年至少检测一次”表述错误。） 〔依据法规已收录条款库：《防雷减灾管理办法》；原中国气象局令20号已废止，现行为44号令2025版〕","basis":"《防雷减灾管理办法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0180","type":"判断题","category":"应急救护技能","question":"根据应急救护规范，心肺复苏的核心操作顺序是胸外按压→开放气道→人工呼吸，按压与吹气的比例为30:2。","options":["对","错"],"answer":"A","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》成人胸外按压：按压与人工呼吸比例为30:2。","basis":"《中国心肺复苏培训体系建设规范》（T/CRHA 308—2026）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0181","type":"判断题","category":"通用安全法律法规","question":"在搭设和拆除脚手架作业时，设置安全警戒线、警戒标志，并应由专人监护，项目部管理人员可以随意入内。（ ）","options":["对","错"],"answer":"B","explanation":"《GB 55023-2022 施工脚手架通用规范》5.1.2：在搭设和拆除脚手架作业时，应设置安全警戒线、警戒标志，并应由专人监护，严禁非作业人员入内。","basis":"施工脚手架通用规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0182","type":"判断题","category":"应急救护技能","question":"对心跳呼吸停止的触电者进行心肺复苏时，胸外按压与人工呼吸的比例为15:2。","options":["对","错"],"answer":"B","explanation":"《T/CRHA 308—2026 中国心肺复苏培训体系建设规范》成人胸外按压：按压与人工呼吸比例为30:2。","basis":"2020版心肺复苏指南","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0183","type":"判断题","category":"应急救护技能","question":"对骨折伤员进行急救时，首先应对骨折部位进行固定，避免二次伤害，严禁随意移动骨折伤员。","options":["对","错"],"answer":"A","explanation":"应急救护通用规范（通用急救要求，无单一强制法条）","basis":"创伤急救规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0184","type":"判断题","category":"通用安全法律法规","question":"根据《工贸企业重大事故隐患判定标准》，特种作业人员未按照规定经专门的安全作业培训并取得相应资格上岗作业的，应判定为重大事故隐患。","options":["对","错"],"answer":"A","explanation":"《工贸企业重大事故隐患判定标准》第三条：工贸企业有下列情形之一的，应当判定为重大事故隐患：……（二）特种作业人员未按照规定经专门的安全作业培训并取得相应资格，上岗作业的；","basis":"《工贸企业重大事故隐患判定标准》应急管理部10号令（2023版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0185","type":"判断题","category":"现场操作规范","question":"根据《有限空间作业安全技术规范》GB 46768-2025，为加快通风换气，可向有限空间内直接通入纯氧。","options":["对","错"],"answer":"B","explanation":"《GB 46768-2025 有限空间作业安全技术规范》5.10.1：应向有限空间内输送清洁空气，不应使用纯氧或富氧空气进行通风。","basis":"《有限空间作业安全技术规范》GB 46768-2025","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0186","type":"单选题","category":"通用安全法律法规","question":"《中华人民共和国突发事件应对法》规定，国家建立统一领导、综合协调、分类管理、分级负责、属地管理为主的应急管理体制。其中，分级负责是指（）。","options":["中央领导地方、上级政府领导下级政府和政府对其各有关部门的统一领导","按突发事件的类别由政府有关部门负责日常应急管理工作","按照突发事件的性质、范围、危害的不同，分别由不同层级的政府负责应急处置"],"answer":"C","explanation":"《中华人民共和国突发事件应对法》第十六条：国家建立统一指挥、专常兼备、反应灵敏、上下联动的应急管理体制和综合协调、分类管理、分级负责、属地管理为主的工作体系。","basis":"《中华人民共和国突发事件应对法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0187","type":"单选题","category":"消防安全","question":"下列有关电动车停放、充电的说法，错误的是（）。","options":["严禁在住宅建筑疏散通道停放和充电","严禁在安全出口充电","可以在安全出口停放"],"answer":"C","explanation":"《中华人民共和国消防法》（2021年修订版）第二十八条：任何单位、个人不得损坏、挪用或者擅自拆除、停用消防设施、器材，不得埋压、圈占、遮挡消火栓或者占用防火间距，不得占用、堵塞、封闭疏散通道、安全出口、消防车通道。人员密集场所的门窗不得设置影响逃生和灭火救援的障碍物。（故“可以在安全出口停放”错误。）","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0188","type":"单选题","category":"通用安全法律法规","question":"依据《安全生产法》，生产经营单位必须加大对安全生产（）的投入保障力度，改善安全生产条件，加强安全生产标准化、信息化建设，构建安全风险分级管控和隐患排查治理双重预防机制，健全风险防范化解机制，提高安全生产水平，确保安全生产。","options":["资金、物资、技术、人员","资金、物资、人员、制度","资金、原料、技术、制度"],"answer":"A","explanation":"《中华人民共和国安全生产法》第四条：生产经营单位必须遵守本法和其他有关安全生产的法律、法规，加强安全生产管理，建立健全全员安全生产责任制和安全生产规章制度，加大对安全生产资金、物资、技术、人员的投入保障力度，改善安全生产条件，加强安全生产标准化、信息化建设，构建安全风险分级管控和隐患排查治理双重预防机制，健全风险防范化解机制，提高安全生产水平，确保安全生产。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0189","type":"单选题","category":"安全生产保险保障","question":"高危行业、领域的生产经营单位未按照国家规定投保（）的，责令限期改正，处五万元以上十万元以下的罚款。","options":["安全生产责任保险","人身安全保险","工伤保险"],"answer":"A","explanation":"《中华人民共和国安全生产法》（2021年修订版）第一百零九条：高危行业、领域的生产经营单位未按照国家规定投保安全生产责任保险的，责令限期改正，处五万元以上十万元以下的罚款；逾期未改正的，处十万元以上二十万元以下的罚款。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0190","type":"单选题","category":"职业病防治","question":"职业病防治工作坚持（）的方针，实行分类管理、综合治理。","options":["安全第一，预防为主","标本兼治，防治结合","预防为主，防治结合"],"answer":"C","explanation":"《中华人民共和国职业病防治法》第三条：职业病防治工作坚持预防为主、防治结合的方针，建立用人单位负责、行政机关监管、行业自律、职工参与和社会监督的机制，实行分类管理、综合治理。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0191","type":"单选题","category":"职业病防治","question":"用人单位应当建立、健全（），加强对职业病防治的管理，提高职业病防治水准，对本单位产生的职业病危害承担责任。","options":["职业病防治责任制","人事管理制度","应急预案"],"answer":"A","explanation":"《中华人民共和国职业病防治法》第五条：用人单位应当建立、健全职业病防治责任制，加强对职业病防治的管理，提高职业病防治水平，对本单位产生的职业病危害承担责任。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0192","type":"单选题","category":"职业病防治","question":"用人单位应（）对工作场所进行职业病危害因素检测、评价，检测、评价结果存入用人单位职业卫生档案。","options":["定期","不定期","每月"],"answer":"A","explanation":"《中华人民共和国职业病防治法》第二十六条：用人单位应当按照国务院卫生行政部门的规定，定期对工作场所进行职业病危害因素检测、评价。检测、评价结果存入用人单位职业卫生档案，定期向所在地卫生行政部门报告并向劳动者公布。","basis":"《中华人民共和国职业病防治法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0193","type":"单选题","category":"事故报告与调查处理","question":"根据《生产安全事故报告和调查处理条例》，下列属于重大事故的是（）","options":["某采石场爆破作业致40人重伤","某化工厂爆炸造成30人死亡","某食品加工厂火灾造成15人死亡"],"answer":"C","explanation":"《生产安全事故报告和调查处理条例》第三条：重大事故，是指造成10人以上30人以下死亡，或者50人以上100人以下重伤，或者5000万元以上1亿元以下直接经济损失的事故。（某食品加工厂火灾造成15人死亡，属“10人以上30人以下死亡”，为重大事故。）","basis":"《生产安全事故报告和调查处理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0194","type":"单选题","category":"危险化学品安全","question":"根据《危险化学品安全管理条例》，危险化学品应当储存在专用仓库、专用场地或者专用储存室内，并由专人负责管理；剧毒化学品以及储存数量构成重大危险源的其他危险化学品，应当在专用仓库内单独存放，并实行双人收发（）保管制度。","options":["双人","单人","独立"],"answer":"A","explanation":"《危险化学品安全管理条例》第二十四条：危险化学品应当储存在专用仓库、专用场地或者专用储存室（以下统称专用仓库）内，并由专人负责管理；剧毒化学品以及储存数量构成重大危险源的其他危险化学品，应当在专用仓库内单独存放，并实行双人收发、双人保管制度。","basis":"《危险化学品安全管理条例》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0195","type":"单选题","category":"特种作业安全管理","question":"《特种作业人员安全技术培训考核管理规定》规定，有下列（）情形的，考核发证机关应当注销特种作业操作证。","options":["特种作业操作证失效的","特种作业人员死亡的","特种作业人员违法使用操作证的"],"answer":"B","explanation":"《特种作业人员安全技术培训考核管理规定》（2026年修订）第三十五条：有下列情形之一的，考核发证机关应当注销特种作业操作证：（一）死亡或者身体条件已不能满足本规定要求，无法继续从事特种作业的；（二）提出注销申请的；（三）特种作业操作证被依法撤销、撤回的；（四）特种作业操作证有效期届满且未换领新证或者换证不通过的。 〔注：原依据《特种作业人员安全技术培训考核管理规定》（安监总局令第30号）已于2026-06-01被应急管理部令第19号取代；取消3年复审、改为6年换证，理论考试不限次、实操可考5次、跨省通办、学历要求放宽〕","basis":"《特种作业人员安全技术培训考核管理规定》（应急管理部令第19号，2026年修订）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0196","type":"单选题","category":"特种作业安全管理","question":"根据《特种作业人员安全技术培训考核管理规定》，生产经营单位未建立健全特种作业人员管理档案的，责令限期改正，处2万元以下的罚款；逾期未改正的，处 （）的罚款。","options":["2 万元以上 3万元以下","3 万元以上 7 万元以下","2 万元以上 5 万元以下","3 万元以上 5 万元以下"],"answer":"C","explanation":"《特种作业人员安全技术培训考核管理规定》（2026年修订）第三十九条：生产经营单位未建立健全特种作业人员管理档案的，责令限期改正，处2万元以下的罚款；逾期未改正的，处2万元以上5万元以下的罚款。 〔注：原依据《特种作业人员安全技术培训考核管理规定》（安监总局令第30号）已于2026-06-01被应急管理部令第19号取代；取消3年复审、改为6年换证，理论考试不限次、实操可考5次、跨省通办、学历要求放宽〕","basis":"《特种作业人员安全技术培训考核管理规定》（应急管理部令第19号，2026-06-01施行）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0197","type":"单选题","category":"安全生产","question":"根据《安全生产法》，生产经营单位对（ ）应当登记建档，进行定期检测、评估、监控，并制定应急预案，告知从业人员和相关人员在紧急情况下应当采取的应急措施。","options":["重大危险源","主要危险源","危险化学品","特种设备"],"answer":"A","explanation":"《中华人民共和国安全生产法》第四十条：生产经营单位对重大危险源应当登记建档，进行定期检测、评估、监控，并制定应急预案，告知从业人员和相关人员在紧急情况下应当采取的应急措施。","basis":"《中华人民共和国安全生产法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0198","type":"单选题","category":"消防安全管理","question":"任何（）不得在公共通道、楼梯、安全出口等部位堆物、堆料或者搭设棚屋。","options":["单位","单位和个人","个人"],"answer":"B","explanation":"《中华人民共和国消防法》（2021年修订版）第二十八条：任何单位、个人不得损坏、挪用或者擅自拆除、停用消防设施、器材……不得占用、堵塞、封闭疏散通道、安全出口、消防车通道。人员密集场所的门窗不得设置影响逃生和灭火救援的障碍物。（故任何单位、个人均不得在公共通道、楼梯、安全出口等部位堆物、堆料或者搭设棚屋。）","basis":"《中华人民共和国消防法》（2021年修订版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0199","type":"单选题","category":"通用安全法律法规","question":"保护接零是把电气设备在正常情况下不带电的金属部分，用导线与电网的保护（）紧密地连接起来。","options":["导线","火线","零线"],"answer":"C","explanation":"《GB/T 13869-2017 用电安全导则》5/6 用电产品保护：保护接零是将设备正常情况下不带电的金属部分与电网的保护零线紧密连接，以防触电。","basis":"《用电安全导则》GB/T 13869-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0200","type":"单选题","category":"通用安全法律法规","question":"手持电动工具按电气安全保护措施分I类、Ⅱ类、Ⅲ类共三类。（）没有保护接地或保护接零的要求。","options":["I类、Ⅱ类","Ⅱ类、Ⅲ类","I类、Ⅲ类"],"answer":"B","explanation":"GB/T 3787-2017：Ⅱ类（双重绝缘/加强绝缘）、Ⅲ类（安全特低电压）工具无保护接地或保护接零要求，答案B","basis":"《手持式电动工具的管理、使用、检查和维修安全技术规程》GB/T 3787-2017","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0201","type":"单选题","category":"通用安全法律法规","question":"发生触电事故，以下做法错误的是（）。","options":["一旦发现有人触电，首先切断与触电者相连的电源","用绝缘体拔开与触电者相接触的带电体","抢救患者时要带上绝缘手套，穿上绝缘鞋","可直接用手拽拉患者离开触电区域"],"answer":"D","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0202","type":"单选题","category":"通用安全法律法规","question":"电流对人体的危害受电流大小、触电时间、电流种类、触电路径及人体状况等因素的影响。其中，通过人体的（）是最主要的影响因素。","options":["电流大小和触电时间","触电时间和电流种类","电流种类和触电路径"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0203","type":"单选题","category":"电气作业安全管理","question":"（）措施属电击防护措施中的直接接触防护。","options":["保护接地","漏电保护","绝缘"],"answer":"C","explanation":"GB/T 13869—2017《用电安全导则》第2.4条：直接接触是指人或动物与带电部分的电接触；绝缘是防止直接接触电击的基本防护措施（基本绝缘）。故“绝缘”属于电击防护措施中的直接接触防护。","basis":"GB/T 13869—2017《用电安全导则》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0204","type":"单选题","category":"设备安全管理","question":"接地是消除静电危害最简单的方法，主要用于消除（）静电。","options":["导电体上的静电","绝缘体上的静电","易燃液体上的静电"],"answer":"A","explanation":"GB 12158—2024《防止静电事故通用要求》4.2.2.1：在静电危险场所，所有对地绝缘的静电导体应接地。对金属物体应采用金属导体与大地做导通性连接，对金属以外的静电导体及亚导体则应作间接接地。即接地主要用于消除导电体（静电导体）上的静电。 〔依据法规已收录条款库：GB 12158-2024《防止静电事故通用要求》；替代GB 12158-2006《防止静电事故通用导则》及GB 13348-2009〕","basis":"GB 12158—2024《防止静电事故通用要求》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0205","type":"单选题","category":"通用安全法律法规","question":"（）是具有能承受内部的爆炸性混合物的爆炸而不致受到损坏，而且通过外壳任何结合面或结构孔洞，不致使内部爆炸引起外部爆炸性混合物爆炸的电气。","options":["本质安全型","增安型","隔爆型"],"answer":"C","explanation":"GB 3836.1《爆炸性环境 第1部分：设备 通用要求》隔爆型（d）外壳定义（题干即该定义，答案C）","basis":"《爆炸性环境 第1部分：设备 通用要求》GB 3836.1","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0206","type":"单选题","category":"消防安全","question":"建筑物内的（）设备应采用专用的供电回路，当建筑内的总用电电源被切断时，仍能保证其用电。","options":["消防用电","生产用电","生活用电"],"answer":"A","explanation":"GB 50016—2014《建筑设计防火规范》（2018年版）第10.1.6条：消防用电设备应采用专用的供电回路，当建筑内的生产、生活用电被切断时，应仍能保证消防用电。 〔依据法规已收录条款库：GB 50016-2014《建筑设计防火规范》（2018年版）；部分强制性条文被GB 55037-2022《建筑防火通用规范》自2023-06-01起废止〕","basis":"GB 50016—2014《建筑设计防火规范》（2018年版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0207","type":"单选题","category":"通用安全法律法规","question":"下列情形中，不属于《工贸企业重大事故隐患判定标准》第三条明确规定的是（）？","options":["未对承包单位、承租单位的安全生产工作进行统一协调、管理，或者未定期进行安全检查的","特种作业人员未按照规定经专门的安全作业培训并取得相应资格，上岗作业的","金属冶炼企业主要负责人、安全生产管理人员未按照规定经考核合格的","餐饮行业的生产经营单位，使用燃气未安装可燃气体报警装置的"],"answer":"D","explanation":"《工贸企业重大事故隐患判定标准》（应急管理部令第10号）第三条；选项D（餐饮燃气未装可燃气体报警）系《安全生产法》第三十六条要求，不属本标准第三条情形，故D为『不属于』的正确答案","basis":"《工贸企业重大事故隐患判定标准》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0208","type":"单选题","category":"电气作业安全管理","question":"金属梯子不适用于（）。","options":["接近电力装置的地点","密闭场地","泥坑"],"answer":"A","explanation":"GB 26860—2011《电力安全工作规程 发电厂和变电站电气部分》4.3.3：在厂站的带电区域内或邻近带电导体附近，不应使用金属梯子。（金属梯子导电，故不适用于接近电力装置的地点。）","basis":"GB 26860—2011《电力安全工作规程 发电厂和变电站电气部分》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0209","type":"单选题","category":"通用安全法律法规","question":"保险丝应安装在（）上，来发挥它的过荷保护功能。","options":["火线","零线","地线"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0210","type":"单选题","category":"电气作业安全管理","question":"一般的漏电保护器，动作电流额定值为（），动作时间小于等于0.1秒。","options":["30毫安","50毫安","80毫安"],"answer":"A","explanation":"GB/T 13955—2017《剩余电流动作保护装置安装和运行》规定：用于直接接触电击防护的剩余电流动作保护器，额定剩余动作电流不超过30mA、最大分断时间不超过0.1秒。一般漏电保护器动作电流额定值为30毫安、动作时间不大于0.1秒。 〔依据法规已收录条款库：GB/T 13955-2017《剩余电流动作保护装置安装和运行》〕","basis":"GB/T 13955—2017《剩余电流动作保护装置安装和运行》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0211","type":"单选题","category":"特种作业安全管理","question":"根据《特种作业人员安全技术培训考核管理规定》，特种作业人员以欺骗、贿赂、作弊等不正当手段取得特种作业操作证的，考核发证机关应当撤销特种作业操作证。特种作业人员自特种作业操作证被撤销之日起（）年内，不得再次申请特种作业操作证。","options":["4","3","2","1"],"answer":"B","explanation":"《特种作业人员安全技术培训考核管理规定》（安监总局令第30号）第三十条：违反第（四）（五）项（操作证记载虚假信息、以欺骗贿赂等不正当手段取证）的，3年内不得再次申请，答案B（3年） 〔注：原依据《特种作业人员安全技术培训考核管理规定》（安监总局令第30号）已于2026-06-01被应急管理部令第19号取代；取消3年复审、改为6年换证，理论考试不限次、实操可考5次、跨省通办、学历要求放宽〕","basis":"《特种作业人员安全技术培训考核管理规定》（应急管理部令第19号，2026-06-01施行）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0212","type":"单选题","category":"设备安全管理","question":"安全阀属于（）类的安全装置。","options":["联锁","超限保险","监测控制"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0213","type":"单选题","category":"设备安全管理","question":"机械设备设计时应优先选择（）安全技术措施。","options":["直接","间接","指示性"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0214","type":"单选题","category":"厂区作业安全管理","question":"以下叉车（非防爆）作业违反安全作业要求的是（ ）。（1）用货叉推顶货物移位；（2）货叉上载人；（3）进入易燃易爆仓库内作业。","options":["（1）和（2）","（2）和（3）","（1）、（2）、（3）"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0215","type":"单选题","category":"起重作业安全管理","question":"起重机轨道上的行程限位开关属于（）类的安全装置。","options":["超限保险","联锁","监测控制"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0216","type":"单选题","category":"起重作业安全管理","question":"（）资料是使用起重机吊运物料时，操作员不需清楚知道。","options":["该机最高安全负重量","物料重量","起重机总重量"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0217","type":"单选题","category":"起重作业安全管理","question":"起吊物料时，除非起重机操作员的视线不受阻，否则应有（）。","options":["安装超重警告器","安全主任在场监工","信号员的指导配合"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0218","type":"单选题","category":"特种作业安全管理","question":"进行电焊、气焊等具有火灾危险作业的人员和自动消防系统的操作人员，必须（），并遵守消防安全操作规程。","options":["注意安全","经培训上岗","持证上岗"],"answer":"C","explanation":"《中华人民共和国消防法》第二十一条：进行电焊、气焊等具有火灾危险作业的人员和自动消防系统的操作人员，必须持证上岗，并遵守消防安全操作规程。","basis":"《中华人民共和国消防法》（2021年修正版）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0219","type":"单选题","category":"电气作业安全管理","question":"电焊工在（）操作时不必先切断电源。","options":["更换焊件需要改接二次回线时","更换电焊条时","更换保险丝时"],"answer":"B","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0220","type":"单选题","category":"动火作业安全管理","question":"气焊工（）操作不属于违反氧气瓶安全使用要求。","options":["带着沾有油污的手套安装氧气减压器","氧气瓶平卧使用","氧气瓶压力下降到0.1MPa时更换新气瓶"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0221","type":"单选题","category":"现场操作规范","question":"关于有限空间作业，下列做法错误的是（）。","options":["作业人员应佩戴安全可靠的防护用品","提供应急救援保障","必要时，监护人员可与作业人员一起进入有限空间作业"],"answer":"C","explanation":"《焊接与切割安全》（GB 9448-2025）第8章第5条：在有限空间内作业时，若存在严重危害生命安全的气体，有限空间外面应设置监护人员；监护人员应具有在紧急状态下迅速救出或保护里面作业人员的救护措施，具备实施救援行动的能力；应随时监护里面作业人员的状态并与他们保持联络，备好救护设备。","basis":"《焊接与切割安全》（GB 9448-2025）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0222","type":"单选题","category":"高处作业安全管理","question":"施工现场作业人员使用安全带的正确方法是（）。","options":["与身体平行","低挂高用","高挂低用"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0223","type":"单选题","category":"现场操作规范","question":"下列关于有限空间作业监护人职责的说法中，错误的是（）。","options":["清楚可能存在的危害和对作业人员的影响","掌握作业人员情况并与其保持沟通","与作业人员一同进入有限空间进行作业"],"answer":"C","explanation":"《焊接与切割安全》（GB 9448-2025）第8章第5条：在有限空间内作业时，若存在严重危害生命安全的气体，有限空间外面应设置监护人员；监护人员应具有在紧急状态下迅速救出或保护里面作业人员的救护措施，具备实施救援行动的能力；应随时监护里面作业人员的状态并与他们保持联络，备好救护设备。","basis":"《焊接与切割安全》（GB 9448-2025）","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0224","type":"单选题","category":"通用安全法律法规","question":"有限空间分为地下有限空间，地上有限空间和（）。","options":["密闭设备","地下工事","压力容器"],"answer":"A","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0225","type":"单选题","category":"通用安全法律法规","question":"在应急管理中，（）阶段的目标是尽可能地抢救受害人员、保护可能受威胁的人群，并尽可能控制并消除事故。","options":["预防","响应","恢复"],"answer":"B","explanation":"《中华人民共和国突发事件应对法》第七十一条：国家建立健全突发事件应急响应制度。突发事件的应急响应级别，按照突发事件的性质、特点、可能造成的危害程度和影响范围等因素分为一级、二级、三级和四级，一级为最高级别；《中华人民共和国突发事件应对法》第七十三条：自然灾害、事故灾难或者公共卫生事件发生后，履行统一领导职责的人民政府应当采取下列一项或者多项应急处置措施：（一）组织营救和救治受害人员，转移、疏散、撤离并妥善安置受到威胁的人员以及采取其他救助措施；（二）迅速控制危险源……","basis":"《中华人民共和国突发事件应对法》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0226","type":"单选题","category":"事故报告与调查处理","question":"违反操作规程或规章制度进行操作而发生的安全事故，是（）事故。","options":["重大","特别重大","责任","非责任"],"answer":"C","explanation":"通用安全管理规范（通用安全要求，无单一强制法条依据）","basis":"通用安全管理规范","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0227","type":"单选题","category":"通用安全法律法规","question":"使用行车、电动葫芦时，超载吊物或吊不规则物件时未固牢固，安全防护装置缺损，有可能发生（）事故。","options":["机械伤害","高处坠落","起重致害","物体打击"],"answer":"C","explanation":"GB 6441-2025《生产安全事故分类与编码》第4.1.2 基本事故类型条：基本事故类型名称及说明（27类）：物体打击、厂(场)内车辆致害、道路(轨道)车辆致害、机械致害、起重致害、触电、淹溺、灼烫、火灾、高处坠落、跌落、坍塌、水害、容器爆炸、管道爆炸、可燃气体爆炸、可燃液体蒸气爆炸、粉尘爆炸、民用爆炸物品爆炸、烟花爆竹爆炸、其他可燃固体爆炸、高温熔融物爆炸、中毒、窒息、滑坡、泄漏、其他。","basis":"GB 6441-2025《生产安全事故分类与编码》","source":"综合题库1.xlsx","status":"已整理"},{"id":"Q0228","type":"单选题","category":"应急管理","question":"综合应急预案的内容应当包括总则、应急组织机构及职责、（）后期处置、应急保障等主要内容。","options":["事故预防","应急响应","应急处置"],"answer":"B","explanation":"GB/T 29639-2020《生产经营单位
